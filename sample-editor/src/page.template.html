<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>サンプルエディター</title><style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#92b8ce;font-family:sans-serif}canvas{display:block;width:100%;height:100%}#v{position:absolute;top:max(10px,env(safe-area-inset-top));left:20px;color:#fff;text-shadow:0 2px 4px #222;font:bold 15px sans-serif}#pad{position:absolute;left:max(25px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:150px;height:150px;border:2px solid #ffffff70;border-radius:50%;background:#13293755;box-shadow:0 0 15px #0003;touch-action:none}#stick{position:absolute;left:47px;top:47px;width:56px;height:56px;background:#e2e7e9ad;border:2px solid white;border-radius:50%;pointer-events:none}#hint{position:absolute;right:12px;top:12px;color:#fff;background:#1b2c3970;padding:5px 9px;border-radius:7px;font-size:12px}#editToggle{position:absolute;right:12px;top:41px;z-index:6;background:#182733ca;color:#fff;border:1px solid #ffffff77;border-radius:8px;padding:6px 13px;font-size:13px}
#editPanel{position:absolute;right:12px;top:80px;z-index:7;width:min(300px,48vw);padding:9px;background:#14232be8;color:#fff;border:1px solid #ffffff55;border-radius:9px;display:grid;gap:5px;font-size:12px}
#editPanel[hidden]{display:none}#editInfo{font-size:11px;overflow-wrap:anywhere}#editNotice{color:#d4e8ae;min-height:14px;font-size:11px}
#editPanel .editorRow{display:flex;gap:5px}#editPanel button{background:#435762;color:white;border:1px solid #ffffff55;border-radius:5px;padding:5px 7px;flex:1;font-size:12px}
#editPanel button:active,#editToggle:active{background:#617c89}
#storeJump{position:absolute;right:153px;top:41px;z-index:7;background:#284638dd;color:#fff;border:1px solid #ffffff77;border-radius:8px;padding:6px 10px;font-size:13px}
body.shooting #storeJump{display:none}
#shootToggle{position:absolute;right:77px;top:41px;z-index:8;background:#172b36dd;color:white;border:1px solid #ffffff77;border-radius:8px;padding:6px 12px;font-size:13px}
#shootPanel{position:absolute;right:12px;top:88px;width:min(195px,29vw);padding:9px;background:#14242eea;color:#fff;border:1px solid #ffffff66;border-radius:9px;z-index:8;display:grid;gap:6px;font-size:12px}
#shootPanel[hidden]{display:none}#shootPanel button{border:1px solid #ffffff55;border-radius:6px;background:#405967;color:#fff;padding:7px 4px;font-size:12px;flex:1}#shootPanel button:disabled{opacity:.35}
#shootPanel .shotRow{display:flex;gap:5px}#shootStatus{color:#d7e2e4;min-height:15px}#shotCounter{font-size:12px;color:#e5d4a1}
#portraitGuide{position:absolute;top:0;left:50%;transform:translateX(-50%);height:100%;aspect-ratio:9/16;border-left:1px solid #ffffff88;border-right:1px solid #ffffff88;pointer-events:none;z-index:4}
#portraitGuide[hidden]{display:none}#portraitGuide:after{content:'9:16 撮影プレビュー';position:absolute;top:6px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#eee9;font-size:11px;text-shadow:0 1px 3px #000}
body.shooting #pad,body.shooting #editToggle,body.shooting #editPanel,body.shooting #v,body.shooting #hint{display:none}
body.shooting #shootToggle{right:12px;top:39px}
@media(max-height:420px){#pad{width:120px;height:120px}#stick{left:37px;top:37px;width:46px;height:46px}}
</style></head><body><canvas id="scene"></canvas><div id="v">v21</div><div id="hint">サンプルエディター</div>
<button id="editToggle" type="button">編集</button>
<div id="editPanel" hidden>
<strong>POI：谷中銀座・再現研究区画</strong>
<div id="editInfo"></div>
<div class="editorRow"><button data-edit="prev">前の建物</button><button data-edit="next">次の建物</button></div>
<div class="editorRow"><button data-edit="xMinus">X −</button><button data-edit="xPlus">X ＋</button><button data-edit="zMinus">Z −</button><button data-edit="zPlus">Z ＋</button></div>
<div class="editorRow"><button data-edit="hMinus">高さ −</button><button data-edit="hPlus">高さ ＋</button><button data-edit="reset">初期値に戻す</button></div>
<div id="editNotice">変更はこの端末に自動保存</div>
</div>
<button id="storeJump" type="button">コンビニへ</button>
<button id="shootToggle" type="button">撮影</button>
<div id="shootPanel" hidden>
<strong>撮影・カメラカット</strong>
<span id="shotCounter"></span>
<div class="shotRow"><button data-shot="add">カット追加</button><button id="shootPlay" data-shot="play">再生</button></div>
<div class="shotRow"><button data-shot="stop">停止</button><button data-shot="delete">最後を削除</button></div>
<button data-shot="portrait">縦9:16 / 横プレビュー切替</button>
<span id="shootStatus">構図を保存できます</span>
<small>構図は端末内に保存。動画録画は未対応。</small>
</div>
<div id="portraitGuide" hidden></div>
<div id="pad"><div id="stick"></div></div><script>@@GAME_JS@@</script></body></html>
