'use strict';
const canvas=document.getElementById('scene'),gl=canvas.getContext('webgl',{antialias:true,alpha:false,powerPreference:'high-performance'});
if(!gl){document.body.textContent='この端末ではWebGLを使用できません';throw Error('WebGL unavailable')}
const vs='attribute vec3 p;attribute vec3 color;uniform mat4 vp;varying vec3 c;void main(){gl_Position=vp*vec4(p,1.);c=color;}';
const fs='precision mediump float;varying vec3 c;uniform float opacity;void main(){gl_FragColor=vec4(c,opacity);}';
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
const locP=gl.getAttribLocation(prog,'p'),locC=gl.getAttribLocation(prog,'color'),locVP=gl.getUniformLocation(prog,'vp'),locOpacity=gl.getUniformLocation(prog,'opacity');
gl.uniform1f(locOpacity,1);
const vertices=[];
function color(hex){return [(hex>>16&255)/255,(hex>>8&255)/255,(hex&255)/255]}
function tri(a,b,c,col){for(const v of [a,b,c])vertices.push(...v,...col)}
function quad(a,b,c,d,col){tri(a,b,c,col);tri(a,c,d,col)}
function box(x,y,z,w,h,d,hex){
 const c=color(hex),top=c.map(t=>Math.min(1,t*1.12)),side=c.map(t=>t*.83),dark=c.map(t=>t*.72),X=x-w/2,Z=z-d/2,U=x+w/2,V=z+d/2,T=y+h;
 quad([X,T,Z],[U,T,Z],[U,T,V],[X,T,V],top);
 quad([X,y,V],[U,y,V],[U,T,V],[X,T,V],c);quad([U,y,Z],[X,y,Z],[X,T,Z],[U,T,Z],side);
 quad([U,y,V],[U,y,Z],[U,T,Z],[U,T,V],dark);quad([X,y,Z],[X,y,V],[X,T,V],[X,T,Z],side);
}
function seeded(a,b){let t=Math.sin(a*127.1+b*311.7)*43758.5453;return t-Math.floor(t)}
// v14 scene registry: one POI owns independently addressable building and prop instances.
// Values here are an authored starting layout, not surveyed real-world dimensions.
const SCENE_STORAGE_KEY='sample-editor-scene-v1';
const scene={
 schema:1,
 pois:[{id:'yanaka-ginza-study',name:'谷中銀座・再現研究区画',bounds:{minX:-19,maxX:19,minZ:-66,maxZ:66},source:'photo-inspired estimates',buildingIds:[],objectIds:[]}],
 buildings:[],
 objects:[],
 selectedBuildingId:null
};
function defaultShop(side,k){
 return {
  id:'yanaka-'+(side===-1?'west':'east')+'-'+String(k+1).padStart(2,'0'),
  poiId:'yanaka-ginza-study',type:'shop',side,k,
  x:side*(8.65+seeded(k*17,side)*.52),
  z:-51+k*7.25+(seeded(k,side)*.55-.275),
  width:6.75+seeded(k,side*9)*.35,
  depth:5.2+seeded(k*8,side)*1.3,
  height:4.8+Math.floor(seeded(k*5,side)*3)*2.65,
  material:'painted-plaster',source:'photo-inspired estimates'
 };
}
for(const side of [-1,1])for(let k=0;k<15;k++)scene.buildings.push(defaultShop(side,k));
for(let k=0;k<8;k++)for(const side of [-1,1]){
 scene.objects.push({id:'pole-'+side+'-'+k,poiId:'yanaka-ginza-study',type:'utility-pole',
  x:side*5.95,z:-48+k*14.2,height:7.1,source:'photo-inspired estimates'});
}
// v20 convenience-store study at the end of the commercial street.
// Coordinates are a designed prototype, not measurements of a named real shop.
const convenience={id:'mini-market-01',poiId:'convenience-study',
 type:'convenience',x:0,z:79.5,width:17.6,depth:20,height:4.35,
 entrance:{x:0,z:69.5,opening:3.5},
 source:'Japanese convenience-store layout reference; approximate proportions'};
scene.pois.push({id:'convenience-study',name:'小型コンビニ・研究店舗',
 bounds:{minX:-10,maxX:10,minZ:68,maxZ:91},
 source:'layout study, estimated',buildingIds:[convenience.id],objectIds:[]});
scene.buildings.push(convenience);
const fixtures=[
 ['counter-left','checkout',-5.6,72.35,2.6,1.1,1.05],
 ['counter-machine','register',-5.6,72.35,.48,.40,.33],
 ['shelf-a','food-daily-shelf',-3.15,77.2,1.16,3.55,1.57],
 ['shelf-b','drink-shelf',3.15,77.2,1.16,3.55,1.57],
 ['shelf-c','food-daily-shelf',-3.15,83.1,1.16,3.55,1.57],
 ['shelf-d','drink-shelf',3.15,83.1,1.16,3.55,1.57],
 ['back-fridge-a','fridge',-5.45,88.05,2.8,.8,2.50],
 ['back-fridge-b','fridge',-2.55,88.05,2.8,.8,2.50],
 ['back-fridge-c','fridge',.35,88.05,2.8,.8,2.50],
 ['back-fridge-d','fridge',3.25,88.05,2.8,.8,2.50],
 ['back-fridge-e','fridge',6.15,88.05,2.8,.8,2.50],
 ['side-rack-a','food-daily-shelf',7.5,75.6,.66,3.4,1.95],
 ['side-rack-b','food-daily-shelf',7.5,82.1,.66,3.4,1.95],
 ['hot-case','hot-case',-6.15,76.1,1.08,.85,1.15],
 ['magazine-rack','magazine-shelf',-7.3,74.8,2.7,.52,1.58],
 ['entry-mat','floor-mat',0,71.2,2.9,1.65,.018]
];
for(const [id,type,x,z,width,depth,height] of fixtures){
 scene.objects.push({id:'mini-market-'+id,poiId:'convenience-study',
  type,x,z,width,depth,height,yaw:type==='magazine-shelf'?-Math.PI/2:0,
  source:'reference-inspired, approximate'});
 scene.pois[1].objectIds.push('mini-market-'+id);
}
scene.pois[0].buildingIds=scene.buildings.filter(b=>b.type==='shop').map(b=>b.id);
scene.pois[0].objectIds=scene.objects.filter(o=>o.poiId==='yanaka-ginza-study').map(o=>o.id);
function restoreSceneEdits(){
 try{
  const saved=JSON.parse(localStorage.getItem(SCENE_STORAGE_KEY)||'null');
  if(!saved||saved.schema!==1||!Array.isArray(saved.buildings))return;
  for(const entry of saved.buildings){
   const b=scene.buildings.find(item=>item.id===entry.id);
   if(!b)continue;
   for(const field of ['x','z','width','depth','height']){
    const value=entry[field];
    if(Number.isFinite(value)&&Math.abs(value)<200&&
       (field==='x'||field==='z'||(field==='height'?value>=3:value>=3)))
      b[field]=value;
   }
  }
 }catch(err){console.warn('Scene edits unavailable',err)}
}
function saveSceneEdits(){
 try{
  localStorage.setItem(SCENE_STORAGE_KEY,JSON.stringify({
   schema:scene.schema,
   buildings:scene.buildings.map(b=>({id:b.id,x:b.x,z:b.z,width:b.width,depth:b.depth,height:b.height}))
  }));
  return true;
 }catch(err){console.warn('Saving scene failed',err);return false;}
}
restoreSceneEdits();
// Separate local-only fixture orientation edits, with strict whitelist validation.
const FIXTURE_ANGLE_KEY='sample-editor-fixture-yaw-v1';
function restoreFixtureAngles(){
 try{
  const saved=JSON.parse(localStorage.getItem(FIXTURE_ANGLE_KEY)||'null');
  if(!saved||saved.schema!==1||!saved.angles)return;
  for(const o of scene.objects.filter(o=>o.poiId==='convenience-study')){
   const a=saved.angles[o.id];
   if([0,1,2,3].includes(a))o.yaw=a*Math.PI/2;
  }
 }catch(e){console.warn('Fixture angles unavailable',e)}
}
function saveFixtureAngles(){
 try{
  const angles={};
  for(const o of scene.objects.filter(o=>o.poiId==='convenience-study'))
   angles[o.id]=((Math.round(o.yaw/(Math.PI/2))%4)+4)%4;
  localStorage.setItem(FIXTURE_ANGLE_KEY,JSON.stringify({schema:1,angles}));
  return true;
 }catch(e){console.warn('Could not save fixture angles',e);return false}
}
restoreFixtureAngles();
// Yanaka Ginza-inspired compact shopping street. Visual study: Taito ward streetscape
// guidance and street-level photos. Dimensions are approximate, not surveyed geometry.
// 1 world unit ~= 1 meter; narrow lane, low-rise mixed facades and varied storefront depths.
box(0,-.30,0,150,.15,175,0x6b795e);
box(0,-.155,0,10.6,.10,132,0xb18d67); // warm ochre pedestrian surface
for(const side of [-1,1]){
 // Drainage and narrow stone frontage, raised slightly above the pedestrian street.
 box(side*5.37,-.055,0,.24,.055,132,0x858784);
 box(side*5.87,-.045,0,.78,.08,132,0x9a9690);
}
// The scene registry drives individual building buffers and their collision footprints.
const townBuildings=[];
const storePalettes=[0x9b8f7d,0xc1ad94,0xc4c2b5,0x998a79,0xa7b0a9,0x877c70,0xb6a48c];
const awnings=[0x467269,0x824d49,0xc1ab79,0x425d73,0x76674a,0x865f40,0x537b83];
const signage=[0x554a3d,0x3d5c51,0x755843,0x7b4842,0x4b5861,0x746340];
function renderStreetShop(shop){
 const {side,k}=shop;
 const x=shop.x,z=shop.z,width=shop.width,depth=shop.depth,height=shop.height;
 const wall=storePalettes[(k+(side>0?3:0))%storePalettes.length];
 const accent=awnings[(k*3+(side>0?1:0))%awnings.length];
 const front=x-side*depth*.5;
 const start=vertices.length;
 // Individual plot: narrower than a modern office frontage.
 box(x,.0,z,depth,height,width,wall);
 box(x,height,z,depth+.18,.17,width+.22,0x555653);
 for(let floor=1;floor<Math.floor(height/2.65);floor++){
  const y=1.6+floor*2.66;
  for(const p of [-1.65,1.65]){
   box(front-side*.055,y,z+p,.08,1.37,1.32,0x4b6266);
   box(front-side*.103,y-.72,z+p,.12,.085,1.47,0xc7b9a4);
   box(front-side*.12,y,z+p,.08,1.43,.07,0xb2a598);
  }
 }
 // Open shop fronts, not repetitive full-height glass office walls.
 box(front-side*.07,.045,z,.12,2.55,width-.38,0x342f2a);
 box(front-side*.14,.21,z,.14,2.18,width-.58,0x53635f);
 for(const p of [-width*.28,width*.28]){
  box(front-side*.20,.1,z+p,.09,2.32,.1,0x8d755b);
  box(front-side*.23,.96,z+p,.075,1.4,1.45,0x304946);
 }
 // Varied upper signboards, small projecting sign + realistic awning with sloped fabric.
 box(front-side*.19,2.62,z,.17,.56,width-.28,signage[k%signage.length]);
 for(const p of [-1.75,-.85,.1,1.1,1.75]){
  box(front-side*.293,2.65,z+p,.015,.12,.37,0xd0ba89);
 }
 const edge=front-side*(1.10+seeded(k*7,side)*.28);
 quad([front-side*.25,2.45,z-width*.47],[edge,2.15,z-width*.47],
      [edge,2.15,z+width*.47],[front-side*.25,2.45,z+width*.47],color(accent));
 box(edge,2.11,z,.09,.12,width*.95,accent);
 for(const p of [-width*.42,width*.42])box(edge,2.16,z+p,.045,.09,.04,0x4a4743);
 // Cargo boxes, shop baskets, planters and varied stock extend towards the street.
 const category=k%5;
 for(let i=0;i<4;i++){
  const zz=z-2.1+i*1.33+seeded(k,i)*.12;
  const offset=category===0?.46:category===1?.68:.48;
  const px=edge-side*offset;
  if(i===3&&k%4===0)continue;
  const isPlants=category===0||category===4;
  box(px,.09,zz,.60,.26,.72,isPlants?0x65513e:0x836b51);
  if(isPlants){
   box(px,.34,zz,.42,.12,.49,0x41452d);
   box(px,.45,zz,.54,.36,.55,[0x536c41,0x758647,0x597b56][i%3]);
  }else{
   for(let t=0;t<3;t++)
    box(px,.38,zz-.22+t*.21,.42,.18,.17,[0xb7a579,0x9b633c,0xc3a24f,0x72817b][(i+t+k)%4]);
  }
 }
 // Door handles and wall-mounted air-conditioning boxes.
 box(front-side*.31,1.06,z+width*.24,.035,.16,.035,0xbdb4a0);
 if(k%3===0){
  box(front-side*.12,3.75,z-width*.34,.30,.43,.66,0xc1c2bc);
  for(let t=0;t<4;t++)box(front-side*.29,3.62+t*.08,z-width*.34,.012,.025,.44,0x656b67);
 }
 if(k%4===1){
  box(edge-side*.36,.45,z+2.20,.52,.88,.45,0x8d7b5d);
  box(edge-side*.39,1.33,z+2.20,.08,.06,.53,0xd5c7a5);
 }
 const geometry=new Float32Array(vertices.splice(start));
 if(shop.buffer)gl.deleteBuffer(shop.buffer);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 gl.bufferData(gl.ARRAY_BUFFER,geometry,gl.STATIC_DRAW);
 Object.assign(shop,{cx:x,cz:z,front,buffer,count:geometry.length/6});
 return shop;
}
for(const shop of scene.buildings.filter(b=>b.type==='shop'))townBuildings.push(renderStreetShop(shop));
// Lanterns, utility poles, overhead cables and drainage add a credible lived-in streetscape.
for(const object of scene.objects.filter(o=>o.type==='utility-pole')){
 const z=object.z;
 const side=Math.sign(object.x),px=object.x;
 {
  box(px,0,z,.18,object.height,.18,0x676765);
  box(px,5.45,z,.36,.23,.40,0x8d8d86);
  box(px-side*.26,4.4,z+.46,.035,.12,1.12,0x565b56);
  box(px-side*.26,4.34,z+1.02,.31,.19,.24,0xb4ae85);
  // Thin rails imitate several drooping overhead lines without expensive curves.
  for(let wire=0;wire<3;wire++){
   const h=6.3+wire*.17;
   for(let t=0;t<5;t++){
    const xx=-5.6+t*2.24;
    box(xx,h-.24*Math.sin((t+1)*Math.PI/6),z+wire*.15,2.27,.027,.029,0x424544);
   }
  }
 }
}
// Street crosses small paved courts at each end so the scene is explorable.

function updateNpcPose(npc,dt){
 const gain=1-Math.exp(-Math.min(.05,Math.max(0,dt))*6);

  npc.pose[key]+=((npc.action===key?1:0)-npc.pose[key])*gain;
  if(Math.abs(npc.pose[key])<.001)npc.pose[key]=0;

}
// NPC motion is time-based and only advances when an unobstructed route exists.
// Bystanders stop for merchandise; the clerk remains behind the checkout.
function updateNPCs(dt){
 const time=Math.min(.05,Math.max(0,dt));
 for(const npc of npcs){
  if(npc.knock){npc.effort=0;continue;}
  if(npc.role==='bystander'){npc.phase+=time*.32;updateNpcPose(npc,time);continue;}
  if(npc.role==='clerk'){
   npc.heading=Math.PI+.12*Math.sin((npc.phase+=time*.32));
   const active=npcs.some(other=>other.role==='shopper'&&other.action==='pay');
   npc.action=active?'pay':'idle';
   npc.transaction=active?Math.min(1,(npc.transaction||0)+time*3):0;
   npc.effort=0;
   updateNpcPose(npc,time);
   continue;
  }
  const waypoint=npc.route[npc.routeIndex];
  if(npc.state==='looking'){
   npc.wait-=time;
   const face=Math.atan2(waypoint.lookX-npc.x,waypoint.lookZ-npc.z);
   const diff=Math.atan2(Math.sin(face-npc.heading),Math.cos(face-npc.heading));
   npc.heading+=diff*Math.min(1,time*4);
   npc.effort=0;
   const elapsed=waypoint.wait-npc.wait;
   if(waypoint.activity==='pick'){
    npc.action=elapsed<1.15?'pick':npc.carrying?'carry':'idle';
    if(elapsed>=1.15)npc.carrying=true;
   }else if(waypoint.activity==='pay'){
    npc.action='pay';
    // Release one item onto the counter, then finish a single payment.
    if(npc.wait<=waypoint.wait-1.35)npc.itemPlaced=true;
    if(npc.wait<=.45&&!npc.paymentDone){npc.carrying=false;npc.shoppingCycles++;npc.paymentDone=true}
   }else npc.action=npc.carrying?'carry':'idle';
   if(npc.wait<=0){
    npc.state='walking';npc.routeIndex=(npc.routeIndex+1)%npc.route.length;
    npc.action=npc.carrying?'carry':'idle';
    npc.paymentDone=false;
    npc.itemPlaced=false;
   }
   updateNpcPose(npc,time);
   continue;
  }
  const dx=waypoint.x-npc.x,dz=waypoint.z-npc.z;
  const distance=Math.hypot(dx,dz);
  if(distance<.12){
   npc.x=waypoint.x;npc.z=waypoint.z;
   npc.state='looking';npc.wait=waypoint.wait;npc.effort=0;
   updateNpcPose(npc,time);
   continue;
  }
  const move=Math.min(distance,npc.speed*time),ux=dx/distance,uz=dz/distance;
  const nextX=npc.x+ux*move,nextZ=npc.z+uz*move;
  // Shared wall/fixture collision and player clearance.
  if(blocked(nextX,nextZ)||Math.hypot(nextX-player.x,nextZ-player.z)<.48||
     npcs.some(other=>other!==npc&&Math.hypot(nextX-other.x,nextZ-other.z)<.48)){
   npc.effort=0;
   updateNpcPose(npc,time);
   continue;
  }
  npc.x=nextX;npc.z=nextZ;
  npc.heading=Math.atan2(ux,uz);
  npc.phase+=move*Math.PI/.78;
  npc.action=npc.carrying?'carry':'idle';

function catStrike(){

  const strikeY=clamp(cat.scale*.67,.7,b.height-1);

   Math.hypot(a.z-strikeZ,(a.y-strikeY)*.62)-Math.hypot(b2.z-strikeZ,(b2.y-strikeY)*.62));

   const panel=candidates[j];

   panel.broken=true;hits++;

     vx:dirX*(3+Math.random()*4),vy:2+Math.random()*4,
     vz:dirZ*(2+Math.random()*4)+(Math.random()-.5)*3,

   if(!catHitTest(frontX,shop.z,Math.max(1.5,shop.width*.37)))continue;

   for(let i=0;i<18;i++){

function renderCatDebris(){

  for(let i=0;i<12;i++)box(shop.front+Math.sin(i*6.1)*1.0,.12,

let characterMovementBlend=0;

   if(!blocked(entity.x,nz)&&!npcBlocks(entity.x,nz)&&!catBlocks(entity.x,nz))entity.z=nz;

   else {
   // Advance one half-stride for each physical footstep, matching the footfall SE.

   }
  }

 // Blend to an idle pose when the stick is released or movement is blocked.

  renderCatPurrRings();

  for(const o of tokyoProps)renderTokyoProp(o);

  }else{

  }
 }
 const arr=new Float32Array(vertices);gl.bindBuffer(gl.ARRAY_BUFFER,avatarBuffer);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.DYNAMIC_DRAW);
 const dpr=Math.min(2,window.devicePixelRatio||1),w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}

 for(const b of [...townBuildings,...tokyoBuildings]){
