<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>サンプルエディター</title><style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#92b8ce;font-family:sans-serif}canvas{display:block;width:100%;height:100%}#v{position:absolute;top:max(10px,env(safe-area-inset-top));left:14px;color:#fff;text-shadow:0 2px 4px #222;font:bold 15px sans-serif}#pad{position:absolute;left:max(25px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:150px;height:150px;border:2px solid #ffffff70;border-radius:50%;background:#13293755;box-shadow:0 0 15px #0003;touch-action:none}#stick{position:absolute;left:47px;top:47px;width:56px;height:56px;background:#e2e7e9ad;border:2px solid white;border-radius:50%;pointer-events:none}#hint{position:absolute;right:12px;top:12px;color:#fff;background:#1b2c3970;padding:5px 9px;border-radius:7px;font-size:12px}@media(max-height:420px){#pad{width:120px;height:120px}#stick{left:37px;top:37px;width:46px;height:46px}}
</style></head><body><canvas id="scene"></canvas><div id="v">v1</div><div id="hint">サンプルエディター</div><div id="pad"><div id="stick"></div></div><script>
'use strict';
const canvas=document.getElementById('scene'),gl=canvas.getContext('webgl',{antialias:true,alpha:false,powerPreference:'high-performance'});
if(!gl){document.body.textContent='この端末ではWebGLを使用できません';throw Error('WebGL unavailable')}
const vs='attribute vec3 p;attribute vec3 color;uniform mat4 vp;varying vec3 c;void main(){gl_Position=vp*vec4(p,1.);c=color;}';
const fs='precision mediump float;varying vec3 c;void main(){gl_FragColor=vec4(c,1.);}';
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
const locP=gl.getAttribLocation(prog,'p'),locC=gl.getAttribLocation(prog,'color'),locVP=gl.getUniformLocation(prog,'vp');
const vertices=[];
function color(hex){return [(hex>>16&255)/255,(hex>>8&255)/255,(hex&255)/255]}
function tri(a,b,c,col){for(const v of [a,b,c])vertices.push(...v,...col)}
function quad(a,b,c,d,col){tri(a,b,c,col);tri(a,c,d,col)}
function box(x,y,z,w,h,d,hex){
 const c=color(hex),top=c.map(t=>Math.min(1,t*1.12)),side=c.map(t=>t*.83),dark=c.map(t=>t*.72),X=x-w/2,Z=z-d/2,U=x+w/2,V=z+d/2,T=y+h;
 quad([X,T,Z],[U,T,Z],[U,T,V],[X,T,V],top);
 quad([X,y,V],[U,y,V],[U,T,V],[X,T,V],c);quad([U,y,Z],[X,y,Z],[X,T,Z],[U,T,Z],side);
 quad([U,y,V],[U,y,Z],[U,T,Z],[U,T,V],dark);quad([X,y,Z],[X,y,V],[X,T,V],[X,T,Z],side);
}
function seeded(a,b){let t=Math.sin(a*127.1+b*311.7)*43758.5453;return t-Math.floor(t)}
// compact traversable grid: five east-west and north-south avenues, buildings in blocks
box(0,-.16,0,260,.12,260,0x70845f);
for(let n=-2;n<=2;n++){
 box(n*40,-.095,0,11,.055,236,0x40474d);
 box(0,-.09,n*40,236,.055,11,0x40474d);
 for(let k=-11;k<=11;k++){
  if(Math.abs(k*10-n*40)<8)continue;
  box(n*40,-.056,k*10, .16,.007,3.4,0xded6a6);
  box(k*10,-.054,n*40,3.4,.007,.16,0xded6a6);
 }
}
for(let x=-2;x<2;x++)for(let z=-2;z<2;z++){
 const bx=x*40+20,bz=z*40+20;
 box(bx,-.04,bz,29,.14,29,0x9f9d97);
 for(let i=0;i<3;i++)for(let j=0;j<3;j++){
  const cx=bx-9+i*9,cz=bz-9+j*9;
  if((i===1&&j===1)||(seeded(x*19+i,z*17+j)<.21)){
   box(cx,.02,cz,3,.12,3,0x55704b);
   box(cx,.1,cz, .45,3,.45,0x624e39);
   box(cx,2.4,cz,3.2,3.7,3.2,0x527c49);
   continue;
  }
  const height=6+Math.floor(seeded(cx,cz)*5)*3;
  const shades=[0xb4a99c,0xbcc1c0,0x9badaf,0xd0c4ad,0xa89a89,0xa9b4a5];
  const tint=shades[Math.floor(seeded(cx+6,cz+3)*shades.length)];
  box(cx,0,cz,6.9,height,6.9,tint);
  box(cx,height,cz,7.1,.28,7.1,0x5d696d);
  for(let floor=0;floor<Math.floor(height/2.7);floor++)for(let side of [-1,1]){
   const yy=1.4+floor*2.7;
   for(let wx of [-1.9,1.9]){
    box(cx+wx,yy,cz+side*3.485,1.15,1.3,.055,0x4b7184);
    box(cx+side*3.485,yy,cz+wx,.055,1.3,1.15,0x4b7184);
   }
  }
  box(cx,0,cz+3.5,1.5,2.45,.08,0x645b51);
 }
}
// visible pedestrian avatar, regenerated separately from static town
const staticArray=new Float32Array(vertices),staticBuffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,staticBuffer);gl.bufferData(gl.ARRAY_BUFFER,staticArray,gl.STATIC_DRAW);
const avatarBuffer=gl.createBuffer();
const mat4={mul(a,b){const out=new Float32Array(16);for(let col=0;col<4;col++)for(let row=0;row<4;row++)for(let k=0;k<4;k++)out[col*4+row]+=a[k*4+row]*b[col*4+k];return out},
 perspective(fov,asp,near,far){const t=1/Math.tan(fov/2);return new Float32Array([t/asp,0,0,0,0,t,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0])},
 look(eye,target){let z=norm(sub(eye,target)),x=norm(cross([0,1,0],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1])}};
function sub(a,b){return a.map((v,i)=>v-b[i])}function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0)}function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function norm(a){let q=Math.hypot(...a)||1;return a.map(v=>v/q)}
let player={x:0,z:0,heading:0},padX=0,padY=0,keys={},last=0,walk=0;
const pad=document.getElementById('pad'),stick=document.getElementById('stick');let pointer=null;
function moveStick(e){const r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,rad=r.width*.32,mag=Math.hypot(dx,dy),s=Math.min(1,rad/(mag||1));padX=dx*s/rad;padY=dy*s/rad;const size=stick.offsetWidth;stick.style.left=(r.width/2-size/2+padX*rad)+'px';stick.style.top=(r.height/2-size/2+padY*rad)+'px'}
function resetStick(){pointer=null;padX=padY=0;stick.style.left=(pad.clientWidth-stick.offsetWidth)/2+'px';stick.style.top=(pad.clientHeight-stick.offsetHeight)/2+'px'}
pad.addEventListener('pointerdown',e=>{pointer=e.pointerId;pad.setPointerCapture(pointer);moveStick(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pointer)moveStick(e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,e=>{if(e.pointerId===pointer)resetStick()});
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});window.addEventListener('blur',resetStick);
function blocked(x,z){
 // building footprints only; roads and sidewalks remain fully navigable
 for(let bx=-2;bx<2;bx++)for(let bz=-2;bz<2;bz++)for(let i=0;i<3;i++)for(let j=0;j<3;j++){
  const cx=bx*40+20-9+i*9,cz=bz*40+20-9+j*9;
  if(i===1&&j===1||seeded(bx*19+i,bz*17+j)<.21)continue;
  if(Math.abs(x-cx)<3.85&&Math.abs(z-cz)<3.85)return true;
 }return false;
}
function bind(buffer){gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.vertexAttribPointer(locP,3,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(locP);gl.vertexAttribPointer(locC,3,gl.FLOAT,false,24,12);gl.enableVertexAttribArray(locC)}
function frame(now){
 const dt=Math.min(.05,(now-last)/1000||0);last=now;
 let vx=padX+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),
 vz=padY+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const speed=Math.min(1,Math.hypot(vx,vz));if(speed>.12){
  let len=Math.hypot(vx,vz);vx/=len;vz/=len;let step=dt*4.5*speed;
  let nx=Math.max(-112,Math.min(112,player.x+vx*step)),nz=Math.max(-112,Math.min(112,player.z+vz*step));
  if(!blocked(nx,player.z))player.x=nx;if(!blocked(player.x,nz))player.z=nz;
  player.heading=Math.atan2(vx,vz);walk+=dt*10;
 }
 vertices.length=0;
 const bob=speed>.12?Math.sin(walk)*.05:0;
 box(player.x,0,player.z,.53,.22,.36,0x28313a);
 box(player.x,.21+bob,player.z,.68,1.08,.42,0x3c5c6c);
 box(player.x,1.28+bob,player.z,.43,.49,.43,0xc2a185);
 box(player.x-.17,.0,player.z-.03,.16,.7,.19,0x242c33);
 box(player.x+.17,.0,player.z-.03,.16,.7,.19,0x242c33);
 const arr=new Float32Array(vertices);gl.bindBuffer(gl.ARRAY_BUFFER,avatarBuffer);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.DYNAMIC_DRAW);
 const dpr=Math.min(2,window.devicePixelRatio||1),w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.enable(gl.DEPTH_TEST);gl.clearColor(.56,.73,.83,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const eye=[player.x+8,9.5,player.z+13],look=[player.x,1.2,player.z],vp=mat4.mul(mat4.perspective(1.05,w/h,.1,350),mat4.look(eye,look));
 gl.uniformMatrix4fv(locVP,false,vp);
 bind(staticBuffer);gl.drawArrays(gl.TRIANGLES,0,staticArray.length/6);
 bind(avatarBuffer);gl.drawArrays(gl.TRIANGLES,0,arr.length/6);
 requestAnimationFrame(frame);
}
resetStick();requestAnimationFrame(frame);
</script></body></html>
