function piano(freq,when,vel=.65){if(!audio||!music)return;const {ac,musicGain}=audio;for(const [ratio,weight] of [[1,1],[2,.20],[3,.08]]){const o=ac.createOscillator(),g=ac.createGain(),filter=ac.createBiquadFilter();o.type=ratio===1?'triangle':'sine';o.frequency.setValueAtTime(freq*ratio,when);filter.type='lowpass';filter.frequency.value=ratio===1?2200:1500;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(Math.max(.001,vel*.16*weight),when+.008);g.gain.exponentialRampToValueAtTime(.0001,when+1.35);o.connect(filter);filter.connect(g);g.connect(musicGain);o.start(when);o.stop(when+1.40)}}
function bird(when){if(!audio||!music)return;const {ac,musicGain}=audio;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(830,when);o.frequency.exponentialRampToValueAtTime(1310,when+.10);o.frequency.exponentialRampToValueAtTime(940,when+.24);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.022,when+.03);g.gain.exponentialRampToValueAtTime(.0001,when+.27);o.connect(g);g.connect(musicGain);o.start(when);o.stop(when+.28)}
function footstep(){if(!audio)return;const {ac,fxGain}=audio,now=ac.currentTime,buffer=ac.createBuffer(1,Math.round(ac.sampleRate*.1),ac.sampleRate),a=buffer.getChannelData(0);for(let i=0;i<a.length;i++){const t=i/a.length;a[i]=(Math.random()*2-1)*(1-t)*.45}const src=ac.createBufferSource(),filter=ac.createBiquadFilter(),g=ac.createGain();filter.type='lowpass';filter.frequency.value=520;src.buffer=buffer;g.gain.value=.27;src.connect(filter);filter.connect(g);g.connect(fxGain);src.start(now)}
const melody=[392,440,523.25,440,349.23,392,329.63,293.66,329.63,392,440,392,261.63,293.66,329.63,392];
function scheduleAudio(){if(!audio||!music||audio.ac.state!=='running')return;const now=audio.ac.currentTime;if(nextNote<now)nextNote=now+.05;while(nextNote<now+.3){piano(melody[noteIndex%melody.length],nextNote,.8);if(noteIndex%4===0)piano([196,174.61,164.81,130.81][Math.floor(noteIndex/4)%4],nextNote,.45);noteIndex++;nextNote+=.58}
if(ambientNext<now){bird(now+.05);ambientNext=now+4+Math.random()*5}}
document.getElementById('start').addEventListener('click',()=>{playing=true;overlay.style.display='none';startAudio();nextNote=0});
document.getElementById('audioToggle').addEventListener('click',()=>{music=!music;document.getElementById('audioToggle').textContent=music?'音楽 ON':'音楽 OFF';if(music){startAudio();nextNote=0}else if(audio)audio.musicGain.gain.value=0;if(audio&&music)audio.musicGain.gain.value=.61});
volume.addEventListener('input',()=>{document.getElementById('volumeNumber').textContent=volume.value+'%';if(audio)audio.master.gain.value=Number(volume.value)/100*.85});
document.getElementById('camera').addEventListener('click',()=>{cameraMode=(cameraMode+1)%2;notify(cameraMode===0?'真上寄りカメラ':'少し斜めのカメラ')});
document.getElementById('inspect').addEventListener('click',()=>{const [dx,dz]=directions[player.face],x=player.x+dx,z=player.z+dz;notify(walls.has(x+','+z)?'白い壁。角まできちんと閉じている':x>=7&&x<=15&&z>=7&&z<=14?'静かな家の中。家具が置かれている':'森の空気が澄んでいる');startAudio()});
let holdDir=null,holdTime=0,heldPointer=null;const keys={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3};
function moveStep(dir,time){player.face=dir;const [dx,dz]=directions[dir],x=player.x+dx,z=player.z+dz;if(stepping||blocked(x,z))return false;stepping=true;stepStart=time;stepFrom=[player.x,player.z];stepTo=[x,z];player.x=x;player.z=z;footstep();return true}
document.querySelectorAll('[data-dir]').forEach(b=>{const dir={up:0,right:1,down:2,left:3}[b.dataset.dir];b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);holdDir=dir;heldPointer=e.pointerId;holdTime=-1;b.classList.add('on');startAudio()});for(const kind of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(kind,e=>{if(heldPointer===e.pointerId){holdDir=null;heldPointer=null}b.classList.remove('on')})});
let keyboardDir=null;addEventListener('keydown',e=>{if(keys[e.key]!==undefined){keyboardDir=keys[e.key];if(!e.repeat)holdTime=-1;e.preventDefault();startAudio()}});addEventListener('keyup',e=>{if(keys[e.key]!==undefined)keyboardDir=null});
function frame(ms){requestAnimationFrame(frame);const dt=Math.min(.05,(ms-last)/1000||0);last=ms;elapsed+=dt;if(!playing)return;
const dir=holdDir!==null?holdDir:keyboardDir;if(dir!==null){holdTime-=dt;if(holdTime<=0&&!stepping){if(moveStep(dir,ms))holdTime=.19;else holdTime=.1}}
let swing=0;if(stepping){const p=Math.min(1,(ms-stepStart)/210);player.shownX=stepFrom[0]+(stepTo[0]-stepFrom[0])*p;player.shownZ=stepFrom[1]+(stepTo[1]-stepFrom[1])*p;swing=Math.sin(p*Math.PI*2);if(p>=1){stepping=false;player.shownX=player.x;player.shownZ=player.z}}
if(messageUntil<elapsed)notice.classList.remove('show');
resize();const aspect=cvs.width/cvs.height;
const viewWidth=11.3,viewHeight=viewWidth/aspect;
const projection=orth(-viewWidth/2,viewWidth/2,-viewHeight/2,viewHeight/2,.1,100);
const pos=[player.shownX+.5,0,player.shownZ+.5],eye=cameraMode===0?[pos[0]+.01,33,pos[2]+8]:[pos[0]+2.4,24,pos[2]+12],target=[pos[0],.25,pos[2]];
const vp=mul(projection,look(eye,target));
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);draw(landscape,vp);
const angle=player.face===0?Math.PI:player.face===1?Math.PI/2:player.face===2?0:-Math.PI/2,body=mul(mul(vp,trans(pos[0],.035+Math.abs(swing)*.04,pos[2])),rot(angle));
for(const partObj of avatarParts){let mat=body;if(partObj.name==='leftArm'||partObj.name==='rightArm'||partObj.name==='leftLeg'||partObj.name==='rightLeg'){let sign=(partObj.name==='leftArm'||partObj.name==='rightLeg')?1:-1;mat=mul(body,trans(0,sign*swing*.07,sign*swing*.12))}draw(partObj.mesh,mat)}
document.getElementById('position').textContent='X '+(player.x+1)+' · Y '+(player.z+1)+' · '+faceNames[player.face]+'向き';
document.getElementById('data').firstChild.textContent='1日目 '+String(8+Math.floor(elapsed/80)).padStart(2,'0')+':'+String(Math.floor(elapsed/1.34)%60).padStart(2,'0');
scheduleAudio();
}
requestAnimationFrame(frame);
if(location.search.includes('test=1'))window.__gameTest={state:()=>({x:player.x,z:player.z,face:player.face,stepping,house,walls:[...walls],trees:trees.length,groundCounts:tileKinds.flat().reduce((a,v)=>(a[v]=(a[v]||0)+1,a),{}),treeKinds:trees.reduce((a,v)=>(a[v.t]=(a[v.t]||0)+1,a),{}),worldVertices:world.p.length/3,glLink:gl.getProgramParameter(pr,gl.LINK_STATUS),playing}),step:(dir,ms)=>moveStep(dir,ms),audio:()=>({created:!!audio,music,volume:Number(volume.value)})};
})();
