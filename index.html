<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#c5d6bf"><title>森の遺跡 — 新しい世界</title>
<style>
:root{--panel:#294638a8;--line:#f6f3df73;--font:#f8f5e8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#b8ccb1;color:var(--font);font-family:system-ui,"Noto Sans JP",sans-serif;touch-action:none}button{font:inherit;touch-action:none}#scene{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:absolute;inset:0;pointer-events:none}#status,#worldinfo{position:absolute;top:max(4.5%,env(safe-area-inset-top));background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:13px 14px;box-shadow:0 6px 20px #2b4a3340;backdrop-filter:blur(5px);font-size:12px}#status{left:2.2%;width:min(34%,238px)}#worldinfo{right:2.2%;text-align:right;min-width:31%}.heading{font-family:serif;font-size:20px;letter-spacing:.04em}.sub{font-size:10px;opacity:.9;margin:3px 0 9px}.stat{display:flex;align-items:center;gap:6px;margin:5px 0}.stat label{width:34px}.bar{height:10px;background:#182a2594;flex:1;border-radius:20px;overflow:hidden}.bar b{display:block;height:100%;border-radius:20px;background:#d98685}.stat small{width:27px;text-align:right}.stat.food .bar b{background:#deb875}#day{font-size:17px;white-space:nowrap}#res{line-height:1.7;margin:7px 0}#newWorld{background:#55745c91;border:1px solid #edeacc88;color:white;padding:9px 12px;border-radius:12px;pointer-events:auto}#tip{position:absolute;left:50%;transform:translateX(-50%);bottom:34%;padding:7px 14px;background:#2a473991;border-radius:12px;border:1px solid #f8f7e64c;white-space:nowrap;max-width:93%;overflow:hidden;text-overflow:ellipsis;font-size:12px;text-shadow:0 2px 3px #283b35;opacity:.9}#controls{position:absolute;left:50%;transform:translateX(-50%);bottom:max(3.6%,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,min(21.6vw,18vh));grid-template-rows:repeat(3,min(21.6vw,18vh));gap:5px;pointer-events:auto}.key{border-radius:19px;background:#456b58a1;border:1px solid #fffcdf63;color:#fff4e1;font-size:clamp(24px,7vw,49px);font-weight:800;box-shadow:0 4px 14px #1d382d34;backdrop-filter:blur(4px);user-select:none}.key.secondary{font-size:clamp(12px,3vw,18px);background:#726e4ca5;line-height:1.25}.key.center{background:#b09a70ba;color:#fffdf4;font-size:clamp(15px,4vw,23px)}.key:active,.key.held{background:#72977cae;transform:scale(.975)}#toast{position:absolute;top:28%;left:50%;transform:translateX(-50%);background:#244334d9;border:1px solid #f4e2ae72;border-radius:13px;padding:10px 14px;font-size:14px;opacity:0;transition:opacity .15s;white-space:nowrap;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}#toast.on{opacity:1}#items{position:absolute;top:22%;left:2%;max-width:38%;border-radius:13px;background:#2a4a3cdb;padding:10px;border:1px solid #fcf5e85a;pointer-events:auto;display:none;font-size:12px;line-height:1.7}#items.open{display:block}#items button{background:#cdbd91;color:#26352c;border:0;border-radius:8px;padding:6px}#tag{position:absolute;right:7px;bottom:7px;color:#f6f7e4b2;font-size:9px}@media (orientation:landscape){#controls{grid-template-columns:repeat(3,min(14vh,94px));grid-template-rows:repeat(3,min(14vh,94px));bottom:3%;left:14%;}#status,#worldinfo{top:9px}#tip{bottom:10px;left:60%}#items{top:33%}}@media(max-width:390px){#status,#worldinfo{padding:9px;font-size:10px}.heading{font-size:17px}#day{font-size:14px}}
</style></head><body><canvas id="scene"></canvas><div id="hud">
<div id="status"><div class="heading">森の遺跡 <small style="font:10px sans-serif">v1</small></div><div class="sub">淡彩タイル / 探索試作 / 96×96</div><div class="stat"><label>HP</label><div class="bar"><b id="hpbar" style="width:100%"></b></div><small id="hp">100</small></div><div class="stat food"><label>食料</label><div class="bar"><b id="foodbar" style="width:80%"></b></div><small id="food">80</small></div></div>
<div id="worldinfo"><div id="day">1日目 09:00</div><div id="res">木材 0 · 石 0 · 木の実 0</div><button id="newWorld">新しい世界</button></div>
<div id="toast"></div><div id="tip">十字キーで移動 · 中央で調べる / 採集</div><div id="items"><b>持ち物</b><div id="itemlist"></div><button id="closeItems">閉じる</button></div>
<div id="controls"><button class="key secondary" id="back">戻る</button><button class="key" data-dir="up">▲</button><button class="key secondary" id="weapon">武器<br>切替</button><button class="key" data-dir="left">◀</button><button class="key center" id="action">調べる</button><button class="key" data-dir="right">▶</button><button class="key secondary" id="inventory">アイテム</button><button class="key" data-dir="down">▼</button><button class="key secondary" id="pocket">ポケット</button></div>
<div id="tag">オフライン · 敵なし · 描画 Canvas 2D</div></div>
<script>
(()=>{'use strict';
const cvs=document.getElementById('scene'),ctx=cvs.getContext('2d',{alpha:false});
if(!ctx){document.getElementById('tip').textContent='描画に対応していない端末です';return}
const SIZE=96,T=42,TAU=Math.PI*2;let W=0,H=0,dpr=1,zoom=1,camX=0,camY=0,last=0,sec=0,seed=530,wood=0,stone=0,berries=0,food=80,hp=100,noticeTimer=0;
const player={x:48.5,y:52.5,dir:'down',bob:0};const keys=new Set();let props=[],walls=new Set(),doors=new Set(),furn=[],buildings=[],tiles=[];
const index=(x,y)=>y*SIZE+x,point=(x,y)=>x+','+y,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const hash=(x,y,s=0)=>{const n=Math.sin((x+seed)*127.1+(y-seed)*311.7+s*67.7)*43758.5453;return n-Math.floor(n)};
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,1.6);cvs.width=Math.round(W*dpr);cvs.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function message(s){document.getElementById('toast').textContent=s;document.getElementById('toast').classList.add('on');noticeTimer=2.5}
function insideBuilding(x,y){return buildings.find(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)}
function build(x,y,w,h,kind){
 const b={x,y,w,h,kind};buildings.push(b);
 // Perimeter is complete including all 4 corner tiles. Only the designated door cell is open.
 const doorX=x+Math.floor(w/2),doorY=y+h-1;
 b.door={x:doorX,y:doorY};doors.add(point(doorX,doorY));
 for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){
  tiles[index(xx,yy)]=2;
  if(xx===x||xx===x+w-1||yy===y||yy===y+h-1){
    if(!(xx===doorX&&yy===doorY))walls.add(point(xx,yy));
  }
 }
 const deco=[['table',x+3,y+3],['shelf',x+w-3,y+2],['bed',x+w-3,y+h-3],['chest',x+3,y+h-3]];
 for(const [type,fx,fy] of deco)if(fx>x&&fx<x+w-1&&fy>y&&fy<y+h-1)furn.push({type,x:fx,y:fy});
}
function generate(){
 seed=Math.floor(Math.random()*100000);wood=stone=berries=0;food=80;hp=100;sec=0;props=[];walls=new Set();doors=new Set();buildings=[];furn=[];tiles=new Array(SIZE*SIZE);keys.clear();
 for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){
  const road=(x>=45&&x<=52)||(y>=45&&y<=49);
  tiles[index(x,y)]=road?1:0;
 }
 build(21,50,14,11,'home');build(60,51,13,12,'home');build(20,19,13,11,'home');build(62,20,12,11,'home');build(33,29,12,10,'guild');build(64,70,15,11,'storage');
 for(let y=2;y<SIZE-2;y++)for(let x=2;x<SIZE-2;x++){
  if(insideBuilding(x,y)||tiles[index(x,y)]===1)continue;
  const h=hash(x,y,1);
  if(h<.055)props.push({x,y,type:'tree',used:false});
  else if(h<.08)props.push({x,y,type:'rock',used:false});
  else if(h<.135)props.push({x,y,type:'bush',used:false});
  else if(h<.16)props.push({x,y,type:'flower',used:false});
 }
 player.x=48.5;player.y=53.5;player.dir='down';camX=player.x*T-W/2;camY=player.y*T-H*.43;
 updateHUD();message('淡い森と建物を探索しよう');
}
function updateHUD(){document.getElementById('res').textContent='木材 '+wood+' · 石 '+stone+' · 木の実 '+berries;document.getElementById('hp').textContent=Math.round(hp);document.getElementById('food').textContent=Math.round(food);document.getElementById('hpbar').style.width=hp+'%';document.getElementById('foodbar').style.width=food+'%';const mins=9*60+Math.floor(sec*2.6);document.getElementById('day').textContent='1日目 '+String(Math.floor(mins/60)%24).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}
function isSolid(x,y){const a=Math.floor(x),b=Math.floor(y);return a<0||b<0||a>=SIZE||b>=SIZE||walls.has(point(a,b))||props.some(p=>!p.used&&p.type==='tree'&&p.x===a&&p.y===b)}
function move(dt){let dx=Number(keys.has('right'))-Number(keys.has('left')),dy=Number(keys.has('down'))-Number(keys.has('up'));if(!dx&&!dy)return;const len=Math.hypot(dx,dy),speed=4.2;dx/=len;dy/=len;const nx=player.x+dx*speed*dt,ny=player.y+dy*speed*dt;if(!isSolid(nx,player.y))player.x=nx;if(!isSolid(player.x,ny))player.y=ny;if(Math.abs(dx)>Math.abs(dy))player.dir=dx>0?'right':'left';else player.dir=dy>0?'down':'up';player.bob+=dt*10;food=clamp(food-dt*.012,0,100)}
function tile(x,y){const sx=x*T,sy=y*T,k=tiles[index(x,y)],r=hash(x,y,2);
const greens=['#bfd3b5','#c8dac0','#b7d0ad','#c5d7b8','#b9d0b4'];ctx.fillStyle=k===2?'#d5cbb3':k===1?(r>.5?'#d7ccb1':'#d1c7ad'):greens[Math.floor(r*greens.length)];ctx.fillRect(sx,sy,T+1,T+1);
ctx.strokeStyle=k===2?'#b6a78c1e':'#879d7f28';ctx.lineWidth=1;ctx.strokeRect(sx+.5,sy+.5,T,T);
if(k===0){for(let j=0;j<4;j++){const px=sx+hash(x,y,13+j)*T,py=sy+hash(x,y,22+j)*T;ctx.fillStyle=j%2?'#7da07947':'#9ebc9259';ctx.fillRect(px,py,1.7,1.2)}if(r>.86){ctx.fillStyle='#fff7d4a0';ctx.fillRect(sx+19,sy+23,2,2)}}
else if(k===1){for(let j=0;j<3;j++){ctx.fillStyle='#a5a0843d';ctx.fillRect(sx+6+hash(x,y,45+j)*27,sy+6+hash(x,y,67+j)*28,2,1.5)}}}
function shrub(p){const x=p.x*T,y=p.y*T;
ctx.fillStyle='#1d3b2e2f';ctx.beginPath();ctx.ellipse(x+23,y+32,17,10,0,0,TAU);ctx.fill();
for(let j=0;j<5;j++){const xx=x+12+(j%3)*9,yy=y+18+Math.floor(j/3)*10;ctx.fillStyle=['#91af86','#779d77','#a0bb92','#6f9570','#93b28a'][j];ctx.beginPath();ctx.arc(xx,yy,9,0,TAU);ctx.fill()}if(p.type==='flower'){ctx.fillStyle='#c98787';ctx.beginPath();ctx.arc(x+21,y+19,3,0,TAU);ctx.arc(x+32,y+26,3,0,TAU);ctx.fill()}}
function rock(p){const x=p.x*T,y=p.y*T;ctx.fillStyle='#39483b28';ctx.beginPath();ctx.ellipse(x+22,y+31,15,7,0,0,TAU);ctx.fill();ctx.fillStyle='#8a9891';ctx.beginPath();ctx.moveTo(x+7,y+28);ctx.lineTo(x+16,y+12);ctx.lineTo(x+30,y+9);ctx.lineTo(x+37,y+23);ctx.lineTo(x+31,y+34);ctx.lineTo(x+15,y+34);ctx.closePath();ctx.fill();ctx.fillStyle='#b3bbb2';ctx.beginPath();ctx.moveTo(x+16,y+12);ctx.lineTo(x+30,y+9);ctx.lineTo(x+24,y+19);ctx.lineTo(x+11,y+24);ctx.fill()}
function tree(p){const x=p.x*T,y=p.y*T;ctx.fillStyle='#162e2254';ctx.beginPath();ctx.ellipse(x+25,y+32,17,9,0,0,TAU);ctx.fill();ctx.fillStyle='#88735a';ctx.fillRect(x+21,y+15,7,20);for(let j=0;j<6;j++){ctx.fillStyle=['#769d7e','#87ad89','#6f9781','#9db798','#789989','#668c77'][j];ctx.beginPath();ctx.arc(x+15+(j%3)*9,y+10+Math.floor(j/3)*12,12,0,TAU);ctx.fill()}}
function drawWall(x,y){const sx=x*T,sy=y*T,left=walls.has(point(x-1,y)),right=walls.has(point(x+1,y)),up=walls.has(point(x,y-1)),down=walls.has(point(x,y+1));const c='#edf0df';ctx.fillStyle='#455a4930';ctx.fillRect(sx+4,sy+5,T,T);ctx.fillStyle=c;ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#d5dbc9';ctx.fillRect(sx,sy,T,7);ctx.fillStyle='#c6ccba';if(!left)ctx.fillRect(sx,sy,5,T);if(!right)ctx.fillRect(sx+T-5,sy,5,T);if(!up)ctx.fillRect(sx,sy,T,4);if(!down)ctx.fillRect(sx,sy+T-5,T,5);
const corner=(!left&&!up)||(!right&&!up)||(!left&&!down)||(!right&&!down);if(corner){ctx.fillStyle='#dce1d1';ctx.fillRect(sx+3,sy+3,7,7)}
ctx.fillStyle='#a6ac9c';if(hash(x,y,16)>.65)ctx.fillRect(sx+7,sy+7,3,3)}
function furniture(p){const x=p.x*T,y=p.y*T;
if(p.type==='table'){ctx.fillStyle='#9f937c';ctx.fillRect(x+5,y+12,33,22);ctx.fillStyle='#c2b093';ctx.fillRect(x+8,y+10,27,18);ctx.fillStyle='#e0d1b2';ctx.fillRect(x+11,y+12,21,12)}
if(p.type==='bed'){ctx.fillStyle='#8e9c8f';ctx.fillRect(x+3,y+3,36,35);ctx.fillStyle='#c2bcaa';ctx.fillRect(x+7,y+6,28,30);ctx.fillStyle='#dfdfce';ctx.fillRect(x+9,y+9,24,11)}
if(p.type==='shelf'){ctx.fillStyle='#a89e89';ctx.fillRect(x+5,y+4,31,33);ctx.fillStyle='#ded8c4';ctx.fillRect(x+8,y+7,25,8);ctx.fillRect(x+8,y+19,25,8)}
if(p.type==='chest'){ctx.fillStyle='#9e865e';ctx.fillRect(x+6,y+7,29,27);ctx.fillStyle='#d9b982';ctx.fillRect(x+9,y+10,23,19);ctx.fillStyle='#826845';ctx.fillRect(x+18,y+13,5,5)}}
function drawPlayer(){const x=player.x*T,y=player.y*T,b=Math.sin(player.bob)*1.5;
ctx.fillStyle='#364b3f3d';ctx.beginPath();ctx.ellipse(x,y+8,13,6,0,0,TAU);ctx.fill();
ctx.fillStyle='#726453';ctx.fillRect(x-8,y+1+b,6,11);ctx.fillRect(x+2,y+1-b,6,11);ctx.fillStyle='#74917c';ctx.fillRect(x-10,y-15,20,19);ctx.fillStyle='#aec5af';ctx.fillRect(x-10,y-15,20,5);ctx.fillStyle='#b8a38b';ctx.fillRect(x-14,y-14,5,14);ctx.fillRect(x+9,y-14,5,14);ctx.fillStyle='#e1c4a7';ctx.fillRect(x-10,y-34,20,19);ctx.fillStyle='#58463b';ctx.fillRect(x-10,y-34,20,6);ctx.fillStyle='#414b45';if(player.dir!=='up'){ctx.fillRect(x-5,y-24,2,2);ctx.fillRect(x+4,y-24,2,2)}ctx.fillStyle='#6d8e79';ctx.fillRect(x-6,y-15,12,3)}
function render(){
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#c6d7b9';ctx.fillRect(0,0,W,H);
const targetX=player.x*T-W/(2*zoom),targetY=player.y*T-H*.47/zoom;camX+=(targetX-camX)*.2;camY+=(targetY-camY)*.2;
ctx.save();ctx.scale(zoom,zoom);ctx.translate(-camX,-camY);
const x0=clamp(Math.floor(camX/T)-2,0,SIZE-1),x1=clamp(Math.ceil((camX+W/zoom)/T)+2,0,SIZE-1),y0=clamp(Math.floor(camY/T)-2,0,SIZE-1),y1=clamp(Math.ceil((camY+H/zoom)/T)+2,0,SIZE-1);
for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)tile(x,y);
for(const p of furn)if(p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1)furniture(p);
for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(walls.has(point(x,y)))drawWall(x,y);
for(const d of doors){const [x,y]=d.split(',').map(Number);if(x<x0||x>x1||y<y0||y>y1)continue;ctx.fillStyle='#ccb78f';ctx.fillRect(x*T+7,y*T+9,T-14,T-11);ctx.fillStyle='#9b815e';ctx.fillRect(x*T+14,y*T+12,14,19)}
for(const p of props)if(!p.used&&p.x>=x0-1&&p.x<=x1+1&&p.y>=y0-1&&p.y<=y1+1){if(p.type==='tree')tree(p);else if(p.type==='rock')rock(p);else shrub(p)}
drawPlayer();ctx.restore();
}
function interact(){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[player.dir];let tx=Math.floor(player.x)+d[0],ty=Math.floor(player.y)+d[1];
const near=props.find(p=>!p.used&&Math.abs(p.x-tx)<=0&&Math.abs(p.y-ty)<=0);
if(near){near.used=true;if(near.type==='tree'){wood++;message('木材を手に入れた')}else if(near.type==='rock'){stone++;message('石材を手に入れた')}else{berries++;food=clamp(food+5,0,100);message('木の実を採集した')}updateHUD();return}
const nearby=furn.find(f=>Math.abs(f.x-tx)+Math.abs(f.y-ty)<2);
if(nearby){message(nearby.type==='chest'?'古い箱を見つけた':'家具を調べた');return}
message(walls.has(point(tx,ty))?'白い石壁。角も隙間なくつながっている':'周囲には何もない')}
const bind=(id,fn)=>document.getElementById(id).addEventListener('click',fn);
document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(d);b.classList.add('held')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys.delete(d);b.classList.remove('held')})});
bind('action',interact);bind('newWorld',generate);bind('weapon',()=>message('武器なし · 探索専用モード'));bind('pocket',()=>message('ポケットは未装備'));bind('back',()=>document.getElementById('items').classList.remove('open'));bind('inventory',()=>{const panel=document.getElementById('items');panel.classList.toggle('open');document.getElementById('itemlist').textContent='木材 '+wood+' / 石 '+stone+' / 木の実 '+berries});bind('closeItems',()=>document.getElementById('items').classList.remove('open'));
const keymap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};addEventListener('keydown',e=>{if(keymap[e.key]){keys.add(keymap[e.key]);e.preventDefault()}if(e.code==='Space'||e.key==='Enter'){interact();e.preventDefault()}});addEventListener('keyup',e=>{if(keymap[e.key])keys.delete(keymap[e.key])});
let touch=[];cvs.addEventListener('touchstart',e=>{if(e.touches.length===2)touch=[...e.touches].map(t=>({x:t.clientX,y:t.clientY}))},{passive:true});cvs.addEventListener('touchmove',e=>{if(e.touches.length!==2||touch.length!==2)return;const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),p=Math.hypot(touch[0].x-touch[1].x,touch[0].y-touch[1].y);if(p>0)zoom=clamp(zoom*d/p,.8,1.5);touch=[...e.touches].map(t=>({x:t.clientX,y:t.clientY}))},{passive:true});cvs.addEventListener('touchend',()=>{touch=[]});
function tick(t){requestAnimationFrame(tick);let dt=Math.min(.04,(t-last)/1000||0);last=t;sec+=dt;move(dt);noticeTimer-=dt;if(noticeTimer<=0)document.getElementById('toast').classList.remove('on');if(Math.floor(sec*3)!==Math.floor((sec-dt)*3))updateHUD();render()}
if(location.search.includes('test=1'))window.__test={state:()=>({x:player.x,y:player.y,walls:[...walls],doors:[...doors],buildings:buildings.map(b=>({...b}))}),setPosition:(x,y)=>{player.x=x;player.y=y},inspect:interact};
generate();requestAnimationFrame(tick);
})();
</script></body></html>
