<style>

</style></head><body><canvas id="view"></canvas>
<div id="hud"><div class="glass"><div id="title">灰緑の境界</div><div id="subtitle">ISOMETRIC SURVIVAL · FIELD STUDY / α0.2</div><div id="context">周囲を調べて物資を探そう</div></div><div id="stats" class="glass"><span id="place">名もなき林道</span><div id="clock">DAY 1 · 08:20</div></div></div>
<div id="note" aria-live="polite"></div>
<div id="inventory"></div>
<div id="controls"><div id="pad" aria-label="移動用アナログスティック"><div id="knob">✣</div><div id="padGuide">MOVE / RUN</div></div><div id="actions"><button class="act" id="map">地図</button><button class="act main" id="action">調べる</button></div></div>
<div id="panel"><div id="card"><h1>灰緑の境界</h1><p>人の気配が消えた森と、朽ちかけた建物。<br>道をたどり、廃屋に入り、残された物資を探そう。<br><br>左下のスティックを倒して移動。大きく倒すと走る。<br>扉のそばで「調べる」を押すと建物へ入れる。<br>拾ったものは画面下の持ち物に残る。</p><button id="start">探索を始める</button></div></div>
<div id="portrait">この試作品は横画面用です。<br>スマホを横向きにしてください。</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false});
const iw=46,ih=46,tw=74,th=37,sky='#93abb0', TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const hash=(x,y,s=0)=>{let n=Math.sin(x*121.37+y*237.13+s*73.41)*43758.545;return n-Math.floor(n)};
const easing=(t)=>t*t*(3-2*t);
function noise(x,y,s=0){const a=Math.floor(x),b=Math.floor(y),u=easing(x-a),v=easing(y-b);return (1-v)*((1-u)*hash(a,b,s)+u*hash(a+1,b,s))+v*((1-u)*hash(a,b+1,s)+u*hash(a+1,b+1,s))}
const buildings=[
{id:'watch',x:12,y:12,w:5,h:5,name:'見張り小屋',roof:'#636d61',wall:'#9b957d',loot:[['缶詰','🥫'],['古い地図','🗺️']]},
{id:'house',x:28,y:11,w:6,h:5,name:'苔むした民家',roof:'#735b52',wall:'#a7a188',loot:[['懐中電灯','🔦'],['乾パン','🍞']]},
{id:'store',x:27,y:29,w:6,h:6,name:'放棄された商店',roof:'#596c72',wall:'#a99d83',loot:[['水筒','🧴'],['工具','🔧']]},
{id:'shed',x:10,y:30,w:5,h:5,name:'古い物置',roof:'#777369',wall:'#a29a83',loot:[['ロープ','🪢'],['救急箱','🩹']]}
];
const world=Array.from({length:ih},(_,y)=>Array.from({length:iw},(_,x)=>({kind:'grass',v:hash(x,y,1)})));
const props=[],drops=[];
const player={x:21.5,y:22.5,inside:null,items:[],steps:0,face:0};
let running=false,last=0,seconds=0,camX=0,camY=0,zoom=1,dpr=1,W=0,H=0,noteUntil=0,mapOpen=false,interactFlash=0;let joystick={x:0,y:0,active:false,pointer:null},seen=new Set();
const controls=new Set(),keymap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
function bAt(x,y){return buildings.find(b=>x>=b.x&&y>=b.y&&x<b.x+b.w&&y<b.y+b.h)}
function road(x,y){return Math.abs(x-y+1)<2.2||Math.abs(x+y-44)<1.8||(x>17&&x<25&&y>15&&y<31)}
for(let y=0;y<ih;y++)for(let x=0;x<iw;x++){
const v=world[y][x],n=noise(x*.15,y*.15,5),roadHere=road(x,y),wet=noise(x*.11,y*.11,9)>.69;
v.kind=roadHere?'road':wet?'wet':n>.71?'deep':'grass';
if(bAt(x+.5,y+.5))v.kind='floor';
else if(!roadHere&&x>2&&y>2&&x<iw-3&&y<ih-3){
const r=hash(x,y,3);
if(r<.18&&Math.hypot(x-21,y-22)>4)props.push({x:x+.5+(hash(x,y,7)-.5)*.4,y:y+.5,k:r<.055?'fir':'tree',h:35+hash(x,y,8)*37,seed:hash(x,y,10)});
else if(r>.92)props.push({x:x+.5,y:y+.5,k:'rock',h:12+hash(x,y,17)*9,seed:hash(x,y,13)});
else if(r>.78)props.push({x:x+.5,y:y+.5,k:'bush',h:9+hash(x,y,17)*8,seed:hash(x,y,13)});
}
}
buildings.forEach(b=>b.loot.forEach((item,i)=>drops.push({x:b.x+1.7+(i%2)*2.3,y:b.y+1.8+Math.floor(i/2)*1.7,name:item[0],icon:item[1],building:b.id,taken:false})));
for(const d of [{x:21,y:20,name:'色褪せた手帳',icon:'📓'},{x:37,y:22,name:'コンパス',icon:'🧭'}])drops.push({...d,taken:false,building:null});
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,1.8);canvas.width=Math.max(1,Math.round(W*dpr));canvas.height=Math.max(1,Math.round(H*dpr));ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const sx=(x,y)=>(x-y)*tw*.5,sy=(x,y)=>(x+y)*th*.5;
function iso(x,y,z=0){return [sx(x,y),sy(x,y)-z]}
function polygon(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}
function tile(x,y,kind,v){const a=iso(x,y),b=iso(x+1,y),c=iso(x+1,y+1),d=iso(x,y+1);
let color=kind==='road'?['#777b68','#838574','#777d70'][Math.floor(v*3)]:kind==='floor'?'#858579':kind==='wet'?'#436e5f':kind==='deep'?'#42634f':v>.6?'#587a59':v>.3?'#527454':'#4d7052';
polygon([a,b,c,d],color,'#17332b12');
const cx=(a[0]+c[0])/2,cy=(a[1]+c[1])/2;
if(kind==='floor'){ctx.strokeStyle='#dad4b12b';ctx.beginPath();ctx.moveTo(cx-16,cy);ctx.lineTo(cx+14,cy);ctx.stroke();return}
const p=hash(x,y,22);
if(kind==='road'){if(p>.65){ctx.fillStyle='#bbc0a455';ctx.fillRect(cx-9,cy-1,8,2)}return}
ctx.lineWidth=1;ctx.strokeStyle=p>.5?'#a9b97b57':'#2d63464a';
for(let i=0;i<4;i++){const fx=cx+(hash(x,y,31+i)-.5)*tw*.58,fy=cy+(hash(x,y,41+i)-.5)*th*.63;ctx.beginPath();ctx.moveTo(fx,fy+2);ctx.lineTo(fx-2,fy-3-hash(x,y,52+i)*3);ctx.stroke()}
if(p>.86){ctx.fillStyle=p>.93?'#d9b774':'#e4ded0';ctx.beginPath();ctx.arc(cx+6,cy-3,1.5,0,TAU);ctx.fill()}
}
function tree(o){const [x,y]=iso(o.x,o.y);const h=o.h;
ctx.fillStyle='#101c1a4d';ctx.beginPath();ctx.ellipse(x+12,y+2,h*.43,h*.19,-.15,0,TAU);ctx.fill();
polygon([[x-3,y],[x-3,y-h*.73],[x+3,y-h*.73],[x+3,y]],'#705843');
if(o.k==='fir'){for(let j=0;j<3;j++){let top=y-h*(1.33-j*.24),bottom=top+h*.53,w=h*(.28+j*.07);polygon([[x,top],[x-w,bottom],[x+w,bottom]],['#355d46','#376b4a','#49845a'][j],'#274a35')}}
else {const rr=h*.34,yy=y-h*.87;for(let j=0;j<5;j++){let a=j*2.5+o.seed*4,xx=x+Math.cos(a)*rr*.65,dy=yy+Math.sin(a)*rr*.35;ctx.fillStyle=['#35674a','#3c8055','#557f4c','#5b915d','#2b6048'][j];ctx.beginPath();ctx.ellipse(xx,dy,rr*(.65+(j%2)*.13),rr*.57,a*.25,0,TAU);ctx.fill()}ctx.fillStyle='#76a16a70';ctx.beginPath();ctx.ellipse(x-rr*.38,yy-rr*.36,rr*.58,rr*.2,-.35,0,TAU);ctx.fill()}
}
function rock(o){const [x,y]=iso(o.x,o.y),h=o.h;
polygon([[x-h*.7,y],[x-h*.45,y-h*.7],[x+h*.12,y-h],[x+h*.75,y-h*.15],[x+h*.44,y+3]],'#737e75','#54685e');
polygon([[x-h*.45,y-h*.7],[x+h*.12,y-h],[x+h*.75,y-h*.15],[x+.1*h,y-h*.3]],'#99a395');
}
function bush(o){const [x,y]=iso(o.x,o.y),r=o.h;for(let i=0;i<3;i++){ctx.fillStyle=['#315b41','#4f8152','#608e54'][i];ctx.beginPath();ctx.ellipse(x+(i-1)*r*.52,y-r*.48-(i%2)*3,r*.67,r*.53,0,0,TAU);ctx.fill()}}
function wall(a,b,h,fill){const c=[b[0],b[1]-h],d=[a[0],a[1]-h];polygon([a,b,c,d],fill,'#34443c88')}
function drawBuilding(b){const x=b.x,y=b.y,w=b.w,h=b.h;
const A=iso(x,y),B=iso(x+w,y),C=iso(x+w,y+h),D=iso(x,y+h),ht=65;
const inside=player.inside===b.id;
polygon([A,B,C,D],'#77796d','#d0c8ab33');
for(let k=0;k<3;k++){const tx=x+1+k*1.3,ty=y+1.2;const p=iso(tx,ty);ctx.fillStyle='#aa947557';ctx.fillRect(p[0]-8,p[1]-1,16,3)}
if(!inside){
wall(A,B,ht,b.wall);wall(A,D,ht,'#797868');wall(B,C,ht,'#b1a991');wall(D,C,ht,'#8e8873');
const windows=[[x+w*.43,y,19],[x+w,y+h*.55,15]];
for(let i=0;i<windows.length;i++){const q=iso(windows[i][0],windows[i][1],ht*.48);rect(q[0]-7,q[1]-8,14,17,'#3c5b5e');rect(q[0]-5,q[1]-6,10,12,'#8fb0a1');}
const door=iso(x+w*.49,y+h,2);polygon([[door[0]-9,door[1]],[door[0]-9,door[1]-30],[door[0]+9,door[1]-30],[door[0]+9,door[1]]],'#493e32','#d9bb838c');
const rA=iso(x-.24,y-.2,ht+18),rB=iso(x+w+.24,y-.2,ht+18),rC=iso(x+w+.24,y+h+.24,ht+18),rD=iso(x-.24,y+h+.24,ht+18);
const ridge1=iso(x+w*.5,y-.38,ht+43),ridge2=iso(x+w*.5,y+h+.38,ht+43);
polygon([rA,rB,ridge1],b.roof);polygon([rA,ridge1,ridge2,rD],b.roof,'#2a3735');polygon([ridge1,rB,rC,ridge2],'#384e4a','#233e3b');
ctx.strokeStyle='#d9e0c01e';for(let i=1;i<5;i++){const p=iso(x,y+i*h/5,ht+18);const q=iso(x+w*.5,y+i*h/5,ht+43);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke()}
}else{
wall(A,B,ht*.28,b.wall);wall(A,D,ht*.28,'#807a67');
const entries=drops.filter(p=>p.building===b.id&&!p.taken);
for(const item of entries){const p=iso(item.x,item.y);ctx.fillStyle='#ead28e';ctx.beginPath();ctx.arc(p[0],p[1]-9,8,0,TAU);ctx.fill();ctx.fillStyle='#5b5035';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText(item.icon,p[0],p[1]-4)}
}}
function drawPlayer(){const [x,y]=iso(player.x,player.y);const motion=Math.sin(player.steps*9)*2;ctx.fillStyle='#091b183f';ctx.beginPath();ctx.ellipse(x+5,y+3,15,7,0,0,TAU);ctx.fill();
ctx.fillStyle='#343d37';ctx.fillRect(x-8,y-10+motion,6,12);ctx.fillRect(x+2,y-10-motion,6,12);
polygon([[x-10,y-33],[x+10,y-33],[x+11,y-13],[x-11,y-13]],'#577169','#32433d');
polygon([[x+7,y-31],[x+17,y-29],[x+16,y-15],[x+8,y-16]],'#715a42');
ctx.fillStyle='#c9a888';ctx.beginPath();ctx.arc(x,y-39,9,0,TAU);ctx.fill();
ctx.fillStyle='#473d33';ctx.beginPath();ctx.ellipse(x-1,y-44,11,5,-.15,Math.PI,TAU);ctx.fill();
ctx.fillStyle='#b2af89';ctx.fillRect(x-13,y-34,4,15);ctx.fillRect(x+9,y-34,4,15);
}
function drawPickup(d){if(d.taken||d.building)return;const [x,y]=iso(d.x,d.y);const pulse=4+Math.sin(seconds*3)*2;
ctx.fillStyle='#edd8a58e';ctx.beginPath();ctx.arc(x,y-12,8+pulse,0,TAU);ctx.fill();
ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText(d.icon,x,y-10)}
function drawWorld(){
const cx=sx(player.x,player.y),cy=sy(player.x,player.y);
ctx.setTransform(dpr,0,0,dpr,0,0);
const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#7fa7a2');bg.addColorStop(1,'#3d645a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(W*.5-(cx+camX)*zoom,H*.46-(cy+camY)*zoom);ctx.scale(zoom,zoom);
const minX=player.x-25,maxX=player.x+25,minY=player.y-25,maxY=player.y+25;
for(let sum=0;sum<iw+ih-1;sum++)for(let x=0;x<iw;x++){const y=sum-x;if(y<0||y>=ih||x<minX||x>maxX||y<minY||y>maxY)continue;tile(x,y,world[y][x].kind,world[y][x].v)}
// Scene elements are sorted by the same depth axis as the ground tiles.
const elements=[];
for(const o of props)if(Math.abs(o.x-player.x)<22&&Math.abs(o.y-player.y)<22)elements.push({depth:o.x+o.y,sort:0,fn:()=>o.k==='rock'?rock(o):o.k==='bush'?bush(o):tree(o)});
for(const b of buildings)elements.push({depth:b.x+b.y+b.w+b.h,sort:1,fn:()=>drawBuilding(b)});
for(const d of drops)if(!d.building&&!d.taken)elements.push({depth:d.x+d.y,sort:0,fn:()=>drawPickup(d)});
elements.push({depth:player.x+player.y+.1,sort:2,fn:drawPlayer});
elements.sort((a,b)=>a.depth-b.depth||a.sort-b.sort);
for(const o of elements)o.fn();
ctx.restore();
const light=ctx.createRadialGradient(W*.48,H*.42,H*.12,W*.48,H*.42,W*.83);light.addColorStop(0,'#00000000');light.addColorStop(1,'#0c24245b');ctx.fillStyle=light;ctx.fillRect(0,0,W,H);
if(mapOpen)drawMap();
}
function drawMap(){const sz=Math.min(H*.64,250),left=W*.5-sz*.5,top=H*.49-sz*.5;
ctx.fillStyle='#102823ed';ctx.fillRect(left-10,top-10,sz+20,sz+20);
const sq=sz/iw;for(let y=0;y<ih;y++)for(let x=0;x<iw;x++){const k=world[y][x].kind;ctx.fillStyle=k==='road'?'#a49b78':k==='floor'?'#d1b98f':k==='deep'?'#315842':'#4c7960';ctx.fillRect(left+x*sq,top+y*sq,sq+1,sq+1)}
ctx.fillStyle='#f8e39c';ctx.beginPath();ctx.arc(left+player.x*sq,top+player.y*sq,4,0,TAU);ctx.fill();ctx.strokeStyle='#e6e4c9';ctx.strokeRect(left-1,top-1,sz+2,sz+2)}
function blocking(x,y){if(x<1||y<1||x>iw-2||y>ih-2)return true;const b=bAt(x,y);return b&&player.inside!==b.id}
function notify(t,d=2.5){const n=document.getElementById('note');n.textContent=t;n.classList.add('show');noteUntil=seconds+d}
function refreshInventory(){const node=document.getElementById('inventory');node.textContent='';for(let i=0;i<6;i++){const e=document.createElement('div');e.className='slot'+(player.items[i]?' filled':'');const item=player.items[i];if(item){const a=document.createElement('span');a.textContent=item.icon;e.appendChild(a);const b=document.createElement('small');b.textContent=item.name;e.appendChild(b)}else{e.textContent='·'}node.appendChild(e)}}
function nearDoor(b){const dx=player.x-(b.x+b.w*.5),dy=player.y-(b.y+b.h+.5);return Math.hypot(dx,dy)<2.6}
function interact(){
if(player.inside){const b=buildings.find(v=>v.id===player.inside);let candidates=drops.filter(d=>d.building===b.id&&!d.taken&&Math.hypot(d.x-player.x,d.y-player.y)<2.4);
if(candidates.length){pickup(candidates[0]);return}
if(Math.hypot(player.x-(b.x+b.w*.5),player.y-(b.y+b.h-1))<2.4){player.inside=null;player.x=b.x+b.w*.5;player.y=b.y+b.h+1;notify(b.name+'を出た');return}
notify('室内を調べよう。出口は手前側にある');return}
const outdoor=drops.find(d=>!d.taken&&!d.building&&Math.hypot(d.x-player.x,d.y-player.y)<1.9);if(outdoor){pickup(outdoor);return}
const door=buildings.find(nearDoor);if(door){player.inside=door.id;player.x=door.x+door.w*.5;player.y=door.y+door.h-1;notify('「'+door.name+'」に入った');return}
notify('周囲に調べられるものはない');
}
function pickup(item){if(player.items.length>=6){notify('持ち物がいっぱい');return}item.taken=true;player.items.push({name:item.name,icon:item.icon});refreshInventory();notify(item.name+'を見つけた！',3)}
function movement(dt){let ix=joystick.x+(controls.has('right')?1:0)-(controls.has('left')?1:0),iy=joystick.y+(controls.has('down')?1:0)-(controls.has('up')?1:0);
const len=Math.hypot(ix,iy);if(len<.1)return;const magnitude=Math.min(1,len);ix/=len;iy/=len;
// Camera-aligned directions along the two diagonals of the isometric world.
const dx=(ix+iy)*.7071,dy=(iy-ix)*.7071,speed=(magnitude>.78?5.65:3.35)*magnitude,nx=player.x+dx*dt*speed,ny=player.y+dy*dt*speed;
if(player.inside){const b=buildings.find(v=>v.id===player.inside);player.x=clamp(nx,b.x+.6,b.x+b.w-.6);player.y=clamp(ny,b.y+.6,b.y+b.h-.6)}
else{if(!blocking(nx,player.y))player.x=nx;if(!blocking(player.x,ny))player.y=ny}
player.steps+=dt*(magnitude>.78?5.2:3.3)*magnitude;player.face=Math.atan2(dy,dx)}
function update(dt){seconds+=dt;movement(dt);if(seconds>noteUntil)document.getElementById('note').classList.remove('show');
const b=player.inside&&buildings.find(v=>v.id===player.inside);document.getElementById('place').textContent=b?b.name:road(player.x,player.y)?'ひび割れた林道':'霧の深い森';
const m=Math.floor(seconds*1.7),hh=8+Math.floor((20+m)/60);document.getElementById('clock').textContent='DAY 1 · '+String(hh).padStart(2,'0')+':'+String((20+m)%60).padStart(2,'0');
}
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.045,(t-last)/1000||0);last=t;if(!running)return;update(dt);drawWorld()}
requestAnimationFrame(frame);
const pad=document.getElementById('pad'),knob=document.getElementById('knob');
function moveJoystick(e){
 const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 const dx=e.clientX-cx,dy=e.clientY-cy,limit=r.width*.31,len=Math.hypot(dx,dy);
 const scale=Math.min(1,limit/Math.max(1,len));joystick.x=dx*scale/limit;joystick.y=dy*scale/limit;
 knob.style.transform='translate('+Math.round(joystick.x*limit)+'px,'+Math.round(joystick.y*limit)+'px)';
}
pad.addEventListener('pointerdown',e=>{e.preventDefault();if(joystick.active)return;joystick.active=true;joystick.pointer=e.pointerId;pad.setPointerCapture(e.pointerId);pad.classList.add('active');moveJoystick(e)});
pad.addEventListener('pointermove',e=>{if(joystick.active&&joystick.pointer===e.pointerId)moveJoystick(e)});
function releaseJoystick(e){if(e.pointerId!==joystick.pointer)return;joystick.active=false;joystick.pointer=null;joystick.x=joystick.y=0;knob.style.transform='translate(0px,0px)';pad.classList.remove('active')}
for(const eventName of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(eventName,releaseJoystick);
addEventListener('keydown',e=>{const k=keymap[e.key];if(k){controls.add(k);e.preventDefault()}if(e.code==='Space'||e.key==='Enter'){interact();e.preventDefault()}if(e.key==='m')mapOpen=!mapOpen});
addEventListener('keyup',e=>{if(keymap[e.key])controls.delete(keymap[e.key])});
document.getElementById('action').addEventListener('click',interact);
document.getElementById('map').addEventListener('click',()=>{mapOpen=!mapOpen});
document.getElementById('start').addEventListener('click',()=>{running=true;document.getElementById('panel').style.display='none';notify('林道をたどって廃屋を探索しよう',3)});
let touches=new Map(),pinch=0;canvas.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const arr=[...touches.values()],dist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);if(pinch>0)zoom=clamp(zoom*dist/pinch,.68,1.55);pinch=dist}});
for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>{touches.delete(e.pointerId);if(touches.size<2)pinch=0});
if(location.search.includes('test=1')){
window.__gameTest={
 moveTo:(x,y)=>{player.x=x;player.y=y;player.inside=null},
 state:()=>({x:player.x,y:player.y,inside:player.inside,items:player.items.length,joystick:{x:joystick.x,y:joystick.y,active:joystick.active}})
};
}
refreshInventory();drawWorld();
})();
</script></body></html>
