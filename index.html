<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101e1b"><title>木漏れ日の大地</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101e1b;color:#e9e6da;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none} .glass{background:#10231cb3;border:1px solid #e0dfb331;box-shadow:0 8px 26px #0005;backdrop-filter:blur(8px);border-radius:17px;padding:9px 13px;color:#eee8ce}#name{font-weight:650;letter-spacing:.12em;font-size:15px}#loc{font-size:11px;color:#ced9c3;margin-top:4px}#right{font-size:12px;white-space:nowrap;text-align:right}
#pad{position:absolute;bottom:max(25px,env(safe-area-inset-bottom));left:23px;width:146px;height:146px;border-radius:50%;border:1px solid #e6e7c74d;background:#10241b6e;backdrop-filter:blur(5px);touch-action:none;box-shadow:inset 0 0 40px #122e2266;user-select:none}#ring{position:absolute;inset:15px;border:1px solid #e7ead533;border-radius:50%}#stick{position:absolute;left:47px;top:47px;width:52px;height:52px;border-radius:50%;background:#dce2cc9c;border:1px solid #fffeef91;box-shadow:0 3px 20px #0006;transform:translate(0,0);pointer-events:none}#buttons{position:absolute;right:18px;bottom:max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}.ctrl{border:1px solid #f0e9c455;background:#142b24af;color:#f8f0d6;border-radius:17px;padding:12px 17px;font-size:13px;font-weight:650;min-width:83px;touch-action:manipulation}#tip{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;color:#f4efd599;text-shadow:0 2px 6px #000;font-size:10px;white-space:nowrap;pointer-events:none}#intro{position:absolute;inset:0;background:#07130cc5;display:flex;align-items:center;justify-content:center;padding:26px}#intro section{width:min(420px,100%);border:1px solid #c8c6a65e;background:#172b22f2;padding:27px;border-radius:22px;text-align:center;box-shadow:0 25px 70px #0008}h1{font-size:27px;font-weight:650;letter-spacing:.14em;margin:0 0 15px}p{line-height:1.9;color:#d2d8c3;font-size:14px}#start{margin-top:13px;border:0;border-radius:14px;background:#d8caa1;color:#253429;padding:14px 32px;font-weight:800;font-size:15px}@media(max-width:370px){#pad{width:128px;height:128px}#stick{left:40px;top:40px;width:48px;height:48px}#buttons{right:10px}.ctrl{padding:10px 12px}}
</style></head><body><canvas id="view"></canvas>
<div id="top"><div class="glass"><div id="name">木漏れ日の大地</div><div id="loc">静かな森を散策する</div></div><div id="right" class="glass">☀ <span id="clock">朝 08:00</span><div id="coords" style="font-size:10px;color:#c9d6bd;margin-top:4px">X 0 / Y 0</div></div></div>
<div id="pad"><div id="ring"></div><div id="stick"></div></div><div id="buttons"><button class="ctrl" id="zoom">倍率 ×1.0</button><button class="ctrl" id="walk">歩く</button></div><div id="tip">自由探索 · 敵なし · オフライン</div>
<div id="intro"><section><h1>木漏れ日の大地</h1><p>風の通る森、石の小径、静かな湖。<br>目的も戦闘もない、小さな散策の世界。<br><br>左のスティックで移動、右側で視点の倍率と速度を変更できます。</p><button id="start">散策を始める</button></section></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false});
const pad=document.getElementById('pad'),stick=document.getElementById('stick'),zoomBtn=document.getElementById('zoom'),walkBtn=document.getElementById('walk');
const loc=document.getElementById('loc'),coords=document.getElementById('coords'),clock=document.getElementById('clock');
let w=0,h=0,dpr=1,scale=1.05,run=false,started=false,t=0,last=0;
let px=180,py=160,camX=px,camY=py,face=0,step=0,stickId=null,vx=0,vy=0,keys={};
const UNIT=42,WORLD=110,SEED=7307;
const TAU=Math.PI*2;
const hash=(x,y,s=0)=>{let a=Math.sin(x*127.1+y*311.7+s*71.3+SEED)*43758.5453;return a-Math.floor(a)};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const lerp=(a,b,f)=>a+(b-a)*f;
function noise(x,y,s=0){const xx=Math.floor(x),yy=Math.floor(y),fx=smooth(x-xx),fy=smooth(y-yy);return lerp(lerp(hash(xx,yy,s),hash(xx+1,yy,s),fx),lerp(hash(xx,yy+1,s),hash(xx+1,yy+1,s),fx),fy)}
const terrain=(x,y)=>{const n=noise(x*.042,y*.042,3)*.67+noise(x*.115,y*.115,6)*.33;const pond=Math.hypot((x-55)*.95,(y-48)*1.14)<11.5+noise(x*.23,y*.23,5)*3;const path=Math.abs(y-(18+4*Math.sin(x*.095)+2*Math.sin(x*.23)))<1.45;
return pond?2:path?1:n>.65?3:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const tiles=[],objects=[];
for(let y=0;y<WORLD;y++)for(let x=0;x<WORLD;x++){const type=terrain(x,y),n=noise(x*.27,y*.27,9);tiles.push(type);if(x<3||y<3||x>WORLD-4||y>WORLD-4)continue;
const p=hash(x,y,4),v=hash(x,y,6);
if(type===0||type===3){if(p<(type===3?.29:.13)&&Math.hypot(x-4,y-4)>4){objects.push({x:(x+.5+(.5-v)*.5)*UNIT,y:(y+.5+(hash(x,y,7)-.5)*.6)*UNIT,k:p<.075?'pine':'tree',r:26+hash(x,y,10)*18,v:hash(x,y,11)})}
else if(p>.89)objects.push({x:(x+.5)*UNIT,y:(y+.5)*UNIT,k:'stone',r:9+v*10,v});
else if(p>.76)objects.push({x:(x+.5)*UNIT,y:(y+.5)*UNIT,k:'bush',r:12+v*8,v})}
if(type===1&&p>.94)objects.push({x:(x+.5)*UNIT,y:(y+.5)*UNIT,k:'stone',r:9+v*8,v});
}
objects.sort((a,b)=>a.y-b.y);
function moveInput(){let x=vx,y=vy;if(keys.ArrowLeft||keys.a)x-=1;if(keys.ArrowRight||keys.d)x+=1;if(keys.ArrowUp||keys.w)y-=1;if(keys.ArrowDown||keys.s)y+=1;const len=Math.hypot(x,y);return len>1?[x/len,y/len]:[x,y]}
function moveStick(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.min(r.width*.32,Math.hypot(dx,dy));let a=Math.atan2(dy,dx);vx=Math.cos(a)*m/(r.width*.32);vy=Math.sin(a)*m/(r.width*.32);stick.style.transform='translate('+vx*46+'px,'+vy*46+'px)'}
pad.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;pad.setPointerCapture(e.pointerId);moveStick(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});
const end=e=>{if(e.pointerId===stickId){stickId=null;vx=vy=0;stick.style.transform='translate(0,0)'}};pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);pad.addEventListener('lostpointercapture',end);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);
zoomBtn.addEventListener('click',()=>{scale=scale<1.15?1.4:scale<1.55?1.8:.85;zoomBtn.textContent='倍率 ×'+scale.toFixed(1)});
walkBtn.addEventListener('click',()=>{run=!run;walkBtn.textContent=run?'走る':'歩く'});
document.getElementById('start').addEventListener('click',()=>{started=true;document.getElementById('intro').style.display='none'});
function ground(x,y,s,k){const v=hash(x,y,1);if(k===2){const g=ctx.createLinearGradient(s,s,s,s+UNIT);g.addColorStop(0,'#375f60');g.addColorStop(1,'#234a4d');ctx.fillStyle=g;return}
if(k===1){ctx.fillStyle=['#776d52','#80775c','#8c8061'][Math.floor(v*3)];return}
const n=noise(x*.23,y*.23,2);const c=k===3?[51,78,50]:[58,91,55];const q=(n-.5)*30+v*9;ctx.fillStyle='rgb('+Math.round(c[0]+q)+','+Math.round(c[1]+q)+','+Math.round(c[2]+q)+')'}
function drawTile(x,y){const wx=x*UNIT,wy=y*UNIT,k=(x>=0&&x<WORLD&&y>=0&&y<WORLD)?tiles[y*WORLD+x]:2;ground(x,y,wy,k);ctx.fillRect(wx,wy,UNIT+1,UNIT+1);
const h=hash(x,y,13);
if(k===2){ctx.strokeStyle='#b9d6bb2c';ctx.lineWidth=1.2;ctx.beginPath();const wave=Math.sin(t*1.3+x*.6+y*.8)*2;ctx.moveTo(wx+6,wy+18+wave);ctx.quadraticCurveTo(wx+20,wy+14+wave,wx+35,wy+18+wave);ctx.stroke();return}
if(k===1){ctx.fillStyle='#a7a08129';for(let i=0;i<3;i++){const a=hash(x,y,20+i)*UNIT,b=hash(x,y,30+i)*UNIT;ctx.beginPath();ctx.ellipse(wx+a,wy+b,3+i,2,hash(x,y,i)*3,0,TAU);ctx.fill()}return}
if(h>.28){for(let i=0;i<6;i++){let ax=wx+hash(x,y,40+i)*UNIT,ay=wy+hash(x,y,50+i)*UNIT;ctx.strokeStyle=i%2?'#b2a76c45':'#a3bb7555';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax-2+Math.sin(t*.8+i+x)*1.3,ay-3-hash(x,y,60+i)*5);ctx.stroke()}}
if(h>.79){ctx.fillStyle='#b6a38533';ctx.beginPath();ctx.arc(wx+hash(x,y,18)*UNIT,wy+hash(x,y,19)*UNIT,1.8,0,TAU);ctx.fill()}
}
function tree(o){const x=o.x,y=o.y,r=o.r;
ctx.fillStyle='#07170e60';ctx.beginPath();ctx.ellipse(x+12,y+8,r*1.1,r*.43,-.3,0,TAU);ctx.fill();
if(o.k==='pine'){ctx.fillStyle='#5c4731';ctx.fillRect(x-4,y-12,8,21);for(let i=2;i>=0;i--){const q=r*(1-i*.19),yy=y-8-i*15;ctx.fillStyle=['#193c32','#265648','#356858'][i];ctx.beginPath();ctx.moveTo(x,yy-q*.95);ctx.lineTo(x-q*.67,yy+q*.6);ctx.lineTo(x+q*.67,yy+q*.6);ctx.closePath();ctx.fill()}return}
ctx.strokeStyle='#53462e';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y+5);ctx.lineTo(x-3,y-r*.55);ctx.stroke();
const grad=ctx.createRadialGradient(x-r*.28,y-r*.95,r*.15,x,y-r*.55,r*1.1);grad.addColorStop(0,o.v>.5?'#73965a':'#829d61');grad.addColorStop(.55,o.v>.5?'#3b7046':'#557944');grad.addColorStop(1,'#244b35');
ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(x,y-r*.68,r*1.03,r*.82,-.1,0,TAU);ctx.fill();
for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#a2b16a38':'#274e344c';const a=i*2.4+o.v*6;ctx.beginPath();ctx.ellipse(x+Math.cos(a)*r*.52,y-r*.68+Math.sin(a)*r*.4,r*.21,r*.14,a,0,TAU);ctx.fill()}
}
function drawObject(o){if(o.k==='tree'||o.k==='pine'){tree(o);return}
if(o.k==='stone'){ctx.fillStyle='#081c1750';ctx.beginPath();ctx.ellipse(o.x+4,o.y+4,o.r*1.1,o.r*.5,0,0,TAU);ctx.fill();ctx.fillStyle='#707d70';ctx.beginPath();ctx.moveTo(o.x-o.r,o.y);ctx.lineTo(o.x-o.r*.45,o.y-o.r*.7);ctx.lineTo(o.x+o.r*.4,o.y-o.r*.75);ctx.lineTo(o.x+o.r,o.y);ctx.lineTo(o.x+o.r*.5,o.y+o.r*.43);ctx.closePath();ctx.fill();ctx.strokeStyle='#adb3a255';ctx.stroke();return}
ctx.fillStyle='#214934';ctx.beginPath();ctx.ellipse(o.x,o.y,o.r,o.r*.58,0,0,TAU);ctx.fill();ctx.fillStyle='#62875c';ctx.beginPath();ctx.ellipse(o.x-4,o.y-6,o.r*.73,o.r*.34,0,0,TAU);ctx.fill()}
function drawPlayer(){ctx.save();ctx.translate(px,py);ctx.fillStyle='#0d170f69';ctx.beginPath();ctx.ellipse(4,7,15,8,0,0,TAU);ctx.fill();ctx.rotate(face+Math.PI/2);
const bounce=Math.sin(step*9)*2;ctx.fillStyle='#313a36';ctx.fillRect(-8,-1+bounce,6,18);ctx.fillRect(2,-1-bounce,6,18);
ctx.fillStyle='#706e56';ctx.beginPath();ctx.ellipse(0,-7,11,13,0,0,TAU);ctx.fill();
ctx.fillStyle='#bda586';ctx.beginPath();ctx.arc(0,-19,8,0,TAU);ctx.fill();
ctx.fillStyle='#584936';ctx.beginPath();ctx.arc(0,-22,8,Math.PI,TAU);ctx.fill();
ctx.fillStyle='#77694c';ctx.fillRect(-13,-9,5,14);ctx.fillRect(8,-9,5,14);ctx.restore()}
function frame(ms){let dt=Math.min((ms-last)/1000||0,.05);last=ms;t+=dt;let input=moveInput();
if(started){const speed=run?215:115;if(Math.hypot(...input)>.12){let dx=input[0]*speed*dt,dy=input[1]*speed*dt;const nx=clamp(px+dx,2*UNIT,(WORLD-2)*UNIT),ny=clamp(py+dy,2*UNIT,(WORLD-2)*UNIT);
const ptype=terrain(nx/UNIT,ny/UNIT);if(ptype!==2){px=nx;py=ny}else{if(terrain(nx/UNIT,py/UNIT)!==2)px=nx;if(terrain(px/UNIT,ny/UNIT)!==2)py=ny}
face=Math.atan2(input[1],input[0])-Math.PI/2;step+=dt*(run?2:1.3)}}
camX=lerp(camX,px,clamp(dt*5,0,1));camY=lerp(camY,py,clamp(dt*5,0,1));
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#17291f';ctx.fillRect(0,0,w,h);
ctx.save();ctx.translate(w/2-camX*scale,h/2-camY*scale);ctx.scale(scale,scale);
const x0=Math.max(0,Math.floor((camX-w/2/scale)/UNIT)-2),x1=Math.min(WORLD-1,Math.ceil((camX+w/2/scale)/UNIT)+2);
const y0=Math.max(0,Math.floor((camY-h/2/scale)/UNIT)-2),y1=Math.min(WORLD-1,Math.ceil((camY+h/2/scale)/UNIT)+2);
for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)drawTile(x,y);
let drawn=false;for(const o of objects){if(o.y<y0*UNIT-80||o.y>y1*UNIT+130||o.x<x0*UNIT-80||o.x>x1*UNIT+80)continue;if(!drawn&&o.y>=py){drawPlayer();drawn=true}drawObject(o)}if(!drawn)drawPlayer();
ctx.restore();
const vign=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.15,w/2,h/2,Math.max(w,h)*.79);vign.addColorStop(0,'#00000000');vign.addColorStop(1,'#07120b70');ctx.fillStyle=vign;ctx.fillRect(0,0,w,h);
const secs=Math.floor((t*2.5+8*60)%(24*60)),hours=Math.floor(secs/60),mins=secs%60;clock.textContent=(hours>=17?'夕方 ':hours<6?'夜 ':'朝 ')+String(hours).padStart(2,'0')+':'+String(mins).padStart(2,'0');
coords.textContent='X '+Math.floor(px/UNIT)+' / Y '+Math.floor(py/UNIT);const type=terrain(px/UNIT,py/UNIT);loc.textContent=type===1?'古い石の小径':type===3?'深い木立の中':'緑の野原と森';
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script></body></html>
