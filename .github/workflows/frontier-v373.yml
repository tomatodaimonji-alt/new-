name: Frontier timber bridge and river
on:
  push:
    branches: ['dot/workshop-frontier-v373']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node tests/v373-river.cjs world-editor.html
          node tests/v371-path.cjs world-editor.html
          node tests/v371-houses.cjs world-editor.html
          node tests/v372-tutorial.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v373-river-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v373-bridge
          path: v373-bridge.png
