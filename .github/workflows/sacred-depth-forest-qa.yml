name: Isolated sacred depth QA over exact v296
on:
  push:
    branches: ['dot/workshop-sacred-depth-forest-qa']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        suite: [strict, sightline, temple, fire-hit, snow, orvas-pickup, orvas-soul, orvas-gear, orvas-traces, tracking-reset]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c30d71a67d3b0487616bdf8a4178c5a414a2b25b
          path: exact
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          test "$(git hash-object exact/world-editor.html)" = 820f9a94abf136d589f559e543b51a194987bceb
          python .sacred-depth/forest/build.py exact/world-editor.html .sacred-depth/forest.html
          python .sacred-depth/temple/build.py .sacred-depth/forest.html exact/world-editor.html
          test "$(git hash-object exact/world-editor.html)" = 925ebdc559345a8a409df1d1f4e1cba9b63d1924
          python .sacred-depth/export_roundtrip.py exact/world-editor.html .sacred-depth/exported.html
          test "$(git hash-object .sacred-depth/exported.html)" = 4f8da0dbed08f563b715c58d804ffcfee6ee4b8b
          python .sacred-depth/no-lantern.py .sacred-depth/exported.html exact/world-editor.html
          test "$(git hash-object exact/world-editor.html)" = df32697d8e3a7837b35eff99c738da7b0494cde9
          cp .sacred-depth/compat/* .sacred-depth/orvas/* exact/tests/
          cp .sacred-depth/forest/tests/* .sacred-depth/temple/tests/* exact/tests/
      - if: matrix.suite == 'strict'
        working-directory: exact
        run: node --test tests/*.test.cjs
      - if: matrix.suite != 'strict'
        working-directory: exact
        run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - if: matrix.suite == 'sightline'
        working-directory: exact
        run: mkdir -p output && FACILITY_SCREENSHOTS=output node tests/sacred-depth-browser.mjs world-editor.html
      - if: matrix.suite == 'temple'
        working-directory: exact
        run: node tests/depth-temple-browser.mjs
      - if: matrix.suite == 'fire-hit'
        working-directory: exact
        run: node tests/fire-wand-flare-browser.mjs && node tests/player-hit-feedback-browser.mjs
      - if: matrix.suite == 'snow'
        working-directory: exact
        run: node tests/snow-pass-browser.mjs
      - if: matrix.suite == 'orvas-pickup'
        working-directory: exact
        run: node tests/orvas-soul-award-browser.mjs
      - if: matrix.suite == 'orvas-soul'
        working-directory: exact
        run: node tests/orvas-soul-browser.mjs && node tests/orvas-stone-death-browser.mjs
      - if: matrix.suite == 'orvas-gear'
        working-directory: exact
        run: node tests/orvas-faithful-gear-browser.mjs && node tests/orvas-beam-tail-browser.mjs
      - if: matrix.suite == 'orvas-traces'
        working-directory: exact
        run: node tests/orvas-ground-traces-browser.mjs && node tests/orvas-player-terminal-browser.mjs
      - if: matrix.suite == 'tracking-reset'
        working-directory: exact
        run: node tests/attack-target-tracking-browser.mjs && node tests/orvas-reset-kit-browser.mjs
      - if: always() && matrix.suite == 'sightline'
        uses: actions/upload-artifact@v4
        with:
          name: sacred-depth-v296-exact-sightlines
          path: exact/output
