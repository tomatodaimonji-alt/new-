name: Disposable David Temple QA
on:
  push:
    branches: [dot/workshop-david-temple-qa]
permissions:
  contents: read
jobs:
  exact-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/david-temple-map.test.cjs tests/stone-david-geometry.test.cjs tests/david-temple-combat.test.cjs tests/player-weapon-profiles-v194.test.cjs tests/snow-audio.test.cjs
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        fixture: [david-temple-browser, snow-pass-browser, south-port-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.fixture }}.mjs
        env:
          FACILITY_SCREENSHOTS: screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.fixture }}
          path: screenshots
          if-no-files-found: ignore
          retention-days: 5
