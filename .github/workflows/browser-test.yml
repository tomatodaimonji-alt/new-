name: Browser smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, 'tests/**', '.github/workflows/browser-test.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Launch WebGL Chromium and test touchscreen entry/movement
        run: node tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-screenshot
          path: smoke-test.png
