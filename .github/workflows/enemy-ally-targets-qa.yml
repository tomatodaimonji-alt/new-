name: Disposable hostile targeting and allied visual QA
on:
  push:
    branches: [dot/workshop-enemy-ally-targets-qa]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: bash
        run: |
          if ! node --test tests/*.cjs > "$RUNNER_TEMP/strict.out" 2>&1; then
            grep -E '^not ok |^  location:|^  error:|^# (tests|pass|fail|duration)' "$RUNNER_TEMP/strict.out" | cut -c1-350 | tail -200
            exit 1
          fi
          grep -E '^# (tests|pass|fail|duration)' "$RUNNER_TEMP/strict.out"
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test: [enemy-ally-targets-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.test }}.mjs
