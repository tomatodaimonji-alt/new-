name: Disposable hostile targeting and allied visual QA
on:
  push:
    branches: [dot/workshop-enemy-ally-targets-qa]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/enemy-ally-targets.test.cjs tests/monster-companion.test.cjs tests/orvas-ally.test.cjs tests/enemy-threat-vfx.test.cjs
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test: [enemy-ally-targets-browser, orvas-soul-browser, david-foley-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.test }}.mjs
