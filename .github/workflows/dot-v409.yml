name: Validate v409 surface and cave planes
on:
  push:
    branches: ['dot/workshop-frontier-v409-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: node tests/v409-test.cjs world-editor.html
      - run: WORKSHOP_HTML=world-editor.html node tests/v409-speed.cjs
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v409-browser.cjs
      - run: node tests/v409-regression.cjs
