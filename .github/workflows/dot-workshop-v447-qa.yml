name: Workshop frontier v447
on:
  push:
    branches: [dot/workshop-frontier-v447-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v447-walk.cjs world-editor.html && node tests/v447-draw.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v447-browser.cjs
