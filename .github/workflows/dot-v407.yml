name: Validate v407 human movement and wallet
on:
  push:
    branches: ['dot/workshop-frontier-v407-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: node tests/v407-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v407-browser.cjs
      - run: node tests/v407-regression.cjs
