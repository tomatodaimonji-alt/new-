name: Verify base stats, cave occlusion, unlock timer and coin drop
on:
  push:
    branches: ['dot/workshop-frontier-v416-qa']
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v416-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v416-browser.cjs
