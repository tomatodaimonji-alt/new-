name: Verify Frontier recovery, shop ownership and guards
on:
  push:
    branches: ['dot/workshop-frontier-v421-verify']
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v421-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v421-browser.cjs
