name: Frontier companion doorway
on:
  push:
    branches: ['dot/workshop-frontier-v397-qa2']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v397-browser.cjs
