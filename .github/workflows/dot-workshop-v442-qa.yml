name: Workshop frontier v442
on:
  push:
    branches: [dot/workshop-frontier-v442-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v442-common.cjs world-editor.html && node tests/v442-south.cjs world-editor.html && HTML=world-editor.html node tests/v442-npc.cjs
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v442-browser.cjs
