name: Frontier dialogue and ground detail
on:
  push:
    branches: ['dot/workshop-frontier-v375-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node tests/v375-intro.cjs world-editor.html
          node tests/v375-ground.cjs world-editor.html
          node tests/v375-speech.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v375-intro-browser.cjs
      - if: always()
        run: node tests/v375-landscape.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v375-landscape
          path: v375-ground.png
