name: Workshop frontier v451
on:
  push:
    branches: [dot/workshop-frontier-v451-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - run: git show 573006489b255cd39dcb6bafac4917dc302ddd05:world-editor.html >/tmp/pre-stick.html
      - run: node tests/v451-rollback.cjs world-editor.html /tmp/pre-stick.html && node tests/v451-horizon.cjs world-editor.html && node tests/v450-balance.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: CHECK_NORTH=1 node tests/v451-north-browser.cjs
