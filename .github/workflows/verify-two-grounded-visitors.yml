name: Verify exact v324 grounded visitors
on:
  push:
    branches: [dot/workshop-two-grounded-visitors-v324]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "3f6211c900191a0b9f518eefdcbfdb2aa1b95bd4"
      - run: node tests/visitors.test.cjs world-editor.html && node tests/npc-resident-seam.test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/visitors-browser.mjs world-editor.html
