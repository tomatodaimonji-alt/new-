name: Build Sample Editor APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'sample-editor/**'
      - '.github/workflows/build-sample-editor-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate generated single-file game
        run: node sample-editor/tools/test.mjs
      - name: Build separate debug APK
        run: |
          mkdir -p sample-editor/app/src/main/assets
          cp sample-editor/index.html sample-editor/app/src/main/assets/index.html
          cd sample-editor
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SampleEditor-v16-APK
          path: sample-editor/app/build/outputs/apk/debug/app-debug.apk
