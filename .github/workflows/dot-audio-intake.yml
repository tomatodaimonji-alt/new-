name: Acquire public CC0 produce Foley preview
on:
  push:
    branches: [dot/workshop-audio-intake]
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Retrieve the public preview for Watermelon Slicing 2
        run: |
          set -euo pipefail
          mkdir -p recordings
          sound='443/443467_7919598-hq.mp3'
          curl --fail --silent --show-error --location --retry 1 --max-time 20 "https://cdn.freesound.org/previews/$sound" -o recordings/watermelon.mp3 ||
          curl --fail --silent --show-error --location --retry 1 --max-time 20 "https://freesound.org/data/previews/$sound" -o recordings/watermelon.mp3
          ffprobe -v error -show_entries format=duration recordings/watermelon.mp3
          sha256sum recordings/watermelon.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-produce-foley-cc0
          path: recordings/
          if-no-files-found: error
          retention-days: 5
