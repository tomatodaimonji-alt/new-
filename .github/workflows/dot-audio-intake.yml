name: Acquire licensed player damage Foley
on:
  push:
    branches: [dot/workshop-audio-intake]
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Acquire public licensed recordings
        run: |
          mkdir -p recordings
          fetch() {
            id="$1"; slug="$2"; folder="$((id / 1000))"
            html="$(curl --max-time 16 --retry 1 --fail --silent --show-error --location "https://freesound.org/people/$slug/sounds/$id/")"
            audio="$(printf '%s' "$html" | grep -Eo "https://cdn[.]freesound[.]org/previews/$folder/${id}_[0-9]+-hq[.]mp3" | sort -u | head -1)"
            test -n "$audio"
            printf '%s\n' "$audio" | tee "recordings/$id.url"
            curl --max-time 24 --retry 1 --fail --silent --show-error --location "$audio" -o "recordings/$id.mp3"
          }
          fetch 388031 saturdaysoundguy & a=$!
          curl --max-time 24 --retry 1 --fail --silent --show-error --location 'https://upload.wikimedia.org/wikipedia/commons/5/5b/Dull_thud.ogg' -o recordings/dull-thud.ogg & b=$!
          wait "$a" || echo "Primary source unavailable"
          wait "$b" || echo "Fallback source unavailable"
          file recordings/*
          ls -l recordings/
          for clip in recordings/*.mp3 recordings/*.ogg; do ffprobe -v error -show_entries format=duration -of csv=p=0 "$clip"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-damage-foley-source-recordings
          path: recordings
          if-no-files-found: error
