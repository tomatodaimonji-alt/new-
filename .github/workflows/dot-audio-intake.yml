name: Acquire licensed VSCO field music samples
on:
  push:
    branches: [dot/workshop-audio-intake]
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch public CC0 original samples by pinned revision
        run: |
          set -euo pipefail
          mkdir -p recordings
          fetch() {
            curl --fail --silent --show-error --location --retry 2 --max-time 40 "$2" -o "recordings/$1.wav"
            test "$(wc -c < "recordings/$1.wav")" = "$3"
            test "$(git hash-object "recordings/$1.wav")" = "$4"
          }
          fetch 'flute-a' 'https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/Woodwinds/Flute/susNV/LDFlute_susNV_A4_v1_1.wav' 3460842 3007213aa6264efe0619c7321bf2e8df7966b0a2
          fetch 'flute-c' 'https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/Woodwinds/Flute/susNV/LDFlute_susNV_C5_v1_1.wav' 2491416 093129d6a876ce5f004279b2979894d0ed637a8d
          fetch 'viola-a' 'https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/Strings/Viola%20Section/trem/Violas_trem_A3_v1_rr1.wav' 2074040 da970517a0b4ec56b49aa41133b3ed7bc142d01a
          fetch 'viola-e' 'https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/Strings/Viola%20Section/trem/Violas_trem_E4_v1_rr1.wav' 2187412 9a63f06c388479300c3e0a9a65448cba2efa84c7
          fetch 'cello-d' 'https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/Strings/Cello%20Section/susvib/susvib_D2_v1_1.wav' 2550956 8076f809d4f6a8057f3835e12d22751a25e39252
          fetch 'cello-a' 'https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/Strings/Cello%20Section/susvib/susvib_A2_v1_1.wav' 2336738 76df6b474aff133b2ac9d96bf2466cb6fd865c72
          fetch 'harp-a' 'https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/Strings/Harp/KSHarp_A4_mf.wav' 2143618 acbece38a84e886cb5516e0f29d6ff5d38900fe1
          fetch 'harp-e' 'https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/Strings/Harp/KSHarp_E5_mf.wav' 1171586 20675907d698db011d0c8bc72cf9af4e7a1ac971
      - name: Upload verified public samples
        uses: actions/upload-artifact@v4
        with:
          name: workshop-field-vsco-cc0
          path: recordings/
          if-no-files-found: error
          retention-days: 5
