name: Verify public recorded Foley source files
on:
  push:
    branches: [dot/workshop-audio-intake]
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Acquire public licensed recordings
        run: |
          mkdir -p recordings
          fetch() { curl --max-time 22 --retry 1 --fail --silent --show-error --location "$1" --output "recordings/$2"; }
          fetch 'https://cdn.freesound.org/previews/393/393800_1654262-hq.mp3' door-open.mp3 &
          fetch 'https://upload.wikimedia.org/wikipedia/commons/6/62/Closing_an_old_door.ogg' door-close.ogg &
          fetch 'https://cdn.freesound.org/previews/180/180837_964357-hq.mp3' steel-swing.mp3 &
          fetch 'https://cdn.freesound.org/previews/361/361482_6456158-hq.mp3' steel-impact.mp3 &
          fetch 'https://cdn.freesound.org/previews/584/584864_9735996-hq.mp3' item-pickup.mp3 &
          wait
          file recordings/*
          sha1sum recordings/*
          for clip in recordings/*; do ffprobe -v error -show_entries format=duration -of csv=p=0 "$clip"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensed-foley-source-recordings
          path: recordings
          if-no-files-found: error
