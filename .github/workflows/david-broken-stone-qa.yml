name: Disposable David Broken Stone QA
on:
  push:
    branches: [dot/workshop-david-broken-stone-qa]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: bash
        run: |
          if ! node --test tests/*.test.cjs > "$RUNNER_TEMP/strict.out" 2>&1; then
            grep -E '^not ok |^  location:|^  error:|^# (tests|pass|fail|duration)' "$RUNNER_TEMP/strict.out" | tail -180
            exit 1
          fi
          grep -E '^# (tests|pass|fail|duration)' "$RUNNER_TEMP/strict.out"
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        test: [david-impact-polish-browser, david-impact-polish-leap-browser, david-leap-fatal-ground-browser, mast]
        exclude:
          - test: mast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.test }}.mjs
        env:
          DAVID_STONE_ARTIFACT: ${{ runner.temp }}/temple-art
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.test }}-screenshots
          path: ${{ runner.temp }}/temple-art
