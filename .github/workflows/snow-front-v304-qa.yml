name: Natural physically rooted concealment preview
on:
  push:
    branches: ['dot/workshop-v304-snow-frontage-qa']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          test "$(git hash-object world-editor.html)" = 3035a520c7eeb18e37f46a7a90e466693179cf9e
          python .veil/build.py world-editor.html preview.html
          test "$(git hash-object preview.html)" = 8d3ac4a6799e832b6b5bebbb9b026659f8bf9b75
          cp .veil/tests/* tests/
          STOCK=world-editor.html HTML=preview.html node --test tests/natural-sacred-veil.test.cjs
          npm install --no-save playwright@1.58.2 && npx playwright install chromium
          FACILITY_SCREENSHOTS=shots node tests/natural-sacred-veil-browser.mjs world-editor.html preview.html
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: physical-forest-AB, path: shots}
