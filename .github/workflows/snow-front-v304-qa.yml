name: Same-floor companion recovery at real northern obstacles
on:
  push:
    branches: ['dot/workshop-v304-snow-frontage-qa']
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        case: [companion-stalls, local-detours, companion-seam-walk]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          test "$(git hash-object world-editor.html)" = ee4c1a024c0339699d4c62b3c32e3e90ca09fff2
          cp world-editor.html baseline.html
          python .stalls/build.py baseline.html world-editor.html
          test "$(git hash-object world-editor.html)" = e0d9744811d9b388f4497d6d6125141af0e66d06
          cp .stalls/tests/* tests/
          HTML=world-editor.html node --test tests/companion-stalls.test.cjs tests/local-detours.test.cjs
          npm install --no-save playwright@1.58.2 && npx playwright install chromium
          node tests/${{ matrix.case }}-browser.mjs world-editor.html
