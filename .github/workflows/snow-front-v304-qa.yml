name: Isolated v304 actual Snow frontages
on:
  push:
    branches: ['dot/workshop-v304-snow-frontage-qa']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        suite: [west]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          test "$(git hash-object world-editor.html)" = 666cffe39406f94195bf30e4d1763b51ca95373f
          cp world-editor.html stock.html
          python .snow-front/build.py stock.html frontage.html
          python .snow-front/shell.py frontage.html shell.html
          python .snow-front/companion/build.py shell.html world-editor.html
          cp .snow-front/compat/* tests/
          test "$(git hash-object world-editor.html)" = 0cb9b8e42f3e46bba1b60192516e6d5ed4e583e5
          cp .snow-front/tests/* tests/
          STOCK=stock.html HTML=world-editor.html node --test tests/snow-frontage.test.cjs
      - if: matrix.suite == 'strict'
        run: |
          c=0
          node --test --test-reporter=tap tests/*.test.cjs >strict.log 2>&1 || c=$?
          grep -E '^(not ok|# tests|# pass|# fail)' strict.log || true
          exit "$c"
      - if: matrix.suite != 'strict'
        run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - if: matrix.suite == 'frontage'
        run: |
          node tests/snow-frontage-browser.mjs world-editor.html
          FACILITY_SCREENSHOTS=shots node tests/snow-frontage-shell-browser.mjs world-editor.html
      - if: always() && matrix.suite == 'frontage'
        uses: actions/upload-artifact@v4
        with: {name: frontage-frames, path: shots}
      - if: startsWith(matrix.suite, 'audible-')
        run: node tests/snow-continuous-seam-browser.mjs world-editor.html
      - if: matrix.suite == 'preserves'
        run: |
          node tests/snow-pass-browser.mjs world-editor.html
          node tests/snow-neighbor-alignment-browser.mjs world-editor.html
          node tests/snow-new-sleeve-browser.mjs world-editor.html
          node tests/sacred-coastal-sightline-browser.mjs world-editor.html
          node tests/gradual-scenery-browser.mjs world-editor.html
      - if: matrix.suite == 'companion'
        run: node tests/companion-seam-walk-browser.mjs world-editor.html

      - if: matrix.suite == 'west'
        run: SNOW_PHASE_REPORT=1 node tests/snow-west-crossing-performance-browser.mjs world-editor.html
