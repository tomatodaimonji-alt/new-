name: Actual temple contact and stable porch orbit
on:
  push:
    branches: ['dot/workshop-v304-snow-frontage-qa']
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        scene: [temple-contact-wall, frontier-grade]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          test "$(git hash-object world-editor.html)" = ab78c71080874767f6344676ca50959494cea311
          cp world-editor.html baseline.html
          python .contact/build.py baseline.html world-editor.html
          test "$(git hash-object world-editor.html)" = 382059c9f46cd3306bd25eebb2c31d77229a98d8
          cp .contact/tests/* .contact/compat/* tests/
          HTML=world-editor.html node --test tests/temple-contact-wall.test.cjs tests/frontier-grade.test.cjs
          npm install --no-save playwright@1.58.2 && npx playwright install chromium
          FACILITY_SCREENSHOTS=shots node tests/${{ matrix.scene }}-browser.mjs world-editor.html
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "authored-${{ matrix.scene }}", path: shots}
