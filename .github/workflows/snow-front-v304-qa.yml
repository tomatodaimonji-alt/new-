name: Actual mine corners and stone bridge follow
on:
  push:
    branches: ['dot/workshop-v304-snow-frontage-qa']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          test "$(git hash-object world-editor.html)" = 5a4c9eeaaece246ef7a86c1e97b0167340edbfa3
          cp world-editor.html baseline.html
          python .detour/build.py baseline.html world-editor.html
          test "$(git hash-object world-editor.html)" = dbda7896581824f17beae0df8479e0fa08008d81
          cp .detour/tests/* tests/
          HTML=world-editor.html node --test tests/local-detours.test.cjs
          npm install --no-save playwright@1.58.2 && npx playwright install chromium
          node tests/local-detours-browser.mjs world-editor.html
