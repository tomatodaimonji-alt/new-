name: Exact sacred frontage sightline
on:
  push:
    branches: ['dot/workshop-v304-snow-frontage-qa']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          test "$(git hash-object world-editor.html)" = 62d5a258424b6dca202814c02002d9633d73f0f1
          cp world-editor.html baseline.html
          python .front-grade/build.py baseline.html world-editor.html
          test "$(git hash-object world-editor.html)" = 13d66933a49d2e70a339ebf346e14262a6d1a4c1
          cp .front-grade/tests/* tests/
          HTML=world-editor.html node --test tests/frontier-grade.test.cjs
          npm install --no-save playwright@1.58.2 && npx playwright install chromium
          FACILITY_SCREENSHOTS=shots node tests/frontier-grade-browser.mjs world-editor.html
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: sacred-frontage-frames, path: shots}
