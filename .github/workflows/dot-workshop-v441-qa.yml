name: Workshop frontier v441
on:
  push:
    branches: [dot/workshop-frontier-v441-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v441-reward.cjs world-editor.html && node tests/v441-preclear.cjs world-editor.html && node tests/v441-bow.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v441-browser.cjs
