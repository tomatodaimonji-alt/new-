name: Verify exact v334 east Snow seam
on:
  push:
    branches: [dot/workshop-east-seam-v334]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "38de35ac932dedf396508bced8297e6b73faa090" && git show HEAD^:world-editor.html > /tmp/v333.html && test "$(git hash-object /tmp/v333.html)" = "8eb39528fc547b877ca72de0f18cc19cbd4cfb23"
      - run: BASELINE=/tmp/v333.html HTML=world-editor.html node tests/seam-roles-release.test.cjs
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/east-seam-pair.mjs /tmp/v333.html world-editor.html
