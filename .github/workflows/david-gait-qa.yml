name: Isolated David gait QA
on:
  push:
    branches: ['dot/workshop-david-gait-qa']
jobs:
  stride:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/david-gait-browser.mjs
  old-boss:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/david-foley-browser.mjs
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/david-gait.test.cjs tests/david-arena-chase.test.cjs tests/david-beam-continuity.test.cjs tests/david-beam-buffer.test.cjs tests/david-beam-sweep.test.cjs tests/david-temple-combat.test.cjs tests/david-alien-audio.test.cjs tests/david-foley.test.cjs tests/real-david-fire-foley.test.cjs
