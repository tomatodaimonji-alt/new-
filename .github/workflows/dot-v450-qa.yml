name: Workshop frontier v450
on:
  push:
    branches: [dot/workshop-frontier-v450-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - run: git show 573006489b255cd39dcb6bafac4917dc302ddd05:world-editor.html >/tmp/prior450.html
      - run: node tests/v450-balance.cjs world-editor.html && WORKSHOP_BASE_HTML=/tmp/prior450.html WORKSHOP_HTML=world-editor.html node --test tests/v450-stick.cjs
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: HERO_SHOTS=1 node tests/v450-combined-browser.cjs
