name: Validate Frontier v399
on:
  push:
    branches: ['dot/workshop-frontier-v399-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: node tests/v399-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
        continue-on-error: true
      - run: node tests/v399-regression.cjs
      - run: node tests/v399-shots.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-v399
          path: screenshots/
          retention-days: 1
