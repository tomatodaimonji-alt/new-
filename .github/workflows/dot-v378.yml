name: Frontier shop and wild slimes
on:
  push:
    branches: ['dot/workshop-frontier-v378-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/v378-shop.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v378-browser.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v378-shop
          path: v378-shop.png
