name: Frontier village introduction
on:
  push:
    branches: ['dot/workshop-frontier-v372']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node tests/v372-tutorial.cjs world-editor.html
          node tests/v371-path.cjs world-editor.html
          node tests/v371-houses.cjs world-editor.html
          node tests/v370-arms.cjs world-editor.html
          node tests/v369-fence.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v372-tutorial-browser.mjs
