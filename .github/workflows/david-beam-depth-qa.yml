name: Independent David beam depth QA
on:
  push:
    branches: ['dot/workshop-david-beam-depth-qa']
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [beam-depth, foley]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: test "$(git hash-object world-editor.html)" = e0836559890403d963b02e59be7cf75561f6445c
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/david-${{ matrix.suite }}-browser.mjs world-editor.html
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/david-beam-depth.test.cjs tests/david-beam-buffer.test.cjs tests/david-beam-continuity.test.cjs
