name: Validate v408 armor shortcuts and gifting
on:
  push:
    branches: ['dot/workshop-frontier-v408-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: node tests/v408-test.cjs world-editor.html
      - run: node tests/v408-gift.cjs world-editor.html
      - run: node tests/v408-map.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v408-browser.cjs
