      - if: matrix.task == 'browser'
        run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - if: matrix.task == 'browser'
        run: node .qa/tests/lifecycle-pause-browser.mjs
      - if: matrix.task == 'browser'
        run: node .qa/tests/healing-cast-browser.mjs
      - if: matrix.task == 'strict'
        run: |
          cp .qa/tests/background-audio.test.cjs tests/
          if node --test tests/*.cjs > "$RUNNER_TEMP/unit.out" 2>&1; then tail -8 "$RUNNER_TEMP/unit.out"; else grep -E '^not ok |^  location:|^  error:|^# (tests|pass|fail|duration)' "$RUNNER_TEMP/unit.out" |cut -c1-350|tail -300; exit 1; fi
      - uses: actions/setup-java@v4
        if: matrix.task == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.task == 'apk'
        with:
          gradle-version: '8.9'
      - if: matrix.task == 'apk'
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          mkdir -p app/src/main/assets
          cp world-editor.html app/src/main/assets/starter.html
          gradle :app:assembleDebug --no-daemon
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/starter.html | cmp world-editor.html -
      - uses: actions/upload-artifact@v4
        if: matrix.task == 'apk'
        with:
          name: isolated-lifecycle-pause-apk
          path: app/build/outputs/apk/debug/app-debug.apk
