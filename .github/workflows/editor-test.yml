name: 3D world editor browser test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'world-editor.html'
      - 'tests/editor-smoke.mjs'
      - '.github/workflows/editor-test.yml'
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test WebGL editor and data roundtrip
        run: node tests/editor-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3d-editor-test-screenshots
          path: editor-*.png
