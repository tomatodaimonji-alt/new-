name: Isolated Clock and Area Growth QA
on:
  push:
    branches: [dot/workshop-clock-area-grow-qa]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          test "$(git hash-object world-editor.html)" = "ac96ee9ea35dde90c6d3b581005e0a8136a45a5e"
          python .qa-clock-area/build.py world-editor.html checked.html
          test "$(git hash-object checked.html)" = "dff343ad9e31619174725dad0a7b55bae730bda3"
          mv checked.html world-editor.html
          if ! node --test tests/*.test.cjs > "$RUNNER_TEMP/strict.out" 2>&1; then
            grep -E '^not ok |^  location:|^  error:|^# (tests|pass|fail|duration)' "$RUNNER_TEMP/strict.out" | tail -250
            exit 1
          fi
          grep -E '^# (tests|pass|fail|duration)' "$RUNNER_TEMP/strict.out"
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        test: [area-card-layout-browser, area-panel-motion-browser, mini-map-wide-browser, local-map-shell-browser]
    env:
      FACILITY_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: |
          test "$(git hash-object world-editor.html)" = "ac96ee9ea35dde90c6d3b581005e0a8136a45a5e"
          python .qa-clock-area/build.py world-editor.html checked.html
          test "$(git hash-object checked.html)" = "dff343ad9e31619174725dad0a7b55bae730bda3"
          node tests/${{ matrix.test }}.mjs checked.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.test }}-clock-area
          path: screenshots
          if-no-files-found: ignore
          retention-days: 3
