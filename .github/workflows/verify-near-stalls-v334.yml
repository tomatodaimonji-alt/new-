name: Verify exact v334 Port near stalls
on:
  push:
    branches: [dot/workshop-near-stalls-v334]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "7079d83a6fc913870d3679834921d9c3349196f9"
      - run: git show HEAD^:world-editor.html > /tmp/v333.html && node tests/near-stall.test.cjs world-editor.html /tmp/v333.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/port-stall-browser.mjs /tmp/v333.html world-editor.html
