name: Disposable Original Orvas Allied Boss QA
on:
  push:
    branches: [dot/workshop-orvas-boss-ally-qa]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/orvas-ally.test.cjs tests/soul-command-menu.test.cjs tests/soul-follow-priority.test.cjs tests/orvas-soul.test.cjs tests/companion-ui.test.cjs
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test: [orvas-soul-browser, soul-command-menu-browser, david-foley-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.test }}.mjs
