name: Allied physical contact audio red-green
on:
  push:
    branches: [dot/workshop-orvas-boss-ally-qa]
permissions:
  contents: read
jobs:
  contacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [world-editor.html, ally-hit-se-fixed.html]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/ally-hit-se-browser.mjs ${{ matrix.target }}
