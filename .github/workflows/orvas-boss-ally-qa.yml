name: Orvas allied committed leap real A-B
on:
  push:
    branches: [dot/workshop-orvas-boss-ally-qa]
permissions:
  contents: read
jobs:
  committed-leap:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        target: [world-editor.html, leap-fixed.html]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/orvas-committed-leap-browser.mjs ${{ matrix.target }}
