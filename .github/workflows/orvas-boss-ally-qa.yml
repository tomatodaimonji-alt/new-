name: Disposable Original Orvas Allied Boss QA
on:
  push:
    branches: [dot/workshop-orvas-boss-ally-qa]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/orvas-ally.test.cjs tests/soul-command-menu.test.cjs tests/soul-follow-priority.test.cjs tests/orvas-soul.test.cjs tests/companion-ui.test.cjs tests/companion-free.test.cjs tests/soul-summon-effect.test.cjs tests/orvas-temple-name.test.cjs tests/sacred-coastal-sightline.test.cjs
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test: [orvas-soul-browser, soul-command-menu-browser, david-foley-browser, soul-summon-effect-browser, orvas-temple-name-browser, sacred-coastal-sightline-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.test }}.mjs
        env:
          SOUL_BEHAVIOR_NATIVE: '1'
          FACILITY_SCREENSHOTS: screenshots
      - uses: actions/upload-artifact@v4
        if: always() && matrix.test == 'orvas-soul-browser'
        with:
          name: full-size-allied-orvas-native
          path: screenshots
          if-no-files-found: ignore
