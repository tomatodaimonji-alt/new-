name: World Workshop source integrity
on:
  push:
    branches: [main]
    paths:
      - 'src/editor/**'
      - 'src/shared/**'
      - 'scripts/build.mjs'
      - 'scripts/test-build.mjs'
      - 'world-editor.html'
      - '.github/workflows/editor-integrity.yml'
  pull_request:
    paths:
      - 'src/editor/**'
      - 'src/shared/**'
      - 'scripts/build.mjs'
      - 'scripts/test-build.mjs'
      - 'world-editor.html'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs --check
      - run: node scripts/test-build.mjs
