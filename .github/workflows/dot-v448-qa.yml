name: Workshop frontier v448
on:
  push:
    branches: [dot/workshop-frontier-v448-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v448-corner.cjs world-editor.html && node tests/v448-journey.cjs world-editor.html && node tests/v448-aggro.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v448-browser.cjs
