name: Independent David ordinary and jump impact QA
on:
  push:
    branches: ['dot/workshop-david-impact-polish-qa']
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [stomp, leap, leap7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: test "$(git hash-object world-editor.html)" = dd84df4802ceaca6abffc210044a2d1b9c697f6d
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - if: matrix.mode != 'leap7'
        run: node tests/david-impact-polish-browser.mjs world-editor.html --${{ matrix.mode }}
      - if: matrix.mode == 'leap7'
        run: |
          sed s/POI_DAVID_LEAP_RADIUS=8/POI_DAVID_LEAP_RADIUS=7/ world-editor.html > radius7-trial.html
          test "$(git hash-object radius7-trial.html)" != "$(git hash-object world-editor.html)"
          node tests/david-impact-polish-browser.mjs radius7-trial.html --leap
  strict:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          code=0
          node --test --test-reporter=tap tests/*.cjs >strict.log 2>&1 || code=$?
          grep -E '^(not ok|# tests|# pass|# fail)' strict.log || true
          exit "$code"
