name: Verify exact v330 actual restaurant wage
on:
  push:
    branches: [dot/workshop-real-npc-paid-shift-v330]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "c66097aace1dc3e469574bc6cd9e21c3ab441a5c"
      - run: node tests/npc-paid-shift.test.cjs world-editor.html && node tests/npc-guild-delivery.test.cjs world-editor.html && node tests/temple-outdoor-cache.test.cjs
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/paid-shift-browser.mjs world-editor.html
