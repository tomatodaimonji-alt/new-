name: Actor visibility at the terrain horizon
on:
  push:
    branches: ['dot/workshop-actor-horizon-v361']
jobs:
  landscape:
    strategy:
      fail-fast: false
      matrix: {suite: [actor]}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v361-${{ matrix.suite }}-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v361-${{ matrix.suite }}-screens
          path: |
            actor-horizon-shots
