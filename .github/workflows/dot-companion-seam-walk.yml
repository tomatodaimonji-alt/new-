name: Snow active soul v309 exact
on:
  push:
    branches: [dot/workshop-companion-seam-walk-qa]
permissions:
  contents: read
jobs:
  snow-active-soul:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNOW_PHASE_REPORT: '1'
      SNOW_PALETTE_REPORT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/snow-active-soul-browser.mjs
