name: Workshop frontier v432
on:
  push:
    branches: [dot/workshop-frontier-v432-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v432-stairs.cjs world-editor.html && node tests/v432-path.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v432-browser.cjs
