name: Workshop frontier v444
on:
  push:
    branches: [dot/workshop-frontier-v444-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v444-edges.cjs world-editor.html && node tests/v444-southcam.cjs world-editor.html && node tests/v443-north.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v444-browser.cjs
