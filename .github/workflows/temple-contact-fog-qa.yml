name: Temple contact wall real alpha and collision
on:
  push:
    branches: [dot/workshop-david-temple-qa]
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [world-editor.html, contact-wall-fixed.html]
    env:
      FACILITY_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/temple-contact-wall-browser.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          path: screenshots
          name: wall-${{ matrix.target }}
          if-no-files-found: ignore
