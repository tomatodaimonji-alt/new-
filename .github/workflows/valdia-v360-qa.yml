name: Rounded Valdia, gates and water
on:
  push:
    branches: ['dot/workshop-outdoor-haze-v339']
jobs:
  landscape:
    strategy:
      fail-fast: false
      matrix: {suite: [envelope, frontage, water]}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v360-${{ matrix.suite }}-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v360-${{ matrix.suite }}-screens
          path: |
            frontage-shots
            envelope-shots
            water-shots
