name: Verify Frontier bridge duo and hair ornament
on:
  push:
    branches: ['dot/workshop-frontier-v424-qa']
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v424-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v424-browser.cjs
