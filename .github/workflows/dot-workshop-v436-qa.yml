name: Workshop frontier v436
on:
  push:
    branches: [dot/workshop-frontier-v436-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v436-root.cjs world-editor.html && node tests/v436-fixtures.cjs world-editor.html && node tests/v436-interior.cjs world-editor.html && node tests/v436-pursuit.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v436-browser.cjs
