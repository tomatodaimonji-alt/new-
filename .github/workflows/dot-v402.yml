name: Validate Frontier v402
on:
  push:
    branches: ['dot/workshop-frontier-v402-memory-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: node tests/v402-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v402-browser.cjs
      - run: node tests/v402-regression.cjs
