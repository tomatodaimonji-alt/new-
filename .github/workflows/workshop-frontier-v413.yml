name: Verify Ren at the east bridge approach
on:
  push:
    branches: ['dot/workshop-frontier-v413-qa']
jobs:
  village:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v413-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v413-browser.cjs
