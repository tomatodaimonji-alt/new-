name: Capture v398 dungeon screenshots
on:
  push:
    branches: ['dot/frontier-v398-dungeon-screens']
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v398-shots.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: v398-dungeon-screens
          path: screenshots/
          retention-days: 1
      - name: Encode captures for transfer
        run: |
          for f in screenshots/*.jpg; do echo "SCREEN_BEGIN $(basename "$f")"; base64 -w 2400 "$f"; echo "SCREEN_END"; done
