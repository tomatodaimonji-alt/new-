name: Workshop frontier v440
on:
  push:
    branches: [dot/workshop-frontier-v440-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v440-paint.cjs world-editor.html && node tests/v440-dialogue.cjs world-editor.html && node tests/v440-landing.cjs world-editor.html && node tests/v439-perf.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v440-browser.cjs
