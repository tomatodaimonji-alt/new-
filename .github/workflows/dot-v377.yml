name: Frontier village chief
on:
  push:
    branches: ['dot/workshop-frontier-v377-qa2']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node tests/v377-chief.cjs world-editor.html
          node tests/v377-spear.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v377-browser.cjs
