name: Workshop frontier v449
on:
  push:
    branches: [dot/workshop-frontier-v449-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v449-gap.cjs world-editor.html && node tests/v448-heavy-avatar.cjs world-editor.html && node tests/v448-heavy-residents.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v449-browser.cjs && CHECK_HEAVY=1 node tests/v448-heavy-browser.cjs
