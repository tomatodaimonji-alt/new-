name: Verify exact v331 actual scout report
on:
  push:
    branches: [dot/workshop-scout-report-v331]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "0b94677900cf74e27a21f4cb6383be6bb420fbf1"
      - run: git show HEAD^:world-editor.html > /tmp/v330.html && SCOUT_V330_BASE=/tmp/v330.html node tests/npc-scout-report.test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/scout-report-browser.mjs world-editor.html
