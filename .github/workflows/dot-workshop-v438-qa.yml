name: Workshop frontier v438
on:
  push:
    branches: [dot/workshop-frontier-v438-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v438-coins.cjs world-editor.html && node tests/v437-root.cjs world-editor.html && node tests/v437-stair.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v438-browser.cjs
