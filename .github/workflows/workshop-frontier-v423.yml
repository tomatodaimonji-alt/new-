name: Verify Frontier rank vitals and mithril gear
on:
  push:
    branches: ['dot/workshop-frontier-v423-qa']
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v423-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v423-browser.cjs
