name: Verify exact v335 hotbar after movement pad
on:
  push:
    branches: [dot/workshop-pad-hotbar-v335]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "c5bcb77b1b7f7c0fa8e57a7a6aa99cedb0a8002d" && git show HEAD^:world-editor.html > /tmp/v334.html && test "$(git hash-object /tmp/v334.html)" = "38de35ac932dedf396508bced8297e6b73faa090"
      - run: node tests/hotbar-after-pad.test.cjs && node tests/movement-weapon-switch.test.cjs && node tests/gold-swipe.test.cjs
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/hotbar-after-pad-browser.mjs world-editor.html /tmp/v334.html
