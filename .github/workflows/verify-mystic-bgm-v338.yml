name: Verify exact v338 mystical seven recordings
on:
  push:
    branches: [dot/workshop-new-mystical-bgm-v338]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "7098322884c4d0f35f37b0b36e9121a459241be8" && git show HEAD^:world-editor.html > /tmp/v337.html && test "$(git hash-object /tmp/v337.html)" = "07e61989cc0d387290d099d97f5b7fff65bc86c4"
      - run: node tests/mystic-region-assets.test.cjs /tmp/v337.html world-editor.html docs/recorded-region-bgm-manifest.json && node tests/region-transport.test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/recorded-zone-browser.mjs world-editor.html
