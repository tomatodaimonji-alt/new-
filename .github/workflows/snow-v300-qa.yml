name: Isolated v302 coexisting souls plus disjoint snow corridor
on:
  push:
    branches: ['dot/workshop-v300-disjoint-snow-qa']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        suite: [strict, geometry, pixels, routes, coastal-name, local-temple, audible-a, audible-b, active-soul, ally-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 8a3fe9d85302d953202ae95194c2699af568f0c6
          path: exact
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          test "$(git hash-object exact/world-editor.html)" = 6ea7cf68b733799423359b0d3c49e907f62a8172
          cp exact/world-editor.html .snow-v300/stock.html
          cd .snow-v300
          python sleeve.py stock.html sleeve.html
          test "$(git hash-object sleeve.html)" = 96f69125f2a242bd03d0dfa74d8b74e1d5b7d01f
          python build.py sleeve.html stream.html --default
          python horizon-safe.py stream.html horizon.html
          python path-ast-trial.py horizon.html paths.html
          python cold-palette-reuse.py paths.html palette.html
          python forest-stream-bridge.py palette.html world-editor.html
          test "$(git hash-object world-editor.html)" = cffe27feb00279f908d50a5772ec448ba2490a0a
          STOCK=stock.html HTML=world-editor.html node --test tests/*.test.cjs
      - if: matrix.suite == 'strict'
        run: |
          cp .snow-v300/world-editor.html exact/world-editor.html
          cp .snow-v300/compat/*.cjs exact/tests/
          cd exact
          c=0
          node --test --test-reporter=tap tests/*.test.cjs >strict.log 2>&1 || c=$?
          grep -E '^(not ok|# tests|# pass|# fail)' strict.log || true
          exit "$c"
      - if: matrix.suite != 'strict'
        run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - if: matrix.suite == 'geometry'
        run: node .snow-v300/tests/snow-new-sleeve-browser.mjs .snow-v300/world-editor.html
      - if: matrix.suite == 'pixels'
        run: |
          node .snow-v300/tests/snow-neighbor-alignment-browser.mjs .snow-v300/world-editor.html
          node .snow-v300/tests/snow-visible-from-forest-browser.mjs .snow-v300/world-editor.html
      - if: matrix.suite == 'routes'
        run: node .snow-v300/tests/snow-pass-browser.mjs .snow-v300/world-editor.html
      - if: matrix.suite == 'coastal-name'
        run: |
          node .snow-v300/v301/sacred-coastal-sightline-browser.mjs .snow-v300/world-editor.html
          node exact/tests/orvas-temple-name-browser.mjs .snow-v300/world-editor.html
          node exact/tests/sacred-depth-browser.mjs .snow-v300/world-editor.html
      - if: matrix.suite == 'local-temple'
        run: |
          node exact/tests/local-minimap-browser.mjs .snow-v300/world-editor.html
          node exact/tests/depth-temple-browser.mjs .snow-v300/world-editor.html
      - if: startsWith(matrix.suite, 'audible-')
        shell: bash
        run: |
          code=0
          for repetition in 1; do
            echo "Unchanged audible held drag gate, physically translated coordinates, repetition $repetition"
            SNOW_PHASE_REPORT=1 SNOW_PALETTE_REPORT=1 node .snow-v300/tests/snow-continuous-seam-browser.mjs .snow-v300/world-editor.html || code=1
          done
          exit "$code"
      - if: matrix.suite == 'active-soul'
        run: SNOW_PHASE_REPORT=1 node .snow-v300/v302/snow-active-soul-browser.mjs .snow-v300/world-editor.html
      - if: matrix.suite == 'ally-ui'
        run: |
          node exact/tests/soul-command-menu-browser.mjs .snow-v300/world-editor.html
          node exact/tests/soul-summon-effect-browser.mjs .snow-v300/world-editor.html
          node exact/tests/orvas-soul-browser.mjs .snow-v300/world-editor.html
