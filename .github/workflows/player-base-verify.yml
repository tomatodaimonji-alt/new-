name: Verify portable Orvas terminal continuity
on:
  push:
    branches: [dot/workshop-orvas-scorch-curve-qa]
jobs:
  exact-field:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git show fe5c2b0d4a3df5acd5edf1bf054b3531cc443f62:world-editor.html > base.html
          git hash-object base.html
          test "$(git hash-object base.html)" = ee4c1a024c0339699d4c62b3c32e3e90ca09fff2
          python3 tests/portable-eye-build.py base.html candidate.html
          git hash-object candidate.html
          test "$(git hash-object candidate.html)" = 8823f47a7a2adfcc3e9b3f19876e4db09e445ab6
          HTML=candidate.html node --test tests/portable-eye-sockets.test.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/orvas-player-terminal-browser.mjs candidate.html
