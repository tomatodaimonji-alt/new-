name: Private identical-foot ordinary gate tiers across actual stock and stream
on:
  push:
    branches: [dot/workshop-player-base-verify-hybrid-gate-v320]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        backend: [stock, stream]
        tier: [middle]
    env:
      HYBRID_BACKEND: ${{ matrix.backend }}
      HYBRID_TIER: ${{ matrix.tier }}
      FACILITY_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node tests/hybrid-gate-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-${{ matrix.backend }}-${{ matrix.tier }}
          path: screenshots
          if-no-files-found: ignore
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/hybrid-gate-policy.test.cjs
