name: Private P2.1 split ground priority, opaque physical shell and RAF A/B
on:
  push:
    branches: [dot/workshop-player-base-verify-uniform-outdoor-p21-qa]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [public, prototype, split, raster]
    env:
      UNIFORM_RAF_MODE: ${{ matrix.mode }}
      FACILITY_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - if: matrix.mode == 'public'
        run: UNIFORM_RAF_MODE=published node tests/uniform-turn-raf-browser.mjs exact-public-v319.html
      - if: matrix.mode == 'prototype' || matrix.mode == 'split'
        run: node tests/uniform-turn-raf-browser.mjs
      - if: matrix.mode == 'raster'
        run: node tests/uniform-split-raster-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p21-${{ matrix.mode }}
          path: screenshots
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/uniform*.test.cjs
