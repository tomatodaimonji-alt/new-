name: Read-only actual stock roof and facade workload on optimized candidate
on:
  push:
    branches: [dot/workshop-player-base-verify-roof-frontage-v320]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        site: [center, gate]
        opt: [reference, optimized]
    env:
      EXTERIOR_SITE: ${{ matrix.site }}
      EXTERIOR_OPT: ${{ matrix.opt }}
      FACILITY_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node tests/roof-frontage-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontage-${{ matrix.site }}-${{ matrix.opt }}
          path: screenshots
          if-no-files-found: ignore
