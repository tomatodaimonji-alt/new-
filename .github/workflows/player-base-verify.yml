name: Verify upward view within deeply relocated exact temple
on:
  push:
    branches: [dot/workshop-next-higher-view-qa]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FACILITY_SCREENSHOTS: screenshots
    strategy:
      fail-fast: false
      matrix:
        script: [higher-view-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.script }}.mjs depth-only-qa.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.script }}
          path: screenshots
          if-no-files-found: ignore
