name: Read-only exact v320 outdoor near geometry workload
on:
  push:
    branches: [dot/workshop-player-base-verify-exterior-budget-v320]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        site: [gate]
    env:
      EXTERIOR_SITE: ${{ matrix.site }}
      FACILITY_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - if: matrix.site == 'gate'
        run: node tests/exterior-wall-transport.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exterior-${{ matrix.site }}
          path: screenshots
          if-no-files-found: ignore
