name: Verify real companion command selection and spell equip coexistence
on:
  push:
    branches: [dot/workshop-soul-command-menu-qa]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FACILITY_SCREENSHOTS: screenshots
    strategy:
      fail-fast: false
      matrix:
        script: [soul-command-menu-browser, orvas-soul-award-browser, movement-heal-multitouch-browser]
        include:
          - script: soul-follow-real-movement
            behavior: '1' 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: |
          if [ "${{ matrix.behavior }}" = 1 ]; then
            SOUL_BEHAVIOR_NATIVE=1 node tests/soul-command-menu-browser.mjs
          else
            node tests/${{ matrix.script }}.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.script }}
          path: screenshots
          if-no-files-found: ignore
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if node --test tests/*.cjs > "$RUNNER_TEMP/unit.out" 2>&1; then
            tail -8 "$RUNNER_TEMP/unit.out"
          else
            grep -E '^not ok |^  location:|^  error:|^# (tests|pass|fail|duration)' "$RUNNER_TEMP/unit.out" | cut -c1-350 | tail -200
            exit 1
          fi
