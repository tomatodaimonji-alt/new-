name: Private single paired stock dedicated wall shader
on:
  push:
    branches: [dot/workshop-stock-wall-attribution-once]
jobs:
  once:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: |
          export HYBRID_BACKEND=stock-opt HYBRID_TIER=near FACILITY_SCREENSHOTS=results
          python tests/stock-wall-dedicated-build.py world-editor.html dedicated.html
          HTML=dedicated.html node --test tests/stock-wall-dedicated.test.cjs
          export WALL_DEDICATED_SHA=1fc9d4cfdc7326b983cfe7e650423d92cef37e55
          test "$(git hash-object dedicated.html)" = "$WALL_DEDICATED_SHA"
          WALL_ATTR_VARIANT=embedded node tests/stock-wall-dedicated.mjs
          WALL_ATTR_VARIANT=dedicated node tests/stock-wall-dedicated.mjs dedicated.html
          node -e 'const a=require("./results/embedded.json"),b=require("./results/dedicated.json");const p=a.raster.pixels,q=b.raster.pixels,k=Object.keys(p).filter(x=>q[x]),m=k.map(x=>Math.max(...p[x].map((v,i)=>Math.abs(v-q[x][i])))).sort((a,b)=>a-b);if(k.length<100||k.length/(Object.keys(p).length+Object.keys(q).length-k.length)<.995||m[Math.floor((m.length-1)*.95)]>2)process.exitCode=1;console.log(JSON.stringify({wallCommon:k.length,maskIoU:k.length/(Object.keys(p).length+Object.keys(q).length-k.length),rgbP95:m[Math.floor((m.length-1)*.95)],body:[a.stats.body,b.stats.body],raw:[a.stats.raw,b.stats.raw]}));'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution
          path: results
