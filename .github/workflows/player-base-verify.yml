name: Retest v235 locked target, startup hit areas and exact elite damage on identical gameplay HTML
on:
  push:
    branches: [dot/workshop-v235-preflight]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACILITY_SCREENSHOTS: screenshots
      SOUTH_MERCHANT_NIGHT: '1'
      SOUTH_ROAD_PROFILE: '1'
    strategy:
      fail-fast: false
      matrix:
        script: [combat-lock-browser, landscape-large-inventory-browser, otherworld-browser]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/${{ matrix.script }}.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.script }}
          path: screenshots
          if-no-files-found: ignore
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.cjs
