name: Private shared outdoors ordinary structures and true temple cache rehearse
on:
  push:
    branches: [dot/workshop-player-base-verify-uniform-outdoor-p1b-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        script: [uniform-construction-browser, uniform-outdoor-browser, uniform-canopy-browser, uniform-natural-browser]
    env:
      FACILITY_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - if: matrix.script != 'uniform-natural-browser'
        run: node tests/${{ matrix.script }}.mjs
      - if: matrix.script == 'uniform-natural-browser'
        run: node tests/uniform-natural-browser.mjs world-editor.html uniform-natural-preview.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.script }}
          path: screenshots
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/uniform*.test.cjs
