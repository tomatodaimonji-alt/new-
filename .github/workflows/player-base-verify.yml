name: Verify ordinary close-arm avatar-only visibility
on:
  push:
    branches: [dot/workshop-ordinary-close-avatar-qa]
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FACILITY_SCREENSHOTS: screenshots
    strategy:
      fail-fast: false
      matrix:
        script: [ordinary-avatar-baseline, ordinary-close-avatar-browser, david-sacred-portrait-browser]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - if: matrix.script == 'ordinary-avatar-baseline'
        run: |
          git show HEAD^:world-editor.html > baseline.html
          node tests/ordinary-close-avatar-browser.mjs baseline.html --opaque
      - if: matrix.script != 'ordinary-avatar-baseline'
        run: node tests/${{ matrix.script }}.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.script }}
          path: screenshots
          if-no-files-found: ignore
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if node --test tests/*.cjs > "$RUNNER_TEMP/unit.out" 2>&1; then
            tail -8 "$RUNNER_TEMP/unit.out"
          else
            grep -E '^not ok |^  location:|^  error:|^# (tests|pass|fail|duration)' "$RUNNER_TEMP/unit.out" | cut -c1-350 | tail -200
            exit 1
          fi
