name: Private no-readback exact outdoor threshold RAF A/B
on:
  push:
    branches: [dot/workshop-player-base-verify-uniform-threshold-raf-qa]
jobs:
  raf:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [published, prototype]
    env:
      UNIFORM_RAF_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - if: matrix.mode == 'published'
        run: node tests/uniform-threshold-raf-browser.mjs exact-public-v316.html
      - if: matrix.mode == 'prototype'
        run: node tests/uniform-threshold-raf-browser.mjs world-editor.html
