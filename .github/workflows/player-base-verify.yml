name: Private rotation and gate-residency measured optimization, no default
on:
  push:
    branches: [dot/workshop-player-base-verify-hybrid-wall-opt-v320]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: stock-ref, tier: near }
          - { backend: stock-opt, tier: near }
          - { backend: stream-ref, tier: near }
          - { backend: stream-opt, tier: near }
          - { backend: stream-control, tier: near }
          - { backend: stock-fallback, tier: near }
          - { backend: stream-opt, tier: far }
    env:
      HYBRID_BACKEND: ${{ matrix.backend }}
      HYBRID_TIER: ${{ matrix.tier }}
      FACILITY_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node tests/hybrid-wall-opt-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wall-opt-${{ matrix.backend }}-${{ matrix.tier }}
          path: screenshots
          if-no-files-found: ignore
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/hybrid-{gate-policy,fort-wall,wall-opt}.test.cjs
