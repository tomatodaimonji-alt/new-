name: Verify portable Orvas eye sockets
on:
  push:
    branches: [dot/workshop-orvas-scorch-curve-qa]
jobs:
  exact-field:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git show 860879f3884b6895b1001945e3a5a7d08d2f524e:world-editor.html > base.html
          git hash-object base.html
          test "$(git hash-object base.html)" = ac96ee9ea35dde90c6d3b581005e0a8136a45a5e
          python3 tests/portable-eye-build.py base.html candidate.html
          git hash-object candidate.html
          test "$(git hash-object candidate.html)" = 5a39d944443f4375ad3686b8bff256c10b23550f
          HTML=candidate.html node --test tests/portable-eye-sockets.test.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/portable-eye-sockets-browser.mjs candidate.html
        env:
          FACILITY_SCREENSHOTS: screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-eye-cameras
          path: screenshots
          if-no-files-found: ignore
