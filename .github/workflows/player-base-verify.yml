name: Isolated v289 predecessor sacred temple, fog route, physical wake
on:
  push:
    branches: [dot/workshop-v289-sacred-integration-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACILITY_SCREENSHOTS: screenshots
      SOUTH_MERCHANT_NIGHT: '1'
      SOUTH_ROAD_PROFILE: '1'
    strategy:
      fail-fast: false
      matrix:
        script: [david-sacred-temple-browser, sacred-discovery-browser, david-awakening-browser, david-score-browser, david-foley-browser, david-temple-browser, david-impact-polish-browser, david-impact-polish-leap-browser, david-walking-edge-roll-browser, david-death-finish-browser, david-large-hurtbox-browser, night-sky-wall-browser, surface-sky-camera-browser]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.script }}.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.script }}
          path: screenshots
          if-no-files-found: ignore
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if node --test tests/*.cjs > "$RUNNER_TEMP/unit.out" 2>&1; then
            tail -8 "$RUNNER_TEMP/unit.out"
          else
            grep -E '^not ok |^  location:|^  error:|^# (tests|pass|fail|duration)' "$RUNNER_TEMP/unit.out" | cut -c1-350 | tail -300
            exit 1
          fi

