name: Private real square backing and radial policy comparison
on:
  push:
    branches: [dot/workshop-player-base-verify-uniform-outdoor-p1-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        stock: ['0', '1']
    env:
      OUTDOOR_STOCK: ${{ matrix.stock }}
      FACILITY_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node tests/uniform-outdoor-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uniform-stock-${{ matrix.stock }}
          path: screenshots
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/uniform-outdoor.test.cjs
