name: Verify exact v321 close portable eye beam contact without changing ordinary aim
on:
  push:
    branches: [dot/workshop-player-base-verify]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACILITY_SCREENSHOTS: screenshots
      SNOW_PHASE_REPORT: '1'
      SNOW_PALETTE_REPORT: '1'
      SOUL_BEHAVIOR_NATIVE: '1'
      SOUTH_MERCHANT_NIGHT: '1'
      SOUTH_ROAD_PROFILE: '1'
    strategy:
      fail-fast: false
      matrix:
        script: [close-locked-slime-beam-browser, companion-stalls-browser, area-panel-motion-browser, portable-eye-sockets-browser, giant-hp-anchor-browser, ally-hit-se-browser, wild-notice-native, chest-party-hud-browser, minimap-smooth-browser, local-detours-browser, local-detours-hostile-browser, orvas-ground-traces-browser, square-field-browser, mini-map-wide-browser, local-minimap-browser, soul-floor-browser, soul-floor-snow-browser, orvas-committed-leap-browser, local-map-shell-browser, temple-contact-wall-browser, outdoor-lod-browser, overland-square-browser, frontier-grade-browser, area-card-layout-browser, area-panel-motion-browser, west-repeat-ally-browser, snow-frontage-browser, snow-frontage-shell-browser, snow-west-crossing-performance-browser, snow-continuous-seam-browser, snow-active-soul-browser, companion-seam-walk-browser, snow-pass-browser, sacred-coastal-sightline-browser, gradual-scenery-browser]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.script }}.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.script }}
          path: screenshots
          if-no-files-found: ignore
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if node --test tests/*.cjs > "$RUNNER_TEMP/unit.out" 2>&1; then
            tail -8 "$RUNNER_TEMP/unit.out"
          else
            grep -E '^not ok |^  location:|^  error:|^# (tests|pass|fail|duration)' "$RUNNER_TEMP/unit.out" | cut -c1-350 | tail -300
            exit 1
          fi
