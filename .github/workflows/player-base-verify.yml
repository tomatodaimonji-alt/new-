name: Read-only exact v320 outdoor near geometry workload
on:
  push:
    branches: [dot/workshop-player-base-verify-exterior-budget-v320]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        site: [gate, center, port]
    env:
      EXTERIOR_SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node tests/exterior-archetype-profile.mjs
