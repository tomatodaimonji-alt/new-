name: Private actual opaque common temple exterior and indoor safety
on:
  push:
    branches: [dot/workshop-player-base-verify-uniform-outdoor-p2-qa]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [control, prototype, threshold]
    env:
      UNIFORM_SHELL_MODE: ${{ matrix.mode }}
      UNIFORM_RAF_MODE: prototype
      FACILITY_SCREENSHOTS: screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - if: matrix.mode != 'threshold'
        run: node tests/uniform-shell-browser.mjs
      - if: matrix.mode == 'threshold'
        run: node tests/uniform-threshold-raf-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-${{ matrix.mode }}
          path: screenshots
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/uniform*.test.cjs
