name: Verify final v295 Orvas trophy parity, traces and actual soul award
on:
  push:
    branches: [dot/workshop-player-base-verify]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACILITY_SCREENSHOTS: screenshots
      SOUTH_MERCHANT_NIGHT: '1'
      SOUTH_ROAD_PROFILE: '1'
    strategy:
      fail-fast: false
      matrix:
        script: [orvas-faithful-gear-browser, orvas-beam-tail-browser, orvas-ground-traces-browser, orvas-player-terminal-browser, orvas-stone-death-browser, orvas-soul-browser, orvas-soul-award-browser, orvas-weapons-browser, orvas-reset-kit-browser]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.script }}.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.script }}
          path: screenshots
          if-no-files-found: ignore
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if node --test tests/*.cjs > "$RUNNER_TEMP/unit.out" 2>&1; then
            tail -8 "$RUNNER_TEMP/unit.out"
          else
            grep -E '^not ok |^  location:|^  error:|^# (tests|pass|fail|duration)' "$RUNNER_TEMP/unit.out" | cut -c1-350 | tail -300
            exit 1
          fi
