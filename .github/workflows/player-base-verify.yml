name: Independent 04:40 warm light pixels
on:
  push:
    branches: [dot/workshop-player-base-verify-warm-lighting-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACILITY_SCREENSHOTS: screenshots
      SOUTH_MERCHANT_NIGHT: '1'
      SOUTH_ROAD_PROFILE: '1'
    strategy:
      fail-fast: false
      matrix:
        script: [warm-lighting-browser]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: git show 42ef0e3833439e67b6baff56ce840824c7c2e833:world-editor.html > /tmp/warm-before.html
      - run: node tests/${{ matrix.script }}.mjs world-editor.html /tmp/warm-before.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.script }}
          path: screenshots
          if-no-files-found: ignore
