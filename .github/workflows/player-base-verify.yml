name: Verify nearby locked slime eye beam
on:
  push:
    branches: [dot/workshop-orvas-scorch-curve-qa]
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git show 1d5eb5cfee57ad269dfa757d071ef9b178dfdce5:world-editor.html > base.html
          test "$(git hash-object base.html)" = fba71f8d06e367c2f1eaa642484737aa8386964d
          python3 tests/close-eye-build.py base.html candidate.html
          test "$(git hash-object candidate.html)" = 93ec664359580dad7417ed5988834686aaa5bb2e
          HTML=candidate.html node --test tests/close-locked-slime-beam.test.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: |
          if [ "${{ matrix.mode }}" = baseline ]; then
            CLOSE_BEAM_BASELINE=1 node tests/close-locked-slime-beam-browser.mjs base.html
          else
            node tests/close-locked-slime-beam-browser.mjs candidate.html
          fi
        env:
          FACILITY_SCREENSHOTS: screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: close-eyes-${{ matrix.mode }}
          path: screenshots
          if-no-files-found: ignore
