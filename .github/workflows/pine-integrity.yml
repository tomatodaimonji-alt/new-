name: PINE source and single-HTML integrity
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build.mjs'
      - 'scripts/test-build.mjs'
      - 'forest-game-prototype.html'
      - 'world-editor.html'
      - '.github/workflows/pine-integrity.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/build.mjs'
      - 'scripts/test-build.mjs'
      - 'forest-game-prototype.html'
      - 'world-editor.html'
      - '.github/workflows/pine-integrity.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated HTML exactly matches split sources
        run: node scripts/build.mjs --check
      - name: Check syntax and core architecture invariants
        run: node scripts/test-build.mjs
