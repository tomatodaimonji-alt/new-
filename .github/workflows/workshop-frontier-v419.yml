name: Verify Frontier outfitting, loot, and trade
on:
  push:
    branches: ['dot/workshop-frontier-v419-qa']
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v419-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v419-browser.cjs
