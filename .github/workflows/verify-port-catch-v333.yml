name: Verify exact v333 port catch
on:
  push:
    branches: [dot/workshop-port-catch-v333]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "8eb39528fc547b877ca72de0f18cc19cbd4cfb23"
      - run: node tests/npc-port-catch.test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/port-catch-browser.mjs world-editor.html
