name: Verify exact v323 NPC routines and warm survival state
on:
  push:
    branches: [dot/workshop-npc-agency-warm-v323]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "c360fde92fad794755188fec65640b130626bfdf"
      - run: node tests/npc-agency.test.cjs world-editor.html && node tests/npc-resident-seam.test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/npc-agency-seam-browser.mjs world-editor.html
