name: Workshop frontier v439
on:
  push:
    branches: [dot/workshop-frontier-v439-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v439-perf.cjs world-editor.html && node tests/v439-route.cjs world-editor.html && HTML=world-editor.html node tests/v439-walk.cjs && node tests/v439-chant.cjs world-editor.html && node tests/v438-coins.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v439-browser.cjs
