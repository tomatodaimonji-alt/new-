name: Validate Frontier v400
on:
  push:
    branches: ['dot/workshop-frontier-v400-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: node tests/v400-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v400-regression.cjs
      - run: node tests/v400-shots.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-v400
          path: screenshots/
          retention-days: 1
