name: Private v338 round distance proven routes
on:
  push:
    branches: [dot/workshop-private-stock-atlas-v324]
jobs:
  outdoor-haze:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: |
          cd tests/stock-atlas-audit/outdoor-haze
          test "$(git hash-object ../../../world-editor.html)" = 7098322884c4d0f35f37b0b36e9121a459241be8
          python build.py ../../../world-editor.html private-v338.html
          test "$(git hash-object private-v338.html)" = b8e81e5a3b23468a69d02c3c17601082b5e6a03d
          ATLAS_PARSE_ONLY=1 node haze-proven-routes-safe.mjs private-v338.html
          HAZE_ART=/tmp/haze-audit node haze-proven-routes-safe.mjs private-v338.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outdoor-haze
          path: /tmp/haze-audit
          if-no-files-found: ignore
