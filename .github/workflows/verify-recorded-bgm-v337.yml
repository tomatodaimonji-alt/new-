name: Verify exact v337 recordings and transport
on:
  push:
    branches: [dot/workshop-recorded-bgm-v337]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "07e61989cc0d387290d099d97f5b7fff65bc86c4" && git show HEAD^:world-editor.html > /tmp/v336.html && test "$(git hash-object /tmp/v336.html)" = "ea42da28b718024613d40a54f202c5fd83d4f3bc"
      - run: node tests/region-transport.test.cjs world-editor.html && node tests/recorded-region-assets.test.cjs /tmp/v336.html world-editor.html docs/recorded-region-bgm-manifest.json
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/recorded-zone-browser.mjs world-editor.html
