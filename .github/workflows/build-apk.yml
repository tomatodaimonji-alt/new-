name: Build 3D World Editor APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'world-editor.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle current 3D editor HTML
        run: |
          mkdir -p app/src/main/assets
          cp world-editor.html app/src/main/assets/starter.html
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: world-editor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
