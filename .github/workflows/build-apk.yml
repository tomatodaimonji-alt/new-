name: Build 3D World Editor APK

on:
  workflow_dispatch:
  # Keep the existing package available; publish a new APK only on explicit request.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle current 3D editor HTML
        run: |
          mkdir -p app/src/main/assets
          cp world-editor.html app/src/main/assets/starter.html
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: world-editor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish installable APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="3d-world-workshop-v81"
          APK="3D-world-workshop-v81.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "3Dワールド工房 v81 Android APK" \
              --notes "AI画像解析用PNG保存に対応したAndroidアプリ。既存のアプリを削除せず上書きインストールを試してください。デバッグ署名が異なる場合は上書きできません。既存データ保護のため、アプリをアンインストールしないでください。" \
              --latest
          fi
