name: Workshop frontier v435
on:
  push:
    branches: [dot/workshop-frontier-v435-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v435-root.cjs world-editor.html && node tests/v435-interior.cjs world-editor.html && node tests/v435-path.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v435-browser.cjs
