name: Validate v406 Frontier daily life and woods
on:
  push:
    branches: ['dot/workshop-frontier-v406-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: HTML=world-editor.html WORKSHOP_HTML=world-editor.html node tests/v406-landscape.cjs world-editor.html
      - run: HTML=world-editor.html WORKSHOP_HTML=world-editor.html node tests/v406-pickup.cjs world-editor.html
      - run: HTML=world-editor.html WORKSHOP_HTML=world-editor.html node tests/v406-idle.cjs world-editor.html
      - run: node tests/v406-gear-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v406-regression.cjs
      - run: node tests/v406-lands-browser.cjs
      - run: node tests/v406-pickup-browser.cjs world-editor.html
