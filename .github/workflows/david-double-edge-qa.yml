name: Disposable David Double Edge QA
on:
  push:
    branches: [dot/workshop-david-double-edge-qa]
permissions:
  contents: read
jobs:
  exact-geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/david-double-edge.test.cjs tests/stone-david-geometry.test.cjs
  actual-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/david-double-edge-browser.mjs
