name: Disposable physical companion seam QA
on:
  push:
    branches: [dot/workshop-companion-seam-walk-qa]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/companion-seam-walk.test.cjs tests/companion-free.test.cjs tests/monster-companion.test.cjs
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        test: [companion-seam-walk-browser, orvas-soul-browser, soul-floor-snow-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - run: node tests/${{ matrix.test }}.mjs
