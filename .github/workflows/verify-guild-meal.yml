name: Verify exact v327 actual meals and guild food courier
on:
  push:
    branches: [dot/workshop-npc-guild-meal-v327]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "32c81b467c47eb55079e272e5df8e6f0c3a7b465"
      - run: node tests/npc-guild-delivery.test.cjs world-editor.html && node tests/npc-inn-meal.test.cjs world-editor.html && node tests/funded-food.test.cjs world-editor.html && node tests/stock-atlas-cull.test.cjs
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/guild-meal-browser.mjs world-editor.html
