name: Disposable David Courtyard Score QA
on:
  push:
    branches: [dot/workshop-david-score-qa]
permissions:
  contents: read
jobs:
  score-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/david-score.test.cjs tests/david-awakening.test.cjs
  score-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/david-score-browser.mjs
