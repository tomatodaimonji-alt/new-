name: Workshop frontier v450 balance
on:
  push:
    branches: [dot/workshop-frontier-v450-balance-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v450-balance.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v450-browser.cjs
