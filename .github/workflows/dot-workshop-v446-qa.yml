name: Workshop frontier v446
on:
  push:
    branches: [dot/workshop-frontier-v446-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v446-cellar.cjs world-editor.html && node tests/v446-roads.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v446-browser.cjs
