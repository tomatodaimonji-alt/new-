name: Test terrain, physical hits, and bedside interaction
on:
  push:
    branches: ['dot/workshop-frontier-v412-qa']
jobs:
  village:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v412-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v412-browser.cjs
