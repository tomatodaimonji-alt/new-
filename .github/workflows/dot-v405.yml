name: Validate v405 dungeon camera and resume
on:
  push:
    branches: ['dot/workshop-frontier-v405-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: node tests/v405-test.cjs world-editor.html
      - run: HTML=world-editor.html node tests/v405-look.cjs
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v405-browser.cjs
      - run: node tests/v405-regression.cjs
