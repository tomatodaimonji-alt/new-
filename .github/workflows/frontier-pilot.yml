name: Frontier river, house and dialogue
on:
  push:
    branches: ['dot/workshop-frontier-v363']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/v363-frontier-geometry.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v363-frontier-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-landscape-screens
          path: frontier-shots
