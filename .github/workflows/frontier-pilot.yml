name: Frontier street and tree refinements
on:
  push:
    branches: ['dot/workshop-frontier-v367']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/v367-frontier-geometry.cjs world-editor.html
      - run: |
          node tests/v367-frontage.cjs world-editor.html
          node tests/v367-houses.cjs world-editor.html
          node tests/v367-fence.cjs world-editor.html
          node tests/v367-trees.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v367-frontier-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-landscape-screens
          path: frontier-shots
