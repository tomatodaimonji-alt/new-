name: Verify exact v328 food satiety versus HP
on:
  push:
    branches: [dot/workshop-player-food-satiety-v328]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "0d6e5c43965fc8a90138be4af57076058852057c"
      - run: node tests/player-food-satiety.test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/healing-cast-browser.mjs world-editor.html
