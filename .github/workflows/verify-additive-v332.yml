name: Verify exact v332 spare terrain
on:
  push:
    branches: [dot/workshop-stream-ground-v332]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "78fed308a8815309d7edd9881c4da207c7abd05f"
      - run: git show HEAD^:world-editor.html > /tmp/v331.html && BASELINE=/tmp/v331.html HTML=world-editor.html node tests/additive-v332.test.cjs
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/additive-v332-browser.mjs world-editor.html
