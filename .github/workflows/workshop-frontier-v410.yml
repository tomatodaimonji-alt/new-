name: Validate Frontier night watch and foliage
on:
  push:
    branches: ['dot/workshop-frontier-v410-qa']
jobs:
  night-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: node tests/v410-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v410-browser.cjs
