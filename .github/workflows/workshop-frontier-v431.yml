name: Workshop frontier v431
on:
  push:
    branches: [dot/workshop-frontier-v431-qa]
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v431-south.cjs world-editor.html && node tests/v431-enemy.cjs world-editor.html && node tests/v431-expedition.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v431-browser.cjs
