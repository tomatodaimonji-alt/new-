name: Orvas real footplant hairline proof
on:
  push:
    branches: ['dot/workshop-david-discovery-qa']
permissions:
  contents: read
jobs:
  feet:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 332b694d1310c17845a7aeef92deac8356f4e5c7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact deeper arena candidate
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = 9854592ed243431332f40b55e829dfd85e63376c
          mkdir -p .qa/tests
          cat >.qa/build.py <<'SOURCE'
          from pathlib import Path
          import sys
          src,out=map(Path,sys.argv[1:]);s=src.read_bytes()
          def r(a,b):
           global s
           if isinstance(a,str):a=a.encode()
           if isinstance(b,str):b=b.encode()
           assert s.count(a)==1,(a,s.count(a))
           s=s.replace(a,b,1)
          assert b'function poiOrvasTraceGround(' in s
          t=b'function poiDavidFootFeedback(o,s,b,now){'
          r(t,Path(__file__).with_name('walk.js').read_bytes()+t)
          t="poiDavidHeavyContact('foot',{sx:x,sz:z,y:b.y},now,b);"
          r(t,t+chr(10)+" if(typeof poiOrvasFootPlant==='function')poiOrvasFootPlant(o,s,b,count,now);")
          t="if(typeof poiDrawDavidFissure==='function')poiDrawDavidFissure(now,p.vp);"
          r(t,t+chr(10)+" if(typeof poiDrawOrvasWalkFissures==='function')poiDrawOrvasWalkFissures(now,p.vp);")
          out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(s)
          SOURCE
          cat >.qa/walk.js <<'SOURCE'
          // BEGIN ORVAS WALK FISSURES
          const POI_ORVAS_FOOT_MARK_MS=680,POI_ORVAS_FOOT_MARK_LIMIT=3;
          const poiOrvasFootMarks=[];
          function poiOrvasFootDrop(mark){
           if(mark?.gpu&&typeof gl!=='undefined')gl.deleteBuffer(mark.gpu.buf);
          }
          function poiOrvasFootPlant(o,s,b,count,now){
           const d=s?.david;
           if(!d?.wakeDone||d.returning||d.attack||d.leapAbort||!b||b.y!==poiWalkLevel||
              !poiEnemyThreatEnabled()||poiDavidHidden()||!poiDavidMatch(o)||
              typeof poiOrvasTraceGround!=='function'||typeof poiDavidRig!=='function')return false;
           const p=poiAimOrigin(now),pose=poiMonsterPose(o,s,now),v=pose.david;
           if(!v||!poiDavidIn(b,p)||Math.hypot(p.x-(pose.x-.5),p.z-(pose.z-.5))>11)return false;
           // At each distance boundary the swing foot just reached the ground:
           // count 1 is the first (left) foot, count 2 the other, then alternate.
           const side=(count-1)&1,foot=poiDavidRig(v).feet[side],heading=pose.heading;
           if(!foot||!Number.isFinite(heading))return false;
           const c=Math.cos(heading),sine=Math.sin(heading);
           const x=pose.x-.5+c*foot[0]-sine*foot[2],z=pose.z-.5+sine*foot[0]+c*foot[2];
           if(!poiDavidIn(b,{x,z,y:b.y}))return false;
           const e={x,z,sx:x,sz:z,y:b.y,start:now,radius:.56,owner:facilitySite,map:world,side,count};
           const q={},ground=poiOrvasTraceGround(q,e,b),m=mesh();
           if(!ground(x,z))return false;
           const tile=q.orvasGroundFloors?.get(Math.floor(x+.5)+','+Math.floor(z+.5));
           const material=ground.material?.(x,z)??(/grass|moss/i.test(tile)?'grass':/earth|soil|sand/i.test(tile)?'soil':'stone');
           const ink=material==='grass'?[.16,.124,.073]:material==='soil'?[.155,.102,.064]:[.116,.098,.079];
           const seam=material==='stone'?[.188,.162,.138]:ink;
           // Two short irregular ground lines with only one small secondary
           // fork. These are marks, not raised blocks or attack warning meshes.
           const base=heading+(side?.41:-.32)+.19*Math.sin(count*2.36);
           const point=(a,l)=>[x+Math.cos(base+a)*l,z+Math.sin(base+a)*l];
           const limb=(a,b,width,color)=>poiOrvasHairline(m,ground,...a,...b,width,color);
           const mid=point(.12,.213),tip=point(-.075,.486),other=point(2.47,.336);
           limb([x,z],mid,.016,ink);limb(mid,tip,.010,ink);limb([x,z],other,.011,seam);
           limb(mid,[mid[0]+.092*Math.cos(base+1.02),mid[1]+.092*Math.sin(base+1.02)],.007,seam);
           if(!m.p.length)return false;
           if(poiOrvasFootMarks.length>=POI_ORVAS_FOOT_MARK_LIMIT)poiOrvasFootDrop(poiOrvasFootMarks.shift());
           poiOrvasFootMarks.push({...e,m,gpu:null});
           return true;
          }
          function poiDrawOrvasWalkFissures(now,vp){
           if(!poiOrvasFootMarks.length)return;
           for(let i=poiOrvasFootMarks.length-1;i>=0;i--){
            const e=poiOrvasFootMarks[i];
            if(!poiWalkActive||e.owner!==facilitySite||e.map!==world||e.y!==poiWalkLevel||now-e.start>=POI_ORVAS_FOOT_MARK_MS){
             poiOrvasFootDrop(e);poiOrvasFootMarks.splice(i,1);
            }
           }
           if(!poiOrvasFootMarks.length)return;
           gl.enable(gl.BLEND);gl.blendFunc(gl.CONSTANT_ALPHA,gl.ONE_MINUS_CONSTANT_ALPHA);gl.depthMask(false);
           try{
            for(const e of poiOrvasFootMarks){
             if(!e.gpu)e.gpu=upload(e.m);
             const alpha=.64*Math.min(1,(now-e.start+16)/54)*Math.max(0,1-(now-e.start)/POI_ORVAS_FOOT_MARK_MS)**1.25;
             gl.blendColor(0,0,0,alpha);draw(e.gpu,vp);
            }
           }finally{gl.depthMask(true);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.blendColor(0,0,0,0);gl.disable(gl.BLEND)}
          }
          // END ORVAS WALK FISSURES
          SOURCE
          cat >.qa/tests/orvas-walk-fissures.test.cjs <<'SOURCE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),test=require('node:test');
          const h=fs.readFileSync(process.env.HTML||'world-editor.html','utf8');
          const get=(a,b)=>{const i=h.indexOf(a),j=h.indexOf(b,i+1);return i>=0&&j>i?h.slice(i,j):''};
          function setup(){
           const c={foley:[],poiDavidHeavyContact:(kind,loc)=>c.foley.push([kind,loc.sx,loc.sz]),POI_DAVID_GAIT_STRIDE:1.78,
            poiWalkLevel:0,facilitySite:{id:'base'},world:[],poiEnemyThreatEnabled:()=>true,poiDavidHidden:()=>false,
            poiDavidMatch:o=>o.correct?c.b:null,poiDavidIn:(_b,p)=>p.x<=20.8,poiAimOrigin:()=>({x:20,z:20,y:0}),
            b:{y:0},obj:{correct:true,x:20,z:20,y:0},gl:{deleteBuffer(){}},poiMonsterActorPoint:()=>({x:20,z:20,t:0}),
            poiMonsterPose:()=>({x:20.5,z:20.5,heading:0,david:{walkDistance:2}}),poiDavidRig:()=>({feet:[[-.55,0,.27],[.48,0,-.19]]}),
            poiOrvasTraceGround:()=> (x,z)=>x<=20.8?[x+.5,.142,z+.5]:null,
            mesh:()=>({p:[],n:[],c:[]}),poiOrvasHairline:(m,g,x,z,nx,nz,width)=>{const a=g(x,z),b=g(nx,nz);if(a&&b)m.p.push(...a,...b,width)},
            step:{david:{wakeDone:true,gaitDistance:0},actorFree:{},moveStarted:90,guardMoveMs:310,x:20,z:20}};
           vm.createContext(c);vm.runInContext(get('// BEGIN ORVAS WALK FISSURES','// END ORVAS WALK FISSURES')+
            get('function poiDavidFootFeedback(', 'function poiDavidHeavyContact('),c);
           const f=(t,d)=>{c.step.david.gaitDistance=d;c.t=t;vm.runInContext('poiDavidFootFeedback(obj,step,b,t)',c)};
           const marks=()=>vm.runInContext('typeof poiOrvasFootMarks!=="undefined"?poiOrvasFootMarks:[]',c);
           return {f,marks,c};
          }
          test('one tiny mark follows each alternating real gait plant and does not change prior audible foot cue',()=>{
           const q=setup();
           q.f(100,0);q.f(145,1.0);assert.equal(q.marks().length,0);
           q.f(180,1.8);assert.equal(q.marks().length,1);assert.equal(q.marks()[0].x,19.45);
           q.f(205,1.85);assert.equal(q.marks().length,1);
           q.f(280,3.6);assert.equal(q.marks().length,2);assert.equal(q.marks()[1].x,20.48);
           assert.equal(q.c.foley.length,2);
          });
          test('awakening, stationary pose, attack, and retreat cannot emit; queue never grows above three',()=>{
           const q=setup();q.f(100,0);q.c.step.david.wakeDone=false;q.f(145,1.8);assert.equal(q.marks().length,0);
           q.c.step.david.wakeDone=true;q.c.step.david.returning=true;q.f(180,3.6);assert.equal(q.marks().length,0);
           q.c.step.david.returning=false;q.c.step.david.attack={};q.f(205,5.5);assert.equal(q.marks().length,0);
           q.c.step.david.attack=null;for(let i=4;i<13;i++)q.f(210+i*10,i*1.78+.02);
           assert.equal(q.marks().length,3);
           assert(q.marks().every(m=>m.m.p.length>0));
          });
          SOURCE
          cat >.qa/tests/orvas-walk-fissures-browser.mjs <<'SOURCE'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import vm from 'node:vm';
          const html=readFileSync(process.argv[2]??'world-editor.html','utf8');
          const key='  freeMovementPose:()=>({x:poiWalkViewX,z:poiWalkViewZ,level:poiWalkLevel}),';
          function inject(s,a,b){assert.equal(s.split(a).length,2,a);return s.replace(a,b)}
          let fixture=inject(html,key,key+`
            arenaQA:{
             manual:()=>{window.__arenaManual=true},
             draw:()=>render(),
             get:()=>{
              const m=[...poiMonsterStates].find(([o])=>o.type==='monsterStoneDavid'),s=m?.[1],d=s?.david,q=d?.attack;
              const renderPose=m?poiMonsterPose(m[0],s,performance.now()):null;
              const rig=renderPose?.david?poiDavidRig(renderPose.david):null;
              return {now:performance.now(),nextMob:poiNextMobTick,nextStep:poiWalkNextReady,arena:facilitySite.davidTemple.boss.room.arena,
                player:[poiWalkX,poiWalkZ,poiWalkLevel],pose:[poiWalkViewX,poiWalkViewZ],free:!!poiFreePose,hp:poiPlayerHP,boss:s?[s.x,s.z]:null,awake:!!d?.awake,wakeDone:!!d?.wakeDone,marks:poiOrvasFootMarks.map(m=>({x:m.x,z:m.z,y:m.y,start:m.start,side:m.side,count:m.count,n:m.gpu?.count??0,first:m.m.p.slice(0,18)})),rendered:window.__footProof??[],
                returning:!!d?.returning,renderPose:renderPose?{x:renderPose.x,y:renderPose.y,z:renderPose.z,david:renderPose.david}:null,
                rig:rig?{crouch:rig.leapCrouch??0,feet:rig.feet.map(p=>p[1])}:null,q:q?{kind:q.kind,start:q.start,cursor:q.cursor,dx:q.dx,dz:q.dz,sx:q.sx,sz:q.sz,leap:q.leap,hits:q.hits}:null,
                cue:window.__arenaCue??[],steps:window.__davidStepSources??[],shakes:window.__davidProjected??[],damage:window.__arenaDamage??[]};
             }
            },`);
          fixture=inject(fixture,' requestAnimationFrame(render);',' if(!window.__arenaManual)requestAnimationFrame(render);');
          fixture=inject(fixture,'function poiDavidMobFrame(o,s,now){','function poiDavidMobFrame(o,s,now){if(!window.__arenaManual)return false;');
          fixture=inject(fixture,'function poiWildRegionalFrame(now,rng){','function poiWildRegionalFrame(now,rng){return;');
          fixture=inject(fixture,'function poiWildPick(rng){','function poiWildPick(rng){return null;');
          fixture=inject(fixture,'draw(poiDavidCue.lane,vp)','draw(poiDavidCue.lane,vp);if(q.kind==="leap"){const a=window.__arenaCue??=[];if(a.length<70)a.push({start:q.start,vertices:poiDavidCue.lane.count,now})}');
          fixture=inject(fixture,' const priorHP=poiPlayerHP;',' const priorHP=poiPlayerHP;if(obj.type==="monsterStoneDavid")(window.__arenaDamage??=[]).push({start:poiDavidActive?.s?.david?.attack?.start,raw,amount,now});');
          fixture=inject(fixture,"  if(ctx?.state==='running')try{poiTryRecordedFoley('davidFootPlant',ctx.currentTime,gain,poiDavidTrackAttackFoley)}catch{}",`  if(ctx?.state==='running')try{
              poiTryRecordedFoley('davidFootPlant',ctx.currentTime,gain,(source,node)=>{
               poiDavidTrackAttackFoley(source,node);
               (window.__davidStepSources??=[]).push({now,gain,buffer:source.buffer.length,distance});
              });
             }catch{}`);
          fixture=inject(fixture," if(typeof poiDavidImpactVp==='function')p.vp=poiDavidImpactVp(p,now);",
           ` if(typeof poiDavidImpactVp==='function'){
            const old=p.vp;p.vp=poiDavidImpactVp(p,now);
            if(old!==p.vp){const e=poiDavidHeavyBump;(window.__davidProjected??=[]).push({now,start:e?.start,cap:e?.cap,dy:Math.abs(p.vp[13]-old[13])});}
           }`);
          fixture=inject(fixture,'gl.blendColor(0,0,0,alpha);draw(e.gpu,vp);','gl.blendColor(0,0,0,alpha);draw(e.gpu,vp);if(e.m&&Number.isInteger(e.side)&&(!window.__footProof?.some(p=>p.start===e.start)))(window.__footProof??=[]).push({start:e.start,x:e.x,z:e.z,n:e.gpu.count});');
          for(const [,js] of fixture.matchAll(/<script(?: [^>]*)?>([\s\S]*?)<\/script>/g))new vm.Script(js);
          if(process.env.DAVID_LAYOUT_ONLY==='1'){console.log('PASS exact browser fixture anchors and inline syntax');process.exit(0)}
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_PACKAGE??'playwright');
          const server=createServer((req,res)=>{res.setHeader('Content-Type','text/html; charset=utf-8');res.end(req.url==='/seed'?'<!doctype html><title>Temple arena QA</title>':fixture)});
          await new Promise(r=>server.listen(0,'127.0.0.1',r));const url='http://127.0.0.1:'+server.address().port;
          let browser,where='launch',p;
          const log=()=>p.evaluate(()=>window.__editorTest.arenaQA.get());
          const errors=[];
          try{
           browser=await chromium.launch({headless:true,...(process.env.CHROMIUM_EXECUTABLE?{executablePath:process.env.CHROMIUM_EXECUTABLE}:{}),
            args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
           p=await browser.newPage({viewport:{width:844,height:390},deviceScaleFactor:.7,isMobile:true,hasTouch:true});
           p.on('pageerror',e=>errors.push(e.message));
           await p.clock.install({time:new Date('2026-11-24T12:00:00Z')});
           where='cold authored save, distance six to wake';
           await p.goto(url+'/seed');
           await p.evaluate(()=>{
            localStorage.setItem('world-workshop-resume-v1',JSON.stringify({version:1,route:'facility',id:'base',play:true,
             position:{x:24,z:156,y:0,facing:0},townLayout:5,townMapHeight:182,templeDepth:1,
             view:{yaw:0,zoom:1.05,panX:0,panZ:0,level:0,hideUpper:false,top:false,third:false,orbitYaw:0,orbitPitch:.35,orbitDistance:5.5}}));
            localStorage.setItem('world-workshop-hotbar-v1','{"version":1,"weapon":"equipWoodSword","potions":0,"gold":0}');
           });
           await p.goto(url+'/?resume=1&test=1',{waitUntil:'domcontentloaded',timeout:25000});
           await p.locator('#pineStartupCover').waitFor({state:'hidden',timeout:23000});
           await p.waitForFunction(()=>window.__editorTest?.arenaQA&&window.__editorTest.facility().active,null,{timeout:12000});
           const initial=await log();
           assert.deepEqual(initial.player,[24,156,0]);assert.deepEqual(initial.boss,[24,158]);assert.equal(initial.hp,100);assert.deepEqual(initial.marks,[]);
           await p.evaluate(()=>window.__editorTest.arenaQA.manual());
           const wall=await p.evaluate(()=>Date.now());await p.clock.pauseAt(wall+1500);
           const advance=async(ms=48)=>{await p.clock.fastForward(ms);await p.evaluate(()=>window.__editorTest.arenaQA.draw());};
           const until=async(pred,n)=>{let s=await log();for(let i=0;i<n&&!pred(s);i++){await advance();s=await log()}assert(pred(s),JSON.stringify(s));return s};
           const aligned=await log(),debt=Math.ceil(aligned.nextMob-aligned.now);
           if(debt>0)await p.clock.fastForward(debt+16);
           where='trusted mobile gesture audio unlocks';
           await p.touchscreen.tap(450,185);
           where='awake normally and enter real distance-six chase band';
           let s=await until(s=>s.awake,45);assert.deepEqual(s.marks,[]);
           const retreat=async z=>{
            await p.keyboard.press('ArrowUp');
            let m=await until(q=>q.player[1]===z&&q.now>=q.nextStep,14);
            assert.deepEqual(m.player,[24,z,0]);return m;
           };
           // Keep the actual player at distance just over the settled sweep reach
           // but under the leap trigger, without forcing a trajectory or attack kind.
           for(let z=155;z>=152;z--){s=await retreat(z);assert.deepEqual(s.marks,[])}
           where='actual trusted retreat maintains distance band as boss physically chases';
           for(const [nextZ,bossZ] of [[151,157.36],[150,156.36]]){
            await until(s=>s.renderPose.z-.5<=bossZ,36);
            await retreat(nextZ);
           }
           const planted=await until(s=>s.rendered.length&&s.steps.length,42);
           const m=planted.marks.find(v=>v.start===planted.rendered[0].start);
           assert(m&&m.n>0&&m.n<=24&&m.y===0);
           assert(planted.steps.some(v=>v.now===m.start&&v.buffer===7440));
           assert(m.first.filter((_,i)=>i%3===1).every(h=>h>=0&&h<=.24));
           assert(Math.abs(m.x-24)>.18&&Math.abs(m.x-24)<.88,'mark follows foot, not centered plant sound');
           assert.equal(planted.hp,100);assert.equal(planted.damage.length,0);
           where='existing sweep occurs, then stationary animation leaves no phantom marks';
           const swung=await until(s=>s.q?.kind==='sweep',50);assert(swung.rendered.length>=1);
           const total=swung.rendered.length;
           await advance(420);const stable=await log();assert.equal(stable.rendered.length,total);
           await advance(340);assert(!(await log()).marks.some(v=>v.start===m.start));
           console.log('Actual Orvas gait drew one low planted-shoe fissure with matching original foot sound + bounded expiry',JSON.stringify({m,player:planted.player,sound:planted.steps[0]}));
           assert.deepEqual(errors,[]);
           console.log('PASS live David planted source + projected step/sweep contact; no phantom stationary sounds');
          }catch(e){console.error(where,await (p?log().catch(()=>null):null),errors);throw e}
          finally{await browser?.close();await new Promise(r=>server.close(r))}
          SOURCE
          python .qa/build.py world-editor.html .qa/world-editor.html
          test "$(git hash-object .qa/world-editor.html)" = 06d972d3d5dfabe10d88f9059e6f39814c6c8ec0
      - name: One ground event per genuine plant with existing feedback unchanged
        working-directory: .qa
        run: node --test tests/*.cjs
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - name: Trusted chase actual scene GPU footprint and existing foot sound
        working-directory: .qa
        run: node tests/orvas-walk-fissures-browser.mjs
