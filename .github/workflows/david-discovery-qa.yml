name: Fire Wand flare actual one-shot QA
on:
  push:
    branches: ['dot/workshop-david-discovery-qa']
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04c55894a275b66e3139e5c08986c2b29b506805
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact sound-only candidate
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = aa855e8ed66395458f8f431d03c24d53168a304e
          mkdir -p .qa/tests .qa/rendered
          cat >.qa/build.py <<'SOURCE'
          from pathlib import Path
          import base64,re,sys
          src,dst=map(Path,sys.argv[1:]);s=src.read_bytes()
          pcm=(Path(__file__).parent/'rendered/wandFlameLaunch.pcm').read_bytes()
          assert len(pcm)==8256
          b64=base64.b64encode(pcm)
          lines=b' +\n'.join(b"  '"+b64[i:i+120]+b"'" for i in range(0,len(b64),120))
          pattern=rb"\n wandFlameLaunch:\s*(?:'[A-Za-z0-9+/=]+'\s*(?:\+\s*)?)+(?=,)"
          s,n=re.subn(pattern,b'\n wandFlameLaunch:\n'+lines,s);assert n==1
          dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(s)
          SOURCE
          cat >.qa/tests/fire-wand-flare.test.cjs <<'SOURCE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),test=require('node:test');
          const html=fs.readFileSync(process.env.HTML||'world-editor.html','utf8');
          const asset=name=>{
           const m=html.match(new RegExp('\\n '+name+':\\s*((?:\'[A-Za-z0-9+/=]+\'\\s*(?:\\+\\s*)?)+)'));
           assert(m,name);
           return Buffer.from([...m[1].matchAll(/'([^']+)'/g)].map(x=>x[1]).join(''),'base64');
          };
          test('recorded fire wand is a short immediately voiced one-shot with smooth quiet tail and headroom',()=>{
           const b=asset('wandFlameLaunch'),n=b.length/2,a=Array.from({length:n},(_,i)=>b.readInt16LE(i*2)/32768);
           assert(n>=3360&&n<=4800,'140–200 ms only, no sustained torch');
           const rms=(s,e)=>Math.sqrt(a.slice(s,e).reduce((sum,x)=>sum+x*x,0)/(e-s));
           assert(Math.abs(a[0])<=1/32768&&Math.abs(a.at(-1))<=1/32768,'clickless endpoints');
           const max=Math.max(...a.map(Math.abs));
           assert(max>=.22&&max<=.60,'one shot peak .22–.60 before normal mixer');
           const peak=a.findIndex(x=>Math.abs(x)>=max);
           assert(peak<1680,'body arrives within first 70ms');
           assert(rms(120,n*.30|0)>=.045,'audible body before the short decay');
           assert(rms(n-480,n)<rms(120,n*.30|0)*.09,'last 20ms not a hiss');
           assert(html.includes("poiTryRecordedFoley('wandFlameLaunch',now,.52)"),'same launch routing and mixing');
          });
          SOURCE
          cat >.qa/tests/real-david-fire-foley.test.cjs <<'SOURCE'
          const a=require('node:assert/strict'),{test}=require('node:test'),vm=require('node:vm'),fs=require('node:fs'),crypto=require('node:crypto');
          const h=fs.readFileSync(process.env.HTML||'world-editor.html','utf8');
          const exact=(first,last)=>{const x=h.indexOf(first),y=h.indexOf(last,x+first.length);a(x>=0&&y>x,first);return h.slice(x,y)};
          test('all metal/flame masters are embedded exactly once with bounded 24kHz mono duration and clean tails',()=>{
           const table=vm.runInNewContext(exact('const POI_RECORDED_FOLEY={','const poiRecordedFoleyCache')+';POI_RECORDED_FOLEY');
           const items={
            davidBladeSweep:[9600,'d2460f6fe00ae14e4f6fb7ce908f45cfcb12f47739a07bdd9da21d6ced7dc59a'],
            davidSwordFirst:[6480,'26c5aff60be181dad9bbcabffe29d2d3e33fb4dda6490ceb5a09e3924a00cfcd'],
            davidSwordSecond:[8400,'465cfa3222349c9f04f711225a9e03eb5a53e0466143eacf32501013489e5655'],
            davidHeavyStomp:[27600,'b393593ad1d31dafb370fc06413a7a96f64240936ff0fb006066c91f2c46dde8'],
            davidLeapStomp:[35040,'9232ab36dc816826bf640724486ca6f8fa090eb5b6733a12390d31b6d0962317'],
            wandFlameLaunch:[4128,'5d4cdb5dd4abd03069a825a73fb6ef88ffdc2cb46570f1c398befd996db9b81a']
           };
           for(const [key,[len,sha]] of Object.entries(items)){
            const bytes=Buffer.from(table[key]||'','base64');
            a.equal(bytes.length,len*2,key);a.equal(crypto.createHash('sha256').update(bytes).digest('hex'),sha,key);
            a.equal(bytes.readInt16LE(0),0);a.equal(bytes.readInt16LE(bytes.length-2),0);
            const samples=[];for(let i=0;i<len;i++)samples.push(bytes.readInt16LE(i*2)/32768);
            const peak=samples.reduce((n,v)=>Math.max(n,Math.abs(v)),0);
            a(key==='wandFlameLaunch'?peak>.45&&peak<.47:peak>.66&&peak<(key==='davidLeapStomp'?.83:.81),key+' peak');
           }
          });
          test('real accepted wand cast starts one short flare sound even without contact; cooldown, unpaid, muted and hidden casts do not duplicate it',()=>{
           let now=1000,charges=2,events=[],shots=0,visible=true;
           const c={console,performance:{now:()=>now},document:{get hidden(){return !visible},querySelector:()=>null},poiWalkActive:true,poiInventoryAllowed:()=>true,
            poiPlayerWeaponProfile:()=>({ready:610}),poiPlayerWeaponPending:null,poiAttackReady:0,poiWalkX:24,poiWalkZ:100,poiWalkLevel:0,poiWalkFacing:0,
            poiPlayerWeaponFlightBegin:()=>{shots++},poiWalkAvatar:()=>{},poiAudioEnabled:true,poiAudioAllowed:()=>true,poiAudioStart:()=>{},
            poiAudioContext:{state:'running',currentTime:3},poiAudioLevels:{master:1,se:1},POI_WEAPON_SE:{},facilitySite:{id:'base'},
            poiTryRecordedFoley:(...args)=>events.push(args),
            poiInventorySpendFireWand:()=>charges>0?(charges--,true):false};
           const cast=vm.runInNewContext(exact('function poiSound(','function poiAudioSyncLifecycle')+exact('function poiPlayerCastFireWand(','function poiPlayerFlightMs(')+';poiPlayerCastFireWand',c);
           a.equal(cast(0).ok,true);a.equal(cast(0).reason,'cooldown');
           a.deepEqual(events,[['wandFlameLaunch',3,.52]]);a.equal(shots,1);
           now=1800;visible=false;a.equal(cast(0).reason,'unavailable');a.equal(charges,1);
           visible=true;c.poiAudioLevels.se=0;a.equal(cast(0).ok,true);
           now=2500;a.equal(cast(0).reason,'storage');
           a.equal(shots,2);a.equal(events.length,1);a.equal(charges,0);
          });
          SOURCE
          cat >.qa/tests/fire-wand-flare-browser.mjs <<'SOURCE'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import {Script} from 'node:vm';
          const source=readFileSync(process.argv[2]??'world-editor.html','utf8');
          const a='  freeMovementPose:()=>({x:poiWalkViewX,z:poiWalkViewZ,level:poiWalkLevel}),';assert.equal(source.split(a).length,2);
          let html=source.replace(a,a+`
           wandUiQA:{
            move:(from,to)=>poiInventoryMove(from,to),
            audio:()=>({events:window.__flareEvents??[],state:poiAudioContext?.state,isLive:!!window.__flareSource&&poiAudioTransient.has(window.__flareSource)}),
            view:()=>({
             armed:poiArmedWandIndex(),weapon:poiHotbarRead().weapon,held:window.__wandWorldType,
             mesh:poiWalkMesh?.count??0,charges:poiInventorySlots(poiHotbarRead()).map(c=>c?.charges??null)
            })
           },
          `);
          const mesh='function poiBuildPlayerMesh(weapon,pose,gear,stride=0,r=0,x=0,y=0,z=0,heading=null,worldSpear=false){';
          assert.equal(html.split(mesh).length,2);html=html.replace(mesh,mesh+'if(worldSpear)window.__wandWorldType=weapon;');
          const audioStart=' poiAudioTransient.add(source);source.start(when);source.stop(when+(cap??(buffer.duration+.012)));';
          assert.equal(html.split(audioStart).length,2);
          html=html.replace(audioStart,audioStart+`
           if(buffer===poiRecordedFoleyCache.get('wandFlameLaunch')){
            const data=buffer.getChannelData(0),peak=data.reduce((m,x)=>Math.max(m,Math.abs(x)),0);
            window.__flareSource=source;
            (window.__flareEvents??=[]).push({length:buffer.length,duration:buffer.duration,rate:buffer.sampleRate,channels:buffer.numberOfChannels,
             loop:source.loop,cap,volume,peak});
           }
          `);
          for(const m of html.matchAll(/<script(?: [^>]*)?>([\s\S]*?)<\/script>/g))new Script(m[1]);
          if(process.env.WAND_UI_LAYOUT_ONLY==='1'){console.log('wand cursor browser fixture parses exact source');process.exit(0)}
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_PACKAGE??'playwright');
          const server=createServer((req,res)=>{res.setHeader('Content-Type','text/html; charset=utf-8');res.end(req.url==='/seed'?'<title>temporary QA</title>':html)});
          await new Promise((y,n)=>server.listen(0,'127.0.0.1',y).once('error',n));
          const origin='http://127.0.0.1:'+server.address().port;let browser;
          try{
           browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
           const page=await(await browser.newContext({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:.75})).newPage();
           const errors=[];page.on('pageerror',e=>errors.push(e.message));
           await page.goto(origin+'/seed');
           await page.evaluate(()=>{
            const slots=Array(27).fill(null);slots[0]={type:'equipWoodSword',count:1,durability:90};slots[4]={type:'fireWand',count:1,charges:1};slots[6]={type:'fireWand',count:1,charges:2};
            localStorage.setItem('world-workshop-hotbar-v1',JSON.stringify({version:1,weaponDurabilityVersion:2,weapon:'equipWoodSword',potions:0,gold:0,slots}));
            localStorage.setItem('world-workshop-resume-v1',JSON.stringify({version:1,route:'facility',id:'base',play:true,position:{x:24,z:91,y:0,facing:0},
             townLayout:5,townMapHeight:128,view:{yaw:0,zoom:1.05,panX:0,panZ:0,level:0,hideUpper:false,top:false,third:false,orbitYaw:0,orbitPitch:.35,orbitDistance:5.5}}));
           });
           await page.goto(origin+'/?resume=1&test=1',{waitUntil:'domcontentloaded'});
           await page.locator('#pineStartupCover').waitFor({state:'hidden'});
           await page.waitForFunction(()=>window.__editorTest?.wandUiQA);
           const view=()=>page.evaluate(()=>window.__editorTest.wandUiQA.view());
           const button=i=>page.locator('#poiHotbar [data-hotbar-slot="'+i+'"]');
           const selected=async(slot)=>assert.deepEqual(await page.locator('#poiHotbar [aria-pressed="true"]').evaluateAll(xs=>xs.map(x=>x.dataset.hotbarSlot)),slot===null?[]:[String(slot)]);
           await selected(0);assert.equal((await view()).held,'equipWoodSword');
           await button(4).tap();await selected(4);let q=await view();
           assert(q.mesh>0);assert.equal(q.armed,4);assert.equal(q.held,'fireWand');assert.equal(q.weapon,'equipWoodSword');
           await button(6).tap();await selected(6);q=await view();assert.equal(q.armed,6);assert.equal(q.held,'fireWand');
           assert((await page.evaluate(()=>window.__editorTest.wandUiQA.move(6,{zone:'hotbar',index:5}))).ok);
           await selected(5);q=await view();assert.equal(q.armed,5);assert.equal(q.charges[5],2);assert.equal(q.charges[4],1);
           assert((await page.evaluate(()=>window.__editorTest.wandUiQA.move(5,{zone:'bag',index:0}))).ok);
           await selected(null);q=await view();assert.equal(q.armed,9);assert.equal(q.held,'fireWand');
           await button(4).tap();await selected(4);
           const events=()=>page.evaluate(()=>window.__editorTest.wandUiQA.audio());
           assert.equal((await events()).events.length,0);
           await page.locator('#poiWalkAction').tap();await selected(0);
           await page.waitForFunction(()=>window.__editorTest.wandUiQA.audio().events.length===1);
           const audio=await events(),e=audio.events[0];assert.equal(audio.state,'running');
           assert.deepEqual([e.rate,e.length,e.channels,e.loop,e.cap,e.volume],[24000,4128,1,false,null,.52]);
           assert(Math.abs(e.duration-.172)<1e-6&&e.peak<=.461);
           await page.waitForFunction(()=>!window.__editorTest.wandUiQA.audio().isLive);
           assert.equal((await events()).events.length,1);
           q=await view();assert.equal(q.armed,null);assert.equal(q.charges[4],null);assert.equal(q.charges[9],2);
           await page.waitForFunction(()=>window.__editorTest.wandUiQA.view().held==='equipWoodSword');
           await button(0).tap();await selected(0);
           assert.deepEqual(errors,[]);
           console.log('Native Fire Wand physical cast, one real 172-ms no-loop audio buffer, ended source cleanup and exactly one charge.');
          }finally{await browser?.close();await new Promise(y=>server.close(y))}
          SOURCE
          base64 -d >.qa/rendered/wandFlameLaunch.pcm <<'PCM'
          
          PCM
          python .qa/build.py world-editor.html .qa/world-editor.html
          test "$(git hash-object .qa/world-editor.html)" = 58981ed357f7a05d6f14e28c25442f5d449cbda5
      - name: Run scoped units
        working-directory: .qa
        run: node --test tests/*.cjs
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - name: Touch arm and cast, exactly one real PCM source then cleanup
        working-directory: .qa
        run: node tests/fire-wand-flare-browser.mjs
