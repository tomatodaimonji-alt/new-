name: David committed finish and torso geometry QA
on:
  push:
    branches: ['dot/workshop-david-discovery-qa']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [david-death-finish, david-large-hurtbox]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab24cd7fc7bb709a5a8496f7fc7ecf939323aaf8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact independent candidate
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = 3355eac7bc93889420bc35b469ae7e1377f054e4
          mkdir -p .qa/a .qa/b .qa/tests
          cat >.qa/b/build.py <<'SOURCE'
          from pathlib import Path
          import sys
          src,dst=map(Path,sys.argv[1:]);s=src.read_text()
          def rep(a,b):
           global s
           assert s.count(a)==1,(a,s.count(a))
           s=s.replace(a,b,1)
          a='function poiDavidDeathFrame(now){';b='function poiDavidMobFrame(o,s,now){'
          rep(s[s.index(a):s.index(b)],Path(__file__).with_name('death.js').read_text())
          rep('function poiDavidCease(o,s,b,now){\n const d=s.david;\n if(!d?.awake||d.returning)return;',
          '''function poiDavidCease(o,s,b,now){
           const d=s.david;
           if(!d?.awake||d.returning||d.deathFinish)return;''')
          rep(' if(typeof poiDavidFootFeedback', ''' if(d.deathFinish){
            // A menu or mode switch may clear the defeat sequence early.
            if(typeof poiPlayerDying==='function'&&poiPlayerDying())return false;
            d.deathFinish=null;poiDavidCease(o,s,b,now);return false;
           }
           if(typeof poiDavidFootFeedback''')
          rep('if(!poiPlayerDeathBegin(now)){','if(!poiPlayerDeathBegin(now,obj)){')
          rep('function poiPlayerDeathBegin(now){','function poiPlayerDeathBegin(now,killer){')
          rep(" if(typeof poiDavidDeathFrame==='function')poiDavidDeathFrame(now);",
              " if(typeof poiDavidDeathFrame==='function')poiDavidDeathFrame(now,killer);")
          rep('const active=q&&b&&s.hp>0&&poiEnemyThreatEnabled()&&poiWalkLevel===q.y',
              'const finishing=!!s?.david?.deathFinish,active=q&&b&&s.hp>0&&(poiEnemyThreatEnabled()||finishing)&&poiWalkLevel===q.y')
          rep(' const sw=q.sweep,tell=sw&&sw.start===null&&age>=110,emission=poiDavidBeamEmission(q,now);',
              ' const sw=q.sweep,tell=sw&&sw.start===null&&age>=110,emission=poiDavidBeamEmission(q,now);\n if(finishing&&!emission)return;')
          rep('  const {lane}=poiDavidCueGeometry(q,b);','  const {lane}=finishing?{lane:{p:[]}}:poiDavidCueGeometry(q,b);')
          rep('  if(tell){\n   if(poiDavidCue.fan===undefined)', '  if(finishing){ /* The residue is the existing depth-tested beam, not a warning. */ }\n  else if(tell){\n   if(poiDavidCue.fan===undefined)')
          dst.parent.mkdir(parents=True,exist_ok=True);dst.write_text(s)
          SOURCE
          cat >.qa/b/death.js <<'SOURCE'
          function poiDavidDeathFrame(now,killer){
           const live=poiDavidActive,b=live&&poiDavidMatch(live.o);
           if(!live||!b||live.s.hp<=0||poiMonsterStates.get(live.o)!==live.s)return;
           const {o,s}=live,d=s.david,q=d?.attack;
           // Called synchronously by the defeat initializer, before the lethal
           // strike's enclosing branch returns. Only that actual source qualifies.
           if(killer===o&&q?.cursor>0&&!d.returning){
            d.deathFinish={until:Math.min(q.until,now+POI_DEATH_PAUSE)};
            if(q.kind==='beam'&&q.sweep?.start===null){
             // A follow-up turn that has not begun is a future attack, not a pose.
             q.sweep=null;q.until=now+POI_DAVID_PATTERNS.beam.rest;
             d.deathFinish.until=q.until;
            }
            if(typeof poiAimLocked!=='undefined'&&poiAimLocked?.id===o)poiCombatLockReset();
           }
           if(d?.deathFinish){
            if(q&&now<d.deathFinish.until){
             // Only the renderer's cursor advances. No hit, companion contact,
             // ground effect, strike audio, regeneration, or AI choice occurs here.
             while(q.cursor<q.hits.length&&now>=q.hits[q.cursor]){
              q.lastContactAt=q.hits[q.cursor++];
             }
             const sw=q.sweep;
             if(sw?.start!=null&&!sw.done){
              const at=Math.min(now,sw.end);
              sw.angle=sw.side*POI_DAVID_BEAM_ARC*(at-sw.start)/POI_DAVID_BEAM_SWEEP;
              if(at===sw.end){sw.done=true;sw.endedAt=now;poiDavidBeamAudioEnd(q)}
             }
             if(q.kind==='beam'&&!sw&&now-q.lastContactAt>=POI_DAVID_BEAM_SHORT)poiDavidBeamAudioEnd(q);
             return;
            }
            d.deathFinish=null;
           }
           poiDavidCease(o,s,b,now);
           if(s.david?.returning)poiDavidReturnFrame(o,s,b,now);
          }
          SOURCE
          cat >.qa/a/build.py <<'SOURCE'
          from pathlib import Path
          import sys
          src,dst=map(Path,sys.argv[1:]);s=src.read_text()
          def rep(a,b):
           global s
           assert s.count(a)==1,(a,s.count(a))
           s=s.replace(a,b,1)
          anchor='function poiAimTrace(shot,range,now){'
          rep(anchor,Path(__file__).with_name('body.js').read_text()+anchor)
          rep('let winner=null,best=Infinity;\n for(const c of poiAimTargetList(o,range,now)){\n  const t=',
          '''let winner=null,best=Infinity,bodyPoint=null;
           for(const c of poiAimTargetList(o,range,now)){
            const body=typeof poiLargeMeleeBody==='function'?poiLargeMeleeBody(c,shot,now):null;
            if(body){
             for(const b of body){
              const t=poiLargeMeleeRay(o,d,b,range);
              if(t===null||t>=best||t>limit+POI_AIM_EPS)continue;
              winner=c;best=t;bodyPoint={x:o.x+d.x*t+.5,z:o.z+d.z*t+.5,y:b.y};
             }
             continue;
            }
            const t=''')
          rep('{winner=c;best=t}\n }\n return winner?', '{winner=c;best=t;bodyPoint=null}\n }\n return winner?')
          rep('forward:(winner.x-o.x)*d.x+(winner.z-o.z)*d.z,monster:', 'forward:bodyPoint?best:(winner.x-o.x)*d.x+(winner.z-o.z)*d.z,monster:')
          rep('{spearPoint:{x:winner.x+.5','{spearPoint:bodyPoint??{x:winner.x+.5')
          rep('if(arc?!poiPlayerFrontArcContains(o,d,c,forward):!poiSwordSweepContains(o,d,c,forward))continue;',
          '''const body=typeof poiLargeMeleeBody==='function'?poiLargeMeleeBody(c,shot,now):null;
            if(body){if(body.some(b=>poiLargeMeleeSweep(o,d,b,forward,arc,pass)))hits.push(c);continue}
            if(arc?!poiPlayerFrontArcContains(o,d,c,forward):!poiSwordSweepContains(o,d,c,forward))continue;''')
          dst.parent.mkdir(parents=True,exist_ok=True);dst.write_text(s)
          SOURCE
          cat >.qa/a/body.js <<'SOURCE'
          // BEGIN OVERSIZED MELEE BODY
          function poiLargeMeleeBody(target,shot,now){
           // Null retains legacy center targeting. An empty array means the
           // authored body is above/below the actual held weapon contact plane.
           const type=target.id.type,w=shot.type;
           if(type!=='monsterStoneDavid'||w==='equipWoodBow'||w==='fireWand')return null;
           if(typeof poiDavidRig!=='function'||typeof poiMonsterPose!=='function')return null;
           const p=poiMonsterPose(target.id,target.state,now),r=poiDavidRig(p.david);
           const height=w==='equipWoodSpear'?.868:(typeof POI_WORLD_MELEE_CONTACT_HEIGHT!=='undefined'?POI_WORLD_MELEE_CONTACT_HEIGHT[w]:0)??.76;
           const y=terrainY(Math.floor(shot.aim.x+.5),Math.floor(shot.aim.z+.5))+shot.aim.y*1.4+(height||.76)-p.y;
           // Mesh ankle and knee prism centerline/radii in poiDavidGeometry.
           // Evaluate the visible low body at the contact height, never its held
           // swords, arms, or the empty space between the two legs.
           const body=[],angle=Number.isFinite(p.heading)?p.heading:null,c=Math.cos(angle??0),s=Math.sin(angle??0);
           const point=(a,b,lo,hi)=>{
            if(y<Math.min(a[1],b[1])||y>Math.max(a[1],b[1]))return;
            const t=(y-a[1])/(b[1]-a[1]);
            const u=a[0]+(b[0]-a[0])*t,v=a[2]+(b[2]-a[2])*t;
            const [x,z]=angle===null?(typeof rot2==='function'?rot2(u,v,target.state.facing||0):[u,v]):[u*c-v*s,u*s+v*c];
            // Inscribed ground disk rather than filling the corners of stone.
            body.push({x:p.x-.5+x,z:p.z-.5+z,y:p.y+y,r:lo+(hi-lo)*t});
           };
           for(let i=0;i<2;i++){
            const f=r.feet[i],k=r.knees[i],side=i?1:-1;
            const ankle=[f[0],f[1]+.24,f[2]-.14],hip=[side*.406+.09,2.29+side*.045,-.018];
            const bend=typeof poiDavidLeapBodyY==='function'?poiDavidLeapBodyY:(y=>y);
            const fit=([x,y,z])=>[x,bend(y,r.leapCrouch),z];
            point(fit([f[0],f[1]+.03,f[2]]),fit(ankle),.25,.23);
            point(fit(ankle),fit(k),.205,.235);
            point(fit(k),fit(hip),.235,.29);
           }
           return body;
          }
          function poiLargeMeleeRay(o,d,b,range){
           const x=b.x-o.x,z=b.z-o.z,t=x*d.x+z*d.z,side=x*d.z-z*d.x;
           const delta=b.r*b.r-side*side;
           if(delta<-POI_AIM_EPS)return null;
           const depth=Math.sqrt(Math.max(0,delta));
           if(t+depth<POI_AIM_EPS)return null;
           const hit=Math.max(0,t-depth);
           return hit<=range+POI_AIM_EPS?hit:null;
          }
          function poiLargeMeleeSweep(o,d,b,range,arc,pass){
           const x=b.x-o.x,z=b.z-o.z,u=x*d.x+z*d.z,v=x*d.z-z*d.x;
           let a=Math.max(arc?0:POI_AIM_EPS,u),side=v;
           if(arc){
            if(u<0)side=Math.max(-range,Math.min(range,v));
            else{const k=Math.min(1,range/(Math.hypot(a,side)||1));a*=k;side*=k}
           }else{a=Math.min(a,range);side=Math.max(-POI_SWORD_HALF_WIDTH,Math.min(POI_SWORD_HALF_WIDTH,v))}
           if((u-a)**2+(v-side)**2>b.r*b.r+POI_AIM_EPS)return false;
           const px=a*d.x+side*d.z,pz=a*d.z-side*d.x,len=Math.hypot(px,pz),ray=poiAimUnit(px,pz);
           // Check the actual overlapping part, not the actor's center behind it.
           return len<=POI_AIM_EPS||poiAimWallLimit(o,ray,len,pass)+POI_AIM_EPS>=len;
          }
          // END OVERSIZED MELEE BODY
          SOURCE
          cat >.qa/tests/david-death-finish-browser.mjs <<'SOURCE'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import {Script} from 'node:vm';
          let h=readFileSync(process.argv[2]??'world-editor.html','utf8');
          const install=(a,b)=>{assert.equal(h.split(a).length,2,a);h=h.replace(a,b)};
          const mark="if(facilityParams.get('test')==='1')window.__editorTest={";

          install(' const r=poiDavidRig(pose),P=v=>',' const r=poiDavidRig(pose);if(window.__finish)window.__finish.draw={pose,right:r.hands[1],left:r.hands[0]};const P=v=>');
          install(" let kind=POI_DAVID_ORDER[d.cycle%POI_DAVID_ORDER.length];"," if(window.__finishManual)return false;\n let kind=POI_DAVID_ORDER[d.cycle%POI_DAVID_ORDER.length];");
          install(mark,`
           window.__finish={
            frame:()=>render(),
            prepare:hp=>{
             const {o,s}=poiDavidActive??{};
             if(!s?.david?.wakeDone||s.david.attack)return false;
             poiPlayerHP=hp;
             return poiDavidBegin(o,s,performance.now(),'double');
            },
            state:()=>{
             const live=poiDavidActive,s=live?.s,d=s?.david,q=d?.attack;
             return {now:performance.now(),d:d&&{wake:d.wakeDone,next:d.next,returning:!!d.returning,finish:!!d.deathFinish},
              q:q&&{cursor:q.cursor,landed:q.landed,executed:q.executed,hits:q.hits,until:q.until},
              death:poiPlayerDeathSnapshot(),draw:window.__finish.draw,hp:poiPlayerHP,boss:s?[s.x,s.z]:null};
            }
           }; `+mark);
          install(' requestAnimationFrame(render);',' if(!window.__finishManual)requestAnimationFrame(render);');
          for(const [,js] of h.matchAll(/<script(?: [^>]*)?>([\s\S]*?)<\/script>/g))new Script(js);
          if(process.env.DAVID_DEATH_FINISH_PARSE_ONLY){console.log('Exact death-finish browser fixture parses');process.exit(0)}
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_PACKAGE??'playwright');
          const srv=createServer((q,r)=>{r.setHeader('Content-Type','text/html; charset=utf-8');r.end(q.url==='/seed'?'<title>Seed</title>':h)});
          await new Promise(r=>srv.listen(0,'127.0.0.1',r));
          const root='http://127.0.0.1:'+srv.address().port;let browser;
          try{
           browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
           for(const lethal of [false,true]){
            const ctx=await browser.newContext({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:.65});
            const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));p.setDefaultTimeout(20000);
            await p.clock.install({time:new Date('2026-04-01T10:00:00Z')});
            await p.goto(root+'/seed');await p.evaluate(()=>localStorage.setItem('world-workshop-resume-v1',JSON.stringify({
             version:1,route:'facility',id:'base',play:true,position:{x:24,z:102,y:0,facing:2},townLayout:5,townMapHeight:128,
             view:{yaw:0,zoom:1.05,panX:0,panZ:0,level:0,hideUpper:false,top:false,third:false,orbitYaw:0,orbitPitch:.24,orbitDistance:5.5}
            })));
            await p.goto(root+'/?resume=1&test=1',{waitUntil:'domcontentloaded'});await p.locator('#pineStartupCover').waitFor({state:'hidden'});
            await p.clock.pauseAt(await p.evaluate(()=>Date.now()+150));
            await p.evaluate(()=>{window.__finishManual=true});

            const qa=()=>p.evaluate(()=>window.__finish.state());
            const frame=async(ms=40)=>{await p.clock.fastForward(ms);await p.evaluate(()=>window.__finish.frame());};
            const until=async(check,limit=95)=>{let q=await qa();for(let i=0;i<limit&&!check(q);i++){await frame();q=await qa()}assert(check(q),JSON.stringify(q));return q};
            await until(s=>s.d?.wake&&s.now>=s.d.next);
            assert(await p.evaluate(hp=>window.__finish.prepare(hp),lethal?1:100),JSON.stringify(await qa()));
            if(!lethal){
             const live=await until(s=>s.q?.executed===2);
             assert(live.hp>0&&live.hp<100&&!live.death&&!live.d.finish&&live.q.landed===2,JSON.stringify(live));
             assert.deepEqual(errors,[]);await ctx.close();continue;
            }
            const dead=await until(s=>s.death?.phase==='pause');
            assert.equal(dead.hp,0);assert(dead.q?.cursor===1&&dead.q.executed===1&&dead.d.finish&&!dead.d.returning,JSON.stringify(dead));
            const after=await until(s=>s.q?.cursor===2&&s.draw?.pose?.contact===2);
            assert.equal(after.hp,0);assert.equal(after.q.executed,1);assert.equal(after.q.landed,1);
            assert.notDeepEqual(after.draw.right,dead.draw.right);
            assert.equal(after.death.opacity,0);
            await until(s=>!s.d?.finish&&(!s.q));
            const respawn=await until(s=>s.death?.relocated);
            assert(respawn.hp>0&&respawn.death.blackAt-dead.death.start>=1650);
            assert.deepEqual(errors,[]);
            console.log('Actual lethal blade, rendered second blade without another hit, then original return and defeated-player respawn');
            await ctx.close();
           }
          }finally{await browser?.close();await new Promise(r=>srv.close(r))}
          SOURCE
          cat >.qa/tests/david-death-finish.test.cjs <<'SOURCE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),test=require('node:test');
          const h=fs.readFileSync(process.env.PRODUCT||'world-editor.html','utf8');
          function slice(a,b){const i=h.indexOf(a),j=h.indexOf(b,i+1);assert(i>=0&&j>i,a);return h.slice(i,j)}
          const rules=slice('function poiDavidBeamEmission(', 'function poiDavidBeamAdvance(')+slice('function poiDavidCease(', 'function poiDavidArrive(')+slice('function poiDavidDeathFrame(', 'function poiDavidMobFrame(')+slice('function poiDavidPose(', 'function poiDavidIncoming(');
          function setup(kind='double',killer=true,sw=null){
           const q={kind,start:0,hits:kind==='double'?[720,1040]:[720],cursor:1,executed:1,landed:1,lastContactAt:720,until:1730,sweep:sw};
           const d={awake:true,wakeDone:true,dx:1,dz:0,attack:q,trail:[{x:4,z:4}]};
           const o={type:'monsterStoneDavid'},s={david:d,x:3,z:4,hp:100,moveStarted:0},b={x:4,z:4};
           const ctx=vm.createContext({q,d,s,o,b,killer:killer?o:{type:'monsterSlime'},poiDavidActive:{o,s},poiDavidMatch:()=>b,poiMonsterStates:new Map([[o,s]]),poiMonsterMeshDirty:false,
            POI_DEATH_PAUSE:1200,POI_DAVID_PATTERNS:{beam:{rest:760}},POI_DAVID_BEAM_SHORT:180,POI_DAVID_BEAM_SWEEP:680,POI_DAVID_BEAM_ARC:1,
            poiDavidBeamRay:()=>({x:1,z:0}),poiDavidLeapPose:()=>null,poiDavidLeapAbort:()=>{},
            poiDavidReturnFrame:()=>{ctx.returned=(ctx.returned||0)+1},poiDavidArrive:()=>{},poiDavidBeamAudioEnd:(q)=>{if(!q.beamClosed){q.beamClosed=true;ctx.ended=(ctx.ended||0)+1}},
            poiPlayerDying:()=>true});
           vm.runInContext(rules,ctx);return {ctx,q,s,d,at:js=>vm.runInContext(js,ctx)};
          }
          test('first fatal double contact retains real second blade pose and causes no more resolved contacts',()=>{
           const {q,d,at,ctx}=setup();
           at('poiDavidDeathFrame(720,killer);poiDavidCease(o,s,b,720)');
           assert.equal(at('poiDavidPose(s,740).phase'),'impact');
           assert(!d.returning);
           at('poiDavidDeathFrame(900)');assert.equal(at('poiDavidPose(s,900).phase'),'windup');
           at('poiDavidDeathFrame(1040)');assert.equal(at('poiDavidPose(s,1040).phase'),'impact');
           assert.equal(q.cursor,2);assert.equal(q.executed,1);assert.equal(q.landed,1);
           at('poiDavidDeathFrame(1350)');assert.equal(at('poiDavidPose(s,1350).phase'),'recover');assert(!ctx.returned);
           at('poiDavidDeathFrame(1730)');assert.equal(d.attack,null);assert(d.returning);assert.equal(ctx.returned,1);
          });
          test('only David as actual lethal source may remain visually active',()=>{
           const {d,at}=setup('stomp',false);at('poiDavidDeathFrame(720,killer)');
           assert.equal(d.attack,null);assert(d.returning);
          });
          test('beam already sweeping finishes visually, tell for not-yet-started sweep is discarded',()=>{
           const {q,at,ctx}=setup('beam',true,{side:1,tell:500,start:650,end:1330,angle:.1,done:false});
           at('poiDavidDeathFrame(720,killer);poiDavidDeathFrame(1100)');
           assert(q.sweep.angle>.5&&at('poiDavidBeamEmission(q,1100).turning'));
           at('poiDavidDeathFrame(1330);poiDavidDeathFrame(1340)');assert.equal(ctx.ended,1);
           assert.equal(at('poiDavidPose(s,1340).phase'),'recover');assert.equal(q.executed,1);
           const p=setup('beam',true,{tell:720,start:null});
           p.at('poiDavidDeathFrame(720,killer)');assert.equal(p.q.sweep,null);
           assert.equal(p.at('poiDavidBeamEmission(q,800).turning'),false);
          });
