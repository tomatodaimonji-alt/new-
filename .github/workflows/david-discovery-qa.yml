name: Orvas natural stone shatter actual lethal proof
on:
  push:
    branches: ['dot/workshop-david-discovery-qa']
permissions:
  contents: read
jobs:
  shatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab19e14057396356908558450c7f2c2f5ba84c8a
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact candidate
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = ae8350f7ad6130af38f489c4a803f4cd9769d9d6
          mkdir -p .qa/tests .qa/rendered
          cat >.qa/build.py <<'SOURCE'
          from pathlib import Path
          import base64,re,sys
          src,dst=map(Path,sys.argv[1:]);s=src.read_bytes();here=Path(__file__).parent
          def rep(a,b):
           global s
           if isinstance(a,str):a=a.encode()
           if isinstance(b,str):b=b.encode()
           assert s.count(a)==1,(a,s.count(a))
           s=s.replace(a,b,1)
          pcm=(here/'rendered/orvasStoneShatter.pcm').read_bytes()
          assert len(pcm)==30720
          b64=base64.b64encode(pcm)
          lines=b' +\n'.join(b"  '"+b64[i:i+120]+b"'" for i in range(0,len(b64),120))
          rep(b'const POI_RECORDED_FOLEY={\n',b'const POI_RECORDED_FOLEY={\n orvasStoneShatter:\n'+lines+b',\n')
          rep("function poiDavidStoneHitFoley(o,s,now){","""function poiOrvasShatterFoley(o,s,now){
           if(!poiWalkActive||!poiAudioEnabled||!poiAudioAllowed()||poiAudioLevels.master<=0||poiAudioLevels.se<=0)return false;
           const b=poiDavidMatch(o);
           if(!b||poiWalkLevel!==b.y)return false;
           const p=poiAimOrigin(now),distance=Math.hypot(s.x-p.x,s.z-p.z);
           if(distance>17)return false;
           const gain=.73*Math.max(.26,1-Math.max(0,distance-2)*.050)*(poiDavidLine(s,p,b)?1:.36);
           poiAudioStart();const ctx=poiAudioContext;
           if(ctx?.state!=='running')return false;
           // Only the existing one-shot transient register owns this clip. The
           // boss's encounter attack teardown must not cut its ground contacts.
           try{return poiTryRecordedFoley('orvasStoneShatter',ctx.currentTime,gain)}catch{return false}
          }
          function poiDavidStoneHitFoley(o,s,now){""")
          rep("  if(state.hp<before)poiDavidStoneHitFoley(obj,state,now);","  if(state.hp>0&&state.hp<before)poiDavidStoneHitFoley(obj,state,now);")
          rep(" if(!state.hp){\n  const debris=poiMonsterBreak(obj,state,now);"," if(!state.hp&&(!stone||before>0)){\n  const debris=poiMonsterBreak(obj,state,now);")
          anchor='function poiMonsterBreak(obj,state,now,random=Math.random,actorEffect=null){'
          rep(anchor,(here/'shatter.js').read_bytes()+anchor.encode()+b"""
           const boss=!actorEffect&&state.hp===0&&typeof poiOrvasBreak==='function'&&typeof poiDavidMatch==='function'?poiDavidMatch(obj):null;
           if(boss)return poiOrvasBreak(obj,boss,poiMonsterPose(obj,state,now),state,now,random);
          """)
          rep(" const ease=1-Math.pow(1-t,1.65);\n for(const c of e.parts){\n  const a=c.yaw*ease,",
          """ for(const c of e.parts){
            const u=e.orvasStone?Math.min(1,t/c.settleT):t;
            const ease=1-Math.pow(1-u,1.65);
            const a=c.yaw*ease,""")
          rep("const lift=4*t*(1-t)*c.lift+Math.max(0,Math.sin((t-.66)*Math.PI/.34))*c.bounce*(t>.66?1:0);",
          "const lift=4*u*(1-u)*c.lift+Math.max(0,Math.sin((u-.66)*Math.PI/.34))*c.bounce*(u>.66?1:0);")
          rep("  const my=start+(c.centerY-start)*t+lift;","  const my=start+(c.centerY-start)*(e.orvasStone?u*u:u)+lift;")
          dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(s)
          SOURCE
          cat >.qa/shatter.js <<'SOURCE'
          // BEGIN ORVAS SHATTER GEOMETRY
          function poiOrvasChip(i,scale){
           const m=mesh(),ring=[],edge=[],sides=5+i%3,h=scale*(.23+(i%4)*.065);
           for(let k=0;k<sides;k++){
            const a=k*2*Math.PI/sides+(i*.47),r=scale*(.76+.24*Math.sin(k*1.7+i+.08));
            ring.push([r*Math.cos(a),0,r*Math.sin(a)*(.76+i%3*.07)]);
            edge.push([r*Math.cos(a)*.61,h*(.72+.28*Math.cos(k+i)),r*Math.sin(a)*.55]);
           }
           const tint=.47+i%5*.022,top=[tint+.09,tint+.068,tint+.015],shade=[tint-.065,tint-.077,tint-.10];
           for(let k=0;k<sides;k++){
            const j=(k+1)%sides,c=k%2?[tint+.015,tint,tint-.043]:shade;
            tri(m,ring[k],edge[k],edge[j],c);tri(m,ring[k],edge[j],ring[j],c);
            tri(m,edge[j],edge[k],[.03*scale,h,0],top);
           }
           return m;
          }
          function poiOrvasBreak(o,b,pose,state,now,rng){
           const ox=pose.x-.5,oz=pose.z-.5,groundAt=(x,z)=>terrainY(x,z)+(facilitySite?o.y*1.4:0);
           const x0=Math.floor(pose.x),z0=Math.floor(pose.z),pass=poiAimWall({y:o.y}),cache=new Map();
           const valid=(x,z)=>{
            const k=x+','+z;
            if(!cache.has(k))cache.set(k,validPos(x,z)&&poiDavidIn(b,{x,z,y:o.y})&&
             !(o.y===0&&facilityCreekIndex?.water.has(k))&&poiWalkCanStep(x,z));
            return cache.get(k);
           };
           const sections=[],startAngle=rng()*Math.PI*2;
           for(let i=0;i<13;i++){
            const heavy=i<4,scale=heavy?.29+(i%3)*.047:.089+i%4*.036;
            const spread=(heavy?.78+i*.24:1.32+(i%5)*.28)+(rng()-.5)*.16,angle=startAngle+i*2.399963+(rng()-.5)*.24;
            let dx=0,dz=0,landed=false;
            for(const [bend,ratio] of [[0,1],[.41,1],[-.55,1],[1.14,1],[-1.33,1],[2.27,.92],[-2.36,.76],[0,.56],[2.83,.52],[0,0]]){
             const d={x:Math.cos(angle+bend),z:Math.sin(angle+bend)},r=spread*ratio;
             const x=pose.x+r*d.x,z=pose.z+r*d.z,pad=scale*.77;
             if(r>0&&poiAimWallLimit({x:ox,z:oz},d,r,pass)+POI_AIM_EPS<r)continue;
             let clear=true;
             // Check a padded path, not just the destination. Do not scatter into
             // exterior sky, closed adjacent rooms or across blocked elevations.
             for(let k=1;k<=4&&clear;k++){
              const u=k/4,cx=pose.x+(x-pose.x)*u,cz=pose.z+(z-pose.z)*u;
              for(const sx of [-pad,pad])for(const sz of [-pad,pad]){
               const ix=Math.floor(cx+sx),iz=Math.floor(cz+sz);
               if(!valid(ix,iz)||Math.abs(groundAt(ix,iz)-groundAt(x0,z0))>.38)clear=false;
              }
             }
             if(!clear||sections.some(p=>Math.hypot(r*d.x-p.dx,r*d.z-p.dz)<(scale+p.size)*.62))continue;
             dx=x-pose.x;dz=z-pose.z;landed=true;break;
            }
            if(!landed)continue;
            const part=poiOrvasChip(i,scale),tilt=(rng()-.5)*(heavy?.44:.75),tc=Math.cos(tilt),ts=Math.sin(tilt);
            let bottom=Infinity;
            const cy=heavy?.81+(i%4)*.46:.22+(i%6)*.29;
            // Expand around three original silhouette heights, without any upward
            // ballistic impulse. Endpoints are flattened, not full statue limbs.
            for(let j=0;j<part.p.length;j+=3){
             part.p[j+1]+=cy;
             bottom=Math.min(bottom,part.p[j]*ts+(part.p[j+1]-cy)*tc);
            }
            const ground=groundAt(Math.floor(pose.x+dx),Math.floor(pose.z+dz)),restScale=.91+i%3*.037;
            sections.push({part,cx:0,cy,cz:0,fromX:dx*.065,fromZ:dz*.065,dx,dz,ground,centerY:ground+.011-bottom*restScale,
             restScale,yaw:(i%2?1:-1)*(.65+i%4*.5),tilt,lift:.012+i%4*.012,bounce:.011+i%3*.009,settleT:(heavy?.49:.36)+i%5*.084,size:scale});
           }
           const floor=groundAt(x0,z0);
           const effect={...pose,y:Math.max(floor,Math.min(pose.y,floor+.90)),type:o.type,parts:sections,start:now,floor:o.y,
            facing:0,settled:null,orvasStone:true,hitFlashAt:state.hitFlashAt};
           if(poiMonsterBreaks.length>=POI_MONSTER_BREAK_LIMIT)poiMonsterBreaks.shift();
           poiMonsterBreaks.push(effect);poiMonsterMeshDirty=true;
           if(typeof poiOrvasShatterFoley==='function')poiOrvasShatterFoley(o,state,now);
           return effect;
          }
          // END ORVAS SHATTER GEOMETRY
          SOURCE
          cat >.qa/tests/orvas-stone-death-browser.mjs <<'SOURCE'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import {Script} from 'node:vm';
          let h=readFileSync(process.argv[2]??'world-editor.html','utf8');
          const install=(a,b)=>{assert.equal(h.split(a).length,2,a);h=h.replace(a,b)};
          const mark="if(facilityParams.get('test')==='1')window.__editorTest={";

          install(" let kind=POI_DAVID_ORDER[d.cycle%POI_DAVID_ORDER.length];"," if(window.__finishManual)return false;\n let kind=POI_DAVID_ORDER[d.cycle%POI_DAVID_ORDER.length];");
          install(mark,`
           window.__finish={
            frame:()=>render(),
            place:()=>{
             const {o,s}=poiDavidActive,now=performance.now(),p=poiMonsterPose(o,s,now,true);
             const origin={x:p.x-.5+1.42,z:p.z-.5-.20,y:0};
             if(!workshopResumeRestorePosition({x:Math.round(origin.x),z:Math.round(origin.z),y:0,facing:3}))return null;
             poiFreePose={x:origin.x,z:origin.z,level:0,distance:0,walking:false,angle:Math.PI/2};
             poiWalkFacing=3;poiCombatLockReset();
             return origin;
            },
            setHP:(hp)=>{poiDavidActive.s.hp=hp},
            state:()=>{
             const [o,s]=[...poiMonsterStates].find(([o])=>o.type==='monsterStoneDavid')||[],p=o&&poiMonsterPose(o,s,performance.now(),true);
             const a=poiAimOrigin(performance.now()),slot=poiInventorySlots(poiHotbarRead())[0];
             const effect=poiMonsterBreaks.find(e=>e.orvasStone),kit=poiHotbarRead();
             return {fx:effect&&{count:effect.parts.length,x:effect.x,z:effect.z,floor:effect.floor,settled:effect.settled?.p.length??0,
               radius:effect.parts.map(a=>Math.hypot(a.dx,a.dz)),lift:effect.parts.map(a=>a.lift),ground:effect.parts.map(p=>[effect.x+p.dx,p.ground,effect.z+p.dz])},
              voice:window.__stoneEvents??[],voiceActive:!!window.__stoneSource&&poiAudioTransient.has(window.__stoneSource),
              drops:kit.armedDrops??[],dead:kit.dungeonPopulation?.dead?.['davidTemple.david'],
              attackReady:poiAttackReady,now:performance.now(),ready:s?.david?.wakeDone,weapon:poiEquippedWeapon(),hp:s?.hp,
              pending:!!poiPlayerWeaponPending,action:poiWalkActionStarted,durability:slot?.durability,
              a,p:p&&{x:p.x-.5,z:p.z-.5,heading:p.heading}};
            }
           };`+mark);
          install(' requestAnimationFrame(render);',' if(!window.__finishManual)requestAnimationFrame(render);');
          const voice=' poiAudioTransient.add(source);source.start(when);source.stop(when+(cap??(buffer.duration+.012)));';
          install(voice,voice+`
           const clip=[...poiRecordedFoleyCache].find(([,v])=>v===buffer)?.[0];
           if(clip==='orvasStoneShatter'||clip==='davidRockHit'||clip==='defeat'){
            (window.__stoneEvents??=[]).push({clip,n:buffer.length,rate:buffer.sampleRate,loop:source.loop,volume,when});
            if(clip==='orvasStoneShatter')window.__stoneSource=source;
           }`);
          for(const [,js] of h.matchAll(/<script(?: [^>]*)?>([\s\S]*?)<\/script>/g))new Script(js);
          if(process.env.ORVAS_STONE_PARSE_ONLY){console.log('Exact giant-hurtbox browser fixture parses');process.exit(0)}
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_PACKAGE??'playwright');
          const srv=createServer((q,r)=>{r.setHeader('Content-Type','text/html; charset=utf-8');r.end(q.url==='/seed'?'<title>Seed</title>':h)});
          await new Promise(r=>srv.listen(0,'127.0.0.1',r));
          const root='http://127.0.0.1:'+srv.address().port;let browser;
          try{
           browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
           {
            const ctx=await browser.newContext({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:.65});
            const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));p.setDefaultTimeout(20000);
            await p.clock.install({time:new Date('2026-04-01T10:00:00Z')});
            await p.goto(root+'/seed');await p.evaluate(()=>{const slots=Array(27).fill(null);slots[0]={type:'kitchenKnife',count:1,durability:40};slots[1]={type:'equipWoodSword',count:1};
             localStorage.setItem('world-workshop-hotbar-v1',JSON.stringify({version:1,weaponDurabilityVersion:2,weapon:'kitchenKnife',potions:0,slots}));
             localStorage.setItem('world-workshop-resume-v1',JSON.stringify({
             version:1,route:'facility',id:'base',play:true,position:{x:24,z:102,y:0,facing:2},townLayout:5,townMapHeight:128,
             view:{yaw:0,zoom:1.05,panX:0,panZ:0,level:0,hideUpper:false,top:false,third:false,orbitYaw:0,orbitPitch:.24,orbitDistance:5.5}
            }));});
            await p.goto(root+'/?resume=1&test=1',{waitUntil:'domcontentloaded'});await p.locator('#pineStartupCover').waitFor({state:'hidden'});
            await p.clock.pauseAt(await p.evaluate(()=>Date.now()+150));
            await p.evaluate(()=>{window.__finishManual=true});


            const qa=()=>p.evaluate(()=>window.__finish.state());
            const frame=async(ms=40)=>{await p.clock.fastForward(ms);await p.evaluate(()=>window.__finish.frame());};
            const until=async(check,limit=95)=>{let q=await qa();for(let i=0;i<limit&&!check(q);i++){await frame();q=await qa()}assert(check(q),JSON.stringify(q));return q};
            await until(s=>s.ready);
            assert(await p.evaluate(()=>window.__finish.place()));
            await frame(20);
            const before=await qa();
            assert.equal(before.weapon,'kitchenKnife');
            assert(Math.hypot(before.a.x-before.p.x,before.a.z-before.p.z)>1.35,JSON.stringify(before));

            const tap=async()=>{
             const button=await p.locator('#poiWalkAction').boundingBox();assert(button);
             await p.touchscreen.tap(button.x+button.width/2,button.y+button.height/2);
            };
            await tap();
            const nick=await until(s=>s.action>before.action&&!s.pending,15);
            assert(nick.hp<before.hp&&nick.hp>0,JSON.stringify({before,nick}));
            assert.deepEqual(nick.voice.map(q=>q.clip),['davidRockHit']);
            assert(!nick.fx);
            await until(s=>s.now>=s.attackReady,20);
            await p.evaluate(()=>window.__finish.setHP(1));
            await tap();
            const killed=await until(s=>s.hp===0&&s.fx,25);
            assert.deepEqual(killed.voice.map(q=>q.clip),['davidRockHit','orvasStoneShatter']);
            assert.equal(killed.voice[1].n,15360);assert.equal(killed.voice[1].rate,24000);assert.equal(killed.voice[1].loop,false);
            assert(killed.voice[1].volume>0&&killed.voice[1].volume<=.73);
            assert(killed.fx.count>=11&&killed.fx.count<=13&&killed.fx.lift.every(y=>y<=.09)&&killed.fx.floor===0);
            assert(killed.fx.radius.filter(r=>r>1.35).length>=6);
            assert(killed.dead!==undefined);
            const loot=killed.drops.map(r=>r.type);
            for(const type of ['equipOrvasHead','equipOrvasGreatsword','equipOrvasTwinGreatswords'])assert(loot.includes(type));
            await until(s=>s.fx?.settled>100,25);
            await new Promise(r=>setTimeout(r,760));assert(!(await qa()).voiceActive);
            assert.equal((await qa()).voice.filter(q=>q.clip==='orvasStoneShatter').length,1);
            assert.deepEqual(errors,[]);
            console.log('Actual nonlethal→lethal authored Orvas; distinct natural PCM, low scattered settled mesh and durable loot',JSON.stringify({fx:killed.fx,drops:killed.drops,voice:killed.voice}));
            await ctx.close();
           }
          }finally{await browser?.close();await new Promise(r=>srv.close(r))}
          SOURCE
          cat >.qa/tests/orvas-stone-death.test.cjs <<'SOURCE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm'),test=require('node:test');
          const h=fs.readFileSync(process.env.HTML||'world-editor.html','utf8');
          function pick(a,b){const i=h.indexOf(a),j=h.indexOf(b,i+1);return i>=0&&j>i?h.slice(i,j):''}
          function shatter(wall=false,type='monsterStoneDavid',actorEffect=null){
           const orig={x:20.5,z:20.5,y:0};
           const p={p:[-.3,0,0,.3,.5,0,0,.2,.1],n:Array(9).fill(0),c:Array(9).fill(.5)};
           const c={facilitySite:{id:'base'},facilityCreekIndex:null,validPos:(x,z)=>x>=0&&z>=0,
            terrainY:()=>0,poiWalkCanStep:(x,z)=>!wall||x<=20,rot2:(x,z)=>[x,z],
            poiAimWall:()=> (x,z)=>!wall||x<=20,poiDavidMatch:o=>o.type==='monsterStoneDavid'?{y:0}:null,
            poiDavidIn:(_b,p)=>(!wall||p.x<20.5)&&p.y===0,poiMonsterPose:()=>orig,poiOrvasShatterFoley:()=>c.foley++,
            poiMonsterFragmentTemplate:()=>Array.from({length:6},(_,i)=>({part:p,cx:0,cy:.4,cz:0,heading:i,spin:2})),
            POI_MONSTER_BREAK_LIMIT:5,poiMonsterBreaks:[],poiMonsterMeshDirty:false,
            mesh:()=>({p:[],n:[],c:[]}),tri:(m,a,b,d,col)=>{m.p.push(...a,...b,...d);m.n.push(...Array(9).fill(0));m.c.push(...col,...col,...col);},foley:0,result:null};
           const code=pick('const POI_AIM_EPS=', 'function poiAimChooseLock')+
            pick('// BEGIN ORVAS SHATTER GEOMETRY','// END ORVAS SHATTER GEOMETRY')+pick('function poiMonsterBreak(', 'function poiMonsterClearBreaks(');
           Object.assign(c,{type,actorEffect});vm.createContext(c);
           const e=vm.runInContext(code+";poiMonsterBreak({type,x:20,z:20,y:0},{x:20,z:20,facing:0,hp:0},100,()=>.37,actorEffect)",c);
           return {e,c};
          }
          test('only the actual authored Orvas breaks into many small low stones with broad natural spacing',()=>{
           const {e,c}=shatter();
           assert(e?.orvasStone);
           assert(e.parts.length>=11&&e.parts.length<=15);
           assert(e.parts.every(p=>p.lift<=.09&&p.bounce<=.04&&p.ground===0&&p.centerY<.43));
           assert(e.parts.filter(p=>Math.hypot(p.dx,p.dz)>1.35).length>=6);
           assert(new Set(e.parts.map(p=>Math.floor(e.x+p.dx)+','+Math.floor(e.z+p.dz))).size>=8);
           assert.equal(c.foley,1);
           const ordinary=shatter(false,'monsterSlime');assert.equal(ordinary.e.parts.length,6);assert.equal(ordinary.c.foley,0);
           const actor=shatter(false,'monsterStoneDavid',{actor:'companion'});assert.equal(actor.e.parts.length,6);assert.equal(actor.c.foley,0);
          });
          test('not pushed through the first real wall or into another area',()=>{
           const {e,c}=shatter(true);
           assert(e.parts.length>=6);
           assert(e.parts.every(p=>e.x+p.dx<20.94));
           assert.equal(c.foley,1);
          });
          test('dedicated embedded heavy impact and irregular small floor contacts are bounded and distinct',()=>{
           const crypto=require('node:crypto'),m=h.match(/\n orvasStoneShatter:\s*((?:'[A-Za-z0-9+/=]+'\s*(?:\+\s*)?)+)/);
           assert(m);const pcm=Buffer.from([...m[1].matchAll(/'([^']+)'/g)].map(x=>x[1]).join(''),'base64');
           assert.equal(pcm.length,30720);
           assert.equal(crypto.createHash('sha256').update(pcm).digest('hex'),'1baf1fc978221f41547d63133e5162623d0720ff587c997d2daccb9839c376a1');
           const rms=(x,y)=>Math.sqrt(Array.from({length:y-x},(_,i)=>(pcm.readInt16LE(2*(x+i))/32768)**2).reduce((a,b)=>a+b)/(y-x));
           assert(rms(100,4500)>.06);
           for(const i of [4900,7100,9550,12150])assert(rms(i,i+1400)>.002);
           assert.equal(rms(14500,15360),0);
          });
