name: Contextual defeat checkpoint verification
on:
  push:
    branches: ['dot/workshop-david-discovery-qa']
permissions:
  contents: read
jobs:
  contextual:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 42ef0e3833439e67b6baff56ce840824c7c2e833
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact independent candidate
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = 7db83b92dbc97a49f1d31d040b8a92c0d671f195
          mkdir -p .qa/tests
          cat >.qa/build.py <<'SOURCE'
          from pathlib import Path
          import sys
          src,dst=map(Path,sys.argv[1:]);s=src.read_text()
          def rep(a,b):
           global s
           assert s.count(a)==1,(a,s.count(a))
           s=s.replace(a,b,1)
          a='function poiPlayerDeathSpawn(){';b='function poiPlayerDeathFrame(now){'
          rep(s[s.index(a):s.index(b)],Path(__file__).with_name('respawn.js').read_text())
          rep("if(facilitySite?.id!=='base'||!poiWalkActive||poiPlayerHP!==0||poiPlayerDeath)return false;","if(!facilitySite?.id||!poiWalkActive||poiPlayerHP!==0||poiPlayerDeath)return false;")
          rep("poiPlayerDeath={phase:'pause',start:now,blackAt:null,relocated:false,opacity:0};","poiPlayerDeath={phase:'pause',start:now,blackAt:null,relocated:false,opacity:0,checkpoint:poiDefeatContext()};")
          rep("function poiPlayerDeathSnapshot(){return poiPlayerDeath?{...poiPlayerDeath}:null}","function poiPlayerDeathSnapshot(){\n if(!poiPlayerDeath)return null;\n const {checkpoint,...snapshot}=poiPlayerDeath;return snapshot;\n}")
          rep("if(!poiWalkActive||facilitySite?.id!=='base'){poiPlayerDeathClear();return false}","if(!poiWalkActive||facilitySite!==d.checkpoint.site){poiPlayerDeathClear();return false}")
          rep("const spawn=poiPlayerDeathSpawn();level=0;$('level').value='0';","const spawn=poiPlayerDeathSpawn(d.checkpoint);level=spawn.y;$('level').value=String(level);")
          rep("poiWalkReset(spawn.x,spawn.z);poiCombatHud();workshopResumeWrite();","poiWalkReset(spawn.x,spawn.z,spawn.y,spawn.facing);poiCombatHud();workshopResumeWrite();")
          rep("function poiWalkReset(x,z){","function poiWalkReset(x,z,spawnY=0,spawnFacing=poiWalkFacing){")
          rep("if(facilitySite){$('app').classList.remove('facilityCellar');poiMonsterMeshDirty=true}\n poiWalkActionStarted","if(facilitySite){$('app').classList.toggle('facilityCellar',spawnY<0);poiMonsterMeshDirty=true}\n poiWalkActionStarted")
          rep("poiWalkLevel=0;poiWalkX=x;poiWalkZ=z;poiWalkFromX=x;", "poiWalkLevel=spawnY;poiWalkFacing=spawnFacing;poiWalkX=x;poiWalkZ=z;poiWalkFromX=x;")
          rep('dirty=true;cursorDirty=true;poiCreekAudioSync();poiWalkRoof();poiWalkAvatar();poiWalkCamera();poiWalkStatus();workshopResumeWrite();\n if(typeof poiDungeonArrive',"""dirty=true;cursorDirty=true;poiCreekAudioSync();poiWalkRoof();poiWalkAvatar();poiWalkCamera();poiWalkStatus();
           if(typeof poiDefeatRememberEntry==='function')poiDefeatRememberEntry(to.x,to.z,to.y,poiWalkFacing);
           workshopResumeWrite();
           if(typeof poiDungeonArrive""")
          rep('poiWalkLevel=next;level=next;'+chr(36)+"('level').value=String(level);dirty=true;cursorDirty=true;",'poiWalkLevel=next;level=next;'+chr(36)+"""('level').value=String(level);dirty=true;cursorDirty=true;
             if(prior*next<=0&&typeof poiDefeatRememberEntry==='function')poiDefeatRememberEntry(poiWalkX,poiWalkZ,next,poiWalkFacing);""")
          rep(' poiSnowPassSwitches++;',' if(!cold&&typeof poiDefeatRememberEntry===\'function\')poiDefeatRememberEntry(dest.x,dest.z,0,dest.facing);\n poiSnowPassSwitches++;')
          rep("{x:poiSpawnX,z:poiSpawnZ,y:0,facing:poiWalkFacing}:{x:poiWalkX,z:poiWalkZ,y:poiWalkLevel,facing:poiWalkFacing}):null,",
              "poiPlayerDeathSpawn(poiPlayerDeath.checkpoint):{x:poiWalkX,z:poiWalkZ,y:poiWalkLevel,facing:poiWalkFacing}):null,")
          rep("{region:'snowpass',regionHp:poiPlayerHP}:{}),\n  ...(facilitySite?.id==='base'?",
              "{region:'snowpass',regionHp:poiPlayerDeath?POI_PLAYER_MAX_HP:poiPlayerHP}:{}),\n  ...(facilitySite?.id==='base'?")
          dst.parent.mkdir(parents=True,exist_ok=True);dst.write_text(s)
          SOURCE
          cat >.qa/respawn.js <<'SOURCE'
          // BEGIN DEFEAT CHECKPOINTS
          let poiDefeatEntry=null;
          function poiDefeatArea(site,x,z,y){
           if(site?.id!=='base')return site?.id?'region:'+site.id:null;
           const realm=typeof poiDungeonTravelKey==='function'?poiDungeonTravelKey(site,x,z,y):null;
           if(realm)return realm;
           if(y<0&&site.mine&&poiDungeonPointIn(site.mine.bounds,x,z,y))return 'mine';
           if(y===0&&site.davidTemple?.retreat&&z>=(site.davidTemple.entrance?.z??site.davidTemple.retreat.z+1)&&typeof poiDavidTempleContains==='function'&&poiDavidTempleContains(site,x,z,y))return 'davidTemple';
           return 'home';
          }
          function poiDefeatRememberEntry(x,z,y,facing){
           const site=facilitySite,area=poiDefeatArea(site,x,z,y);
           poiDefeatEntry=area&&area!=='home'?{site,area,x,z,y,facing}:null;
          }
          function poiDefeatContext(){
           return {site:facilitySite,area:poiDefeatArea(facilitySite,poiWalkX,poiWalkZ,poiWalkLevel),facing:poiWalkFacing};
          }
          function poiDefeatCheckpoint(ctx){
           const {site,area,facing}=ctx,d=site[area];let p,face=facing;
           if(area?.startsWith('region:')){p=site.spawn;face=p?.facing??2}
           else if(area==='mine'){const s=site.mine.stairs;p={x:s?.x,z:s?.z-1,y:site.mine.bounds.y};face=0}
           else if(area==='davidTemple'){p=d.retreat;face=0}
           else if(area!=='home'){p=d?.dungeonStand;face=((p?.facing??2)+2)%4}
           else p=site.spawn??{x:poiSpawnX,z:poiSpawnZ};
           return p?{x:p.x,z:p.z,y:p.y??0,facing:face}:null;
          }
          function poiDefeatFind(pin,accept,max){
           if(!pin||!Number.isInteger(pin.x)||!Number.isInteger(pin.z)||!Number.isInteger(pin.y))return null;
           const prior=poiWalkLevel;
           try{
            poiWalkLevel=pin.y;
            for(let r=0;r<=max;r++)for(let dz=-r;dz<=r;dz++){
             const dx=r-Math.abs(dz);
             for(const x of dx?[pin.x-dx,pin.x+dx]:[pin.x]){
              const z=pin.z+dz;
              if(!validPos(x,z)||!accept(x,z,pin.y)||!poiWalkCanStep(x,z)||
                 (typeof poiOtherworldPortalAt==='function'&&poiOtherworldPortalAt(facilitySite,x,z,pin.y))||
                 world.some(o=>o.x===x&&o.z===z&&o.y===pin.y&&
                  (o.type==='guildStairUp'||o.type==='guildStairDown'||
                   (typeof poiWalkPassableDoor==='function'&&poiWalkPassableDoor(o.type)))))continue;
              return {...pin,x,z};
             }
            }
           }finally{poiWalkLevel=prior}
           return null;
          }
          // END DEFEAT CHECKPOINTS
          function poiPlayerDeathSpawn(ctx=poiDefeatContext()){
           const {site,area}=ctx,pin=poiDefeatCheckpoint(ctx),arrived=poiDefeatEntry?.site===site&&poiDefeatEntry.area===area?poiDefeatEntry:null;
           const home=(x,z,y)=>y===0&&(typeof poiWildZone!=='function'||poiWildZone(POI_SAFE_TOWN,x,z));
           const same=(x,z,y)=>area==='davidTemple'?
            y===0&&poiDefeatArea(site,x,z,y)==='home':
            area==='home'?home(x,z,y):poiDefeatArea(site,x,z,y)===area;
           // Never trust saved coordinates as an entrance. A genuine live ingress
           // is preferred in this map; cold resumes use its authored safe stand.
           const entry=arrived&&{x:arrived.x,z:arrived.z,y:arrived.y,facing:arrived.facing};
           const local=poiDefeatFind(entry,same,0)||poiDefeatFind(pin,same,area==='home'?20:6);
           if(local)return local;
           if(site.id==='base'){
            const base={...(site.spawn??{x:poiSpawnX,z:poiSpawnZ}),y:0,facing:ctx.facing};
            const safe=poiDefeatFind(base,home,20);
            if(safe)return safe;
            const fallback=poiDefeatFind(base,(_x,_z,y)=>y===0,32);
            if(fallback)return fallback;
           }
           // Do not cross a region boundary if even its entry was edited away.
           return poiDefeatFind(pin,()=>true,10)||
            {x:poiWalkX,z:poiWalkZ,y:poiWalkLevel,facing:ctx.facing};
          }
          SOURCE
          cat >.qa/tests/contextual-respawn.test.cjs <<'SOURCE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),test=require('node:test');
          const h=fs.readFileSync(process.env.PRODUCT||'world-editor.html','utf8');
          function piece(a,b){const x=h.indexOf(a),y=h.indexOf(b,x+1);assert(x>=0&&y>x,a);return h.slice(x,y)}
          const script=(h.includes('// BEGIN DEFEAT CHECKPOINTS')?piece('// BEGIN DEFEAT CHECKPOINTS','// END DEFEAT CHECKPOINTS'):'')+piece('function poiPlayerDeathSpawn(', 'function poiPlayerDeathFrame(');
          const setup=(x,z,y,region='base')=>{
           const site={id:region,spawn:{x:10,z:10},mine:{stairs:{x:20,z:20},bounds:{x1:16,x2:26,z1:15,z2:22,y:-1}},
            chapel:{dungeonStand:{x:40,z:39,y:-1,facing:2},bounds:{x1:36,x2:44,z1:34,z2:40,y:-1}},
            davidTemple:{boss:{},retreat:{x:28,z:30,y:0},bounds:{x1:24,x2:32,z1:32,z2:40,y:0}}};
           if(region!=='base')site.spawn={x:12,z:0};
           const c=vm.createContext({facilitySite:site,poiSpawnX:10,poiSpawnZ:10,poiWalkX:x,poiWalkZ:z,poiWalkLevel:y,poiWalkFacing:1,
           world:[{x:20,z:20,y:-1,type:'guildStairUp'}],POI_SAFE_TOWN:[],poiWildZone:(r,x,z)=>x<13&&z<13,validPos:(x,z)=>x>=0&&z>=0,
           poiWalkCanStep:(x,z)=>!c.block?.has(x+','+z),poiOtherworldPortalAt:(_s,x,z)=>x===40&&z===40,
           poiDungeonTravelKey:(s,x,z,y)=>poiPoint(s.chapel.bounds,x,z,y)?'chapel':null,
           poiDungeonPointIn:poiPoint,poiDavidTempleContains:(s,x,z,y)=>poiPoint(s.davidTemple.bounds,x,z,y)});
           vm.runInContext(script,c);
           return {c,spawn:()=>JSON.parse(vm.runInContext('JSON.stringify(poiPlayerDeathSpawn())',c))};
          };
          function poiPoint(b,x,z,y){return y===b.y&&x>=b.x1&&x<=b.x2&&z>=b.z1&&z<=b.z2}
          test('surface starts at home, mine stays inside, genuine other dungeon uses its own landing',()=>{
           assert.deepEqual(setup(82,60,0).spawn(),{x:10,z:10,y:0,facing:1});
           assert.deepEqual(setup(24,17,-1).spawn(),{x:20,z:19,y:-1,facing:0});
           assert.deepEqual(setup(40,35,-1).spawn(),{x:40,z:39,y:-1,facing:0});
          });
          test('snow cold restore resolves authored entry, David explicitly uses temple forecourt; HUD subregions remain ordinary outside',()=>{
           assert.deepEqual(setup(12,12,0,'snowpass').spawn(),{x:12,z:0,y:0,facing:2});
           assert.deepEqual(setup(28,36,0).spawn(),{x:28,z:30,y:0,facing:0});
          });
          test('occupied default looks nearby without using portal / wrong floor and does not mutate floor',()=>{
           const {c,spawn}=setup(40,35,-1);c.block=new Set(['40,39','40,38','39,39']);
           const p=spawn();assert.deepEqual(p,{x:41,z:39,y:-1,facing:0});assert.equal(c.poiWalkLevel,-1);
          });
          test('actual recorded entry supersedes authored fallback and stale different map entry is ignored',()=>{
           const {c,spawn}=setup(40,35,-1);
           vm.runInContext('poiDefeatRememberEntry(41,38,-1,3)',c);
           assert.deepEqual(spawn(),{x:41,z:38,y:-1,facing:3});
           c.facilitySite={...c.facilitySite};
           assert.deepEqual(spawn(),{x:40,z:39,y:-1,facing:0});
          });
          SOURCE
          cat >.qa/tests/contextual-respawn-browser.mjs <<'SOURCE'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import {Script} from 'node:vm';
          let h=readFileSync(process.argv[2]??'world-editor.html','utf8');
          const install=(a,b)=>{assert.equal(h.split(a).length,2,a);h=h.replace(a,b)};
          const mark="if(facilityParams.get('test')==='1')window.__editorTest={";


          install(mark,`
           window.__deathArea={
            frame:()=>render(),
            lethal:()=>{
             poiPlayerHP=1;
             return poiMobHitPlayer({type:'monsterSlime',y:poiWalkLevel},performance.now(),100);
            },
            state:()=>{
             const save=JSON.parse(localStorage.getItem('world-workshop-resume-v1'));
             return {now:performance.now(),p:[poiWalkX,poiWalkZ,poiWalkLevel,poiWalkFacing],id:facilitySite?.id,
              home:facilitySite?.spawn,snowPending:poiSnowPassPending,hp:poiPlayerHP,
              save,death:poiPlayerDeathSnapshot(),entered:poiDefeatEntry?.area??null};
            }
           }; `+mark);
          install(' requestAnimationFrame(render);',' if(!window.__finishManual)requestAnimationFrame(render);');
          for(const [,js] of h.matchAll(/<script(?: [^>]*)?>([\s\S]*?)<\/script>/g))new Script(js);
          if(process.env.DEFEAT_AREA_PARSE_ONLY){console.log('Exact defeat-area browser fixture parses');process.exit(0)}
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_PACKAGE??'playwright');
          const srv=createServer((q,r)=>{r.setHeader('Content-Type','text/html; charset=utf-8');r.end(q.url==='/seed'?'<title>Seed</title>':h)});
          await new Promise(r=>srv.listen(0,'127.0.0.1',r));
          const root='http://127.0.0.1:'+srv.address().port;let browser;
          try{
           browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
           for(const mode of ['home','mine','chapel','snow','snow-old','snow-corrupt']){
            const ctx=await browser.newContext({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:.65});
            const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));p.setDefaultTimeout(20000);
            await p.clock.install({time:new Date('2026-04-01T10:00:00Z')});
            const seeds={home:{x:115,z:66,y:0},mine:{x:116,z:63,y:0},chapel:{x:124,z:82,y:0},snow:{x:49,z:127,y:0},
             'snow-old':{x:12,z:5,y:0},'snow-corrupt':{x:88,z:77,y:0}};
            await p.goto(root+'/seed');await p.evaluate(({mode,position})=>localStorage.setItem('world-workshop-resume-v1',JSON.stringify({
             version:1,route:'facility',id:'base',play:true,position:{...position,facing:2},...(mode==='snow-old'||mode==='snow-corrupt'?{region:'snowpass',regionHp:100}:{}),townLayout:5,townMapHeight:128,
             view:{yaw:0,zoom:1.05,panX:0,panZ:0,level:0,hideUpper:false,top:false,third:false,orbitYaw:0,orbitPitch:.24,orbitDistance:5.5}
            })),{mode,position:seeds[mode]});
            await p.goto(root+'/?resume=1&test=1',{waitUntil:'domcontentloaded'});await p.locator('#pineStartupCover').waitFor({state:'hidden'});
            await p.clock.pauseAt(await p.evaluate(()=>Date.now()+150));
            await p.evaluate(()=>{window.__finishManual=true});


            const qa=()=>p.evaluate(()=>window.__deathArea.state()),frame=async(ms=120)=>{await p.clock.fastForward(ms);await p.evaluate(()=>window.__deathArea.frame());};
            const until=async(check,limit=25)=>{let q=await qa();for(let i=0;i<limit&&!check(q);i++){await frame();q=await qa()}assert(check(q),JSON.stringify(q));return q};
            const step=async key=>{await p.keyboard.press(key);for(let i=0;i<4;i++)await frame();return qa()};
            if(mode==='mine'){
             await step('ArrowUp');await until(q=>q.p[2]===-1);
             await step('ArrowUp');await step('ArrowUp');
            }
            if(mode==='chapel'){
             await step('ArrowUp');await until(q=>q.p[2]===-1);
             await step('ArrowUp');
            }
            if(mode==='snow'){
             await step('ArrowDown');await until(q=>q.id==='snowpass'&&!q.snowPending);await step('ArrowDown');await step('ArrowDown');
            }
            const before=await qa();assert.equal(before.id,mode==='snow'||mode==='snow-old'?'snowpass':'base',mode);
            if(mode==='snow')assert.equal(before.entered,'region:snowpass');
            if(mode==='mine'||mode==='chapel')assert.equal(before.entered,mode);
            if(mode==='snow-old'||mode==='snow-corrupt')assert.equal(before.entered,null);
            assert(await p.evaluate(()=>window.__deathArea.lethal()));
            const dead=await qa();assert.equal(dead.hp,0);assert.equal(dead.death?.opacity,0);
            const end=await until(s=>s.death?.relocated);
            const want=mode==='mine'?[116,61,-1]:mode==='chapel'?[78,88,-1]:
             mode==='snow'||mode==='snow-old'?[12,0,0]:[before.home.x,before.home.z,0];
            assert.deepEqual(end.p.slice(0,3),want,JSON.stringify({mode,before,end}));
            assert(end.hp>0&&end.death.blackAt-dead.death.start>=1650);
            assert.deepEqual([end.save.position.x,end.save.position.z,end.save.position.y],want);
            assert.equal(end.save.region,mode==='snow'||mode==='snow-old'?'snowpass':undefined);
            const cleared=await until(q=>!q.death);assert.deepEqual(cleared.p,end.p);
            assert.deepEqual(errors,[]);
            console.log('Actual contextual death',mode,JSON.stringify({from:before.p,to:end.p,region:end.save.region??null,delay:end.death.blackAt-dead.death.start}));
            await ctx.close();
           }
          }finally{await browser?.close();await new Promise(r=>srv.close(r))}
          SOURCE
          python .qa/build.py world-editor.html .qa/world-editor.html
          test "$(git hash-object .qa/world-editor.html)" = 986791495c5792553b237f4cbe624d25a58e028e
      - name: Run scoped units
        working-directory: .qa
        run: node --test tests/contextual-respawn.test.cjs
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - name: Actual death and real entries
        working-directory: .qa
        run: node tests/contextual-respawn-browser.mjs
