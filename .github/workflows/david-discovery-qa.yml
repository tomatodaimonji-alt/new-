          SOURCE
          python .qa/build.py world-editor.html .qa/world-editor.html
          python .qa/build.py world-editor.html .qa/radius/world-editor.html --radius-only
          test "$(git hash-object .qa/world-editor.html)" = 8b56dc19730d3b3a39c7d987478b66ef81246881
          test "$(git hash-object .qa/radius/world-editor.html)" = 0758d3785a1d7d742cddd5151fb44ceb25834810
          node --test .qa/tests/david-discovery.test.cjs
          (cd .qa/radius && node --test tests/*.cjs)
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - if: matrix.suite == 'discovery'
        run: node .qa/tests/david-discovery-browser.mjs .qa/world-editor.html
      - if: matrix.suite == 'radius-only'
        run: node tests/david-leap-browser.mjs .qa/radius/world-editor.html
