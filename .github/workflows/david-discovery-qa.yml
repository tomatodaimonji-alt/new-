name: Item picon genuine inventory acquisition
on:
  push:
    branches: ['dot/workshop-david-discovery-qa']
permissions:
  contents: read
jobs:
  pickup:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 66d930df1e8f9260abba51181cb103a9de2a707e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact standalone sound
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = 73a2280d35874eb2415438c3b7816c4ba15737ff
          mkdir -p .qa/tests .qa/rendered
          cat >.qa/build.py <<'SOURCE'
          from pathlib import Path
          import base64,re,sys
          src,dst=map(Path,sys.argv[1:]);s=src.read_bytes()
          pcm=(Path(__file__).parent/'rendered/itemPickup.pcm').read_bytes()
          assert len(pcm)==7440
          b64=base64.b64encode(pcm)
          lines=b' +\n'.join(b"  '"+b64[i:i+120]+b"'" for i in range(0,len(b64),120))
          pattern=rb"\n itemPickup:\s*(?:'[A-Za-z0-9+/=]+'\s*(?:\+\s*)?)+(?=,)"
          s,n=re.subn(pattern,b'\n itemPickup:\n'+lines,s);assert n==1
          dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(s)
          SOURCE
          cat >.qa/tests/recorded-interaction-foley.test.cjs <<'SOURCE'
          const test=require('node:test'),assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync(process.env.HTML||'world-editor.html','utf8');
          function harness(available=true){
           const calls=[];const env={calls,poiAudioLevels:{master:80,se:90},poiWalkActive:true,poiAudioEnabled:true,facilitySite:{id:'base'},
           poiAudioContext:{state:'running',currentTime:10},poiAudioEffects:{},poiAudioStart(){},poiAudioAllowed:()=>true,
           poiTryRecordedFoley:(...a)=>{calls.push(['recorded',...a]);return available},
           poiSurfaceFoley:k=>k,poiRecordedFoley:k=>k,poiKitchenKnifeBuffer:k=>'oldKnife:'+k,
           poiPlayImpactBuffer:(...a)=>calls.push(['buffer',...a]),poiAudioNoiseBurst:(...a)=>calls.push(['brush',...a]),
           poiAudioThud:(...a)=>calls.push(['thud',...a]),poiAudioTone:(...a)=>calls.push(['tone',...a])};
           const extract=(from,to)=>html.slice(html.indexOf(from),html.indexOf(to,html.indexOf(from)));
           vm.createContext(env);
           vm.runInContext(extract('const POI_WEAPON_SE=','function poiHealSound(')+extract('// BEGIN ITEM FOLEY','// END ITEM FOLEY')+
            extract('function poiSound(','function poiAudioSyncLifecycle('),env);
           const play=(...args)=>{calls.length=0;env.poiSound(...args);return calls.slice()};
           return {env,play};
          }
          test('wooden door entry and departure play separate recordings; stone and iron retain separate surface audio',()=>{
           const {play}=harness();
           assert.deepEqual(play('door-open','wood').map(x=>x.slice(0,2)),[['recorded','doorOpen']]);
           assert.deepEqual(play('door-close','wood').map(x=>x.slice(0,2)),[['recorded','doorClose']]);
           assert.deepEqual(play('door-open','stone').map(x=>x.slice(0,2)),[['buffer','door-open-stone']]);
           assert.deepEqual(play('door-close','iron').map(x=>x.slice(0,2)),[['buffer','door-close-iron']]);
          });
          test('only real metallic melee uses recorded attack air; bladed contact uses separate organic Foley; one actual contact can also cue defeat',()=>{
           const {play}=harness();
           for(const type of ['equipIronSword','kitchenKnife']){
            assert.deepEqual(play('attack',type).map(x=>x.slice(0,2)),[['recorded','playerSteelSwing']]);
            const hit=play('hit',type,true,true);
            assert.equal(hit[0][1],'playerSteelCut');assert.equal(hit[0][2],10);
            assert.deepEqual(hit[1].slice(0,2),['buffer','defeat']);
           }
           for(const type of ['equipStoneSword','equipBoneSword']){
            assert.ok(!play('attack',type).some(c=>c[0]==='recorded'),type);
            assert.deepEqual(play('hit',type,false,true),[['recorded','playerSteelCut',10,.57]],type);
           }
           for(const type of ['equipWoodSword','equipWoodSpear','equipStoneMace','equipClub'])
            assert.ok(![...play('attack',type),...play('hit',type)].some(c=>c[0]==='recorded'),type);
          });
          test('successful pickup and chest route to the shared picon without stealing the separate gold cue or mixer mute',()=>{
           const {env,play}=harness();
           assert.equal(play('item-pickup','ironOre')[0][2],10.068);
           assert.deepEqual(play('chest-pickup')[0].slice(0,3),['recorded','itemPickup',10]);
           assert.ok(play('item-pickup','coin').every(a=>a[0]!=='recorded'));
           assert.ok(play('item-pickup','gold').every(a=>a[0]!=='recorded'));
           assert.ok(play('enemy-loot','coin').some(a=>a[0]==='tone'));
           env.poiAudioLevels.se=0;for(const args of [['item-pickup'],['door-open'],['hit','equipIronSword']])assert.deepEqual(play(...args),[]);
          });
          test('absent optional recordings preserve door and weapon fallback while noncoin pickup has no oscillator',()=>{
           const {play}=harness(false);
           assert.deepEqual(play('door-open','wood').at(-1).slice(0,2),['buffer','door-open-wood']);
           assert.deepEqual(play('attack','kitchenKnife').at(-1).slice(0,2),['buffer','oldKnife:attack']);
           const item=play('item-pickup','healingHerb');
           assert.ok(item.filter(a=>a[0]==='brush').length>=2);
           assert.ok(!item.some(a=>a[0]==='tone'||a[0]==='thud'));
          });
          test('bundled recordings decode as 24kHz signed mono PCM on the existing cached buffer and effects path',()=>{
           const calls=[];
           const context={atob:s=>Buffer.from(s,'base64').toString('latin1'),poiAudioContext:{
            createBuffer:(channels,count,rate)=>{const data=new Float32Array(count);return {channels,count,rate,getChannelData:()=>data}}}, poiPlayImpactBuffer:(...args)=>calls.push(args)};
           const i=html.indexOf('const POI_RECORDED_FOLEY='),j=html.indexOf('function poiKitchenKnifePcm(',i);
           const meta=vm.runInNewContext(html.slice(i,j)+';({poiTryRecordedFoley,POI_RECORDED_FOLEY});',context);
           const foley=['doorOpen','doorClose','steelSwing','steelImpact','playerSteelSwing','playerSteelCut','itemPickup'];
           const found=foley.filter(id=>Object.hasOwn(meta.POI_RECORDED_FOLEY,id));
           if(process.env.REQUIRE_RECORDED_INTERACTION_FOLEY==='1')assert.deepEqual(found,foley,'shipping artifact must contain every verified recording');
           for(const id of [...found,'wood','defeat']){
            assert.equal(meta.poiTryRecordedFoley(id,2,.61),true);
            assert.equal(meta.poiTryRecordedFoley(id,3,.61),true);
            const [a,b]=calls.slice(-2),pcm=Buffer.from(meta.POI_RECORDED_FOLEY[id],'base64'),buf=a[0];
            assert.equal(a[0],b[0]);assert.equal(a[1],2);assert.equal(b[1],3);assert.equal(a[2],.61);
            assert.equal(buf.channels,1);assert.equal(buf.rate,24000);assert.equal(buf.count,pcm.length/2);
            const floats=buf.getChannelData(0);
            for(let k=0;k<floats.length;k++)assert.equal(floats[k],pcm.readInt16LE(k*2)/32768);
           }
           assert.equal(meta.poiTryRecordedFoley('noSuchRecording',0,.5),false);
          });
          SOURCE
          cat >.qa/tests/pickup-picon-browser.mjs <<'SOURCE'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import {Script} from 'node:vm';
          let h=readFileSync(process.argv[2]??'world-editor.html','utf8');
          const put=(a,b)=>{assert.equal(h.split(a).length,2,a);h=h.replace(a,b)};
          const key="if(facilityParams.get('test')==='1')window.__editorTest={";
          put(key,`
           window.__pickupPicon={
            ground:(type,x,z,fromX,fromZ,full=false)=>{
             if(!workshopResumeRestorePosition({x:fromX,z:fromZ,y:0,facing:2}))return false;
             poiMonsterStates.clear();poiDavidActive=null;poiCombatLockReset();
             let kit=poiHotbarRead(), slots=poiInventorySlots(kit).slice();
             if(full){
              for(let i=0;i<POI_HOTBAR_SIZE+POI_BAG_UNLOCKED;i++)if(!slots[i])slots[i]={type:'cannedFood',count:poiInventoryStack('cannedFood')};
              kit=poiInventoryEdited(kit,slots);
             }
             if(type==='cannedFood'||type==='healingHerb')kit={...kit,drops:[...(kit.drops||[]),{type,count:1,x,z,y:0}]};
             else {
              const reward=Object.values(POI_ORVAS_REWARDS).find(r=>r.type===type);
              if(!reward||reward.x!==x||reward.z!==z)return false;
              const {bit,...d}=reward;kit={...kit,armedDrops:[...(kit.armedDrops||[]),{...d,durability:poiEquipmentDurabilityMax(type)}]};
             }
             const written=poiEconomyWrite(kit);if(written)poiEconomyRefresh();return written;
            },
            state:()=>{
             const k=poiHotbarRead();
             return {at:[poiWalkX,poiWalkZ],events:window.__pickupSamples??[],held:k.weapon,
              items:poiInventorySlots(k).filter(Boolean).map(c=>c.type),
              drops:k.drops??[],armed:k.armedDrops??[],se:poiAudioLevels.se,
              live:(window.__pickupNodes??[]).filter(n=>poiAudioTransient.has(n)).length};
            }
           };`+key);
          const dispatch=' poiAudioTransient.add(source);source.start(when);source.stop(when+(cap??(buffer.duration+.012)));';
          put(dispatch,dispatch+`
           if(buffer===poiRecordedFoleyCache.get('itemPickup')){
            (window.__pickupSamples??=[]).push({n:buffer.length,rate:buffer.sampleRate,loop:source.loop,volume,when});
            (window.__pickupNodes??=[]).push(source);
           }`);
          for(const [,js] of h.matchAll(/<script(?: [^>]*)?>([\s\S]*?)<\/script>/g))new Script(js);
          if(process.env.PICON_PARSE_ONLY){console.log('Exact item pickup cue fixture parses');process.exit(0)}
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_PACKAGE??'playwright');
          const srv=createServer((q,r)=>{r.setHeader('Content-Type','text/html; charset=utf-8');r.end(q.url==='/seed'?'<title>Setup</title>':h)});
          await new Promise(r=>srv.listen(0,'127.0.0.1',r));const root='http://127.0.0.1:'+srv.address().port;
          let browser;
          try{
           browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
           const ctx=await browser.newContext({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:.7});
           const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));p.setDefaultTimeout(16000);
           await p.goto(root+'/seed');await p.evaluate(()=>{
            localStorage.setItem('world-workshop-audio-v2','{"master":85,"bgm":0,"se":82,"enabled":true}');
            localStorage.setItem('world-workshop-resume-v1',JSON.stringify({version:1,route:'facility',id:'base',play:true,position:{x:24,z:151,y:0,facing:2},
             townLayout:5,townMapHeight:182,templeDepth:1,view:{yaw:0,zoom:1.05,panX:0,panZ:0,level:0,hideUpper:false,top:false,third:false,orbitYaw:0,orbitPitch:.24,orbitDistance:5.5}}));
           });
           await p.goto(root+'/?resume=1&test=1',{waitUntil:'domcontentloaded'});
           await p.locator('#pineStartupCover').waitFor({state:'hidden'});
           const q=()=>p.evaluate(()=>window.__pickupPicon.state());
           const go=async(k,x,z)=>{await p.keyboard.press(k);await p.waitForFunction(([x,z])=>{
            const q=window.__pickupPicon.state();return q.at[0]===x&&q.at[1]===z
           },[x,z]);};
           const ground=async(...args)=>assert(await p.evaluate(a=>window.__pickupPicon.ground(...a),args));
           const count=async n=>{await p.waitForFunction(n=>window.__pickupPicon.state().events.length>=n,n);assert.equal((await q()).events.length,n);};
           await ground('cannedFood',24,152,24,151);
           await go('ArrowDown',24,152);await count(1);assert((await q()).items.includes('cannedFood'));
           await ground('equipOrvasHead',24,157,24,156);
           await go('ArrowDown',24,157);await count(2);assert((await q()).items.includes('equipOrvasHead'));
           await ground('orvasSoul',24,159,24,158);
           await go('ArrowDown',24,159);await count(3);assert((await q()).items.includes('orvasSoul'));

           await p.locator('#poiBagToggle').tap();
           await p.locator('#poiHotbar [data-hotbar-slot="0"]').tap();
           const dialog=p.locator('#poiItemDetail');await dialog.waitFor({state:'visible'});
           await dialog.locator('[data-item-detail-action="back"]').tap();
           await dialog.waitFor({state:'hidden'});assert.equal((await q()).events.length,3);
           await p.locator('#poiHotbar [data-hotbar-slot="0"]').tap();
           await dialog.waitFor({state:'visible'});
           await dialog.locator('[data-item-detail-action="drop"]').tap();
           await dialog.waitFor({state:'hidden'});assert.equal((await q()).events.length,3);
           await p.locator('#poiBagClose').tap();
           assert((await q()).drops.some(d=>d.type==='equipWoodSword'));
           await go('ArrowUp',24,158);await p.waitForTimeout(195);
           await go('ArrowDown',24,159);await count(4);assert((await q()).items.includes('equipWoodSword'));

           await p.evaluate(()=>{const el=document.getElementById('poiVolumeSe');el.value='0';el.dispatchEvent(new Event('input',{bubbles:true}));});
           assert.equal((await q()).se,0);
           await ground('healingHerb',24,154,24,153);
           await go('ArrowDown',24,154);await p.waitForTimeout(230);
           assert((await q()).items.includes('healingHerb'));assert.equal((await q()).events.length,4);
           await p.evaluate(()=>{const el=document.getElementById('poiVolumeSe');el.value='82';el.dispatchEvent(new Event('input',{bubbles:true}));});
           assert.equal((await q()).se,82);
           await ground('equipOrvasGreatsword',25,158,25,157,true);
           await go('ArrowDown',25,158);await p.waitForTimeout(230);
           assert((await q()).armed.some(d=>d.type==='equipOrvasGreatsword'),'real ground item remains if every slot full');
           let s=await q();assert.equal(s.events.length,4);assert.equal(s.live,0);
           assert(s.events.every(e=>e.n===3720&&e.rate===24000&&!e.loop&&e.volume===.60));assert.deepEqual(errors,[]);
           console.log('Actual item, Orvas gear and soul pickups; cancel, drop, muted successful and full failed paths; four clean one-shot buffers',JSON.stringify(s.events));
           await ctx.close();
          }finally{await browser?.close();await new Promise(r=>srv.close(r))}
          SOURCE
          cat >.qa/tests/pickup-picon.test.cjs <<'SOURCE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),test=require('node:test');
          const h=fs.readFileSync(process.env.HTML||'world-editor.html','utf8');
          function asset(name){
           const m=h.match(new RegExp('\\n '+name+':\\s*((?:\'[A-Za-z0-9+/=]+\'\\s*(?:\\+\\s*)?)+)'));assert(m,name);
           return Buffer.from([...m[1].matchAll(/'([^']+)'/g)].map(x=>x[1]).join(''),'base64');
          }
          test('pickup is a soft crisp ascending two-note one-shot, not coin pitches or rustle',()=>{
           const pcm=asset('itemPickup');assert.equal(pcm.length,7440);
           const x=Array.from({length:3720},(_,i)=>pcm.readInt16LE(i*2)/32768);
           assert.equal(x[0],0);assert.equal(x.at(-1),0);assert(Math.max(...x.map(Math.abs))<=.48);
           const freq=(from,to,f)=>{
            let a=0,b=0;for(let i=from;i<to;i++){a+=x[i]*Math.sin(i*f*Math.PI/12000);b+=x[i]*Math.cos(i*f*Math.PI/12000)}
            return Math.hypot(a,b);
           };
           assert(freq(160,970,587.33)>7*freq(160,970,783.99));
           assert(freq(1520,2470,783.99)>7*freq(1520,2470,587.33));
           continuity: for(const sample of x.slice(-96))assert(Math.abs(sample)<.001);
          });
          test('item, chest and soul share one voiced sample; coin and mute keep original routing',()=>{
           const calls=[],c={poiAudioLevels:{master:85,se:85},poiAudioNoiseBurst:(...p)=>calls.push(['air',...p]),
            poiAudioTone:(...p)=>calls.push(['tone',...p]),poiAudioEffects:{},
            poiTryRecordedFoley:(...p)=>(calls.push(['asset',...p]),true)};
           const a=h.indexOf('function poiItemSound('),b=h.indexOf('// END ITEM FOLEY',a);
           vm.createContext(c);vm.runInContext(h.slice(a,b),c);
           const cue=(k,t)=>{calls.length=0;c.poiItemSound(k,t,2);return calls.slice();};
           for(const id of ['healingHerb','equipOrvasGreatsword','orvasSoul','slimeSoul'])assert.deepEqual(cue('item-pickup',id),[['asset','itemPickup',2.068,.60]]);
           assert.deepEqual(cue('chest-pickup','healingHerb'),[['asset','itemPickup',2,.60]]);
           assert.deepEqual(cue('item-pickup','coin').filter(x=>x[0]==='tone').map(x=>x[1]),[1480,1976]);
           c.poiAudioLevels.se=0;assert.deepEqual(cue('item-pickup','orvasSoul'),[]);
          });
