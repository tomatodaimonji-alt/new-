name: Orvas equal power per real contact
on:
  push:
    branches: ['dot/workshop-david-discovery-qa']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        suite: [orvas-faithful-gear, attack-target-tracking]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e01446076fe33d1d707094eec764fc80d70fd099
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact scoped candidate
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = 820f9a94abf136d589f559e543b51a194987bceb
          mkdir -p .qa/tests
          cat >.qa/build.py <<'SOURCE'
          from pathlib import Path
          import sys
          src,out=map(Path,sys.argv[1:]);s=src.read_bytes()
          def rep(a,b):
           global s
           a,b=a.encode(),b.encode()
           assert s.count(a)==1,(a,s.count(a))
           s=s.replace(a,b,1)
          rep('const POI_PLAYER_WEAPON_PROFILES=Object.freeze({',
              'const POI_ORVAS_JUDGMENT_POWER=46;\nconst POI_PLAYER_WEAPON_PROFILES=Object.freeze({')
          rep('equipOrvasGreatsword:{get range(){return POI_DAVID_SWEEP_FORWARD},damage:46,',
              'equipOrvasGreatsword:{get range(){return POI_DAVID_SWEEP_FORWARD},get damage(){return POI_ORVAS_JUDGMENT_POWER},')
          rep('equipOrvasTwinGreatswords:{range:3.55,damage:63,',
              'equipOrvasTwinGreatswords:{range:3.55,get damage(){return POI_ORVAS_JUDGMENT_POWER},')
          rep(" const damage=kind==='double'?POI_DAVID_PATTERNS.double.damage[index]:shot.profile.damage;",
              " const damage=shot.profile.damage; // Each actual contact shares the single sword's raw power.")
          out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(s)
          SOURCE
          cat >.qa/tests/orvas-matched-power.test.cjs <<'SOURCE'
          const fs=require('node:fs'),vm=require('node:vm'),test=require('node:test'),assert=require('node:assert/strict');
          const h=fs.readFileSync(process.env.HTML||'world-editor.html','utf8');
          function piece(a,b){const i=h.indexOf(a),j=h.indexOf(b,i+1);assert(i>=0&&j>i,a);return h.slice(i,j)}
          function run(mode,list){
           const rows=[],wear=[];
           const c={poiAimWall:()=>()=>true,poiAimTargetList:()=>list.value,poiEquipmentSpendWeapon:t=>(wear.push(t),true),
            poiPlayerDamageTarget:(_m,x,z,amount)=>rows.push(amount),POI_DAVID_SWEEP_FORWARD:5.25,POI_DAVID_SWEEP_SIDE:4.2,
            POI_DAVID_PATTERNS:{double:{damage:[28,35],hits:[720,1040]}},poiAimOrigin:()=>({x:0,z:0,y:0}),
            poiPlayerWeaponPending:null,poiEquippedWeapon:()=>mode};
           const standard=piece('const POI_PLAYER_WEAPON_PROFILES=','let poiPlayerWeaponPending');
           const power=h.includes('const POI_ORVAS_JUDGMENT_POWER=')?piece('const POI_ORVAS_JUDGMENT_POWER=','const POI_PLAYER_WEAPON_PROFILES='):'';
           vm.createContext(c);vm.runInContext(power+'const POI_SWORD_PROFILE={};'+standard+piece('function poiDavidArea(','const POI_DAVID_LEAP_LOAD=')+
             piece('const POI_AIM_EPS=', 'function poiAimChooseLock')+piece('function poiOrvasCutResolve(', 'function poiDrawOrvasPlayerBeam'),c);
           const f=s=>vm.runInContext(s,c),profile=f('POI_PLAYER_WEAPON_PROFILES['+JSON.stringify(mode)+']');
           c.shot={type:mode,profile,aim:{x:0,z:0,y:0},dx:1,dz:0,started:0};
           return {rows,wear,profile,c,f};
          }
          const hit=()=>({value:[{id:{y:0},x:2,z:0,state:{hp:200}}]});
          test('single and each actual twin contact use the same raw 46, exactly doubling if both land',()=>{
           const a=run('equipOrvasGreatsword',hit()),b=run('equipOrvasTwinGreatswords',hit());
           a.f("poiOrvasCutResolve(shot,560,'sweep')");
           b.f('poiOrvasTwinFrame(shot,720)');b.f('poiOrvasTwinFrame(shot,1040)');
           assert.equal(a.profile.damage,46);assert.equal(b.profile.damage,46);
           assert.deepEqual(a.rows,[46]);assert.deepEqual(b.rows,[46,46]);assert.equal(b.wear.length,1);
           assert.deepEqual(b.c.POI_DAVID_PATTERNS.double.damage,[28,35],'actual boss remains independently tuned');
          });
          test('single missed contact does not transfer damage to the landed contact',()=>{
           for(const miss of [0,1]){
            const list=hit(),saved=list.value,q=run('equipOrvasTwinGreatswords',list);
            list.value=miss===0?[]:saved;q.f('poiOrvasTwinFrame(shot,720)');
            list.value=miss===1?[]:saved;q.f('poiOrvasTwinFrame(shot,1040)');
            assert.deepEqual(q.rows,[46]);assert.equal(q.wear.length,1);
           }
          });
          SOURCE
          cat >.qa/tests/orvas-beam.test.cjs <<'SOURCE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),test=require('node:test'),vm=require('node:vm');
          const h=fs.readFileSync(process.env.PRODUCT||'world-editor.html','utf8');
          function cut(a,b){const i=h.indexOf(a),j=h.indexOf(b,i+1);return i>=0&&j>=0?h.slice(i,j):''}
          function execute({wall=Infinity,targets=[[2.6,0,0],[5,0,0]],wear=true,range=8}={}){
           const hits=[],calls=[];
           const c={range,poiAimWall:()=>((x)=>x<wall),poiAimTargetList:()=>targets.map(([x,z,y],idx)=>({id:{type:'monsterSlime',y,idx},x,z,state:{hp:50}})),
            poiEquipmentSpendWeapon:t=>(calls.push(t),wear),poiPlayerDamageTarget:(pair,x,z,n)=>hits.push([pair[0].idx,n]),
            poiPlayerWeaponHands:()=>({right:{wrist:[0,.71,.31]}}),poiOrvasHeadPose:()=>({}),poiCreekPlayerHeight:()=>0,poiSound:()=>{},
            POI_DAVID_SWEEP_FORWARD:5.25,POI_DAVID_SWEEP_SIDE:4.2,window:{},performance:{now:()=>300}};
           const src=cut('function poiDavidArea(', 'const POI_DAVID_LEAP_LOAD=')+cut('const POI_ORVAS_HEAD_BASE=', 'function poiOrvasHeadGeometry')+cut('const POI_AIM_EPS=', 'function poiAimChooseLock')+cut('// BEGIN ORVAS PLAYER BEAM','function poiDrawOrvasPlayerBeam');
           vm.createContext(c);vm.runInContext(src,c);
           const rays=vm.runInContext("poiOrvasBeamResolve({type:'equipOrvasHead',profile:{range,damage:48},dx:1,dz:0,y:0,aim:{x:0,z:0,y:0}},300); poiOrvasPlayerBeam?.rays",c);
           return {hits,calls,rays};
          }
          test('equipped trophy emits two real eye rays, first eligible target only, one wear',()=>{
           const {hits,calls,rays}=execute();
           assert.deepEqual(hits,[[0,48]]);assert.deepEqual(calls,['equipOrvasHead']);
           assert.equal(rays.length,2);assert.notEqual(rays[0].z,rays[1].z);assert.equal(rays[0].end,rays[1].end);
          });
          test('eye rays stop on wall, never hit another floor, no emission if wear write denied',()=>{
           let v=execute({wall:2});assert.deepEqual(v.hits,[]);assert(v.rays.every(r=>r.end<=1.5));
           v=execute({targets:[[2,0,1],[4,0,0]]});assert.deepEqual(v.hits,[[1,48]]);
           v=execute({wear:false});assert(!v.rays);assert.deepEqual(v.hits,[]);
          });
          test('exact boss shape geometry: wide flank is single sweep only; paired right/left use one input and two contacts',()=>{
           const spans=[];
           const c={poiAimWall:()=>()=>true,poiAimTargetList:()=>[[3.54,1.49],[4.2,1.7],[-1,0],[3.56,0]].map(([x,z],idx)=>({id:{idx,y:0},x,z,state:{hp:100}})),
            poiEquipmentSpendWeapon:()=>{spans.push('wear');return true},poiPlayerDamageTarget:(pair,x,z,n)=>spans.push([pair[0].idx,n]),poiAimOrigin:()=>({x:0,z:0,y:0}),poiEquippedWeapon:()=>c.weapon,
            poiPlayerWeaponPending:null,POI_DAVID_PATTERNS:{double:{hits:[720,1040],damage:[28,35]}},POI_DAVID_SWEEP_FORWARD:5.25,POI_DAVID_SWEEP_SIDE:4.2};
           vm.createContext(c);
           vm.runInContext(cut('function poiDavidArea(', 'const POI_DAVID_LEAP_LOAD=')+cut('const POI_AIM_EPS=', 'function poiAimChooseLock')+cut('// BEGIN ORVAS PLAYER BEAM','function poiDrawOrvasPlayerBeam'),c);
           const run=s=>vm.runInContext(s,c);
           run("poiOrvasCutResolve({type:'equipOrvasGreatsword',profile:{damage:46},dx:1,dz:0,aim:poiAimOrigin()},100,'sweep')");
           assert(spans.some(x=>x[0]===1&&x[1]===46));assert(!spans.some(x=>x[0]===2));
           spans.length=0;c.weapon='equipOrvasTwinGreatswords';
           run("poiPlayerWeaponPending={type:'equipOrvasTwinGreatswords',profile:{damage:46},started:100,dx:1,dz:0};");
           run('poiOrvasTwinFrame(poiPlayerWeaponPending,819)');assert.deepEqual(spans,[]);
           run('poiOrvasTwinFrame(poiPlayerWeaponPending,820)');assert.deepEqual(spans,['wear',[0,46]]);
           run('poiOrvasTwinFrame(poiPlayerWeaponPending,1139)');assert.equal(spans.length,2);
           run('poiOrvasTwinFrame(poiPlayerWeaponPending,1140)');assert.deepEqual(spans,['wear',[0,46],[0,46]]);
           assert.equal(c.poiPlayerWeaponPending,null);
          });

          test('actual full eye beam reaches 14 from committing player, clipping the same half-width as boss',()=>{
           const empty=execute({targets:[],range:14});
           assert(empty.rays.every(r=>Math.abs(r.x+r.end-14)<1e-6&&r.groundEligible));
           const {rays}=execute({wall:6,targets:[],range:14});assert(rays.every(r=>r.end<6&&!r.groundEligible));
          });
          SOURCE
          cat >.qa/tests/orvas-faithful-gear-browser.mjs <<'SOURCE'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import {Script} from 'node:vm';
          let h=readFileSync(process.argv[2]??'world-editor.html','utf8');
          const install=(a,b)=>{assert.equal(h.split(a).length,2,a);h=h.replace(a,b)};
          const mark="if(facilityParams.get('test')==='1')window.__editorTest={";


          install(mark,`
           window.__orvas={
            frame:()=>render(),
            drop:i=>{
             if(!workshopResumeRestorePosition({x:24,z:108,y:0,facing:1}))return null;
             const type=poiInventorySlots(poiHotbarRead())[i]?.type;
             if(!type||!poiInventoryDrop(i).ok)return null;
             return poiHotbarRead().drops.find(d=>d.type===type);
            },
            take:d=>{
             if(!workshopResumeRestorePosition({x:d.x,z:d.z,y:d.y,facing:1}))return null;
             if(poiHotbarRead().drops?.some(item=>item.type===d.type)&&!poiInventoryPickup(d.x,d.z))return null;
             const slot=poiInventorySlots(poiHotbarRead()).findIndex(c=>c?.type===d.type);
             return {slot,ok:poiEquipHotbarItem(slot)?.ok};
            },
            bossCues:()=>{
             const b=facilitySite.davidTemple.boss,p={x:b.x,z:b.z,y:b.y};
             for(const [kind,i,phase] of [['beam',0,'beamOnset'],['sweep',0,'impact'],['double',0,'impact'],['double',1,'impact']])
              poiDavidAttackFoley({kind,sx:b.x,sz:b.z,y:b.y},p,b,i,phase);
            },
            stage:index=>{
             if(!workshopResumeRestorePosition({x:24,z:108,y:0,facing:1}))return false;
             poiMonsterStates.clear();poiCombatLockReset();
             return poiEquipHotbarItem(index)?.ok;
            },
            addTargets:targets=>{
             const list=targets.map(([x,z,y])=>{
              const o={x,z,y,type:'monsterSlime',rot:0},s=poiCombatActorMake(o);s.hp=100;s.townOwned=true;
              poiMonsterStates.set(o,s);return s;
             });
             window.__orvas.targets=list;poiMonsterMeshDirty=true;
            },
            moveFirst:(x,z)=>{const s=window.__orvas.targets[0];s.x=s.fromX=x;s.z=s.fromZ=z},
            state:()=>{
             const k=poiHotbarRead(),slots=poiInventorySlots(k),weapon=poiEquippedWeapon(),a=poiPlayerWeaponPending;
             const beam=poiOrvasPlayerBeam;
             return {weapon,ready:poiAttackReady,clock:performance.now(),pending:!!a,cursor:a?.orvasCursor,
              used:slots.find(c=>c?.type===weapon)?.durability,hp:window.__orvas.targets?.map(s=>s.hp),
              beam:beam?{rays:beam.rays,draw:!!poiOrvasBeamGpu}:null,start:poiWalkActionStarted,
              ground:window.__orvasGround??[],audio:window.__orvasFoley??[],edge:window.__orvasEdges??[],thermal:window.__orvasThermal??[],
              name:POI_ORVAS_NAME,items:slots.slice(2,5).map(c=>c?.type)};
            }
           };`+mark);
          install(' poiAudioTransient.add(source);source.start(when);source.stop(when+(cap??(buffer.duration+.012)));',`
            poiAudioTransient.add(source);source.start(when);source.stop(when+(cap??(buffer.duration+.012)));
            if(window.__orvasManual){
             const id=buffer===poiDavidAlienCache?'boss-alien-beam':[...poiRecordedFoleyCache].find(([id,b])=>buffer===b&&/^david(?:BladeSweep|Sword)/.test(id))?.[0];
             if(id)(window.__orvasFoley??=[]).push({id,running:source.context.state,loop:source.loop,when,len:buffer.length});
            }
          `);
          install('const b=poiOrvasTwinBladeBasis(arms,pose,i);poiOrvasSwordGeometry(local,b.grip,b.axis,b.blade)',`
            const b=poiOrvasTwinBladeBasis(arms,pose,i);
            if(window.__orvasManual&&pose?.orvasTwin)(window.__orvasEdges??=[]).push({i,p:pose.orvasTwin[i],tip:b.tip,grip:b.grip,axis:b.axis,blade:b.blade});
            poiOrvasSwordGeometry(local,b.grip,b.axis,b.blade)
          `);
          install('   const g=poiDavidThermalBeam(q,d,clear+front,0,true,1);',`
             const g=poiDavidThermalBeam(q,d,clear+front,0,true,1);
             if(window.__orvasManual)(window.__orvasThermal??=[]).push({width:POI_DAVID_BEAM_WIDTH,rng:clear,mask,n:g.p.length/3,core:g.coreCount});
          `);
          install("    }else if(typeof poiOrvasGroundGeometry==='function'&&poiOrvasGroundGeometry(m,d.type,x,y,z)){",`
              }else if(typeof poiOrvasGroundGeometry==='function'&&poiOrvasGroundGeometry(m,d.type,x,y,z)){
               if(window.__orvasManual){
                const exact=mesh();poiOrvasGroundGeometry(exact,d.type,x,y,z);
                const n=exact.p.length,slice=m.p.slice(-n);
                const far=Math.max(...slice.filter((_,i)=>i%3===2))-Math.min(...slice.filter((_,i)=>i%3===2));
                (window.__orvasGround??=[]).push({type:d.type,n,far,
                 same:slice.every((v,i)=>v===exact.p[i])});
               }
          `);
          install(' requestAnimationFrame(render);',' if(!window.__orvasManual)requestAnimationFrame(render);');
          for(const [,js] of h.matchAll(/<script(?: [^>]*)?>([\s\S]*?)<\/script>/g))new Script(js);
          if(process.env.ORVAS_NATIVE_PARSE_ONLY){console.log('Orvas weapons actual browser fixture parses');process.exit(0)}
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_PACKAGE??'playwright');
          const srv=createServer((q,r)=>{r.setHeader('Content-Type','text/html; charset=utf-8');r.end(q.url==='/seed'?'<title>Seed</title>':h)});
          await new Promise(r=>srv.listen(0,'127.0.0.1',r));
          const root='http://127.0.0.1:'+srv.address().port;let browser;
          try{
           browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});

           const ctx=await browser.newContext({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:.65});
           const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));p.setDefaultTimeout(18000);
           await p.goto(root+'/?facility=base&facility-play=1&test=1',{waitUntil:'domcontentloaded'});
           await p.locator('#pineStartupCover').waitFor({state:'hidden'});
           const read=()=>p.evaluate(()=>window.__orvas.state());
           const keys=['equipOrvasHead','equipOrvasGreatsword','equipOrvasTwinGreatswords'];
           assert(!(await read()).items.some(x=>keys.includes(x)));
           await p.locator('#poiLandscapeMenuToggle').click();await p.locator('[data-landscape-action="reset"]').click();
           await p.locator('#poiResetGameDialog').waitFor({state:'visible'});
           await Promise.all([p.waitForURL(/reset-camera=1/),p.locator('#poiResetGameConfirm').click()]);
           await p.locator('#pineStartupCover').waitFor({state:'hidden'});
           await p.clock.install({time:new Date('2026-04-01T10:00:00Z')});
           await p.clock.pauseAt(await p.evaluate(()=>Date.now()+175));
           await p.evaluate(()=>{window.__orvasManual=true});
           const frame=async(ms=35)=>{await p.clock.fastForward(ms);await p.evaluate(()=>window.__orvas.frame());};
           const until=async(check,limit=65)=>{let q=await read();for(let i=0;i<limit&&!check(q);i++){await frame();q=await read()}assert(check(q),JSON.stringify(q));return q};
           const start=async(i,targets)=>{
            await until(q=>q.clock>=q.ready&&!q.pending);
            assert(await p.evaluate(i=>window.__orvas.stage(i),i));
            const q=await read();assert.equal(q.weapon,keys[i-2]);assert(q.used>0);
            const b=await p.locator('#poiWalkAction').boundingBox();assert(b);
            await p.touchscreen.tap(b.x+b.width/2,b.y+b.height/2);
            const held=await until(v=>v.pending&&v.start>=q.clock);
            await p.evaluate(t=>window.__orvas.addTargets(t),targets);
            return {q,held};
           };
           assert.deepEqual((await read()).items,keys);
           assert.equal((await read()).name,'オルヴァス');
           for(let i=2;i<=4;i++){
            const d=await p.evaluate(i=>window.__orvas.drop(i),i);assert(d&&d.type===keys[i-2]);
            await frame();
            const ground=(await read()).ground.find(x=>x.type===d.type);
            assert(ground&&ground.same&&ground.n>300&&ground.far>(i===2?.65:3.35));
            const picked=await p.evaluate(d=>window.__orvas.take(d),d);
            assert.deepEqual(picked,{slot:i,ok:true});assert.equal((await read()).weapon,d.type);
           }

           let {q,held}=await start(2,[[32,108,0],[34,108,0]]);
           let landed=await until(v=>!v.pending&&v.beam?.draw);
           assert(landed.clock-held.start>=420);
           assert.deepEqual(landed.hp,[52,100]);assert.equal(landed.used,q.used-1);
           assert(landed.beam.rays.length===2&&landed.beam.rays[0].z!==landed.beam.rays[1].z);
           assert.equal(landed.thermal.at(-1).width,.56);assert(landed.thermal.at(-1).n>100&&landed.thermal.at(-1).mask===3);
           assert(Math.abs(Math.abs(landed.beam.rays[0].z-landed.beam.rays[1].z)-.302)<.002);
           assert.deepEqual(landed.audio.map(x=>x.id),['boss-alien-beam']);

           ({q,held}=await start(3,[[28,108,0],[26,111,0],[23,108,0]]));
           landed=await until(v=>!v.pending);
           assert(landed.clock-held.start>=560);
           assert.deepEqual(landed.hp,[54,54,100]);assert.equal(landed.used,q.used-1);
           ({q,held}=await start(4,[[27,108,0],[26,111,0],[23,108,0]]));
           const first=await until(v=>v.cursor===1);
           assert(first.clock-held.start>=720);assert.deepEqual(first.hp,[54,100,100]);
           landed=await until(v=>!v.pending);
           assert(landed.clock-held.start>=1040);assert.deepEqual(landed.hp,[8,100,100]);assert.equal(landed.used,q.used-1);
           for(const i of [0,1]){
            const edge=landed.edge.find(b=>b.i===i&&b.p>=1.479&&Math.abs(b.tip[1]-.028)<.004);
            assert(edge&&edge.blade[1]<-.9&&Math.abs(Math.hypot(...edge.tip.map((n,k)=>n-edge.grip[k]))-3.10)<.0001);
           }
           const expected=['boss-alien-beam','davidBladeSweep','davidSwordFirst','davidSwordSecond'];
           assert.deepEqual(landed.audio.map(x=>x.id),expected);assert(landed.audio.every(a=>a.running==='running'&&a.len>1000));
           await p.evaluate(()=>window.__orvas.bossCues());
           const all=(await read()).audio;assert.deepEqual(all.map(x=>x.id),[...expected,...expected]);
           assert.deepEqual(all.slice(4).map(x=>x.len),all.slice(0,4).map(x=>x.len));

           ({q,held}=await start(4,[[29,108,0]]));
           const miss=await until(v=>v.cursor===1);
           assert.deepEqual(miss.hp,[100]);assert.equal(miss.used,q.used);
           await p.evaluate(()=>window.__orvas.moveFirst(27,108));
           const partial=await until(v=>!v.pending);
           assert.deepEqual(partial.hp,[54]);assert.equal(partial.used,q.used-1);
           console.log('Physical reset, then all three actual right-button attacks, matched timing, scope and wear',JSON.stringify({first:first.hp,landed:landed.hp}));
           assert.deepEqual(errors,[]);
           await ctx.close();
          }finally{await browser?.close();await new Promise(r=>srv.close(r))}
          SOURCE
          cat >.qa/tests/attack-target-tracking-browser.mjs <<'SOURCE'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import {Script} from 'node:vm';
          let h=readFileSync(process.argv[2]??'world-editor.html','utf8');
          const insert=(a,b)=>{assert.equal(h.split(a).length,2,a);h=h.replace(a,b)};
          const mark="if(facilityParams.get('test')==='1')window.__editorTest={";
          insert(mark,`
           window.__trackedTest={
            frame:()=>render(),
            stage:(slot,x,z)=>{
             if(!workshopResumeRestorePosition({x:24,z:108,y:0,facing:1}))return false;
             poiMonsterStates.clear();poiCombatLockReset();
             const add=(n,x,z)=>{
              const o={x:Math.round(x),z:Math.round(z),y:0,type:'monsterSlime',rot:0,qa:n},s=poiCombatActorMake(o);
              s.hp=100;s.townOwned=true;s.x=s.fromX=x;s.z=s.fromZ=z;
