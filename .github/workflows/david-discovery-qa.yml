name: Orvas actual rewards and three weapons
on:
  push:
    branches: ['dot/workshop-david-discovery-qa']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        suite: [orvas-reset-kit, orvas-weapons]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 42ef0e3833439e67b6baff56ce840824c7c2e833
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact combined candidate
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = 7db83b92dbc97a49f1d31d040b8a92c0d671f195
          mkdir -p .qa/tests
          cat >.qa/build.py <<'SOURCE'
          from pathlib import Path
          import sys
          src,dst=map(Path,sys.argv[1:]);s=src.read_text()
          def rep(a,b):
           global s
           assert s.count(a)==1,(a,s.count(a))
           s=s.replace(a,b,1)
          def code(n):return Path(__file__).with_name(n).read_text()
          rep('function poiDungeonRememberDefeat(o,state){',code('rewards.js')+'function poiDungeonRememberDefeat(o,state){')
          rep("const reward=id==='northFort.minotaur'?poiNorthMinotaurRewardGrant(kit):kit;",
              "const reward=id==='northFort.minotaur'?poiNorthMinotaurRewardGrant(kit):id==='davidTemple.david'&&typeof poiOrvasRewardGrant==='function'?poiOrvasRewardGrant(kit):kit;")
          rep('const kit={weapon:saved.weapon,potions:saved.potions};',
              "const kit={weapon:saved.weapon,potions:saved.potions};\n const orvas=typeof poiOrvasRewardMask==='function'?poiOrvasRewardMask(saved.orvasRewards):0;if(orvas)kit.orvasRewards=orvas;")
          rep('const final=typeof poiCompanionReconcile===\'function\'?poiCompanionReconcile(restored):restored;',
              '''const orvasRestored=typeof poiOrvasRewardRestore==='function'&&
            (saved.dungeonPopulation?.dead?.['davidTemple.david']!==undefined||restored.armedDrops?.some(d=>poiOrvasRewardValid(d)))?
            poiOrvasRewardRestore(restored,saved.dungeonPopulation):restored;
           const final=typeof poiCompanionReconcile==='function'?poiCompanionReconcile(orvasRestored):orvasRestored;''')
          rep('...(kit.northMinotaurAxeAwarded===true?{northMinotaurAxeAwarded:true}:{}),','...(kit.northMinotaurAxeAwarded===true?{northMinotaurAxeAwarded:true}:{}),'+
              "...(typeof poiOrvasRewardMask==='function'&&poiOrvasRewardMask(kit.orvasRewards)?{orvasRewards:kit.orvasRewards}:{}),")
          rep('for(const [index,d] of raw.slice(0,13).entries()){',
              '''let legacy=0;
           for(const d of raw.slice(0,16)){
            const orvas=typeof poiOrvasRewardValid==='function'?poiOrvasRewardValid(d):null;
            if(orvas){
             if(!result.some(v=>v.id===d.id)&&d.durability===poiEquipmentDurabilityMax(d.type)){
              const {bit,...drop}=orvas;result.push({...drop,durability:d.durability});
             }
             continue;
            }
            const index=legacy++;
            if(index>12)continue;''')
          rep("!poiArmedDuplicateWeapon(kit,d.type));","!(typeof poiOrvasRewardValid==='function'&&poiOrvasRewardValid(d)&&poiOrvasRewardOwned(kit,d.type))&&!poiArmedDuplicateWeapon(kit,d.type));")
          rep("equipNorthMinotaurAxe:'ミノタウロスの長柄斧',","equipNorthMinotaurAxe:'ミノタウロスの長柄斧',equipOrvasHead:'オルヴァスの頭',equipOrvasGreatsword:'審判の巨剣',equipOrvasTwinGreatswords:'審判の双巨剣',")
          rep("equipNorthMinotaurAxe:180,","equipNorthMinotaurAxe:180,equipOrvasHead:100,equipOrvasGreatsword:220,equipOrvasTwinGreatswords:210,")
          rep("""{id:'equipNorthMinotaurAxe',name:'ミノタウロスの長柄斧',icon:'🪓',cat:'equipment'},""",
          "{id:'equipNorthMinotaurAxe',name:'ミノタウロスの長柄斧',icon:'🪓',cat:'equipment'},\n{id:'equipOrvasHead',name:'オルヴァスの頭',icon:'♜',cat:'equipment'},\n{id:'equipOrvasGreatsword',name:'審判の巨剣',icon:'🗡',cat:'equipment'},\n{id:'equipOrvasTwinGreatswords',name:'審判の双巨剣',icon:'⚔',cat:'equipment'},")
          rep("'equipLongStaff','equipNorthMinotaurAxe'];","'equipLongStaff','equipNorthMinotaurAxe','equipOrvasHead','equipOrvasGreatsword','equipOrvasTwinGreatswords'];")
          rep("const name=byId(type)?.name||'モンスター',message=name+'を倒した';",
              "const name=type==='monsterStoneDavid'&&typeof POI_ORVAS_NAME==='string'?POI_ORVAS_NAME:(byId(type)?.name||'モンスター'),message=name+'を倒した';")
          rep("  bar.seen=frame;\n  if(bar.hp!==state.hp)", "  if(obj.type==='monsterStoneDavid'&&state.david?.wakeDone&&typeof POI_ORVAS_NAME==='string')bar.el.setAttribute('aria-label',POI_ORVAS_NAME+'のHP');\n  bar.seen=frame;\n  if(bar.hp!==state.hp)")
          rep("function decoBase(m,id,x,y,z,r=0){",code('art.js')+"function decoBase(m,id,x,y,z,r=0){")
          rep("case 'equipNorthMinotaurAxe':", """case 'equipOrvasHead':poiOrvasHeadGeometry(m,x,y,z);break;
          case 'equipOrvasGreatsword':poiOrvasGreatswordGeometry(m,x,y,z);break;
          case 'equipOrvasTwinGreatswords':poiOrvasTwinGeometry(m,x,y,z);break;
          case 'equipNorthMinotaurAxe':""")
          rep("const POI_PLAYER_WEAPON_PROFILES=Object.freeze({",code('combat.js')+"const POI_PLAYER_WEAPON_PROFILES=Object.freeze({")
          rep(" equipNorthMinotaurAxe:{range:2.55", """ equipOrvasHead:{range:14,damage:48,hit:420,ready:1520,pose:760,speed:1,reach:5,eyeBeam:true},
           equipOrvasGreatsword:{range:POI_DAVID_SWEEP_FORWARD,damage:46,hit:560,ready:1150,pose:1150,speed:1,reach:5,sweep:true,orvasCut:'sweep'},
           equipOrvasTwinGreatswords:{range:3.55,damage:63,hit:720,ready:1730,pose:1730,speed:1,reach:4,orvasCut:'double'},
           equipNorthMinotaurAxe:{range:2.55""")
          rep(" if(a.profile.sweep&&contact.aim)poiSwordResolve(contact,now);",
              " if(a.profile.eyeBeam&&typeof poiOrvasBeamResolve==='function')poiOrvasBeamResolve(contact,now);\n else if(a.profile.orvasCut==='sweep'&&typeof poiOrvasCutResolve==='function')poiOrvasCutResolve(contact,now,'sweep');\n else if(a.profile.sweep&&contact.aim)poiSwordResolve(contact,now);")
          rep("else if(type!=='equipWoodBow'&&type!=='equipWoodSword'&&!profile.frontArc)", "else if(type!=='equipWoodBow'&&type!=='equipWoodSword'&&!profile.frontArc&&!profile.eyeBeam)")
          rep(" if(p.sweep)return poiPlayerSwordSweepPose(ms);", """ if(p.eyeBeam)return poiOrvasHeadPose(p,ms);
           if(p.orvasCut==='double')return poiOrvasTwinPose(ms);
           if(type==='equipOrvasGreatsword'){
            const t=ms<p.hit?ms/p.hit*108:108+(ms-p.hit)/(p.pose-p.hit)*188;
            return poiPlayerSwordSweepPose(t);
           }
           if(p.sweep)return poiPlayerSwordSweepPose(ms);""")
          rep("equipLongStaff:.74,equipNorthMinotaurAxe:.83", "equipLongStaff:.74,equipNorthMinotaurAxe:.83,equipOrvasGreatsword:.79")
          rep("equipLongStaff:1.58,equipNorthMinotaurAxe:2.14,", "equipLongStaff:1.58,equipNorthMinotaurAxe:2.14,equipOrvasGreatsword:4.65,")
          rep("  const prop=mesh();deco(prop,weapon,0,0,0,0);", """  if(weapon==='equipOrvasHead'){
             const head=mesh();poiOrvasHeadGeometry(head,...poiOrvasTrophyBase([gx,gy,gz]));
             const origin=[x,y,z];
             for(let i=0;i<head.p.length;i+=3){
              const [u,v]=rotate(head.p[i],head.p[i+2]),[nx,nz]=rotate(head.n[i],head.n[i+2]);
              m.p.push(origin[0]+u,origin[1]+head.p[i+1],origin[2]+v);m.n.push(nx,head.n[i+1],nz);
              m.c.push(head.c[i],head.c[i+1],head.c[i+2]);
             }
             return m;
            }
            const prop=mesh();deco(prop,weapon,0,0,0,0);""")
          rep("weapon==='equipNorthMinotaurAxe'?{grip:.64,scale:.75}:null;", "weapon==='equipNorthMinotaurAxe'?{grip:.64,scale:.75}:weapon==='equipOrvasGreatsword'?{grip:.34,scale:.68}:null;")
          rep("  poiMonsterRender(now,p.vp);","  poiMonsterRender(now,p.vp);\n  if(typeof poiDrawOrvasPlayerBeam==='function')poiDrawOrvasPlayerBeam(now,p.vp);")
          rep(" equipNorthMinotaurAxe:'北の古砦のミノタウロスが振るっていた長柄斧。',"," equipNorthMinotaurAxe:'北の古砦のミノタウロスが振るっていた長柄斧。',equipOrvasHead:'両目から光線を放つ、石造りの戦利品。放つたびに耐久を消費する。',equipOrvasGreatsword:'オルヴァスが振るった巨大な石剣。前方を広く薙ぎ払う。',equipOrvasTwinGreatswords:'左右の巨剣で、正面へ縦斬りを二度放つ。',")
          rep(" if(poiEquippedWeapon()!==a.type){poiPlayerWeaponCancel(true);return}\n if(now<a.started+a.profile.hit)return;",
              """ if(poiEquippedWeapon()!==a.type&&!(a.orvasPaid&&a.orvasWeaponAfterWear===poiEquippedWeapon())){poiPlayerWeaponCancel(true);return}
           if(a.profile.orvasCut==='double'&&typeof poiOrvasTwinFrame==='function'){poiOrvasTwinFrame(a,now);return}
           if(now<a.started+a.profile.hit)return;""")
          rep("  if(weapon==='equipOrvasHead'){","""  if(weapon==='equipOrvasTwinGreatswords'){
             const piece=mesh();poiOrvasGreatswordGeometry(piece,0,0,0);
             for(const [i,side] of [[0,'right'],[1,'left']]){
              const grip=arms[side].wrist,angle=pose?.orvasTwin?.[i],tilt=Number.isFinite(angle)?-angle:-.42;
              const R=characterArmRotation(tilt,i?.14:-.14);
              for(let j=0;j<piece.p.length;j+=3){
               const [u,v,w]=R(piece.p[j]*.67,(piece.p[j+1]-.34)*1.09,piece.p[j+2]*.76);
               const [px,pz]=rotate(u+grip[0],w+grip[2]),nn=R(piece.n[j]/.67,piece.n[j+1]/1.09,piece.n[j+2]/.76);
               const [nx,nz]=rotate(nn[0],nn[2]),n=Math.hypot(nx,nn[1],nz)||1;
               m.p.push(x+px,y+grip[1]+v,z+pz);m.n.push(nx/n,nn[1]/n,nz/n);m.c.push(piece.c[j],piece.c[j+1],piece.c[j+2]);
              }
             }
             return m;
            }
            if(weapon==='equipOrvasHead'){""")
          rep(" if(d.wakeCursor!==undefined&&!poiDavidAwakeningTick(o,s,b,now))return false;",
              """ const alreadyNamed=d.wakeDone;
           if(d.wakeCursor!==undefined&&!poiDavidAwakeningTick(o,s,b,now))return false;
           if(!alreadyNamed&&d.wakeDone&&typeof POI_ORVAS_NAME==='string'&&typeof poiMessagePush==='function')
            poiMessagePush(POI_ORVAS_NAME+'が目を覚ました','notice',now);""")
          dst.parent.mkdir(parents=True,exist_ok=True);dst.write_text(s)
          SOURCE
          cat >.qa/rewards.js <<'SOURCE'
          // BEGIN ORVAS REWARD CORE
          const POI_ORVAS_NAME='オルヴァス';
          const POI_ORVAS_REWARDS=Object.freeze({
           'orvas-head':Object.freeze({id:'orvas-head',type:'equipOrvasHead',x:24,z:103,y:0,bit:1}),
           'orvas-greatsword':Object.freeze({id:'orvas-greatsword',type:'equipOrvasGreatsword',x:25,z:104,y:0,bit:2}),
           'orvas-twin-greatswords':Object.freeze({id:'orvas-twin-greatswords',type:'equipOrvasTwinGreatswords',x:23,z:104,y:0,bit:4})
          });
          function poiOrvasRewardValid(drop){
           const d=Object.hasOwn(POI_ORVAS_REWARDS,drop?.id)?POI_ORVAS_REWARDS[drop.id]:null;
           return d&&d.type===drop.type&&d.x===drop.x&&d.z===drop.z&&d.y===drop.y?d:null;
          }
          function poiOrvasRewardOwned(kit,type){
           return poiInventoryOrdinarySlots(kit).some(c=>c?.type===type)||poiAnyChestHas(kit,type)||kit.drops?.some(d=>d.type===type);
          }
          function poiOrvasRewardMask(mask){return Number.isInteger(mask)&&mask>=0&&mask<=7?mask:0}
          function poiOrvasRewardGrant(kit,grant=true){
           const old=kit.armedDrops||[];let drops=old,mask=poiOrvasRewardMask(kit.orvasRewards);
           for(const reward of Object.values(POI_ORVAS_REWARDS)){
            if(mask&reward.bit)continue;
            const {bit,...drop}=reward;
            const exists=old.some(d=>poiOrvasRewardValid(d)===reward)||poiOrvasRewardOwned(kit,reward.type);
            if(!exists&&!grant)continue;
            mask|=bit;
            if(!exists)drops=[...drops,{...drop,durability:poiEquipmentDurabilityMax(drop.type)}];
           }
           return mask!==kit.orvasRewards&&mask?{...kit,orvasRewards:mask,...(drops!==old?{armedDrops:drops}:{})}:kit;
          }
          function poiOrvasRewardRestore(kit,raw,minute=poiDungeonPopulationMinute()){
           const when=raw?.version===1?raw.dead?.['davidTemple.david']:null;
           return poiOrvasRewardGrant(kit,Number.isSafeInteger(when)&&when>=0&&when<=minute);
          }
          // END ORVAS REWARD CORE
          SOURCE
          cat >.qa/art.js <<'SOURCE'
          // BEGIN ORVAS TROPHY ART
          const POI_ORVAS_EYES=Object.freeze([[-.093,.47,.201],[.093,.47,.201]]);
          function poiOrvasHeadGeometry(m,x,y,z){
           const P=(a,b,c)=>[x+a,y+b,z+c];
           const stone=[.60,.566,.476],edge=[.76,.705,.593],shade=[.32,.30,.26],gold=[1.05,.77,.31];
           // Fractured neck, layered brow and copper-gold iris in the original
           // stone make the held item read as a trophy, not a wand.
           cube(m,x,y+.045,z,.24,.115,.25,shade);
           cube(m,x,y+.15,z,.30,.20,.29,stone);
           cube(m,x,y+.32,z-.015,.35,.29,.33,stone);
           cube(m,x,y+.54,z-.022,.27,.10,.286,edge);
           for(const [a,b,f] of POI_ORVAS_EYES){
            cube(m,x+a,y+b-.035,z+f-.030,.137,.11,.050,shade);
            quad(m,P(a-.046,b-.056,f),P(a+.038,b-.045,f),P(a+.040,b+.037,f),P(a-.038,b+.028,f),gold);
            tri(m,P(a-.024,b-.035,f+.002),P(a+.024,b-.026,f+.002),P(a,b+.026,f+.002),[1.35,1.18,.64]);
           }
           const strip=.198;
           quad(m,P(-.128,.552,strip),P(.128,.552,strip),P(.102,.569,.127),P(-.102,.569,.127),edge);
           tri(m,P(-.10,.31,.16),P(.08,.294,.156),P(.076,.330,.159),shade);
          }
          function poiOrvasGreatswordGeometry(m,x,y,z){
           const P=(a,b,c)=>[x+a,y+b,z+c];
           const blade=[.58,.56,.49],cut=[.80,.769,.655],dark=[.36,.33,.28],gold=[.72,.55,.28];
           cube(m,x,y+.05,z,.23,.10,.20,gold);
           cube(m,x,y+.09,z,.118,.44,.115,dark);
           cube(m,x,y+.53,z,.86,.15,.19,dark);
           cube(m,x,y+.56,z,.24,.12,.22,gold);
           for(const side of [-1,1]){
            const b=side,apex=P(0,3.14,0),base=P(.30*b,.67,0),shoulder=P(.346*b,2.83,0);
            const face=P(.05*b,.67,.12),tip=P(.078*b,2.77,.09);
            quad(m,base,shoulder,tip,face,cut);
            tri(m,shoulder,apex,tip,cut);
            quad(m,face,tip,P(0,2.79,.143),P(0,.67,.15),blade);
            tri(m,tip,apex,P(0,2.79,.143),blade);
            quad(m,P(.05*b,.67,-.12),P(.078*b,2.77,-.09),shoulder,base,cut);
            tri(m,P(.078*b,2.77,-.09),apex,shoulder,cut);
            quad(m,P(0,.67,-.15),P(0,2.79,-.143),P(.078*b,2.77,-.09),P(.05*b,.67,-.12),dark);
            tri(m,P(0,2.79,-.143),apex,P(.078*b,2.77,-.09),blade);
           }
          }
          function poiOrvasTwinGeometry(m,x,y,z){
           const blades=mesh();poiOrvasGreatswordGeometry(blades,0,0,0);
           for(const side of [-1,1])for(let i=0;i<blades.p.length;i+=3){
            const a=side*.20,c=Math.cos(a),s=Math.sin(a),px=blades.p[i]*.66,py=blades.p[i+1]*.66;
            m.p.push(x+side*.17+px*c-py*s,y+py*c+px*s,z+side*.10+blades.p[i+2]*.66);
            m.n.push(blades.n[i]*c-blades.n[i+1]*s,blades.n[i+1]*c+blades.n[i]*s,blades.n[i+2]);
            m.c.push(blades.c[i],blades.c[i+1],blades.c[i+2]);
           }
          }
          // END ORVAS TROPHY ART
          SOURCE
          cat >.qa/combat.js <<'SOURCE'
          // BEGIN ORVAS PLAYER BEAM
          let poiOrvasPlayerBeam=null,poiOrvasBeamGpu=null;
          const POI_ORVAS_BEAM_MS=210,POI_ORVAS_EYE_LIFT=.055,POI_ORVAS_EYE_AHEAD=.07;
          function poiOrvasHeadPose(p,ms){
           const raise=Math.min(1,ms/Math.max(1,p.hit*.78)),lower=Math.min(1,Math.max(0,(ms-p.hit-160)/Math.max(1,p.pose-p.hit-160)));
           const t=(raise*raise*(3-2*raise))*(1-lower*lower*(3-2*lower));
           return {strike:1.38*t,guard:.60*t,sweep:-.08*t,twist:0};
          }
          function poiOrvasTrophyBase(wrist){
           return [wrist[0],wrist[1]+POI_ORVAS_EYE_LIFT,wrist[2]+POI_ORVAS_EYE_AHEAD];
          }
          function poiOrvasWorldEyes(shot){
           const o=shot.aim,d={x:shot.dx,z:shot.dz},w=poiOrvasTrophyBase(poiPlayerWeaponHands(poiOrvasHeadPose(shot.profile,shot.profile.hit),0).right.wrist);
           const h=poiCreekPlayerHeight(shot.contactAt)+o.y*1.4+.03;
           return POI_ORVAS_EYES.map(e=>{
            const x=w[0]+e[0],z=w[2]+e[2];
            return {x:o.x+x*d.z+z*d.x,y:o.y,z:o.z-x*d.x+z*d.z,h:h+w[1]+e[1]};
           });
          }
          function poiOrvasBeamResolve(shot,now){
           if(!shot.aim||!poiEquipmentSpendWeapon('equipOrvasHead'))return false;
           const d={x:shot.dx,z:shot.dz},eyes=poiOrvasWorldEyes({...shot,contactAt:now}),o=shot.aim,pass=poiAimWall(o),max=shot.profile.range;
           const targets=poiAimTargetList(o,max+1,now);
           const rays=eyes.map(e=>{
            const leadX=e.x-o.x,leadZ=e.z-o.z,lead=Math.hypot(leadX,leadZ),heading=poiAimUnit(leadX,leadZ);
            const open=!heading||poiAimWallLimit(o,heading,lead,pass)+POI_AIM_EPS>=lead;
            const left=Math.max(0,max-(leadX*d.x+leadZ*d.z));
            return {...e,end:open?poiAimWallLimit(e,d,left,pass):0};
           });
           const muzzle={x:(eyes[0].x+eyes[1].x)/2,z:(eyes[0].z+eyes[1].z)/2,y:o.y};
           const q={kind:'beam',sx:muzzle.x-d.x*.28,sz:muzzle.z-d.z*.28,dx:d.x,dz:d.z,y:o.y};
           let best=null,depth=Infinity,hitRay=-1;
           for(const t of targets){
            if(t.id.y!==o.y||!poiDavidArea(q,{...t,y:t.id.y}))continue;
            const dx=t.x-muzzle.x,dz=t.z-muzzle.z,at=dx*d.x+dz*d.z,len=Math.hypot(dx,dz);
            const line=poiAimUnit(dx,dz);
            const free=rays.findIndex(r=>r.end>POI_AIM_EPS&&at<=r.end+POI_AIM_EPS);
            if(free<0||at>=depth||!line||poiAimWallLimit(muzzle,line,len,pass)+POI_AIM_EPS<len)continue;
            best=t;depth=at;hitRay=free;
           }
           if(best){
            // The paired filaments are one attack, with one consumption and one
            // damage event. Neither extends through its own first physical wall.
            for(const r of rays)r.end=Math.min(r.end,depth);
            poiPlayerDamageTarget([best.id,best.state],Math.round(best.x),Math.round(best.z),shot.profile.damage,shot.type,now,true);
           }
           poiOrvasPlayerBeam={rays,d,start:now,level:o.y,hitRay};
           if(typeof poiAudioAllowed==='function'&&poiAudioAllowed()&&poiAudioEnabled&&poiAudioLevels.master&&poiAudioLevels.se){
            poiAudioStart();
            const ctx=poiAudioContext;
            if(ctx?.state==='running')try{
             const t=ctx.currentTime,g=.46;
             poiPlayImpactBuffer(poiDavidAlienBuffer(ctx),t,g,(_source,node)=>{
              node.gain.setValueAtTime(0,t);
              node.gain.linearRampToValueAtTime(g,t+.025);
              node.gain.setValueAtTime(g,t+.105);
              node.gain.linearRampToValueAtTime(0,t+.195);
             },.21);
            }catch{}
           }
           return true;
          }
          function poiOrvasCutResolve(shot,now,kind,index=0){
           const o=shot.aim,q={kind,sx:o.x,sz:o.z,dx:shot.dx,dz:shot.dz,y:o.y},pass=poiAimWall(o);
           const range=kind==='sweep'?Math.max(POI_DAVID_SWEEP_FORWARD,POI_DAVID_SWEEP_SIDE):Math.hypot(3.55,1.5);
           const hits=poiAimTargetList(o,range,now).filter(t=>{
            if(t.id.y!==o.y||!poiDavidArea(q,{...t,y:t.id.y}))return false;
            const x=t.x-o.x,z=t.z-o.z,n=Math.hypot(x,z),dir=poiAimUnit(x,z);
            return dir&&poiAimWallLimit(o,dir,n,pass)+POI_AIM_EPS>=n;
