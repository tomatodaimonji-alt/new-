name: Exact committed target tracking
on:
  push:
    branches: ['dot/workshop-david-discovery-qa']
permissions:
  contents: read
jobs:
  tracking:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7543d5180808f58c2ad584a7f02757f97b532fb1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact candidate
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = bb4f17f53155553b710d9b599ba8bf91bf5ac389
          mkdir -p .qa/tests
          cat >.qa/build.py <<'SOURCE'
          from pathlib import Path
          import sys
          src,dst=map(Path,sys.argv[1:]);s=src.read_bytes()
          def rep(a,b):
           global s
           if isinstance(a,str):a=a.encode()
           if isinstance(b,str):b=b.encode()
           assert s.count(a)==1,(a,s.count(a))
           s=s.replace(a,b,1)
          def before(a,code):
           rep(a,code.encode()+a.encode())
          before('function poiAimNewShot(shot,now){',Path(__file__).with_name('tracking.js').read_text())
          rep(' const aimed={...shot,aim:o,dx:d.x,dz:d.z};',
          ''' const track=typeof poiAimPin==='function'?poiAimPin(lock,o,d):null;
           if(track)poiAimAttack.track=track;
           let aimed={...shot,aim:o,dx:d.x,dz:d.z,...(track?{track}:null)};
           if(track)aimed=poiAimTrack(aimed,now,o);''')
          rep(' return winner?{x:Math.floor(winner.x+.5),z:Math.floor(winner.z+.5),distance:Math.hypot(winner.x-o.x,winner.z-o.z),',
          ''' if(shot.track&&!poiAimPinContains(shot,winner))winner=null;
           return winner?{x:Math.floor(winner.x+.5),z:Math.floor(winner.z+.5),distance:Math.hypot(winner.x-o.x,winner.z-o.z),''')
          rep("function poiAimFlightBegin(shot,now){\n const o=shot.aim,",
          '''function poiAimFlightBegin(shot,now){
           if(shot.track&&typeof poiAimTrack==='function'&&!shot.track.sealed){
            shot=poiAimTrack(shot,now);
            shot.track.sealed=true;
           }
           const o=shot.aim,''')
          rep(' if(c&&c.state.hp>0&&poiMonsterStates.get(c.id)===c.state)poiPlayerWeaponResolve(s,now,',
          ''' if(c&&c.state.hp>0&&poiMonsterStates.get(c.id)===c.state&&(!s.track||poiAimPinContains(s,c)))poiPlayerWeaponResolve(s,now,''')
          rep('  poiPlayerDamageTarget([best.id,best.state],Math.round(best.x),Math.round(best.z),',
          '''  if(!shot.track||poiAimPinContains(shot,best))poiPlayerDamageTarget([best.id,best.state],Math.round(best.x),Math.round(best.z),''')
          rep(' if(!hits.length)return false;\n if(!shot.orvasPaid',
          ''' if(!hits.length||shot.track&&!hits.some(c=>poiAimPinContains(shot,c)))return false;
           if(!shot.orvasPaid''')
          rep("  landed=poiOrvasCutResolve({...a,aim},now,'double',i);",
          '''  contact=typeof poiAimTrack==='function'?poiAimTrack(a,now,aim):{...a,aim},
            landed=poiOrvasCutResolve(contact,now,'double',i);''')
          rep(" if(!hits.length){if(shot.type==='equipWoodSword'||arc)",
          ''' if(shot.track&&!hits.some(c=>poiAimPinContains(shot,c)))hits.length=0;
           if(!hits.length){if(shot.type==='equipWoodSword'||arc)''')
          rep(' if(a.aim)contact.aim=poiAimOrigin(now);',
          ''' if(a.aim)contact.aim=poiAimOrigin(now);
           if(a.track&&typeof poiAimTrack==='function')Object.assign(contact,poiAimTrack(contact,now,contact.aim));''')
          rep(' const aim=typeof poiAimAttack!==\'undefined\'&&poiWalkAttackPosePending&&poiAimAttack?.started===poiWalkActionStarted&&poiAimAttack.y===poiWalkLevel?poiAimAttack:null;',
          ''' const aim=typeof poiAimAttack!=='undefined'&&poiWalkAttackPosePending&&poiAimAttack?.started===poiWalkActionStarted&&poiAimAttack.y===poiWalkLevel?poiAimAttack:null;
           if(aim?.track&&!aim.track.sealed&&typeof poiAimTrack==='function'){
            // The bearing used by this uploaded body is the same pinned live
            // bearing resolved by the committed contact, never the ambient lock.
            poiAimTrack({track:aim.track},now);
           }''')
          rep(" let locked=poiAimLocked;\n if(locked&&locked.id.y===o.y",
              """ if(!force&&typeof poiAimCombatPinnedMarker==='function'){
            const pinned=poiAimCombatPinnedMarker(o,now);
            if(pinned!==undefined)return pinned;
           }
           let locked=poiAimLocked;
           if(locked&&locked.id.y===o.y""")
          dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(s)
          SOURCE
          cat >.qa/tracking.js <<'SOURCE'
          // BEGIN COMMITTED ATTACK TRACKING
          function poiAimPin(lock,o,d){
           return lock?.id&&lock.state&&poiMonsterStates.get(lock.id)===lock.state?
            {obj:lock.id,state:lock.state,map:world,site:facilitySite,y:o.y,dx:d.x,dz:d.z,lost:false,sealed:false}:null;
          }
          function poiAimTrack(shot,now,o=poiAimOrigin(now)){
           const t=shot.track;
           if(!t)return {...shot,aim:o};
           if(t.sealed||shot.phase==='flight')return shot;
           const s=t.state,v=t.obj;
           if(!t.lost&&(t.map!==world||t.site!==facilitySite||o.y!==t.y||v.y!==o.y||
              poiMonsterStates.get(v)!==s||s.hp<=0||v.type==='monsterStoneDavid'&&(!s.david?.awake||s.david.returning)||
              typeof poiDungeonVisualVisible==='function'&&!poiDungeonVisualVisible(v.x,v.z,v.y)))t.lost=true;
           if(!t.lost){
            const p=poiMonsterPose(v,s,now,true),d=poiAimUnit(p.x-.5-o.x,p.z-.5-o.z);
            if(d){t.dx=d.x;t.dz=d.z}
           }
           const a=poiAimAttack;
           if(a?.track===t){
            a.heading=Math.atan2(-t.dx,t.dz);
            if(a.spearVisual){a.spearVisual.dx=t.dx;a.spearVisual.dz=t.dz}
           }
           return {...shot,x:Math.floor(o.x+.5),z:Math.floor(o.z+.5),aim:o,dx:t.dx,dz:t.dz,lockedMiss:t.lost};
          }
          function poiAimPinContains(shot,target){
           return !shot.track||(!shot.lockedMiss&&target?.id===shot.track.obj&&target.state===shot.track.state);
          }
          function poiAimCombatPinnedMarker(o,now){
           const a=poiAimAttack,t=a?.track;
           if(!t||t.sealed||a.started!==poiWalkActionStarted||a.y!==o.y||!poiWalkAttackPosePending)return undefined;
           if(poiAimTrack({track:t},now,o).lockedMiss)return null;
           const p=poiMonsterPose(t.obj,t.state,now,true);
           return {id:t.obj,state:t.state,x:p.x-.5,z:p.z-.5,y:p.y,p};
          }
          // END COMMITTED ATTACK TRACKING
          SOURCE
          cat >.qa/tests/attack-target-tracking.test.cjs <<'SOURCE'
          const assert=require('node:assert/strict'),test=require('node:test'),fs=require('node:fs'),vm=require('node:vm');
          const h=fs.readFileSync(process.env.HTML||'world-editor.html','utf8');
          const cut=(a,b)=>{const i=h.indexOf(a),j=h.indexOf(b,i+1);assert(i>=0&&j>i,a);return h.slice(i,j)};
          function fixture(){
           const obj={type:'monsterSlime',x:3,z:0,y:0},s={hp:100,x:3,z:0},alt={type:'monsterGoblin',x:4,z:2,y:0},sa={hp:100,x:4,z:2};
           const c={world:[],facilitySite:{},poiAimAttack:null,poiMonsterStates:new Map([[obj,s],[alt,sa]]),obj,s,alt,sa,
            weapon:()=>({profile:{range:8},type:'equipWoodBow',started:0,y:0}),pose:{x:0,z:0,y:0,dir:{x:1,z:0}},poiWalkLevel:0,
            poiAimOrigin:()=>c.pose,poiCombatLockUpdate:()=>c.lock,poiMonsterPose:(_o,s)=>({x:s.x+.5,z:s.z+.5,y:0}),
            poiAimTargetList:()=>[...c.poiMonsterStates].filter(([o,s])=>s.hp>0&&o.y===c.pose.y).map(([id,state])=>({id,state,x:state.x,z:state.z,y:0})),
            poiAimWall:()=>((x,z)=>!c.wall||x<=0),poiPlayerFlightMs:(_p,n)=>n,poiSound(){},poiPlayerWeaponVisual:null,poiPlayerWeaponPending:null};
           c.lock={id:obj,state:s,x:s.x,z:s.z};
           const tail=cut('function poiAimNewShot(', '// BEGIN OVERSIZED MELEE BODY');
           const addition=h.includes('// BEGIN COMMITTED ATTACK TRACKING')?cut('// BEGIN COMMITTED ATTACK TRACKING','// END COMMITTED ATTACK TRACKING'):'';
           vm.createContext(c);vm.runInContext(cut('const POI_AIM_EPS=', 'function poiAimChooseLock')+tail+addition+cut('function poiAimTrace(', 'function poiAimFlightFrame('),c);
           return {c,r:x=>vm.runInContext(x,c)};
          }
          test('accepted identity follows live moving target and strafing origin, never passes through an alternate body',()=>{
           const {c,r}=fixture();
           r("a=poiAimNewShot({...weapon(),type:'kitchenKnife'},0)");
           c.pose={x:2,z:2,y:0,dir:{x:-1,z:0}};c.s.x=2;c.s.z=2.84;c.sa.x=2;c.sa.z=2.42;
           c.lock={id:c.alt,state:c.sa,x:c.sa.x,z:c.sa.z};
           let j=r('contact=poiAimTrack(a,100); poiAimTrace(contact,1,100)');assert.equal(j.monster,null);
           assert.equal(r('contact.dz'),1);
           c.sa.x=2.7;
           j=r('poiAimTrace(poiAimTrack(a,110),1,110)');assert.equal(j.monster[0],c.obj);
           c.wall=true;assert.equal(r('poiAimTrace(poiAimTrack(a,120),1,120).monster'),null);
          });
          test('lost target never reacquires a closer alternate; no-lock attack uses original yaw from live origin',()=>{
           const {c,r}=fixture();
           r('a=poiAimNewShot(weapon(),0)');c.s.hp=0;c.sa.x=1;c.sa.z=0;
           assert.equal(r('poiAimTrace(poiAimTrack(a,200),8,200).monster'),null);
           c.s.hp=100;assert(r('poiAimTrack(a,210).lockedMiss'));
           c.lock=null;r('b=poiAimNewShot(weapon(),220)');
           c.pose={x:.2,z:0,y:0,dir:{x:0,z:1}};
           assert.equal(r('poiAimTrace(poiAimTrack(b,230),8,230).monster[0]'),c.alt);
          });
          test('bow follows to actual release and immediately seals fixed direction',()=>{
           const {c,r}=fixture();
           r('a=poiAimNewShot(weapon(),0)');c.s.x=4;c.s.z=4;
           r('poiAimFlightBegin(a,325)');
           const a=r('poiPlayerWeaponPending');assert(Math.abs(a.dz-Math.SQRT1_2)<1e-6);
           c.s.x=1;c.s.z=-1;
           assert.equal(r('poiAimTrack(poiPlayerWeaponPending,330).dz'),a.dz);
          });
          SOURCE
          cat >.qa/tests/attack-target-tracking-browser.mjs <<'SOURCE'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import {Script} from 'node:vm';
          let h=readFileSync(process.argv[2]??'world-editor.html','utf8');
          const insert=(a,b)=>{assert.equal(h.split(a).length,2,a);h=h.replace(a,b)};
          const mark="if(facilityParams.get('test')==='1')window.__editorTest={";
          insert(mark,`
           window.__trackedTest={
            frame:()=>render(),
            stage:(slot,x,z)=>{
             if(!workshopResumeRestorePosition({x:24,z:108,y:0,facing:1}))return false;
             poiMonsterStates.clear();poiCombatLockReset();
             const add=(n,x,z)=>{
              const o={x:Math.round(x),z:Math.round(z),y:0,type:'monsterSlime',rot:0,qa:n},s=poiCombatActorMake(o);
              s.hp=100;s.townOwned=true;s.x=s.fromX=x;s.z=s.fromZ=z;
              poiMonsterStates.set(o,s);poiMonsterMeshDirty=true;return [o,s];
             };
             const q=window.__trackedTest;
             q.add=add;q.target=add('pinned',x,z);
             q.alt=null;return poiEquipHotbarItem(slot)?.ok;
            },
            alternate:(x,z)=>{const q=window.__trackedTest;q.alt=q.add('alternate',x,z)},
            moveTarget:(x,z)=>{
             const s=window.__trackedTest.target[1];s.x=s.fromX=x;s.z=s.fromZ=z;
            },
            state:()=>{
             const q=window.__trackedTest,a=poiPlayerWeaponPending,aim=poiAimAttack,v=poiPlayerWeaponVisual,p=poiAimOrigin(performance.now()),
              marker=poiCombatLockUpdate(p,performance.now());
             return {now:performance.now(),ready:poiAttackReady,started:poiWalkActionStarted,pos:[p.x,p.z],side:q.target?.[1]?.hp,
              alternate:q.alt?.[1]?.hp,target:a?.track?.obj?.qa??aim?.track?.obj?.qa,marker:marker?.id?.qa,
              cursor:a?.orvasCursor,pending:!!a,actual:q.actual,
              flight:v&&{dx:v.dx,dz:v.dz,origin:[v.aim.x,v.aim.z],type:v.type}};
            }
           };`+mark);
          const upload='function poiBuildPlayerMesh(weapon,pose,gear,stride=0,r=0,x=0,y=0,z=0,heading=null,worldSpear=false){';
          insert(upload,upload+`if(worldSpear&&window.__trackedTest)window.__trackedTest.actual={weapon,heading,x:x-.5,z:z-.5};`);
          insert(' requestAnimationFrame(render);',' if(!window.__trackManual)requestAnimationFrame(render);');
          for(const [,js] of h.matchAll(/<script(?: [^>]*)?>([\s\S]*?)<\/script>/g))new Script(js);
          if(process.env.ATTACK_TRACK_PARSE_ONLY){console.log('Exact committed attack native fixture parses');process.exit(0)}
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_PACKAGE??'playwright');
          const server=createServer((req,res)=>{res.setHeader('Content-Type','text/html; charset=utf-8');res.end(req.url==='/seed'?'<title>tracking QA</title>':h)});
          await new Promise(r=>server.listen(0,'127.0.0.1',r));const url='http://127.0.0.1:'+server.address().port;
          let b;
          try{
           b=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
           const ctx=await b.newContext({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:.68});
           const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));p.setDefaultTimeout(18000);
           await p.clock.install({time:new Date('2026-04-01T10:00:00Z')});
           await p.goto(url+'/seed');
           await p.evaluate(()=>{
            const slots=Array(27).fill(null);slots[0]={type:'equipWoodSword',count:1,durability:100};
            slots[2]={type:'equipOrvasTwinGreatswords',count:1,durability:210};slots[3]={type:'equipWoodBow',count:1,durability:100};
            localStorage.setItem('world-workshop-hotbar-v1',JSON.stringify({version:1,weaponDurabilityVersion:2,weapon:null,potions:0,slots}));
            localStorage.setItem('world-workshop-resume-v1',JSON.stringify({version:1,route:'facility',id:'base',play:true,
             position:{x:24,z:108,y:0,facing:1},townLayout:5,townMapHeight:128,
             view:{yaw:0,zoom:1.05,panX:0,panZ:0,level:0,hideUpper:false,top:false,third:false,orbitYaw:0,orbitPitch:.24,orbitDistance:5.5}}));
           });
           await p.goto(url+'/?resume=1&test=1',{waitUntil:'domcontentloaded'});await p.locator('#pineStartupCover').waitFor({state:'hidden'});
           await p.clock.pauseAt(await p.evaluate(()=>Date.now()+195));
           await p.evaluate(()=>{window.__trackManual=true});
           const q=()=>p.evaluate(()=>window.__trackedTest.state());
           const frame=async(ms=40)=>{await p.clock.fastForward(ms);await p.evaluate(()=>window.__trackedTest.frame());return q()};
           const until=async(fn,max=75)=>{let s=await q();for(let i=0;i<max&&!fn(s);i++)s=await frame();assert(fn(s),JSON.stringify(s));return s};
           const tap=async()=>{
            const k=await p.locator('#poiWalkAction').boundingBox();assert(k);
            await p.touchscreen.tap(k.x+k.width/2,k.y+k.height/2);
           };
           const pad=await p.locator('#poiAnalogPad').boundingBox();assert(pad);
           const stick={x:Math.round(pad.x+pad.width/2),y:Math.round(pad.y+pad.height/2),id:1,radiusX:5,radiusY:5,force:.8};
           const cd=await ctx.newCDPSession(p);
           const send=(type,touchPoints)=>cd.send('Input.dispatchTouchEvent',{type,touchPoints});
           const push=async()=>{await send('touchStart',[stick]);await send('touchMove',[{...stick,y:stick.y+25}]);};
           const end=()=>send('touchEnd',[]);
           const begin=async(i,x,z)=>{
            await until(s=>!s.pending&&s.now>=s.ready);
            assert(await p.evaluate(([i,x,z])=>window.__trackedTest.stage(i,x,z),[i,x,z]));
            await frame();
            await tap();
            const live=await until(s=>s.pending&&s.target==='pinned',12);
            assert.equal(live.marker,'pinned');return live;
           };
           const first=await begin(2,26,108);
           await p.evaluate(()=>window.__trackedTest.alternate(23.4,108.3));
           await push();
           let moved=await until(s=>Math.abs(s.pos[1]-first.pos[1])>.7,15);
           await end();
           assert(Math.abs(moved.actual.heading-first.actual.heading)>.20,JSON.stringify({first,moved}));
           assert.equal(moved.marker,'pinned');assert.equal(moved.target,'pinned');
           const one=await until(s=>s.cursor===1,35);
           assert.equal(one.side,72);assert.equal(one.alternate,100);
           // Move the exact same authored instance to a new bearing between the
           // downstrokes. The deliberately closer alternate remains behind.
           await p.evaluate(()=>window.__trackedTest.moveTarget(26.3,107.8));
           const two=await until(s=>!s.pending&&s.side===37,30);
           assert.equal(two.alternate,100);assert.equal(two.target,'pinned');
           assert(Math.abs(two.actual.heading-one.actual.heading)>.02);
           await begin(2,26,108);
           await p.evaluate(()=>{window.__trackedTest.moveTarget(31,108);window.__trackedTest.alternate(26,108)});
           const escape=await until(s=>!s.pending,40);
           assert.equal(escape.side,100);assert.equal(escape.alternate,100);
           await begin(3,27,108);
           await p.evaluate(()=>window.__trackedTest.moveTarget(27,110));
           const released=await until(s=>s.flight?.type==='equipWoodBow',20);
           assert(released.flight.dx>.7&&released.flight.dz>.4,JSON.stringify(released));
           await p.evaluate(()=>window.__trackedTest.moveTarget(27,106));
           const flying=await frame();
           assert.equal(flying.flight.dz,released.flight.dz);assert.equal(flying.flight.dx,released.flight.dx);
           assert.deepEqual(errors,[]);
           console.log('Actual touched twins maintain same enemy during physical stick strafe and two strikes; escaped pin does not substitute; bow remains fixed from true release.',JSON.stringify({one:one.side,two:two.side,moved:moved.pos,flight:released.flight}));
           await ctx.close();
          }finally{await b?.close();await new Promise(r=>server.close(r))}
          SOURCE
          python .qa/build.py world-editor.html .qa/world-editor.html
          test "$(git hash-object .qa/world-editor.html)" = eec5f4ba5f86023f312a66976b13e36039928463
      - name: Exact pin units and unchanged ranged/other melee baseline
        working-directory: .qa
        env:
          HTML: world-editor.html
        run: node --test tests/*.cjs ../tests/player-weapon-profiles-v194.test.cjs ../tests/punch-motion.test.cjs ../tests/bow-moving-release.test.cjs
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - name: Native touch twin strafe and true bow release
        working-directory: .qa
        run: node tests/attack-target-tracking-browser.mjs
