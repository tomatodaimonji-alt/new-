name: Snow pass prototype only
on:
  push:
    branches: ['dot/workshop-snow-prototype-qa']
permissions:
  contents: read
jobs:
  snow-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build isolated candidate from exact v266 and run unit fixtures
        shell: bash
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = f1fd4130cbb03b3676baa72a9a260c1792ab68e7
          mkdir -p .snow/tests
          cat >.snow/build.py <<'LOCAL_SOURCE'
          import pathlib,sys
          p=pathlib.Path(__file__).parent
          src,out=map(pathlib.Path,sys.argv[1:])
          s=src.read_text()
          def sub(a,b):
           global s
           assert s.count(a)==1,a
           s=s.replace(a,b,1)
          sub('function workshopResumeDecode(raw){',(p/'region.js').read_text()+'\n'+(p/'activation.js').read_text()+'\nfunction workshopResumeDecode(raw){')
          sub("const c=kind==='earth'?[.43+r*.09,.35+r*.07,.25+r*.05]", "const c=kind==='poiSnowGround'?[.76+r*.14,.82+r*.12,.90+r*.08]:kind==='earth'?[.43+r*.09,.35+r*.07,.25+r*.05]")
          sub('function isFloor(t){return ROAD_IDS.has(t)||','function isFloor(t){return t===\'poiSnowGround\'||ROAD_IDS.has(t)||')
          sub(" const canStep=(sx,sz)=>poiWalkCanStep(poiWalkX+sx,poiWalkZ+sz,poiWalkX,poiWalkZ,undefined,true)&&",
          """ const canStep=(sx,sz)=>((typeof poiSnowPassEdge==='function'&&poiSnowPassEdge(poiWalkX+sx,poiWalkZ+sz,poiWalkX,poiWalkZ))||
            poiWalkCanStep(poiWalkX+sx,poiWalkZ+sz,poiWalkX,poiWalkZ,undefined,true))&&""")
          sub("    clear=poiWalkCanStep(x,z,fromX,fromZ,undefined,true);",
          """    clear=(typeof poiSnowPassEdge==='function'&&!!poiSnowPassEdge(x,z,fromX,fromZ))||poiWalkCanStep(x,z,fromX,fromZ,undefined,true);""")
          sub("  if(!poiWalkCanStep(x,z,fromX,fromZ,undefined,true))return false;",
          """  if(!(typeof poiSnowPassEdge==='function'&&poiSnowPassEdge(x,z,fromX,fromZ))&&!poiWalkCanStep(x,z,fromX,fromZ,undefined,true))return false;""")
          sub("function poiWalkEnterCell(dx,dz,now,continuous=false,onDoorCue){",
          """function poiWalkEnterCell(dx,dz,now,continuous=false,onDoorCue){
           if(typeof poiSnowPassEdge==='function'&&poiSnowPassEdge(poiWalkX+dx,poiWalkZ+dz,poiWalkX,poiWalkZ)){
            if(poiSnowPassUse(poiWalkX+dx,poiWalkZ+dz,now))return continuous?'portal':dx?'x':'z';
            return continuous?'portal':false;
           }""")
          sub("return {version:1,route:d.route,id:d.route==='facility'?d.id:null,play:d.play===true,position,",
          """return {version:1,route:d.route,id:d.route==='facility'?d.id:null,play:d.play===true,position,
            ...(typeof poiSnowPassDecode==='function'?poiSnowPassDecode(d,position):{}),""")
          sub("const record=override||{version:1,route,id:facilitySite?.id??null,play:poiWalkActive,",
          """const record=override||{version:1,route,id:facilitySite?.id==='snowpass'?'base':facilitySite?.id??null,play:poiWalkActive,
            ...(facilitySite?.id==='snowpass'&&poiWalkActive?{region:'snowpass',regionHp:poiPlayerHP}:{}),""")
          sub("  if(s.play){\n   facilitySetPlay(true);\n   workshopResumeRestorePosition(facilitySite.id==='base'?workshopResumeTownPosition(s,offset):s.position);",
          """  if(s.play){
             const snow=s.region==='snowpass'&&typeof poiSnowPassApply==='function'&&poiSnowPassApply({region:'snowpass',x:12,z:0,facing:2},performance.now(),true);
             facilitySetPlay(true);
             workshopResumeRestorePosition(snow?s.position:facilitySite.id==='base'?workshopResumeTownPosition(s,offset):s.position);
             if(snow&&Number.isInteger(s.regionHp)){poiPlayerHP=s.regionHp;poiCombatHud()}""")
          sub(" facilityLoadMap(facilitySite.map);\n facilityPrepareFloorMasks();",
          """ if(facilitySite.id==='base')poiSnowPassSeam(facilitySite,facilitySite.map.world);
           facilityLoadMap(facilitySite.map);
           facilityPrepareFloorMasks();""")
          sub("  localSceneStatus:()=>facilityLocalSceneStatus(),","  snowInventoryQA:{markEditor:()=>{window.__snowBaseInitial=facilityInitialMap;world.push({x:2,z:2,y:0,type:'treePine',rot:0});facilitySurfaceEdited=true},sameEditor:()=>facilityInitialMap===window.__snowBaseInitial&&JSON.stringify(data())!==facilityInitialMap,drop:slot=>poiInventoryDrop(slot),gold:n=>poiGroundGoldDrop(n),editor:()=>facilitySetPlay(false),clock:()=>poiTownClockActive(),weapon:()=>poiEquippedWeapon(),markMusic:()=>window.__snowField=poiOrchestraDecks.get('outside')?.fieldLoop,fieldSame:()=>!!window.__snowField&&window.__snowField===poiOrchestraDecks.get('outside')?.fieldLoop},\n  snowPassRegion:()=>({id:facilitySite?.id,world:world.length,width:MAP_W,height:MAP_H,forest:!!facilitySite?.southForest,mapReady:!!sceneMesh?.count,timing:poiSnowPassTiming,actors:poiMonsterStates.size,spawn:[poiSpawnX,poiSpawnZ],switches:poiSnowPassSwitches,hp:poiPlayerHP,music:poiOrchestraScene(performance.now()),field:!!poiOrchestraDecks.get('outside')?.fieldLoop}),\n  localSceneStatus:()=>facilityLocalSceneStatus(),")
          # Extend the prototype palette so import validation and palette lookup accept snow.
          sub("{id:'treePine',name:'針葉樹'", "{id:'poiSnowGround',name:'積雪',icon:'▫',cat:'floor'},\n{id:'treePine',name:'針葉樹'")
          from ground import apply as ground
          s=ground(s,p)
          sub("""function facilitySetPlay(active){
           if(active===poiWalkActive)return;""","""function facilitySetPlay(active){
           if(active===poiWalkActive)return;
           // This region is a play-only route. Editor still opens the original base.
           if(!active&&facilitySite?.id==='snowpass'&&
              !poiSnowPassChange({region:'base',x:49,z:127,facing:0},performance.now()))return;""")
          sub("function poiTownClockActive(){\n return facilitySite?.id==='base'&&poiWalkActive", "function poiTownClockActive(){\n return (facilitySite?.id==='base'||facilitySite?.id==='snowpass')&&poiWalkActive")
          sub("function poiAudioMusicZone(){","function poiAudioMusicZone(){\n if(facilitySite?.id==='snowpass')return 'outside';")
          sub("const zone=facilitySite?.id==='base'?poiAudioMusicZone():'indoor';",
           "const zone=facilitySite?.id==='snowpass'?'outside':facilitySite?.id==='base'?poiAudioMusicZone():'indoor';")
          sub("  if(!facilityRoofMeshes.length)facilityBuildRoofs();",
           "  if(facilitySite.id!=='snowpass'&&!facilityRoofMeshes.length)facilityBuildRoofs();")
          sub(" if(typeof poiHitstopMarkDrawn==='function')poiHitstopMarkDrawn(performance.now());",
           " if(typeof poiSnowPassDrawMeasured==='function')poiSnowPassDrawMeasured();\n if(typeof poiHitstopMarkDrawn==='function')poiHitstopMarkDrawn(performance.now());")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(s)
          LOCAL_SOURCE
          cat >.snow/region.js <<'LOCAL_SOURCE'
          // BEGIN SNOW PASS PROTOTYPE
          const POI_SNOW_PASS=Object.freeze({id:'snowpass',name:'白嶺峠',width:24,height:29,base:{x:49,z:127},snow:{x:12,z:0}});
          function poiSnowPassLink(region,x,z,y,nx,nz){
           if(y!==0)return null;
           const s=POI_SNOW_PASS;
           if(region==='base'&&x===s.base.x&&z===s.base.z&&nx===x&&nz===z+1)return {region:s.id,...s.snow,y:0,facing:2};
           if(region===s.id&&x===s.snow.x&&z===s.snow.z&&nx===x&&nz===z-1)return {region:'base',...s.base,y:0,facing:0};
           return null;
          }
          function poiSnowPassDecode(d,p){
           const {id,width,height}=POI_SNOW_PASS;
           if(d?.route!=='facility'||d.id!=='base'||!Object.hasOwn(d,'region'))return {};
           // A foreign/invalid local coordinate is not a usable base coordinate.
           if(d.region!==id||d.play!==true||p?.y!==0||!Number.isInteger(p.x)||!Number.isInteger(p.z)||
              p.x<0||p.x>=width||p.z<0||p.z>=height)return {position:null};
           const hp=Number.isInteger(d.regionHp)&&d.regionHp>=1&&d.regionHp<=100?d.regionHp:null;
           return {region:id,...(hp===null?{}:{regionHp:hp})};
          }
          function poiSnowPassMap(){
           const s=POI_SNOW_PASS,y=0,p=(x,z)=>({x,z,y}),world=[],route=[p(12,0)];
           let x=12,z=0;
           for(const [tx,tz] of [[12,5],[9,5],[9,10],[14,10],[14,15],[10,15],[10,19],[15,19],[15,25]]){
            while(x!==tx||z!==tz){x+=Math.sign(tx-x);z+=Math.sign(tz-z);route.push(p(x,z))}
           }
           const trail=new Set(route.map(o=>o.x+','+o.z)),shoulder=new Set(route.flatMap(o=>[[o.x,o.z],[o.x+1,o.z],[o.x-1,o.z],[o.x,o.z+1],[o.x,o.z-1]].map(v=>v.join(','))));
           for(let z=0;z<s.height;z++)for(let x=0;x<s.width;x++){
            const key=x+','+z;
            world.push({x,z,y,type:trail.has(key)?'roadGravelFull':'poiSnowGround',rot:0});
            if(!shoulder.has(key)&&x>1&&x<s.width-2&&(x*29+z*47)%31<3)world.push({x,z,y,type:z%4?'treePine':'rockMossy',rot:(x+z)%4});
           }
           return {spawn:{...s.snow},name:s.name,id:s.id,difficulty:1,buildings:[],snowRoute:route,
            map:{format:'forest-world-v1',version:1,width:s.width,height:s.height,size:s.width,world,models:[],prefabs:[],terrainHeights:[],checks:[]}};
          }
          // END SNOW PASS PROTOTYPE
          LOCAL_SOURCE
          cat >.snow/activation.js <<'LOCAL_SOURCE'
          // BEGIN SNOW PASS ACTIVATION (prototype)
          let poiSnowPassBase=null,poiSnowPassSwitches=0,poiSnowPassTiming=null;
          function poiSnowPassSeam(site,world){
           if(site?.id!=='base')return false;
           const own=new Set(world.filter(o=>o.y===0).map(o=>o.x+','+o.z));
           // Extend west from the existing forest rest, then turn south. Leave any
           // grass already authored by v266 in place (it is walkable).
           for(let x=49;x<=54;x++)if(!own.has(x+',119'))world.push({x,z:119,y:0,type:'roadGravelFull',rot:0});
           for(let z=120;z<=127;z++)if(!own.has('49,'+z))world.push({x:49,z,y:0,type:'roadGravelFull',rot:0});
           return world.some(o=>o.x===49&&o.z===127&&o.y===0&&o.type==='roadGravelFull');
          }
          function poiSnowPassEdge(nx,nz,fx,fz){
           if(!poiWalkActive||pineAIActive||!facilitySite)return null;
           const link=poiSnowPassLink(facilitySite.id,fx,fz,poiWalkLevel,nx,nz);
           if(!link||!world.some(o=>o.x===fx&&o.z===fz&&o.y===0&&o.type==='roadGravelFull'))return null;
           return link;
          }
          function poiSnowPassPrepare(dest,cold=false){
           const onBase=facilitySite?.id==='base';
           if(onBase===(dest.region==='base')||!onBase&&!poiSnowPassBase)return null;
           const base=onBase?{site:facilitySite,world,monsters:poiMonsterStates,warm:!cold,
            spawn:cold?facilitySite.spawn:{x:poiSpawnX,z:poiSpawnZ},edited:facilitySurfaceEdited,initial:facilityInitialMap,
            width:MAP_W,height:MAP_H,terrainHeights,models,prefabs,checks:pineCheckMarks,maxLevel:worldMaxLevel,hasCellar:facilityHasCellar}:poiSnowPassBase;
           const incoming=onBase?poiSnowPassMap():base.site,map=onBase?incoming.map:null;
           const cells=(onBase?map.world:base.world).filter(o=>o.x===dest.x&&o.z===dest.z&&o.y===0);
           if(!cells.some(o=>o.type==='roadGravelFull')||cells.some(o=>isWallId(o.type)))return null;
           if(onBase)try{pineValidateWorldData(facilityExportMap(map))}catch(_e){return null}
           return {onBase,base,incoming,map};
          }
          function poiSnowPassApply(dest,now,cold=false,prepared=poiSnowPassPrepare(dest,cold)){
           if(!prepared)return false;
           const {onBase,base,incoming,map}=prepared,hp=poiPlayerHP,cooldown=poiAttackReady;
           if(onBase)poiSnowPassBase=base;
           poiWalkFrameNoRegionRemote();
           facilitySite=incoming;
           if(onBase)facilityLoadMap(map);
           else poiSnowPassRestoreBaseMap(base);
           facilityPrepareFloorMasks();facilitySurfaceEdited=onBase?false:base.edited;
           facilityInitialMap=onBase?JSON.stringify(data()):base.initial;
           poiMonsterStates=!onBase&&base.warm?base.monsters:new Map();
           if(!onBase&&!base.warm)poiResetCombat();
           else for(const state of poiMonsterStates.values()){state.playerAttack=null;state.nextAttack=Math.max(state.nextAttack||0,now+300)}
           const spawn=onBase?incoming.spawn:base.spawn;
           poiSpawnX=spawn.x;poiSpawnZ=spawn.z;
           poiWalkReset(dest.x,dest.z);poiWalkFacing=dest.facing;
           if(!onBase&&!base.warm)poiEconomyStart();
           if(!cold){poiPlayerHP=hp;poiAttackReady=cooldown}
           if(!cold){poiWalkNextReady=now+POI_WALK_MS;poiOtherworldTravelSerial++}
           mode='move';dirty=true;cursorDirty=true;
           facilityBuildRoofs();poiMiniInvalidate();
           $('facilitySessionName').textContent=facilitySite.name;
           if(poiWalkActive){poiWalkAvatar(now);poiWalkCamera();poiWalkStatus();poiCombatHud();poiHotbarRender()}
           poiSnowPassSwitches++;
           if(!onBase)poiSnowPassBase=null;
           return true;
          }
          function poiSnowPassRestoreBaseMap(saved){
           // This already-validated live snapshot never gets cloned/reparsed merely
           // to cross the seam. Keep its exact world/actor identity and rebuild only
           // scene resources tied to the active working map.
           MAP_W=saved.width;MAP_H=saved.height;world=saved.world;terrainHeights=saved.terrainHeights;
           models=saved.models;prefabs=saved.prefabs;worldMaxLevel=saved.maxLevel;pineCheckMarks=saved.checks;
           pineObjectSelection=null;pineSelectedTile=null;pineMoveArmed=false;pineCheckNodes.clear();
           $('pineCheckOverlay').replaceChildren();pineCheckRefresh();
           $('mapWidth').value=MAP_W;$('mapHeight').value=MAP_H;
           for(const id of ['rangeX1','rangeX2'])$(id).max=MAP_W-1;
           for(const id of ['rangeZ1','rangeZ2'])$(id).max=MAP_H-1;
           facilityUpdateCellarOption(saved.hasCellar);refreshPalette();
          }
          function poiSnowPassDrawMeasured(){
           const t=poiSnowPassTiming;
           if(t&&t.firstFrameMs===null&&sceneMesh?.count>0)t.firstFrameMs=performance.now()-t.start;
          }
          function poiWalkFrameNoRegionRemote(){
           poiStopRepeat();poiPlayerWeaponCancel();poiEnemyCancelPlayer();poiTownResidentsReset();
           poiInventoryReleaseMesh();facilityInvalidateScenes();
           if(poiEconomyMesh){gl.deleteBuffer(poiEconomyMesh.buf);poiEconomyMesh=null;poiEconomyMeshDirty=true}
           if(poiMonsterMesh){gl.deleteBuffer(poiMonsterMesh.buf);poiMonsterMesh=null}
           poiMonsterMeshDirty=true;
          }
          function poiSnowPassChange(dest,now){
           const start=performance.now(),prepared=poiSnowPassPrepare(dest);
           if(!prepared||!workshopResumeReady||workshopResumeLeaving||poiGameResetDeparture||poiGameResetBlocked)return false;
           const record={version:1,route:'facility',id:'base',play:true,townLayout:5,townMapHeight:128,
            position:{x:dest.x,z:dest.z,y:0,facing:dest.facing},view:workshopResumeView(),
            editorView:facilityEditView?workshopResumeView(facilityEditView):null,
            ...(dest.region==='snowpass'?{region:'snowpass',regionHp:poiPlayerHP}:{})};
           const raw=JSON.stringify(record);
           let backup,wrote=false;
           try{
            backup=localStorage.getItem(WORKSHOP_RESUME_KEY);
            localStorage.setItem(WORKSHOP_RESUME_KEY,raw);wrote=true;
            if(localStorage.getItem(WORKSHOP_RESUME_KEY)!==raw)throw Error('preview resume write was not durable');
           }catch(_e){
            if(wrote)try{if(backup===null)localStorage.removeItem(WORKSHOP_RESUME_KEY);else localStorage.setItem(WORKSHOP_RESUME_KEY,backup)}catch(__e){}
            toast('現在地を保存できないため、境界を越えられません。');return false;
           }
           try{
            if(!poiSnowPassApply(dest,now,false,prepared))throw Error('preview region failed to activate');
            workshopResumeRaw=raw;
            poiSnowPassTiming={start,region:dest.region,activationMs:performance.now()-start,firstFrameMs:null};
            return true;
           }catch(e){
            // A failed activation must never enter the saved destination.
            try{
             if(backup===null)localStorage.removeItem(WORKSHOP_RESUME_KEY);
             else localStorage.setItem(WORKSHOP_RESUME_KEY,backup);
             workshopResumeRaw=backup||'';
            }catch(_e){}
            console.warn('Snow pass region activation aborted',e);return false;
           }
          }
          function poiSnowPassUse(nx,nz,now){
           const dest=poiSnowPassEdge(nx,nz,poiWalkX,poiWalkZ);
           return !!dest&&poiSnowPassChange(dest,now);
          }
          // END SNOW PASS ACTIVATION
          LOCAL_SOURCE
          cat >.snow/ground.py <<'LOCAL_SOURCE'
          from pathlib import Path
          def apply(s,p):
           def sub(a,b):
            nonlocal s
            assert s.count(a)==1,a
            s=s.replace(a,b,1)
           sub("function poiHotbarHasKit(){return facilitySite?.id==='base'}",
            (p/'ground.js').read_text()+"\nfunction poiHotbarHasKit(){return facilitySite?.id==='base'||(typeof poiSnowGroundActive==='function'&&poiSnowGroundActive())}")
           sub("const drops=poiInventoryReadDrops(saved.drops);","const drops=poiInventoryReadDrops(typeof poiSnowGroundDecode==='function'?poiSnowGroundDecode(saved.drops,saved.snowDrops):saved.drops);")
           sub("poiGroundGoldDecode(saved.groundGold):[]","poiGroundGoldDecode(typeof poiSnowGroundDecode==='function'?poiSnowGroundDecode(saved.groundGold,saved.snowGroundGold):saved.groundGold):[]")
           sub("...(drops?.length?{drops}:{}),...(kit.groundGold?.length?{groundGold:kit.groundGold}:{})",
            "...(typeof poiSnowGroundSave==='function'?poiSnowGroundSave(drops,kit.groundGold):{...(drops?.length?{drops}:{}),...(kit.groundGold?.length?{groundGold:kit.groundGold}:{})})")
           a=s.index('function poiInventoryReadDrops('); z=s.index('function poiInventoryAllowed(',a)
           frag=s[a:z].replace("const key=d.x+','+d.z+','+d.y;","const key=(d.region==='snowpass'?'s:':'')+d.x+','+d.z+','+d.y;").replace("y:d.y,...(count","y:d.y,...(d.region==='snowpass'?{region:d.region}:{}),...(count")
           assert frag!=s[a:z];s=s[:a]+frag+s[z:]
           a=s.index('function poiGroundGoldDecode('); z=s.index('function poiDropNearestCell(',a)
           frag=s[a:z].replace("const key=p.x+','+p.z+','+p.y;","const key=(p.region==='snowpass'?'s:':'')+p.x+','+p.z+','+p.y;").replace("amount:p.amount}","amount:p.amount,...(p.region==='snowpass'?{region:p.region}:{})}")
           assert frag!=s[a:z];s=s[:a]+frag+s[z:]
           sub("return poiHotbarHasKit()&&poiWalkActive&&!pineAIActive&&poiWalkLevel===0;",
            "return facilitySite?.id==='base'&&poiHotbarHasKit()&&poiWalkActive&&!pineAIActive&&poiWalkLevel===0;")
           sub(" mark(kit.drops);mark(kit.groundGold);mark(poiArmedDrawList(kit));mark(poiMineFindList(kit));",
            """ const regional=typeof poiSnowGroundMatch==='function'?poiSnowGroundMatch:()=>true;
           const snow=typeof poiSnowGroundActive==='function'&&poiSnowGroundActive();
           mark((kit.drops||[]).filter(regional));mark((kit.groundGold||[]).filter(regional));
           if(!snow){mark(poiArmedDrawList(kit));mark(poiMineFindList(kit));""")
           sub(" mark(poiEconomyCaches.values());mark(poiEconomyDrops.values());",
            " mark(poiEconomyCaches.values());mark(poiEconomyDrops.values());}")
           sub("  (x,z,fromX,fromZ)=>route(x,z)&&poiWalkCanStep(x,z,fromX,fromZ),",
            "  (x,z,fromX,fromZ)=>(!snow||validPos(x,z))&&route(x,z)&&poiWalkCanStep(x,z,fromX,fromZ),")
           sub(" return location?{location:{...location,y}}:{reason:'blocked'};",
            " return location?{location:{...location,y,...(snow?{region:'snowpass'}:{})}}:{reason:'blocked'};")
           sub("pile=list.find(p=>p.x===x&&p.z===z&&p.y===poiWalkLevel)",
            "pile=list.find(p=>p.x===x&&p.z===z&&p.y===poiWalkLevel&&(typeof poiSnowGroundMatch!=='function'||poiSnowGroundMatch(p)))")
           sub("const item=list.find(d=>d.x===x&&d.z===z&&d.y===poiWalkLevel);",
            "const item=list.find(d=>d.x===x&&d.z===z&&d.y===poiWalkLevel&&(typeof poiSnowGroundMatch!=='function'||poiSnowGroundMatch(d)));")
           sub("{type:d.type,x:d.x,z:d.z,y:d.y}):d)","{type:d.type,x:d.x,z:d.z,y:d.y,...(d.region?{region:d.region}:{})}):d)")
           sub("if(item.type===POI_INVENTORY_HERB&&item.y===0&&kit.towerFind?.kind==='herb'",
            "if(!item.region&&item.type===POI_INVENTORY_HERB&&item.y===0&&kit.towerFind?.kind==='herb'")
           sub("    if(d.y!==poiWalkLevel||!validPos(d.x,d.z)||!poiDungeonVisualVisible(d.x,d.z,d.y))continue;",
            "    if(d.y!==poiWalkLevel||(typeof poiSnowGroundMatch==='function'&&!poiSnowGroundMatch(d))||!validPos(d.x,d.z)||!poiDungeonVisualVisible(d.x,d.z,d.y))continue;")
           sub(" if(!poiWalkDoorFoley(door,fromLevel,onDoorCue)&&!continuous)poiWalkFootstep(wet);",
            """ if(facilitySite?.id==='snowpass'){poiGroundGoldPickup(poiWalkX,poiWalkZ);poiInventoryPickup(poiWalkX,poiWalkZ)}
           if(!poiWalkDoorFoley(door,fromLevel,onDoorCue)&&!continuous)poiWalkFootstep(wet);""")
           return s
          LOCAL_SOURCE
          cat >.snow/ground.js <<'LOCAL_SOURCE'
          // BEGIN SNOW GROUND NAMESPACE
          function poiSnowGroundActive(){return typeof facilitySite!=='undefined'&&facilitySite?.id==='snowpass'}
          function poiSnowGroundMatch(record){return (record?.region==='snowpass')===poiSnowGroundActive()}
          function poiSnowGroundIn(p){
           return p&&p.y===0&&Number.isInteger(p.x)&&Number.isInteger(p.z)&&p.x>=0&&p.x<24&&p.z>=0&&p.z<29;
          }
          function poiSnowGroundDecode(base,snow){
           const old=Array.isArray(base)?base.map(p=>p&&Object.hasOwn(p,'region')?{...p,region:undefined}:p):[];
