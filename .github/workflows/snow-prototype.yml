name: Snow pass prototype only
on:
  push:
    branches: ['dot/workshop-snow-prototype-qa']
permissions:
  contents: read
jobs:
  snow-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build isolated candidate from exact v266 and run unit fixtures
        shell: bash
        run: |
          set -eu
          test "$(git hash-object world-editor.html)" = f1fd4130cbb03b3676baa72a9a260c1792ab68e7
          mkdir -p .snow/tests
          cat >.snow/build.py <<'LOCAL_SOURCE'
          import pathlib,sys
          p=pathlib.Path(__file__).parent
          src,out=map(pathlib.Path,sys.argv[1:])
          s=src.read_text()
          def sub(a,b):
           global s
           assert s.count(a)==1,a
           s=s.replace(a,b,1)
          sub('function workshopResumeDecode(raw){',(p/'region.js').read_text()+'\n'+(p/'activation.js').read_text()+'\nfunction workshopResumeDecode(raw){')
          sub("const c=kind==='earth'?[.43+r*.09,.35+r*.07,.25+r*.05]", "const c=kind==='poiSnowGround'?[.76+r*.14,.82+r*.12,.90+r*.08]:kind==='earth'?[.43+r*.09,.35+r*.07,.25+r*.05]")
          sub('function isFloor(t){return ROAD_IDS.has(t)||','function isFloor(t){return t===\'poiSnowGround\'||ROAD_IDS.has(t)||')
          sub("function poiWalkCanStep(x,z,fromX,fromZ,exceptMonster,skipNpcTile=false){\n if(!validPos(x,z))return false;",
          "function poiWalkCanStep(x,z,fromX,fromZ,exceptMonster,skipNpcTile=false){\n if(typeof poiSnowPassEdge==='function'&&poiSnowPassEdge(x,z,fromX,fromZ))return true;\n if(!validPos(x,z))return false;")
          sub("function poiWalkEnterCell(dx,dz,now,continuous=false,onDoorCue){",
          """function poiWalkEnterCell(dx,dz,now,continuous=false,onDoorCue){
           if(typeof poiSnowPassEdge==='function'&&poiSnowPassEdge(poiWalkX+dx,poiWalkZ+dz,poiWalkX,poiWalkZ)){
            if(poiSnowPassUse(poiWalkX+dx,poiWalkZ+dz,now))return continuous?'portal':dx?'x':'z';
            return continuous?'portal':false;
           }""")
          sub("return {version:1,route:d.route,id:d.route==='facility'?d.id:null,play:d.play===true,position,",
          """return {version:1,route:d.route,id:d.route==='facility'?d.id:null,play:d.play===true,position,
            ...(typeof poiSnowPassDecode==='function'?poiSnowPassDecode(d,position):{}),""")
          sub("const record=override||{version:1,route,id:facilitySite?.id??null,play:poiWalkActive,",
          """const record=override||{version:1,route,id:facilitySite?.id==='snowpass'?'base':facilitySite?.id??null,play:poiWalkActive,
            ...(facilitySite?.id==='snowpass'&&poiWalkActive?{region:'snowpass',regionHp:poiPlayerHP}:{}),""")
          sub("  if(s.play){\n   facilitySetPlay(true);\n   workshopResumeRestorePosition(facilitySite.id==='base'?workshopResumeTownPosition(s,offset):s.position);",
          """  if(s.play){
             const snow=s.region==='snowpass'&&typeof poiSnowPassApply==='function'&&poiSnowPassApply({region:'snowpass',x:12,z:0,facing:2},performance.now(),true);
             facilitySetPlay(true);
             workshopResumeRestorePosition(snow?s.position:facilitySite.id==='base'?workshopResumeTownPosition(s,offset):s.position);
             if(snow&&Number.isInteger(s.regionHp)){poiPlayerHP=s.regionHp;poiCombatHud()}""")
          sub(" facilityLoadMap(facilitySite.map);\n facilityPrepareFloorMasks();",
          """ if(facilitySite.id==='base')poiSnowPassSeam(facilitySite,facilitySite.map.world);
           facilityLoadMap(facilitySite.map);
           facilityPrepareFloorMasks();""")
          sub("  localSceneStatus:()=>facilityLocalSceneStatus(),","  snowPassRegion:()=>({id:facilitySite?.id,world:world.length,width:MAP_W,height:MAP_H,forest:!!facilitySite?.southForest,mapReady:!!sceneMesh?.count,actors:poiMonsterStates.size,switches:poiSnowPassSwitches,hp:poiPlayerHP}),\n  localSceneStatus:()=>facilityLocalSceneStatus(),")
          # Extend the prototype palette so import validation and palette lookup accept snow.
          sub("{id:'treePine',name:'針葉樹'", "{id:'poiSnowGround',name:'積雪',icon:'▫',cat:'floor'},\n{id:'treePine',name:'針葉樹'")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(s)
          LOCAL_SOURCE
          cat >.snow/region.js <<'LOCAL_SOURCE'
          // BEGIN SNOW PASS PROTOTYPE
          const POI_SNOW_PASS=Object.freeze({id:'snowpass',name:'白嶺峠',width:24,height:29,base:{x:49,z:127},snow:{x:12,z:0}});
          function poiSnowPassLink(region,x,z,y,nx,nz){
           if(y!==0)return null;
           const s=POI_SNOW_PASS;
           if(region==='base'&&x===s.base.x&&z===s.base.z&&nx===x&&nz===z+1)return {region:s.id,...s.snow,y:0,facing:2};
           if(region===s.id&&x===s.snow.x&&z===s.snow.z&&nx===x&&nz===z-1)return {region:'base',...s.base,y:0,facing:0};
           return null;
          }
          function poiSnowPassDecode(d,p){
           const {id,width,height}=POI_SNOW_PASS;
           if(d?.route!=='facility'||d.id!=='base'||d.region!==id||d.play!==true||p?.y!==0||
              !Number.isInteger(p.x)||!Number.isInteger(p.z)||p.x<0||p.x>=width||p.z<0||p.z>=height)return {};
           const hp=Number.isInteger(d.regionHp)&&d.regionHp>=1&&d.regionHp<=100?d.regionHp:null;
           return {region:id,...(hp===null?{}:{regionHp:hp})};
          }
          function poiSnowPassMap(){
           const s=POI_SNOW_PASS,y=0,p=(x,z)=>({x,z,y}),world=[],route=[p(12,0)];
           let x=12,z=0;
           for(const [tx,tz] of [[12,5],[9,5],[9,10],[14,10],[14,15],[10,15],[10,19],[15,19],[15,25]]){
            while(x!==tx||z!==tz){x+=Math.sign(tx-x);z+=Math.sign(tz-z);route.push(p(x,z))}
           }
           const trail=new Set(route.map(o=>o.x+','+o.z)),shoulder=new Set(route.flatMap(o=>[[o.x,o.z],[o.x+1,o.z],[o.x-1,o.z],[o.x,o.z+1],[o.x,o.z-1]].map(v=>v.join(','))));
           for(let z=0;z<s.height;z++)for(let x=0;x<s.width;x++){
            const key=x+','+z;
            world.push({x,z,y,type:trail.has(key)?'roadGravelFull':'poiSnowGround',rot:0});
            if(!shoulder.has(key)&&x>1&&x<s.width-2&&(x*29+z*47)%31<3)world.push({x,z,y,type:z%4?'treePine':'rockMossy',rot:(x+z)%4});
           }
           return {spawn:{...s.snow},name:s.name,id:s.id,difficulty:1,buildings:[],snowRoute:route,
            map:{format:'forest-world-v1',version:1,width:s.width,height:s.height,size:s.width,world,models:[],prefabs:[],terrainHeights:[],checks:[]}};
          }
          // END SNOW PASS PROTOTYPE
          LOCAL_SOURCE
          cat >.snow/activation.js <<'LOCAL_SOURCE'
          // BEGIN SNOW PASS ACTIVATION (prototype)
          let poiSnowPassBase=null,poiSnowPassSwitches=0;
          function poiSnowPassSeam(site,world){
           if(site?.id!=='base')return false;
           const own=new Set(world.filter(o=>o.y===0).map(o=>o.x+','+o.z));
           // Extend west from the existing forest rest, then turn south. Leave any
           // grass already authored by v266 in place (it is walkable).
           for(let x=49;x<=54;x++)if(!own.has(x+',119'))world.push({x,z:119,y:0,type:'roadGravelFull',rot:0});
           for(let z=120;z<=127;z++)if(!own.has('49,'+z))world.push({x:49,z,y:0,type:'roadGravelFull',rot:0});
           return world.some(o=>o.x===49&&o.z===127&&o.y===0&&o.type==='roadGravelFull');
          }
          function poiSnowPassEdge(nx,nz,fx,fz){
           if(!poiWalkActive||pineAIActive||!facilitySite)return null;
           const link=poiSnowPassLink(facilitySite.id,fx,fz,poiWalkLevel,nx,nz);
           if(!link||!world.some(o=>o.x===fx&&o.z===fz&&o.y===0&&o.type==='roadGravelFull'))return null;
           return link;
          }
          function poiSnowPassApply(dest,now,cold=false){
           const onBase=facilitySite?.id==='base';
           if(onBase===(dest.region==='base')||!onBase&&!poiSnowPassBase)return false;
           const hp=poiPlayerHP,cooldown=poiAttackReady;
           const base=onBase?{site:facilitySite,map:data(),world,monsters:poiMonsterStates,warm:!cold,edited:facilitySurfaceEdited}:poiSnowPassBase;
           const incoming=onBase?poiSnowPassMap():base.site,map=onBase?incoming.map:base.map;
           // Verify incoming authored cells before any mutation. No editor input enters this registry.
           const cells=(onBase?map.world:base.world).filter(o=>o.x===dest.x&&o.z===dest.z&&o.y===0);
           if(!cells.some(o=>o.type==='roadGravelFull')||cells.some(o=>isWallId(o.type)))return false;
           try{pineValidateWorldData(facilityExportMap(map))}catch(_e){return false}
           if(onBase)poiSnowPassBase=base;
           poiWalkFrameNoRegionRemote();
           facilitySite=incoming;
           facilityLoadMap(map);
           if(!onBase)world=base.world;
           facilityPrepareFloorMasks();facilitySurfaceEdited=onBase?false:base.edited;
           facilityInitialMap=JSON.stringify(data());
           poiMonsterStates=!onBase&&base.warm?base.monsters:new Map();
           if(!onBase&&!base.warm)poiResetCombat();
           else for(const state of poiMonsterStates.values()){state.playerAttack=null;state.nextAttack=Math.max(state.nextAttack||0,now+300)}
           poiWalkReset(dest.x,dest.z);poiWalkFacing=dest.facing;
           if(!cold){poiPlayerHP=hp;poiAttackReady=cooldown}
           if(!cold){poiWalkNextReady=now+POI_WALK_MS;poiOtherworldTravelSerial++}
           mode='move';dirty=true;cursorDirty=true;
           facilityBuildRoofs();poiMiniInvalidate();
           $('facilitySessionName').textContent=facilitySite.name;
           if(poiWalkActive){poiWalkAvatar(now);poiWalkCamera();poiWalkStatus();poiCombatHud();poiHotbarRender()}
           poiSnowPassSwitches++;
           if(!onBase)poiSnowPassBase=null;
           return true;
          }
          function poiWalkFrameNoRegionRemote(){
           poiStopRepeat();poiPlayerWeaponCancel();poiEnemyCancelPlayer();poiTownResidentsReset();
           poiInventoryReleaseMesh();facilityInvalidateScenes();
           if(poiEconomyMesh){gl.deleteBuffer(poiEconomyMesh.buf);poiEconomyMesh=null;poiEconomyMeshDirty=true}
           if(poiMonsterMesh){gl.deleteBuffer(poiMonsterMesh.buf);poiMonsterMesh=null}
           poiMonsterMeshDirty=true;
          }
          function poiSnowPassUse(nx,nz,now){
           const dest=poiSnowPassEdge(nx,nz,poiWalkX,poiWalkZ);
           if(!dest)return false;
           if(!poiSnowPassApply(dest,now))return false;
           workshopResumeWrite();
           return true;
          }
          // END SNOW PASS ACTIVATION
          LOCAL_SOURCE
          cat >.snow/tests/snow-pass-local.test.cjs <<'LOCAL_SOURCE'
          const {test}=require('node:test'),a=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const h=fs.readFileSync(process.env.HTML||'world-editor.html','utf8');
          const i=h.indexOf('// BEGIN SNOW PASS PROTOTYPE'),j=h.indexOf('// END SNOW PASS PROTOTYPE',i);
          a.ok(i>=0&&j>i,'sector contract is installed');
          const c=vm.runInNewContext(h.slice(i,j)+';({link:poiSnowPassLink,decode:poiSnowPassDecode,map:poiSnowPassMap})'),plain=v=>JSON.parse(JSON.stringify(v));
          test('only exact directed edge can activate another local region and land in bounds',()=>{
           a.deepEqual(plain(c.link('base',49,127,0,49,128)),{region:'snowpass',x:12,z:0,y:0,facing:2});
           a.deepEqual(plain(c.link('snowpass',12,0,0,12,-1)),{region:'base',x:49,z:127,y:0,facing:0});
           for(const q of [['base',48,127,0,48,128],['base',49,127,-1,49,128],['base',48,127,0,49,128],['base',49,127,0,49,126],['snowpass',12,0,0,12,1],['unknown',12,0,0,12,-1]])a.equal(c.link(...q),null);
          });
          test('legacy/unknown/invalid version-1 resumes do not activate the snow sector',()=>{
           const initial={version:1,route:'facility',id:'base',play:true},p={x:14,z:12,y:0,facing:2},snow={...initial,region:'snowpass',regionHp:41};
           a.deepEqual(plain(c.decode(initial,p)),{});a.deepEqual(plain(c.decode(snow,p)),{region:'snowpass',regionHp:41});
           for(const [s,q] of [[{...snow,region:'capital'},p],[{...snow,play:false},p],[snow,{...p,z:29}],[snow,{...p,y:-1}]])a.deepEqual(plain(c.decode(s,q)),{});
          });
          test('small pass has real cardinal route, exact return landing, no actors or remote content',()=>{
           const {map,snowRoute}=c.map();a.deepEqual([map.width,map.height],[24,29]);a.ok(map.world.length<800&&snowRoute.length>30);
           for(let i=0;i<snowRoute.length;i++){
            const q=snowRoute[i];a.equal(map.world.filter(o=>o.x===q.x&&o.z===q.z).map(o=>o.type).join(','),'roadGravelFull');
            if(i){const p=snowRoute[i-1];a.equal(Math.abs(p.x-q.x)+Math.abs(p.z-q.z),1)}
           }
           a.ok(map.world.every(o=>!o.type.startsWith('monster')));
          });
          LOCAL_SOURCE
          cat >.snow/tests/snow-pass-browser.mjs <<'LOCAL_SOURCE'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {createRequire} from 'node:module';
          import {readFileSync} from 'node:fs';
          import vm from 'node:vm';
          const h=readFileSync(process.argv[2]??'world-editor.html','utf8');
          for(const [,body] of h.matchAll(/<script(?: [^>]*)?>([\s\S]*?)<\/script>/g))new vm.Script(body);
          if(process.env.SNOW_PASS_SYNTAX_ONLY){console.log('exact game scripts parse');process.exit(0)}
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_PACKAGE??'playwright');
          const server=createServer((req,res)=>{
           res.setHeader('Content-Type','text/html; charset=utf-8');
           res.end(req.url==='/seed'?'<!doctype html><title>Ice route</title>':h);
          });
          await new Promise((r,j)=>server.listen(0,'127.0.0.1',r).once('error',j));
          const root='http://127.0.0.1:'+server.address().port;
          let b;
          try{
           b=await chromium.launch({headless:true,...(process.env.CHROMIUM_EXECUTABLE?{executablePath:process.env.CHROMIUM_EXECUTABLE}:{}),
            args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
           const page=await (await b.newContext({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:.65})).newPage(),errors=[];
           page.on('pageerror',e=>errors.push(e.message));page.setDefaultTimeout(12000);
           await page.goto(root+'/seed');
           const stock=await page.evaluate(()=>{
            const kit=JSON.stringify({version:1,weaponDurabilityVersion:2,weapon:'equipWoodSword',potions:0,slots:[{type:'equipWoodSword',count:1,durability:77}],drops:[{type:'healingHerb',x:50,z:126,y:0}]});
            localStorage.setItem('world-workshop-hotbar-v1',kit);
            localStorage.setItem('world-workshop-resume-v1',JSON.stringify({version:1,route:'facility',id:'base',play:true,
             position:{x:49,z:126,y:0,facing:2},townLayout:5,townMapHeight:128,view:{yaw:0,zoom:1.05,panX:0,panZ:0,level:0,hideUpper:false,top:false,third:false,orbitYaw:0,orbitPitch:.24,orbitDistance:5.5}}));
            return kit;
           });
           await page.goto(root+'/?resume=1&test=1');
           const state=()=>page.evaluate(()=>({area:window.__editorTest?.snowPassRegion(),p:window.__editorTest?.freeMovementPose(),
            save:JSON.parse(localStorage.getItem('world-workshop-resume-v1')),kit:localStorage.getItem('world-workshop-hotbar-v1')}));
           const at=(id,z)=>page.waitForFunction(({id,z})=>{const qa=window.__editorTest;return qa?.snowPassRegion().id===id&&Math.abs(qa.freeMovementPose().z-z)<.08},{id,z});
           await page.locator('#pineStartupCover').waitFor({state:'hidden'});await at('base',126);
           const old=await state();assert.equal(old.area.width,128);assert.equal(old.save.region,undefined);
           await page.evaluate(()=>window.__editorTest.testWound(31));
           const pad=page.locator('#poiAnalogPad'),cdp=await page.context().newCDPSession(page);
           const send=(type,touchPoints)=>cdp.send('Input.dispatchTouchEvent',{type,touchPoints});
           const roll=async(dir,next)=>{
            const r=await pad.boundingBox();assert(r);
            const p={x:Math.round(r.x+r.width*.5),y:Math.round(r.y+r.height*.5),id:7};
            await send('touchStart',[p]);await send('touchMove',[{...p,y:p.y+36*dir}]);
            await at(next,dir>0?0:127);
            await send('touchEnd',[]);
           };
           await roll(1,'snowpass');
           const entry=await state();
           assert.deepEqual([entry.area.width,entry.area.height,entry.area.actors,entry.area.hp],[24,29,0,69]);
           assert.equal(entry.p.x,12);assert.equal(entry.save.region,'snowpass');assert.equal(entry.kit,stock);
           await page.waitForTimeout(225);await page.keyboard.press('ArrowDown');await at('snowpass',1);
           await page.reload();await page.locator('#pineStartupCover').waitFor({state:'hidden'});await at('snowpass',1);
           const restored=await state();assert.equal(restored.area.hp,69);assert.equal(restored.kit,stock);
           await roll(-1,'base');
           const back=await state();
           assert.equal(back.area.width,128);assert.equal(back.p.x,49);assert.equal(back.save.region,undefined);
           assert.equal(back.area.hp,69);assert.equal(back.kit,stock);assert(back.area.actors>0);assert(back.area.forest,'same loaded base still has normal forest');
           assert.deepEqual(JSON.parse(back.kit).drops,[{type:'healingHerb',x:50,z:126,y:0}]);
           await page.waitForTimeout(225);await page.keyboard.press('ArrowUp');await at('base',126);
           await page.waitForTimeout(225);await page.keyboard.press('ArrowRight');
           await page.waitForFunction(()=>window.__editorTest.freeMovementPose().x>49.92);
           const picked=JSON.parse((await state()).kit);
           assert(!picked.drops?.some(d=>d.type==='healingHerb'),'the old ground item is still collectible after return');
           assert(picked.slots.some(d=>d?.type==='healingHerb'),'real base ground pickup still transfers into the same inventory');
           assert.deepEqual(errors,[]);
           console.log('PASS legacy save, actual walking both borders, one region, cold reopen, base and held kit untouched');
          }finally{await b?.close();await new Promise(r=>server.close(r))}
          LOCAL_SOURCE
          python .snow/build.py world-editor.html .snow/world-editor.html
          HTML=.snow/world-editor.html node --test .snow/tests/*.cjs
      - name: Touch seam, reload, return, and pick up a prior base drop
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node .snow/tests/snow-pass-browser.mjs .snow/world-editor.html
