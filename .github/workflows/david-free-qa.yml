          node .david/tests/david-free-browser.mjs .david/world-editor.html
          node .david/tests/david-free-leap-browser.mjs .david/world-editor.html
      - if: matrix.suite == 'original'
        run: |
          node tests/david-arena-chase-browser.mjs .david/world-editor.html
          node .david/tests/david-temple-browser.mjs .david/world-editor.html
      - if: matrix.suite == 'leap'
        run: node tests/david-leap-browser.mjs .david/world-editor.html
      - if: matrix.suite == 'gait'
        run: |
          node tests/david-gait-browser.mjs .david/world-editor.html
          node tests/david-heavy-feedback-browser.mjs .david/world-editor.html
      - if: matrix.suite == 'companion'
        run: node tests/companion-david-browser.mjs .david/world-editor.html
      - if: matrix.suite == 'unit'
        run: |
          cp .david/world-editor.html world-editor.html
          code=0
          node --test --test-reporter=tap tests/*.cjs >.david/unit.log 2>&1 || code=$?
          grep -E '^(not ok|# tests|# pass|# fail)' .david/unit.log | cut -c1-260 || true
          exit "$code"
