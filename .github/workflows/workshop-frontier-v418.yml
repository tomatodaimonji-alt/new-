name: Verify mossy-rock movement and NPC coin pickup
on:
  push:
    branches: ['dot/workshop-frontier-v418-qa']
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v418-test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v418-browser.cjs
