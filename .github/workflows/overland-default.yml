           const above=(a,b)=>a.f<b.f||a.f===b.f&&a.depth>b.depth;
           function push(node){
            let i=heap.length;heap.push(node);
            while(i){const p=(i-1)>>1;if(!above(node,heap[p]))break;heap[i]=heap[p];i=p}heap[i]=node;
           }
