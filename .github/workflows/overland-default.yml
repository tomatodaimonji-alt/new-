        run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      - if: matrix.probe == 'seam'
        run: |
          USE_STREAM_DEFAULT=1 node .spike/tests/overland-browser.mjs .spike/world-editor.html
          SNOW_PHASE_REPORT=1 node .spike/tests/snow-continuous-seam-browser.mjs .spike/world-editor.html
      - if: matrix.probe == 'outlet'
        run: USE_STREAM_DEFAULT=1 node .spike/tests/overland-outlet-browser.mjs .spike/world-editor.html
      - if: matrix.probe == 'visuals'
        run: |
          node .spike/tests/snow-neighbor-alignment-browser.mjs .spike/world-editor.html
          node .spike/tests/snow-visible-from-forest-browser.mjs .spike/world-editor.html
      - if: matrix.probe == 'audio'
        run: |
          node tests/mystic-field-bgm-browser.mjs .spike/world-editor.html
          node tests/snow-audio-browser.mjs .spike/world-editor.html
      - if: matrix.probe == 'persistence'
        run: node .spike/tests/snow-pass-browser.mjs .spike/world-editor.html
      - if: matrix.probe == 'regressions'
        run: |
          cp .spike/world-editor.html world-editor.html
          code=0
          node --test --test-reporter=tap tests/*.cjs >.spike/unit.log 2>&1 || code=$?
          grep -E '^(not ok|# tests|# pass|# fail)' .spike/unit.log | cut -c1-260 || true
          exit "$code"
