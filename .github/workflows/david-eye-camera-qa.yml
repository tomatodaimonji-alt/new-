name: Isolated David eyes and camera QA
on:
  push:
    branches: ['dot/workshop-david-eye-camera-qa']
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [eye-charge, camera]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: test "$(git hash-object world-editor.html)" = b7d3e2fb69c31b693bce705c988d7c7db986b23f
      - run: npm install --no-save playwright@1.58.2 && npx playwright install --with-deps chromium
      - run: node tests/david-${{ matrix.suite }}-browser.mjs world-editor.html
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/david-eye-charge.test.cjs tests/david-camera.test.cjs tests/watchtower-camera.test.cjs tests/stone-david-carved.test.cjs tests/stone-david-geometry.test.cjs
