name: Validate underground entrance and dodge display
on:
  push:
    branches: ['dot/workshop-frontier-v411-qa']
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node tests/v411-portal.cjs world-editor.html && node tests/v411-dodge.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v411-cave.cjs
