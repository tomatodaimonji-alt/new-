name: Verify exact v325 earned lodging funds the food handoff
on:
  push:
    branches: [dot/workshop-funded-inn-kitchen-v325]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "f9c006c79bb83381ef4aafd7950dd1a7159c9d90"
      - run: node tests/funded-food.test.cjs world-editor.html && node tests/npc-resident-seam.test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/economy-browser.mjs world-editor.html && node tests/npc-agency-seam-browser.mjs world-editor.html
