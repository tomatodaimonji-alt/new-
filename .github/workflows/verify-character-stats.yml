name: Verify exact v322 inventory character stats
on:
  push:
    branches: [dot/workshop-inventory-character-stats-v322]
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git hash-object world-editor.html)" = "c1243b9cd24bcc1d7ce08e95963a4dc7dadd494c"
      - run: node tests/character-stats.test.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/character-stats-browser.mjs world-editor.html
