name: Validate v404 chest, HUD, sword and party aids
on:
  push:
    branches: ['dot/workshop-frontier-v404-integration-qa']
jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: git hash-object world-editor.html
      - run: node tests/v404-core-test.cjs world-editor.html
      - run: WORKSHOP_HTML=world-editor.html node tests/v404-iron.cjs
      - run: node tests/v404-party-herbs.cjs world-editor.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/v404-core-browser.cjs
      - run: node tests/v404-party-browser.cjs world-editor.html
