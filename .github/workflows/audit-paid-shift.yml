name: Verify private v328 real paid restaurant shift
on:
  push:
    branches: [dot/workshop-private-npc-paid-shift-v328]
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          test "$(git hash-object world-editor.html)" = "0d6e5c43965fc8a90138be4af57076058852057c"
          python3 tests/private-paid-shift/build.py world-editor.html /tmp/paid.html
          test "$(git hash-object /tmp/paid.html)" = "4b972b0be3808b8d2704e9159c7a6ad2493176cb"
          node tests/private-paid-shift/shift.test.cjs /tmp/paid.html
          node tests/npc-guild-delivery.test.cjs /tmp/paid.html
      - run: npm install --no-save playwright@1.58.2 && npx playwright install chromium
      - run: node tests/private-paid-shift/paid-shift-browser.mjs /tmp/paid.html
