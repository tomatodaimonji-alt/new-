              localStorage.setItem('world-workshop-resume-v1',JSON.stringify({version:1,route:'facility',id:'base',play:true,
               ...(snow?{region:'snowpass',regionHp:80}:{}),position:snow?{x:12,z:4,y:0,facing:0}:{x:49,z:122,y:0,facing:2},
               townLayout:5,townMapHeight:128,view:{yaw:0,zoom:1.05,panX:0,panZ:0,level:0,hideUpper:false,
               top:false,third:true,orbitYaw:snow?Math.PI:0,orbitPitch:.25,orbitDistance:5.5}}));
             },snow);
